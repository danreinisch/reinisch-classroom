<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Door Into Time - Presentations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 2rem;
      color: #333;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .card-hero {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-body {
      padding: 1.5rem;
    }
    .card-week {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .card-date {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 0.5rem;
    }
    .card-summary {
      font-size: 0.95rem;
      color: #555;
      margin-top: 0.5rem;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
    .error {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>A Door Into Time</h1>
  <div id="presentations" class="loading">Loading presentations...</div>

  <script>
    (async function() {
      const container = document.getElementById('presentations');
      try {
        const response = await fetch('./presentations.json');
        if (!response.ok) {
          throw new Error('Failed to load presentations');
        }
        const data = await response.json();
        
        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="error">No presentations found.</div>';
          return;
        }

        // Sort by week descending (most recent first)
        const sorted = [...data.items].sort((a, b) => b.week - a.week);
        
        const grid = document.createElement('div');
        grid.className = 'grid';
        
        sorted.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.page || '#';
          
          const hero = document.createElement('img');
          hero.className = 'card-hero';
          hero.src = item.hero || '';
          hero.alt = item.title || '';
          hero.onerror = function() {
            // Show gradient background if image fails to load
            this.style.display = 'none';
          };
          
          const body = document.createElement('div');
          body.className = 'card-body';
          
          const week = document.createElement('div');
          week.className = 'card-week';
          week.textContent = `Week ${item.week}`;
          
          const title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = item.title || 'Untitled';
          
          const date = document.createElement('div');
          date.className = 'card-date';
          date.textContent = item.date || '';
          
          body.appendChild(week);
          body.appendChild(title);
          body.appendChild(date);
          
          if (item.summary) {
            const summary = document.createElement('div');
            summary.className = 'card-summary';
            summary.textContent = item.summary;
            body.appendChild(summary);
          }
          
          card.appendChild(hero);
          card.appendChild(body);
          grid.appendChild(card);
        });
        
        container.innerHTML = '';
        container.appendChild(grid);
      } catch (error) {
        console.error('Error loading presentations:', error);
        container.innerHTML = `<div class="error">Error loading presentations: ${error.message}</div>`;
      }
    })();
  </script>
</body>
</html>
