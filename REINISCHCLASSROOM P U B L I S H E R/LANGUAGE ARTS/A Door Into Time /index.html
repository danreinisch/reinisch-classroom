<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Door Into Time - Weekly Presentations</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f5;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #2c3e50;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .card-hero {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-body {
      padding: 1.25rem;
    }
    .card-week {
      font-size: 0.875rem;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .card-date {
      font-size: 0.875rem;
      color: #777;
      margin-bottom: 0.75rem;
    }
    .card-summary {
      font-size: 0.9375rem;
      color: #555;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #777;
    }
    .error {
      text-align: center;
      padding: 3rem;
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <h1>A Door Into Time</h1>
  <div id="app">
    <div class="loading">Loading presentations...</div>
  </div>

  <script>
    (async function() {
      const app = document.getElementById('app');
      try {
        const res = await fetch('presentations.json');
        if (!res.ok) throw new Error('Failed to load presentations.json');
        const data = await res.json();
        
        if (!data.items || data.items.length === 0) {
          app.innerHTML = '<div class="error">No presentations available yet.</div>';
          return;
        }

        // Sort by week descending (newest first)
        const sorted = data.items.slice().sort((a, b) => b.week - a.week);
        
        const grid = document.createElement('div');
        grid.className = 'grid';
        
        sorted.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.page || '#';
          
          const hero = document.createElement('img');
          hero.className = 'card-hero';
          hero.src = item.hero || '';
          hero.alt = item.title || '';
          hero.onerror = function() {
            this.style.display = 'none';
          };
          
          const body = document.createElement('div');
          body.className = 'card-body';
          
          const week = document.createElement('div');
          week.className = 'card-week';
          week.textContent = `Week ${item.week}`;
          
          const title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = item.title || '';
          
          const date = document.createElement('div');
          date.className = 'card-date';
          date.textContent = item.date || '';
          
          body.appendChild(week);
          body.appendChild(title);
          body.appendChild(date);
          
          if (item.summary) {
            const summary = document.createElement('div');
            summary.className = 'card-summary';
            summary.textContent = item.summary;
            body.appendChild(summary);
          }
          
          card.appendChild(hero);
          card.appendChild(body);
          grid.appendChild(card);
        });
        
        app.innerHTML = '';
        app.appendChild(grid);
      } catch (err) {
        console.error(err);
        app.innerHTML = '<div class="error">Error loading presentations. Please check the console.</div>';
      }
    })();
  </script>
</body>
</html>
