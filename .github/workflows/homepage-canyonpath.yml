name: Homepage CanyonPath visual checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/css/home-canyonpath.css'
      - 'site/assets/bg/home-arizona.svg'
      - 'site/web/home-dashboard.js'
      - 'site/web/public-shell.js'
      - 'site/web/teacher-shell.css'
      - 'site/assets/css/rc-theme.css'
      - 'tests/home-canyonpath*'
      - '.github/workflows/homepage-canyonpath.yml'

permissions:
  contents: read

jobs:
  homepage-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check homepage source and fallback contrast
        run: node tests/home-canyonpath.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test homepage with mock data only
        run: npx playwright test tests/home-canyonpath.spec.js
      - name: Retain mock-data visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-canyonpath-visual-review
          path: test-results/**/home-*.png
          if-no-files-found: warn
          retention-days: 7
