name: Homepage CanyonPath visual checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/css/home-canyonpath.css'
      - 'site/assets/css/public-canyonpath.css'
      - 'site/assets/bg/home-arizona.svg'
      - 'site/web/sidebar-init.js'
      - 'site/web/home-dashboard.js'
      - 'site/web/public-shell.js'
      - 'site/web/teacher-shell.css'
      - 'site/assets/css/rc-theme.css'
      - 'tests/home-canyonpath*'
      - 'tests/public-canyonpath*'
      - '.github/workflows/homepage-canyonpath.yml'

permissions:
  contents: read

jobs:
  homepage-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Public source files only: no sessions, environment files, or classroom records.
      # This makes the exact inputs available for offline visual/source verification.
      - name: Retain scoped public-theme verification inputs
        uses: actions/upload-artifact@v4
        with:
          name: public-theme-verification-inputs
          path: |
            site/index.html
            site/classroom-resources/index.html
            site/language-arts/index.html
            site/life-skills/index.html
            site/toolkits/index.html
            site/math-toolkit/index.html
            site/assets/css/home-canyonpath.css
            site/assets/css/public-canyonpath.css
            site/assets/css/rc-theme.css
            site/assets/css/class-clock.css
            site/assets/css/class-mode.css
            site/assets/bg/home-arizona.svg
            site/web/sidebar-init.js
            site/web/teacher-shell.css
            tests/home-canyonpath.test.cjs
            tests/public-canyonpath.test.cjs
            tests/home-canyonpath.spec.js
            tests/public-canyonpath.spec.js
            tests/transitional-skills-rename-boundary.test.cjs
            playwright.config.js
            package.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check homepage and public presentation boundaries
        run: node tests/home-canyonpath.test.cjs && node tests/public-canyonpath.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test public browsing with local and synthetic data only
        run: npx playwright test tests/home-canyonpath.spec.js tests/public-canyonpath.spec.js
      - name: Retain public visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-canyonpath-visual-review
          path: |
            test-results/**/home-*.png
            test-results/**/public-*.png
          if-no-files-found: warn
          retention-days: 7
