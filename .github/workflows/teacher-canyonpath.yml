name: Teacher CanyonPath presentation

on:
  push:
    branches: ['feat/teacher-substitute-canyonpath-20260908']
  pull_request:
    paths:
      - 'site/teacher/**'
      - 'site/substitute/**'
      - 'site/web/teacher-shell.*'
      - 'site/assets/css/teacher-canyonpath*.css'
      - 'site/assets/css/substitute-canyonpath.css'
      - 'tests/teacher-canyonpath*'
      - '.github/workflows/teacher-canyonpath.yml'

permissions:
  contents: read

concurrency:
  group: teacher-canyonpath-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Protected presentation and existing authentication contracts
        run: npx playwright test tests/teacher-canyonpath.spec.js tests/teacher-center-auth-redirect.spec.js tests/observation-center-ui.spec.js --project=chromium --workers=2 --retries=0 --reporter=list,html
      - name: Preserve synthetic screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-canyonpath-browser-review
          path: |
            test-results/
            playwright-report/
          retention-days: 7
