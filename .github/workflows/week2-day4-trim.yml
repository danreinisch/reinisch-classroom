name: Week 2 Day 4 Trim Guard

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'netlify/functions/_lib/week2-day4-trim.js'
      - 'netlify/functions/_lib/week2-day4-dynamic-preservation.js'
      - 'netlify/functions/_lib/teacher-week2-day4-trim-core.js'
      - 'netlify/functions/_lib/teacher-week2-day4-dynamic-core.js'
      - 'netlify/functions/_lib/_lib/**'
      - 'netlify/functions/teacher-week2-day4-trim.js'
      - 'netlify/functions/teacher-week2-day4-diagnostic.js'
      - 'site/teacher/week2-day4-trim/**'
      - 'site/web/week2-day4-trim.js'
      - 'tests/week2-day4-trim.test.cjs'
      - 'tests/week2-day4-diagnostic.test.cjs'
      - 'tests/week2-day4-production-safety.test.cjs'
      - 'tests/week2-day4-dynamic-preservation.test.cjs'
      - '.github/workflows/week2-day4-trim.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check netlify/functions/_lib/week2-day4-trim.js
          node --check netlify/functions/_lib/week2-day4-dynamic-preservation.js
          node --check netlify/functions/_lib/teacher-week2-day4-trim-core.js
          node --check netlify/functions/_lib/teacher-week2-day4-dynamic-core.js
          node --check netlify/functions/_lib/_lib/http.js
          node --check netlify/functions/_lib/_lib/auth.js
          node --check netlify/functions/_lib/_lib/supa.js
          node --check netlify/functions/_lib/_lib/week2-day4-trim.js
          node --check netlify/functions/teacher-week2-day4-trim.js
          node --check netlify/functions/teacher-week2-day4-diagnostic.js
          node --check site/web/week2-day4-trim.js
          node --check tests/week2-day4-production-safety.test.cjs
          node --check tests/week2-day4-dynamic-preservation.test.cjs

      - name: Run Week 2 Day 4 trim regression
        run: |
          node tests/week2-day4-trim.test.cjs
          node tests/week2-day4-diagnostic.test.cjs
          node tests/week2-day4-production-safety.test.cjs
          node tests/week2-day4-dynamic-preservation.test.cjs
