name: OBS-9B Browser Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  obs9b-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run OBS-9B Chromium contract
        run: npx playwright test tests/observation-center-goal-quick-capture-ui.spec.js --project=chromium --reporter=list
