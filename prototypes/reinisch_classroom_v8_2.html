<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0a0e14;
  color: #e4e9f0;
  line-height: 1.6;
}
.header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg, #1b8f4d 0%, #16703d 100%);
  padding: 14px 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  z-index: 1000;
}
.header-bar {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: center;
}
.brand {
  font-weight: 800;
  font-size: 20px;
  color: #032113;
  margin-right: auto;
  letter-spacing: -0.5px;
}
.badge {
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
}

.btn {
  border: 1px solid #2d3845;
  background: #1a2332;
  color: #e4e9f0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  display: inline-block;
}
.btn:hover { background: #243447; border-color: #3d4a5c; transform: translateY(-1px); }
.btn-primary { background: #1b8f4d; border-color: #1b8f4d; color: #fff; }
.btn-primary:hover { background: #16703d; border-color: #16703d; }
.btn-danger { background: #c53030; border-color: #c53030; color: #fff; }
.btn-danger:hover { background: #9b2c2c; }
.btn-small { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; }

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.grid { display: grid; grid-template-columns: 260px 1fr 320px; gap: 16px; margin-top: 20px; }
.grid-two { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; }

.card { background: #131921; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.card-title { font-weight: 700; font-size: 16px; margin-bottom: 14px; color: #f0f4f8; display: flex; align-items: center; gap: 8px; }
.card-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #1f2937; }
