[build]
  publish = "."
  command = "node scripts/check-env-leaks.js || true"
  functions = "netlify/functions"

[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"

[functions]
  node_bundler = "esbuild"

# Global security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Disable unused browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    
    # CSP enforced (Stage 3B): Removes 'unsafe-inline' from script-src
    # Inline scripts externalized to separate .js files in site/web/
    # Inline event handlers must use addEventListener instead
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"
    
    # CSP in report-only mode (parallel monitoring with 'unsafe-inline' retained)
    # Kept alongside enforced policy to catch edge cases during transition
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Cache-Control: no-store for HTML files to prevent caching of pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Route-specific CSP for /hub/* - temporary 'unsafe-inline' for Teacher Center inline scripts
# This allows the Hub login to work while planning inline-to-external refactor
[[headers]]
  for = "/hub/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Redirects for presentation navigation script
# Ensures /site/assets/js/presentation-nav.js resolves to canonical location
[[redirects]]
  from = "/site/assets/js/presentation-nav.js"
  to = "/assets/js/presentation-nav.js"
  status = 200

# Redirect for Week 11 background preloader script
# Ensures /site/assets/js/adit-week11-bg-preload.js resolves to canonical location
[[redirects]]
  from = "/site/assets/js/adit-week11-bg-preload.js"
  to = "/assets/js/adit-week11-bg-preload.js"
  status = 200

