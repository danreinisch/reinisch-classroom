[build]
  publish = "."
  command = "node scripts/check-env-leaks.js || true"
  functions = "netlify/functions"   # explicitly set functions dir
  environment = { AWS_LAMBDA_JS_RUNTIME = "nodejs18.x" }

[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"

[functions]
  node_bundler = "esbuild"

# Ensure Node.js 18+ runtime for all contexts (production, deploy previews, branch deploys)
# This guarantees global fetch is available
[context.production.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"

[context.deploy-preview.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"

[context.branch-deploy.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"
