[build]
  publish = "site"
  command = "node scripts/check-env-leaks.js || true"
  functions = "netlify/functions"

[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-auto-release"]
  schedule = "*/10 * * * *"

# Global security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Disable unused browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    
    # CSP enforced (Stage 3B): Removes 'unsafe-inline' from script-src
    # Inline scripts externalized to separate .js files in site/web/
    # Inline event handlers must use addEventListener instead
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; frame-src 'self' https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.io https://*.netlify.app https://api.dictionaryapi.dev; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"
    
    # CSP in report-only mode (parallel monitoring with 'unsafe-inline' retained)
    # Kept alongside enforced policy to catch edge cases during transition
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; frame-src 'self' https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.io https://*.netlify.app https://api.dictionaryapi.dev; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Cache-Control: no-store for HTML files to prevent caching of pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Cache-Control for JS files in /web/: always revalidate to pick up new deploys
[[headers]]
  for = "/web/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Admin not configured page: prevent caching and search indexing
[[headers]]
  for = "/admin-not-configured/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex"

# Cache-Control for video assets: long cache with immutable
[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4"

[[headers]]
  for = "/assets/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/webm"

[[headers]]
  for = "/site/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4"

[[headers]]
  for = "/site/assets/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/webm"

# Route-specific CSP for /teacher/login/* - allows inline scripts for standalone login page
[[headers]]
  for = "/teacher/login/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Route-specific CSP for /hub/* - temporary 'unsafe-inline' for Teacher Center inline scripts
# This allows the Hub login to work while planning inline-to-external refactor
[[headers]]
  for = "/hub/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Route-specific CSP for /student/* - allows inline scripts for HTML assignment iframes rendered via srcdoc
[[headers]]
  for = "/student/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.io https://*.netlify.app; media-src 'self' blob: data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"

# Redirects for presentation navigation script
# Ensures /site/assets/js/presentation-nav.js resolves to canonical location

# Admin redirect - redirect old /admin/ URL to new Teacher Center location
[[redirects]]
  from = "/admin/"
  to = "/teacher/admin/"
  status = 301
  force = false

[[redirects]]
  from = "/admin/*"
  to = "/teacher/admin/:splat"
  status = 301
  force = false

[[redirects]]
  from = "/site/assets/js/presentation-nav.js"
  to = "/assets/js/presentation-nav.js"
  status = 200

# Redirect for Week 11 background preloader script
# Ensures /site/assets/js/adit-week11-bg-preload.js resolves to canonical location
[[redirects]]
  from = "/site/assets/js/adit-week11-bg-preload.js"
  to = "/assets/js/adit-week11-bg-preload.js"
  status = 200

# Redirect for unit-grid.js to canonical location in site/assets
[[redirects]]
  from = "/assets/js/unit-grid.js"
  to = "/site/assets/js/unit-grid.js"
  status = 200

# Redirect for section-nav.js to canonical location in site/assets
[[redirects]]
  from = "/assets/js/section-nav.js"
  to = "/site/assets/js/section-nav.js"
  status = 200

# DEPRECATED: theme.css redirect kept for backward compat with cached pages.
# All new pages use rc-theme.css. Remove this redirect in a future cleanup.
# Redirect for theme.css to canonical location in site/assets
[[redirects]]
  from = "/assets/css/theme.css"
  to = "/site/assets/css/theme.css"
  status = 200

# Redirect for unit-grid.css to canonical location in site/assets
[[redirects]]
  from = "/assets/css/unit-grid.css"
  to = "/site/assets/css/unit-grid.css"
  status = 200

# Redirect for student-portal-init.js to canonical location in site/web
[[redirects]]
  from = "/web/student-portal-init.js"
  to = "/site/web/student-portal-init.js"
  status = 200

# Redirect for teacher-ai-suggest-feedback function (mirrors teacher-ai-suggest pattern)
[[redirects]]
  from = "/api/teacher-ai-suggest-feedback"
  to = "/.netlify/functions/teacher-ai-suggest-feedback"
  status = 200

# Edge Functions Configuration
# Student entry redirect - server-side redirect to hub (preserves deep links)
[[edge_functions]]
  path = "/student/*"
  function = "student-entry-redirect"

# Teacher Center access guard
# Requires a valid RC teacher session before ordinary /teacher/* pages are served.
# Login remains public; admin remains governed by admin-auth-guard below.
[[edge_functions]]
  path = "/teacher/*"
  excludedPath = [
    "/teacher/login",
    "/teacher/login/*",
    "/teacher/admin",
    "/teacher/admin/*"
  ]
  function = "teacher-auth-guard"

# Admin access guard - enforce server-side authentication for admin areas (PR 308, updated PR 335)
# PR 335: Admin SSO via Teacher Center - requires Teacher Center session
# Protects /admin and /admin/* from unauthenticated access
# Redirects unauthenticated users to Teacher Center (/hub/)
[[edge_functions]]
  path = "/admin/*"
  function = "admin-auth-guard"

# Admin access guard for new Teacher Center location
# Protects /teacher/admin/* from unauthenticated access
[[edge_functions]]
  path = "/teacher/admin/*"
  function = "admin-auth-guard"

# Legacy admin-login redirect (PR 335)
# Redirect old admin-login URLs to admin area (which requires Teacher Center SSO)
[[redirects]]
  from = "/admin-login"
  to = "/hub/?reason=admin_login_deprecated&next=%2Fadmin%2F"
  status = 302

[[redirects]]
  from = "/admin-login/*"
  to = "/hub/?reason=admin_login_deprecated&next=%2Fadmin%2F"
  status = 302

# Edge healthcheck
[[edge_functions]]
  path = "/edge-ping"
  function = "edge-ping"

[[edge_functions]]
  path = "/edge-ping/*"
  function = "edge-ping"


