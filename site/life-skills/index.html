<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Life Skills – Reinisch Classroom</title>
  <meta name="description" content="Life Skills unit hub"/>
  
  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css"/>
  <link rel="stylesheet" href="/web/teacher-shell.css"/>
  
  <style>
    /* Styles for unit-grid.js generated elements */
    .wrap{ max-width:1100px; margin:1rem auto; padding:0 1rem }
    header{ margin-bottom:1.2rem }
    h1{ margin:.2rem 0 .3rem 0; font-size:2.25rem; font-weight:850; letter-spacing:-0.02em }
    .sub{ color:var(--rc-muted); margin:0 0 1.2rem 0 }
    .grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); align-items:stretch }
    .card{ display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; text-decoration:none; color:inherit; background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border:1px solid rgba(255, 255, 255, 0.10); border-radius:var(--rc-radius-lg); padding:18px; min-height:98px; transition:all .25s ease; backdrop-filter:blur(12px) saturate(130%); -webkit-backdrop-filter:blur(12px) saturate(130%); box-shadow:0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08) }
    .card:hover{ transform:translateY(-3px); border-color:rgba(34, 197, 94, 0.35); box-shadow:0 16px 48px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12) }
    .card.disabled{ cursor:default; opacity:0.6 }
    .card.disabled:hover{ transform:none; border-color:var(--rc-glass-border); background:var(--rc-glass) }
    .t{ font-weight:800; line-height:1.3 }
    .s{ margin-top:.2rem; color:var(--rc-muted); font-size:.92rem }
  </style>
  
  <script src="/assets/js/open-in-viewer.js"></script>
  <script src="/assets/js/section-nav.js" defer></script>
  <script src="/assets/js/unit-grid.js" defer></script>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="tc-btn" href="/" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <div class="tc-title">Life Skills</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/" data-href="/">
            <span class="tc-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span class="tc-label">Home</span>
          </a>
          <a href="/life-skills/" data-href="/life-skills/">
            <span class="tc-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                <path d="M9 18h6"></path>
                <path d="M10 22h4"></path>
              </svg>
            </span>
            <span class="tc-label">Life Skills</span>
          </a>
        </nav>
      </aside>

      <main class="tc-main">
        <div class="wrap">
          <header>
            <h1>Life Skills</h1>
            <p class="sub">Unit hub</p>
          </header>
          <section class="grid" id="grid" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>

  <script defer src="/web/public-shell.js"></script>
</body>
</html>
