<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Math Practice – 50 Problems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%;font-size:16px}body{background:#0d1117;color:#e6edf3;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 100px}
h1{font-size:1.8rem;font-weight:800;color:#14b8a6;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#b5c4d6;font-size:.95rem;margin-bottom:16px}
.hl{color:#14b8a6;font-weight:600}.wn{color:#ef4444;font-weight:600}.gn{color:#22c55e;font-weight:600}

/* ── Progress header ── */
.prog-bar{width:100%;max-width:600px;margin-bottom:20px}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-info .pn{font-family:'JetBrains Mono',monospace;font-size:1rem;color:#14b8a6}
.prog-info .diff{font-size:.85rem;color:#5eead4;background:rgba(20,184,166,.15);padding:3px 10px;border-radius:6px}
.prog-track{width:100%;height:8px;background:#30363d;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:#14b8a6;border-radius:4px;transition:width .4s}
.streak{text-align:center;font-size:.85rem;color:#f59e0b;margin-top:4px;min-height:18px}

/* ── Problem card ── */
.card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:24px;width:100%;max-width:600px;transition:border-color .3s}
.card.ok{border-color:#22c55e}.card.wrong-shake{animation:qsh .35s ease}
@keyframes qsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-type{font-size:.8rem;color:#484f58;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.q-text{font-size:1.15rem;color:#e6edf3;text-align:center;margin-bottom:12px;line-height:1.4}
.wt{background:#14b8a6;color:#0d1117;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;padding:3px 10px;border-radius:6px;display:inline-block}
.pt{background:#f59e0b;color:#0d1117;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;padding:3px 10px;border-radius:6px;display:inline-block}

/* ── Stack organizer ── */
.stack{background:#0d1117;border:2px solid #30363d;border-radius:12px;padding:18px 14px;margin:10px auto;max-width:300px}
.sr{display:flex;align-items:center;justify-content:center;gap:0;height:42px}
.sr.cr{height:22px}
.sop{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;width:24px;text-align:center;flex-shrink:0}
.sop.add{color:#22c55e}.sop.sub{color:#ef4444}
.sdl{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#5eead4;width:16px;text-align:center;flex-shrink:0}
.sdt{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#5eead4;width:10px;text-align:center;flex-shrink:0}
.sd{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:#e6edf3;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.sline{border:none;border-top:3px solid #14b8a6;margin:3px 0;width:100%}
.sa{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:#14b8a6;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#161b22;border:2px solid #30363d;border-radius:8px;cursor:pointer;user-select:none}.sa:hover{border-color:#14b8a6;transform:scale(1.08)}.sa.filled{border-color:#14b8a6}.sa.empty{color:#484f58}
/* Carry */
.cc{width:34px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cs{width:24px;flex-shrink:0}.cds{width:16px;flex-shrink:0}
.c1{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#f59e0b;font-weight:700;background:rgba(245,158,11,.15);border-radius:5px;padding:1px 4px}
/* Borrow */
.ba{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#f59e0b;font-weight:700;opacity:0;transition:opacity .4s}.ba.show{opacity:1}
.crl{position:absolute;top:50%;left:10%;width:80%;height:2px;background:#ef4444;transform:rotate(-15deg);opacity:0;transition:opacity .4s}.crl.show{opacity:1}
.col-hl{background:rgba(239,68,68,.12);border-radius:4px}
.bbtn{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:5px 14px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;margin:6px auto;display:block}.bbtn:hover{background:#f87171}

/* ── Buttons ── */
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.check-btn{background:#14b8a6;color:#0d1117;border:none;border-radius:10px;padding:11px 32px;font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .2s}.check-btn:hover{background:#5eead4}
.prev-btn{background:#0d1117;border:2px solid #30363d;border-radius:10px;padding:11px 24px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:600;color:#b5c4d6;cursor:pointer}.prev-btn:hover{border-color:#14b8a6;color:#14b8a6}.prev-btn:disabled{opacity:.45;cursor:not-allowed;border-color:#30363d;color:#6b7280}
.next-btn{background:#22c55e;color:#0d1117;border:none;border-radius:10px;padding:11px 32px;font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .2s}.next-btn:hover{background:#4ade80}.next-btn:disabled{opacity:.45;cursor:not-allowed;background:#3f3f46}
.fb{text-align:center;margin-top:10px;font-size:1rem;font-weight:600;min-height:22px}.fb.ok{color:#22c55e}.fb.no{color:#ef4444}

/* ── Completion ── */
.done-card{background:#161b22;border:2px solid #22c55e;border-radius:16px;padding:40px;width:100%;max-width:600px;text-align:center;display:none}
.done-card h2{color:#22c55e;font-size:2rem;margin-bottom:10px}
.done-card .score{font-family:'JetBrains Mono',monospace;font-size:2.5rem;color:#14b8a6;margin:16px 0}
.done-card p{font-size:1.1rem;color:#b5c4d6}
.restart-btn{background:#14b8a6;color:#0d1117;border:none;border-radius:10px;padding:12px 36px;font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:20px}.restart-btn:hover{background:#5eead4}

/* ── Digit Picker ── */
.dp-ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:600;justify-content:center;align-items:center}.dp-ov.open{display:flex}
.dp-bx{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:16px;width:200px}
.dp-t{text-align:center;color:#5eead4;font-size:.85rem;margin-bottom:8px}
.dp-g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dp-k{background:#0d1117;border:2px solid #30363d;border-radius:10px;padding:12px 0;font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:#e6edf3;cursor:pointer;text-align:center;outline:none;user-select:none}.dp-k:hover{border-color:#14b8a6;color:#14b8a6}.dp-k:active{transform:scale(.93)}.dp-k.dc{color:#ef4444;border-color:rgba(239,68,68,.3);font-size:1rem}.dp-k.dc:hover{background:rgba(239,68,68,.1);border-color:#ef4444}
</style>
</head>
<body>

<h1>Money Math Practice</h1>
<p class="sub">50 problems — one at a time — getting harder as you go!</p>

<div class="prog-bar">
<div class="prog-info"><span class="pn" id="pNum">1 / 50</span><span class="diff" id="pDiff">Easy</span></div>
<div class="prog-track"><div class="prog-fill" id="pFill" style="width:2%"></div></div>
<div class="streak" id="streakMsg"></div>
</div>

<div class="card" id="probCard"></div>
<div class="btn-row">
<button class="prev-btn" id="prevBtn" onclick="prevProblem()">&#8592; Previous</button>
<button class="check-btn" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
<button class="next-btn" id="nextBtn" onclick="nextProblem()">Next Problem &#8594;</button>
<button class="next-btn" id="finishBtn" onclick="showCompletion()" style="display:none">Finish</button>
</div>
<div class="fb" id="mainFb"></div>

<div class="done-card" id="doneCard">
<h2>&#127942; All Done!</h2>
<div class="score" id="finalScore"></div>
<p id="finalMsg"></p>
<button class="restart-btn" onclick="location.reload()">Try Again</button>
</div>

<div class="dp-ov" id="dpOv"><div class="dp-bx"><div class="dp-t" id="dpT">Pick a digit</div><div class="dp-g">
<button class="dp-k" onclick="dpP(1)">1</button><button class="dp-k" onclick="dpP(2)">2</button><button class="dp-k" onclick="dpP(3)">3</button>
<button class="dp-k" onclick="dpP(4)">4</button><button class="dp-k" onclick="dpP(5)">5</button><button class="dp-k" onclick="dpP(6)">6</button>
<button class="dp-k" onclick="dpP(7)">7</button><button class="dp-k" onclick="dpP(8)">8</button><button class="dp-k" onclick="dpP(9)">9</button>
<button class="dp-k dc" onclick="dpP(-1)">Clear</button><button class="dp-k" onclick="dpP(0)">0</button><button class="dp-k dc" onclick="dpCl()">Done</button>
</div></div></div>

<script>
/* ═══════════════════════════════════════════
   DIGIT PICKER
   ═══════════════════════════════════════════ */
var dpAB=null;
function dpO(id,lbl){dpAB=id;document.getElementById('dpT').textContent=lbl||'Pick a digit';document.getElementById('dpOv').classList.add('open');}
function dpP(n){if(!dpAB)return;var el=document.getElementById(dpAB);if(n===-1){el.textContent='0';el.classList.remove('filled');el.classList.add('empty');el.setAttribute('data-val','');}else{el.textContent=n;el.classList.add('filled');el.classList.remove('empty');el.setAttribute('data-val',String(n));dpCl();}if(typeof saveProblemState==='function')saveProblemState(cur);}
function dpCl(){document.getElementById('dpOv').classList.remove('open');dpAB=null;}
document.getElementById('dpOv').addEventListener('click',function(e){if(e.target===this)dpCl();});

/* ═══════════════════════════════════════════
   STACK BUILDERS
   ═══════════════════════════════════════════ */
function toD(n){var c=Math.round(n*100);return[Math.floor(c/1000)%10,Math.floor(c/100)%10,Math.floor(c/10)%10,c%10];}
var LBL=['Tens','Ones','Tenths','Hundredths'];

function addStack(a,b,qid){
  var ad=toD(a),bd=toD(b),carry=0,carries=[0,0,0,0];
  for(var i=3;i>=0;i--){var s=ad[i]+bd[i]+carry;carries[i]=s>=10?1:0;carry=carries[i];}

  var h='<div class="stack">';
  h+='<div class="sr cr"><div class="cs"></div><div class="cds"></div>';
  h+='<div class="cc">'+(carries[1]?'<span class="c1">1</span>':'')+'</div>';
  h+='<div class="cc">'+(carries[2]?'<span class="c1">1</span>':'')+'</div>';
  h+='<div class="cc" style="width:10px"></div>';
  h+='<div class="cc">'+(carries[3]?'<span class="c1">1</span>':'')+'</div>';
  h+='<div class="cc"></div>';
  h+='</div>';

  h+='<div class="sr"><div class="sop">&nbsp;</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sd">'+ad[i]+'</div>';}h+='</div>';
  h+='<div class="sr"><div class="sop add">+</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sd">'+bd[i]+'</div>';}h+='</div>';
  h+='<hr class="sline">';
  var aid=qid+'_a';
  h+='<div class="sr"><div class="sop">&nbsp;</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sa empty" id="'+aid+i+'" data-val="" onclick="dpO(\''+aid+i+'\',\''+LBL[i]+'\')">0</div>';}h+='</div></div>';
  return h;
}

function computeB(a,b){var ad=toD(a),bd=toD(b),adj=ad.slice(),bw=[false,false,false,false];for(var i=3;i>=0;i--){if(adj[i]<bd[i]){bw[i]=true;for(var j=i-1;j>=0;j--){if(adj[j]>0){adj[j]--;adj[i]+=10;break;}else adj[j]=9;}}}return{borrows:bw,adjusted:adj,original:ad};}

function subStack(a,b,qid){
  var ad=toD(a),bd=toD(b),bi=computeB(a,b),nb=bi.borrows.indexOf(true)!==-1;
  var h='<div class="stack">';
  h+='<div class="sr cr"><div class="cs"></div><div class="cds"></div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="cc" style="width:10px"></div>';var av=bi.adjusted[i],sh=bi.borrows[i]||(bi.original[i]!==av);h+='<div class="cc"><span class="ba" id="'+qid+'ba'+i+'">'+(sh?av:'')+'</span></div>';}h+='</div>';
  h+='<div class="sr"><div class="sop">&nbsp;</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sd" id="'+qid+'d'+i+'">'+ad[i]+'<div class="crl" id="'+qid+'cl'+i+'"></div></div>';}h+='</div>';
  h+='<div class="sr"><div class="sop sub">−</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sd">'+bd[i]+'</div>';}h+='</div>';
  h+='<hr class="sline">';
  var aid=qid+'_a';
  h+='<div class="sr"><div class="sop">&nbsp;</div><div class="sdl">$</div>';
  for(var i=0;i<4;i++){if(i===2)h+='<div class="sdt">.</div>';h+='<div class="sa empty" id="'+aid+i+'" data-val="" onclick="dpO(\''+aid+i+'\',\''+LBL[i]+'\')">0</div>';}h+='</div>';
  if(nb)h+='<button class="bbtn" id="'+qid+'bb" onclick="animB(\''+qid+'\')">Show Borrow Steps ▶</button>';
  h+='</div>';return h;
}

function animB(qid){
  if(typeof problemState!=='undefined'&&problemState[cur])problemState[cur].borrowShown[qid]=true;
  var btn=document.getElementById(qid+'bb');if(!btn)return;btn.textContent='Showing...';btn.disabled=true;var delay=0;
  for(var i=0;i<4;i++){(function(idx){var cl=document.getElementById(qid+'cl'+idx);var ba=document.getElementById(qid+'ba'+idx);if(ba&&ba.textContent){setTimeout(function(){var d=document.getElementById(qid+'d'+idx);if(d)d.classList.add('col-hl');},delay);delay+=350;setTimeout(function(){if(cl)cl.classList.add('show');},delay);delay+=250;setTimeout(function(){if(ba)ba.classList.add('show');},delay);delay+=250;}})(i);}
  setTimeout(function(){btn.textContent='Steps Shown ✅';btn.style.background='#22c55e';},delay+150);
}

function readS(qid){var aid=qid+'_a';var vals=[];for(var i=0;i<4;i++){var v=document.getElementById(aid+i).getAttribute('data-val');vals.push(v);}if(vals[1]===''||vals[2]===''||vals[3]==='')return NaN;var t=(vals[0]===''?0:parseInt(vals[0]));return t*10+parseInt(vals[1])+parseInt(vals[2])*0.1+parseInt(vals[3])*0.01;}

/* ═══════════════════════════════════════════
   50 PROBLEMS
   ═══════════════════════════════════════════ */
var problems=[];
function addP(a,b,label){problems.push({type:'add',a:a,b:b,ans:Math.round((a+b)*100)/100,label:label,diff:'Easy'});}
function subPE(a,b,label,d){problems.push({type:'sub',a:a,b:b,ans:Math.round((a-b)*100)/100,label:label,diff:d||'Medium'});}
function addPD(a,b,label,d){problems.push({type:'add',a:a,b:b,ans:Math.round((a+b)*100)/100,label:label,diff:d||'Easy'});}

addP(1.25,0.50,'$1.25 + $0.50');
addP(2.00,1.00,'$2.00 + $1.00');
addP(3.10,0.25,'$3.10 + $0.25');
addP(1.50,2.25,'$1.50 + $2.25');
addP(4.00,3.00,'$4.00 + $3.00');
addP(1.75,0.50,'$1.75 + $0.50');
addP(3.50,1.75,'$3.50 + $1.75');
addP(2.99,0.50,'$2.99 + $0.50');
addP(4.75,2.25,'$4.75 + $2.25');
addP(3.99,1.99,'$3.99 + $1.99');
addPD(5.50,3.75,'$5.50 + $3.75','Easy');
addPD(8.99,2.50,'$8.99 + $2.50','Easy');
addPD(6.25,4.75,'$6.25 + $4.75','Easy');
addPD(7.50,5.50,'$7.50 + $5.50','Easy');
addPD(9.99,3.99,'$9.99 + $3.99','Easy');
subPE(5.00,2.00,'$5.00 − $2.00','Medium');
subPE(8.00,3.00,'$8.00 − $3.00','Medium');
subPE(4.50,1.25,'$4.50 − $1.25','Medium');
subPE(7.75,2.50,'$7.75 − $2.50','Medium');
subPE(6.00,2.75,'$6.00 − $2.75','Medium');
subPE(10.00,3.50,'$10.00 − $3.50','Medium');
subPE(5.00,1.99,'$5.00 − $1.99','Medium');
subPE(8.25,4.75,'$8.25 − $4.75','Medium');
subPE(10.00,6.49,'$10.00 − $6.49','Medium');
subPE(15.00,7.75,'$15.00 − $7.75','Medium');
subPE(5.00,2.75,'Pay $5.00, item costs $2.75. Change?','Medium');
subPE(10.00,4.50,'Pay $10.00, item costs $4.50. Change?','Medium');
subPE(10.00,7.25,'Pay $10.00, item costs $7.25. Change?','Hard');
subPE(20.00,12.50,'Pay $20.00, item costs $12.50. Change?','Hard');
subPE(20.00,13.99,'Pay $20.00, item costs $13.99. Change?','Hard');
subPE(5.00,3.49,'Pay $5.00, item costs $3.49. Change?','Hard');
subPE(10.00,8.75,'Pay $10.00, item costs $8.75. Change?','Hard');
subPE(20.00,15.25,'Pay $20.00, item costs $15.25. Change?','Hard');
subPE(50.00,32.99,'Pay $50.00, item costs $32.99. Change?','Hard');
subPE(20.00,18.49,'Pay $20.00, item costs $18.49. Change?','Hard');
problems.push({type:'multi',items:[3.50,1.75],budget:10.00,ans:4.75,label:'Budget $10. Buy $3.50 + $1.75. Left?',diff:'Hard'});
problems.push({type:'multi',items:[4.99,2.50],budget:10.00,ans:2.51,label:'Budget $10. Buy $4.99 + $2.50. Left?',diff:'Hard'});
problems.push({type:'multi',items:[5.25,3.75],budget:20.00,ans:11.00,label:'Budget $20. Buy $5.25 + $3.75. Left?',diff:'Hard'});
problems.push({type:'multi',items:[8.99,4.50],budget:20.00,ans:6.51,label:'Budget $20. Buy $8.99 + $4.50. Left?',diff:'Hard'});
problems.push({type:'multi',items:[6.75,2.25],budget:15.00,ans:6.00,label:'Budget $15. Buy $6.75 + $2.25. Left?',diff:'Hard'});
problems.push({type:'multi',items:[12.99,5.50],budget:25.00,ans:6.51,label:'Budget $25. Buy $12.99 + $5.50. Left?',diff:'Expert'});
problems.push({type:'multi',items:[7.99,3.50],budget:20.00,ans:8.51,label:'Budget $20. Buy $7.99 + $3.50. Left?',diff:'Expert'});
addPD(15.99,8.75,'$15.99 + $8.75','Expert');
subPE(50.00,27.49,'$50.00 − $27.49','Expert');
subPE(20.00,11.76,'$20.00 − $11.76','Expert');
addPD(12.49,9.99,'$12.49 + $9.99','Expert');
problems.push({type:'multi',items:[9.99,7.50],budget:30.00,ans:12.51,label:'Budget $30. Buy $9.99 + $7.50. Left?',diff:'Expert'});
subPE(100.00,63.49,'$100.00 − $63.49','Expert');
problems.push({type:'multi',items:[15.99,8.99],budget:50.00,ans:25.02,label:'Budget $50. Buy $15.99 + $8.99. Left?',diff:'Expert'});
addPD(24.99,18.75,'$24.99 + $18.75','Expert');

/* ═══════════════════════════════════════════
   GAME ENGINE
   ═══════════════════════════════════════════ */
var cur=0,score=0,streak=0,attempts=0;
var diffColors={Easy:'#14b8a6',Medium:'#f59e0b',Hard:'#ef4444',Expert:'#a855f7'};
var problemState=problems.map(function(){return{boxes:{},isCorrect:false,feedback:'',feedbackClass:'',borrowShown:{}};});

function getAnswerIdsForProblem(index){
  var p=problems[index];
  var qid='p'+index;
  var ids=[];
  if(p.type==='multi'){
    for(var i=0;i<4;i++)ids.push(qid+'a_a'+i);
    for(var i=0;i<4;i++)ids.push(qid+'s_a'+i);
  }else{
    for(var i=0;i<4;i++)ids.push(qid+'_a'+i);
  }
  return ids;
}

function saveProblemState(index){
  var state=problemState[index];
  getAnswerIdsForProblem(index).forEach(function(id){
    var el=document.getElementById(id);
    if(el)state.boxes[id]=el.getAttribute('data-val')||'';
  });
}

function restoreBorrowState(qid,index){
  var shown=problemState[index].borrowShown[qid];
  if(!shown)return;
  for(var i=0;i<4;i++){
    var d=document.getElementById(qid+'d'+i);
    var cl=document.getElementById(qid+'cl'+i);
    var ba=document.getElementById(qid+'ba'+i);
    if(ba&&ba.textContent){
      if(d)d.classList.add('col-hl');
      if(cl)cl.classList.add('show');
      ba.classList.add('show');
    }
  }
  var btn=document.getElementById(qid+'bb');
  if(btn){btn.textContent='Steps Shown ✅';btn.style.background='#22c55e';btn.disabled=true;}
}

function restoreProblemState(index){
  var state=problemState[index];
  Object.keys(state.boxes).forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    var val=state.boxes[id];
    if(val===''){
      el.textContent='0';
      el.classList.remove('filled');
      el.classList.add('empty');
      el.setAttribute('data-val','');
    }else{
      el.textContent=val;
      el.classList.add('filled');
      el.classList.remove('empty');
      el.setAttribute('data-val',val);
    }
  });
  if(problems[index].type==='sub')restoreBorrowState('p'+index,index);
  if(problems[index].type==='multi')restoreBorrowState('p'+index+'s',index);
}

function syncNavButtons(){
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');
  var finishBtn=document.getElementById('finishBtn');
  prevBtn.disabled=cur===0;
  nextBtn.style.display=cur===problems.length-1?'none':'';
  finishBtn.style.display=cur===problems.length-1?'':'none';
}

function renderProblem(){
  var p=problems[cur];
  var state=problemState[cur];
  var card=document.getElementById('probCard');
  card.className='card';
  document.getElementById('mainFb').textContent='';
  document.getElementById('mainFb').className='fb';

  var qid='p'+cur;
  var h='<div class="q-type" style="color:'+diffColors[p.diff]+'">'+p.diff+' • '+(p.type==='add'?'Addition':p.type==='sub'?'Subtraction':'Multi-Step')+'</div>';
  h+='<div class="q-text">'+p.label+'</div>';

  if(p.type==='add'){
    h+=addStack(p.a,p.b,qid);
  }else if(p.type==='sub'){
    h+=subStack(p.a,p.b,qid);
  }else{
    var subtotal=Math.round((p.items[0]+p.items[1])*100)/100;
    h+='<div style="border:2px solid rgba(34,197,94,.35);border-radius:12px;padding:12px;margin:8px auto;max-width:340px">';
    h+='<div style="text-align:center;margin-bottom:6px"><span style="background:rgba(34,197,94,.15);color:#22c55e;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:5px">➕ Step 1: ADD items</span></div>';
    h+=addStack(p.items[0],p.items[1],qid+'a');
    h+='</div>';
    h+='<div style="text-align:center;font-size:1.2rem;color:#5eead4;margin:4px 0">⬇</div>';
    h+='<div style="border:2px solid rgba(239,68,68,.35);border-radius:12px;padding:12px;margin:8px auto;max-width:340px">';
    h+='<div style="text-align:center;margin-bottom:6px"><span style="background:rgba(239,68,68,.15);color:#ef4444;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:5px">➖ Step 2: SUBTRACT from budget</span></div>';
    h+=subStack(p.budget,subtotal,qid+'s');
    h+='</div>';
  }

  card.innerHTML=h;
  restoreProblemState(cur);
  if(state.isCorrect)card.classList.add('ok');
  if(state.feedback){
    var fb=document.getElementById('mainFb');
    fb.textContent=state.feedback;
    fb.className='fb '+state.feedbackClass;
  }
  syncNavButtons();
  updateProgress();
}

function prevProblem(){
  if(cur===0)return;
  saveProblemState(cur);
  cur--;
  renderProblem();
}

function markFeedback(message,klass){
  var fb=document.getElementById('mainFb');
  fb.textContent=message;
  fb.className='fb '+klass;
  problemState[cur].feedback=message;
  problemState[cur].feedbackClass=klass;
}

function checkAnswer(){
  saveProblemState(cur);
  var p=problems[cur];
  var qid='p'+cur;
  var v=(p.type==='multi')?readS(qid+'s'):readS(qid);
  if(isNaN(v)){markFeedback('Fill in all the answer boxes!','no');return;}

  attempts++;
  if(Math.abs(v-p.ans)<0.006){
    if(!problemState[cur].isCorrect){score++;streak++;}
    problemState[cur].isCorrect=true;
    document.getElementById('probCard').classList.add('ok');
    markFeedback('✅ Correct! The answer is $'+p.ans.toFixed(2),'ok');
    if(streak>=3)document.getElementById('streakMsg').textContent='🔥 '+streak+' in a row!';
  }else{
    markFeedback('❌ Not quite — try again!','no');
    streak=0;
    document.getElementById('streakMsg').textContent='';
    document.getElementById('probCard').classList.add('wrong-shake');
    setTimeout(function(){document.getElementById('probCard').classList.remove('wrong-shake');},350);
  }
  updateProgress();
}

function nextProblem(){
  if(cur>=problems.length-1)return;
  saveProblemState(cur);
  cur++;
  renderProblem();
}

function showCompletion(){
  saveProblemState(cur);
  document.getElementById('probCard').style.display='none';
  document.querySelector('.btn-row').style.display='none';
  document.getElementById('mainFb').textContent='';
  var dc=document.getElementById('doneCard');
  dc.style.display='block';
  var pct=Math.round(score/problems.length*100);
  document.getElementById('finalScore').textContent=score+' / '+problems.length+' ('+pct+'%)';
  document.getElementById('finalMsg').textContent=pct>=90?'Outstanding! You\'re a money math master!':pct>=70?'Great job! Keep practicing the hard ones!':'Good effort! Try again to improve!';
}

function updateProgress(){
  document.getElementById('pNum').textContent=(cur+1)+' / '+problems.length;
  document.getElementById('pFill').style.width=((cur+1)/problems.length*100)+'%';
  var d=problems[cur].diff;
  document.getElementById('pDiff').textContent=d;
  document.getElementById('pDiff').style.background=diffColors[d]+'25';
  document.getElementById('pDiff').style.color=diffColors[d];
}

renderProblem();
</script>
</body>
</html>
