<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counting Money – 6-Day Unit</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#e6edf3;font-family:'Outfit',sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none;}

/* ── Flicker-free slides: all stacked, visibility toggle ── */
.slide{position:absolute;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 70px 90px;text-align:center;visibility:hidden;}
.slide.active{visibility:visible;z-index:10;}

h1{font-size:3rem;font-weight:800;color:#14b8a6;margin-bottom:14px;line-height:1.15;}
h2{font-size:2.4rem;font-weight:700;color:#14b8a6;margin-bottom:16px;}
h3{font-size:1.7rem;font-weight:600;color:#5eead4;margin-bottom:10px;}
p{font-size:1.5rem;font-weight:300;color:#b5c4d6;line-height:1.5;max-width:1100px;}
.big{font-size:2rem;font-weight:400;color:#e6edf3;line-height:1.4;}
.hl{color:#14b8a6;font-weight:600;}
.warn{color:#ef4444;font-weight:600;}
.green{color:#22c55e;font-weight:600;}
.gold{color:#f59e0b;font-weight:600;}
.mono{font-family:'JetBrains Mono',monospace;}
.card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:30px;margin:12px auto;max-width:1100px;width:100%;}
.card-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.coin-card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:20px 16px;text-align:center;flex:1;min-width:170px;max-width:220px;}
.coin-label{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:600;color:#14b8a6;margin-top:6px;}
.rule-box{background:linear-gradient(135deg,rgba(20,184,166,0.12),#0d1117);border:2px solid #14b8a6;border-radius:16px;padding:26px;margin:12px auto;max-width:920px;}
.step-list{text-align:left;max-width:920px;margin:0 auto;}
.step{display:flex;align-items:flex-start;gap:16px;margin:11px 0;font-size:1.35rem;color:#b5c4d6;}
.step .num{background:#14b8a6;color:#0d1117;font-weight:700;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.15rem;}
.practice{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:28px;margin:12px auto;max-width:1020px;}

.money-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0;align-items:flex-end;}
.cw{cursor:pointer;position:relative;display:inline-block;transition:transform 0.15s;}
.cw:hover{transform:translateY(-3px);}
.cw:hover svg{filter:drop-shadow(0 0 10px rgba(20,184,166,0.65));}
.cw.hairy svg{filter:drop-shadow(0 0 6px rgba(20,184,166,0.4));}
.cw .hg{opacity:0;transition:opacity 0.25s;}
.cw.hairy .hg{opacity:1;}
.cw .ct{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:#484f58;white-space:nowrap;pointer-events:none;}
.cw.hairy .ct{opacity:0;}
.bw{display:inline-block;transition:transform 0.15s;}
.bw:hover{transform:translateY(-3px);}
.bw:hover svg{filter:drop-shadow(0 0 10px rgba(34,197,94,0.6));}
.sep{width:2px;height:48px;background:#30363d;border-radius:1px;margin:0 6px;align-self:center;flex-shrink:0;}

.reveal-btn{font-family:'JetBrains Mono',monospace;font-size:2rem;color:transparent;background:#30363d;border:2px solid #484f58;border-radius:10px;padding:8px 28px;cursor:pointer;position:relative;min-width:200px;text-align:center;outline:none;display:inline-block;margin-top:10px;}
.reveal-btn::after{content:"\1F512  Click to Reveal";color:#484f58;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Outfit',sans-serif;font-size:1rem;font-weight:400;white-space:nowrap;}
.reveal-btn:hover{border-color:#14b8a6;}
.reveal-btn:hover::after{color:#14b8a6;}
.reveal-btn.shown{color:#14b8a6;background:none;border-color:transparent;cursor:default;}
.reveal-btn.shown::after{display:none;}

.bill-card{background:#161b22;border:2px solid #30363d;border-radius:16px;padding:16px;text-align:center;flex:1;min-width:190px;max-width:240px;}
.compare-row{display:flex;gap:28px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap;}
.compare-col{text-align:center;min-width:170px;}
.vs{font-size:1.8rem;color:#5eead4;font-weight:700;}
.ptag{background:#f59e0b;color:#0d1117;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;padding:6px 18px;border-radius:10px;display:inline-block;}
.paytag{background:#14b8a6;color:#0d1117;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;padding:6px 18px;border-radius:10px;display:inline-block;}
.changetag{background:#22c55e;color:#0d1117;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;padding:6px 18px;border-radius:10px;display:inline-block;}
.result-yes{background:rgba(34,197,94,0.12);border:2px solid #22c55e;border-radius:10px;padding:12px 24px;font-size:1.4rem;color:#22c55e;font-weight:600;display:inline-block;margin:6px;}
.result-no{background:rgba(239,68,68,0.12);border:2px solid #ef4444;border-radius:10px;padding:12px 24px;font-size:1.4rem;color:#ef4444;font-weight:600;display:inline-block;margin:6px;}
.count-up{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;align-items:center;}
.cu-step{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:7px 12px;text-align:center;}
.cu-step .v{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#14b8a6;font-weight:600;}
.cu-step .l{font-size:0.75rem;color:#5eead4;}
.arr{color:#5eead4;font-size:1.2rem;}
.review-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:920px;margin:12px auto;}
.rv{background:#161b22;border:2px solid #30363d;border-radius:12px;padding:16px;text-align:center;}
.rv h3{color:#14b8a6;font-size:1.1rem;margin-bottom:4px;}
.rv p{font-size:0.95rem;}
.day-banner{position:absolute;top:18px;left:36px;background:rgba(20,184,166,0.18);border:1px solid rgba(20,184,166,0.35);border-radius:8px;padding:5px 16px;font-size:0.9rem;color:#5eead4;font-weight:600;z-index:20;}
.nav-bar{position:fixed;bottom:0;left:0;right:0;height:70px;background:#161b22;border-top:2px solid #30363d;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:200;}
.nav-btn{background:#0d1117;border:2px solid #30363d;border-radius:10px;padding:10px 26px;font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:600;color:#b5c4d6;cursor:pointer;display:flex;align-items:center;gap:8px;outline:none;}
.nav-btn:hover{border-color:#14b8a6;color:#14b8a6;}
.nav-btn.off{opacity:0.2;pointer-events:none;}
.nav-center{display:flex;align-items:center;gap:14px;}
.slide-ctr{font-family:'JetBrains Mono',monospace;font-size:0.95rem;color:#5eead4;}
.prog-track{width:200px;height:6px;background:#30363d;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:#14b8a6;border-radius:3px;transition:width 0.3s;}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav-bar">
<button class="nav-btn" id="prevBtn" onclick="go(-1)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Previous</button>
<div class="nav-center"><div class="prog-track"><div class="prog-fill" id="progFill"></div></div><div class="slide-ctr" id="slideCtr"></div></div>
<button class="nav-btn" id="nextBtn" onclick="go(1)">Next <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<script>
var CD={quarter:{hairs:5,r:34,fill:'#C0C0C0',stroke:'#888',tf:'#444',label:'25\xA2',w:78,h:88},dime:{hairs:2,r:27,fill:'#D4D4D4',stroke:'#999',tf:'#444',label:'10\xA2',w:64,h:72},nickel:{hairs:1,r:31,fill:'#C0C0C0',stroke:'#888',tf:'#444',label:'5\xA2',w:72,h:82},penny:{hairs:0,r:31,fill:'#b87333',stroke:'#8B5A2B',tf:'#5a3010',label:'1\xA2',w:72,h:82}};
function coinSVG(t){var c=CD[t],cx=c.w/2,cy=c.h/2+10,sh=c.h+8,hm='';if(t==='penny'){hm='<circle class="hg" cx="'+cx+'" cy="'+(cy-c.r-8)+'" r="5.5" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3.5 2.5"/>';}else{var sp=t==='quarter'?58:t==='dime'?20:0;for(var i=0;i<c.hairs;i++){var a=-90+(c.hairs===1?0:(i/(c.hairs-1)*sp*2-sp));var rad=a*Math.PI/180;hm+='<line class="hg" x1="'+(cx+Math.cos(rad)*(c.r-1))+'" y1="'+(cy+Math.sin(rad)*(c.r-1)-2)+'" x2="'+(cx+Math.cos(rad)*(c.r+17))+'" y2="'+(cy+Math.sin(rad)*(c.r+17)-2)+'" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round"/>';}}return '<div class="cw" onclick="this.classList.toggle(\'hairy\')"><svg width="'+c.w+'" height="'+sh+'" viewBox="0 0 '+c.w+' '+sh+'">'+hm+'<circle cx="'+cx+'" cy="'+cy+'" r="'+c.r+'" fill="'+c.fill+'" stroke="'+c.stroke+'" stroke-width="2.5"/><text x="'+cx+'" y="'+(cy+3)+'" text-anchor="middle" fill="'+c.tf+'" font-family="Outfit" font-weight="700" font-size="14">'+c.label+'</text></svg><span class="ct">tap coin</span></div>';}
function billSVG(v){var names={1:'WASHINGTON',5:'LINCOLN',10:'HAMILTON',20:'JACKSON'};return '<div class="bw"><svg width="110" height="50" viewBox="0 0 150 68"><rect x="2" y="2" width="146" height="64" rx="6" fill="#2d5a27" stroke="#1a3a18" stroke-width="2.5"/><rect x="8" y="8" width="134" height="52" rx="3" fill="none" stroke="#4a8a42" stroke-width="1" stroke-dasharray="3 2.5"/><text x="75" y="30" text-anchor="middle" fill="#c5e8c0" font-family="Outfit" font-weight="800" font-size="24">$'+v+'</text><text x="75" y="52" text-anchor="middle" fill="#8ab885" font-family="Outfit" font-size="11">'+(names[v]||'')+'</text></svg></div>';}
var CM={q:'quarter',d:'dime',n:'nickel',p:'penny'};
function coins(s){var h='';for(var i=0;i<s.length;i++)h+=coinSVG(CM[s[i]]);return h;}
function money(bills,cs){var h='';for(var i=0;i<bills.length;i++)h+=billSVG(bills[i]);if(cs&&cs.length)h+='<div class="sep"></div>';h+=coins(cs||'');return h;}
function rev(id,text){return '<button type="button" class="reveal-btn" id="'+id+'" onclick="doReveal(\''+id+'\')">'+text+'</button>';}

var S=[];
function slide(day,banner,content){S.push({day:day,banner:banner,html:content});}

slide(1,'Day 1 of 6','<h1>\uD83D\uDCB0 Counting Money</h1><p class="big">A 6-Day Unit Using the <span class="hl">Hairy Money</span> Method</p><p style="margin-top:20px;font-size:1.1rem;color:#5eead4">Let\'s get started!</p>');
slide(1,'Day 1 \u2014 Coin ID','<h2>Do You Remember These? \uD83E\uDE99</h2><div class="card-row"><div class="coin-card">'+coinSVG('penny')+'<div class="coin-label">Penny \u2014 1\xA2</div></div><div class="coin-card">'+coinSVG('nickel')+'<div class="coin-label">Nickel \u2014 5\xA2</div></div><div class="coin-card">'+coinSVG('dime')+'<div class="coin-label">Dime \u2014 10\xA2</div><p style="font-size:.85rem;color:#5eead4">Smallest coin!</p></div><div class="coin-card">'+coinSVG('quarter')+'<div class="coin-label">Quarter \u2014 25\xA2</div><p style="font-size:.85rem;color:#5eead4">Biggest value!</p></div></div>');
slide(1,'Day 1 \u2014 What is Hairy Money?','<h2>What is Hairy Money? \uD83E\uDDD1\u200D\uD83E\uDDB1</h2><div class="card"><p class="big" style="text-align:center">We draw <span class="hl">"hairs"</span> on top of each coin.</p><p style="text-align:center;margin-top:12px;font-size:1.4rem">Each hair is worth <span class="hl">5 cents</span>. Then we just <span class="hl">count by 5s!</span></p></div><div class="rule-box"><p style="text-align:center;font-size:1.4rem">We don\'t switch between 25s, 10s, and 5s \u2014 we <span class="hl">only count by 5s!</span></p></div>');
slide(1,'Day 1 \u2014 Hair Rules','<h2>The Hair Rules \u2014 Click Each Coin! \uD83D\uDC46</h2><p style="font-size:1.2rem;margin-bottom:10px">Tap each coin to see its hairs appear</p><div class="card-row"><div class="coin-card">'+coinSVG('quarter')+'<div class="coin-label">5 hairs</div><p style="font-size:.95rem;color:#5eead4">5 \xD7 5 = 25\xA2</p></div><div class="coin-card">'+coinSVG('dime')+'<div class="coin-label">2 hairs</div><p style="font-size:.95rem;color:#5eead4">2 \xD7 5 = 10\xA2</p></div><div class="coin-card">'+coinSVG('nickel')+'<div class="coin-label">1 hair</div><p style="font-size:.95rem;color:#5eead4">1 \xD7 5 = 5\xA2</p></div><div class="coin-card">'+coinSVG('penny')+'<div class="coin-label">BALD! \uD83E\uDD5A</div><p style="font-size:.95rem;color:#ef4444">Count by 1s</p></div></div>');
slide(1,'Day 1 \u2014 How to Count','<h2>How to Count with Hairy Money</h2><div class="step-list"><div class="step"><div class="num">1</div><div><span class="hl">Sort</span> \u2014 coins with <span class="hl">most hairs first</span> (Quarters \u2192 Dimes \u2192 Nickels \u2192 Pennies)</div></div><div class="step"><div class="num">2</div><div><span class="hl">Click each coin</span> to draw its hairs!</div></div><div class="step"><div class="num">3</div><div><span class="hl">Count all the hairs by 5s</span> (5, 10, 15, 20, 25, 30\u2026)</div></div><div class="step"><div class="num">4</div><div>When you hit pennies, <span class="warn">switch to counting by 1s</span></div></div></div>');
slide(1,'Day 1 \u2014 Practice','<h2>Let\'s Try One Together!</h2><p style="font-size:1.15rem;margin-bottom:8px">Click each coin to add its hairs, then count by 5s:</p><div class="practice"><div class="money-row">'+coins('qddn')+'</div><p style="font-size:1.3rem;margin:8px 0">Count the hairs: <span class="hl">5, 10, 15, 20, 25, 30, 35, 40, 45, 50</span></p>'+rev('r1','50\xA2 = $0.50')+'</div>');
slide(1,'Day 1 \u2014 With Pennies','<h2>Now With Pennies!</h2><p style="margin-bottom:8px">Click each coin \u2014 pennies get a <span class="warn">bald dot</span>, count them by 1s at the end!</p><div class="practice"><div class="money-row">'+coins('qdnppp')+'</div><p style="font-size:1.25rem;margin:6px 0">Hairs by 5s: <span class="hl">5, 10, 15, 20, 25, 30, 35, 40</span></p><p style="font-size:1.25rem">Then pennies by 1s: <span class="warn">41, 42, 43</span></p>'+rev('r2','43\xA2 = $0.43')+'</div>');
slide(1,'Day 1 \u2014 Key Reminders','<h2>Remember! \uD83E\uDDE0</h2><div class="card" style="text-align:left"><div class="step-list"><div class="step"><div class="num">\uD83E\uDE99</div><div><span class="hl">Quarter = 5 hairs</span> (5 fives = 25)</div></div><div class="step"><div class="num">\uD83E\uDE99</div><div><span class="hl">Dime = 2 hairs</span> (2 fives = 10)</div></div><div class="step"><div class="num">\uD83E\uDE99</div><div><span class="hl">Nickel = 1 hair</span> (1 five = 5)</div></div><div class="step"><div class="num">\uD83E\uDD5A</div><div><span class="warn">Penny = BALD</span> (no hairs \u2014 count by 1s)</div></div></div></div><p style="margin-top:16px;font-size:1.3rem;color:#5eead4">Sort biggest \u2192 smallest \u2192 Draw hairs \u2192 Count by 5s \u2192 Add pennies by 1s</p>');

slide(2,'Day 2 of 6','<h1>\uD83D\uDCB0 Bigger Groups & Writing Amounts</h1><p class="big">More coins & two ways to write money!</p>');
slide(2,'Day 2 \u2014 Sorting','<h2>Sort First! \uD83D\uDCCB</h2><div class="card"><p style="text-align:center;font-size:1.4rem;margin-bottom:12px">Big group of coins? <span class="hl">Sort them first!</span></p><div class="step-list"><div class="step"><div class="num">1</div><div>All <span class="hl">Quarters</span> together (most hairs)</div></div><div class="step"><div class="num">2</div><div>Then <span class="hl">Dimes</span></div></div><div class="step"><div class="num">3</div><div>Then <span class="hl">Nickels</span></div></div><div class="step"><div class="num">4</div><div>Then <span class="warn">Pennies</span> at the end (bald!)</div></div></div></div>');
slide(2,'Day 2 \u2014 Big Group','<h2>Let\'s Count a Big Group!</h2><p style="font-size:1.1rem;margin-bottom:6px">Click each coin to add hairs, then count:</p><div class="practice"><div class="money-row">'+coins('qqqddnpp')+'</div><p style="font-size:1.2rem;margin:6px 0">Hairs: <span class="hl">5+5+5 + 2+2 + 1</span> = 20 hairs \u2192 count by 5s to <span class="hl">100</span></p><p style="font-size:1.2rem">Then pennies: <span class="warn">101, 102</span></p>'+rev('r3','102\xA2')+'</div>');
slide(2,'Day 2 \u2014 100 cents','<h2>Wait\u2026 102\xA2? \uD83E\uDD28</h2><p class="big" style="margin-bottom:14px">That\'s <span class="hl">more than 100 cents!</span></p><div class="rule-box"><p style="text-align:center;font-size:1.7rem"><span class="hl">100 cents = 1 dollar</span></p></div><p style="margin-top:14px;font-size:1.4rem">100\xA2 or more? Write it with a <span class="hl">dollar sign!</span></p>');
slide(2,'Day 2 \u2014 Two Ways','<h2>Two Ways to Write Money \uD83D\uDCDD</h2><div class="card"><h3>Way 1: Cent Sign (\xA2)</h3><p style="text-align:center;font-size:1.2rem;margin-bottom:8px">Number <span class="hl">first</span>, then <span class="hl">\xA2 after</span></p><p style="text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:2.1rem;color:#14b8a6">45\xA2 \u00A0\u00A0 102\xA2</p></div><div class="card" style="margin-top:8px"><h3>Way 2: Dollar Sign ($)</h3><p style="text-align:center;font-size:1.2rem;margin-bottom:8px"><span class="hl">$ first</span>, then a <span class="hl">dot</span> separates dollars and cents</p><p style="text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:2.1rem;color:#14b8a6">$0.45 \u00A0\u00A0 $1.02</p></div>');
slide(2,'Day 2 \u2014 Summary','<h2>Day 2 Recap \u2705</h2><div class="card" style="text-align:left"><div class="step-list"><div class="step"><div class="num">\u2705</div><div><span class="hl">Sort coins</span> before counting</div></div><div class="step"><div class="num">\u2705</div><div>Count <span class="hl">bigger groups</span></div></div><div class="step"><div class="num">\u2705</div><div>Write amounts with <span class="hl">\xA2</span> and <span class="hl">$</span></div></div><div class="step"><div class="num">\u2705</div><div>100\xA2 = $1.00</div></div></div></div>');

slide(3,'Day 3 of 6','<h1>\uD83D\uDCB5 Meet the Bills!</h1><p class="big">Paper Money: $1, $5, $10, and $20</p>');
slide(3,'Day 3 \u2014 The Four Bills','<h2>The Four Main Bills</h2><div class="card-row"><div class="bill-card">'+billSVG(1)+'<div class="coin-label">$1.00</div><p style="font-size:.9rem;color:#5eead4">Washington</p></div><div class="bill-card">'+billSVG(5)+'<div class="coin-label">$5.00</div><p style="font-size:.9rem;color:#5eead4">Lincoln</p></div><div class="bill-card">'+billSVG(10)+'<div class="coin-label">$10.00</div><p style="font-size:.9rem;color:#5eead4">Hamilton</p></div><div class="bill-card">'+billSVG(20)+'<div class="coin-label">$20.00</div><p style="font-size:.9rem;color:#5eead4">Jackson</p></div></div><div class="rule-box" style="margin-top:10px"><p style="text-align:center;font-size:1.3rem">The <span class="hl">number on the bill</span> tells you how much it\'s worth!</p></div>');
slide(3,'Day 3 \u2014 Counting Bills','<h2>Counting Bills: Start Big!</h2><div class="step-list"><div class="step"><div class="num">1</div><div><span class="hl">Sort</span> biggest \u2192 smallest ($20 \u2192 $10 \u2192 $5 \u2192 $1)</div></div><div class="step"><div class="num">2</div><div>Count <span class="hl">$20s</span> first: 20, 40, 60\u2026</div></div><div class="step"><div class="num">3</div><div>Add <span class="hl">$10s</span>: \u202670, 80\u2026</div></div><div class="step"><div class="num">4</div><div>Add <span class="hl">$5s</span>: \u202685, 90\u2026</div></div><div class="step"><div class="num">5</div><div>Add <span class="hl">$1s</span>: \u202691, 92\u2026</div></div></div>');

slide(5,'Day 5 \u2014 Practice','<h2>Do You Have Enough? \uD83D\uDED2</h2><p style="font-size:1.1rem;margin-bottom:6px">Click coins to count your money:</p><div class="practice"><div class="compare-row"><div class="compare-col"><p style="font-size:1rem;color:#5eead4">Your Money:</p><div class="money-row" style="margin:6px 0">'+money([5,1],'qq')+'</div></div><div class="vs">vs.</div><div class="compare-col"><span style="font-size:2.4rem">\uD83C\uDF54</span><br><span class="ptag" style="font-size:1.2rem;padding:4px 14px">$5.75</span></div></div>'+rev('r6','$6.50 \u2014 \u2705 Yes, enough!')+'</div>');
slide(5,'Day 5 \u2014 Tip','<h2>Quick Tip: Compare Dollars First! \uD83D\uDCA1</h2><div class="step-list"><div class="step"><div class="num">1</div><div>Look at the <span class="hl">dollar part first</span></div></div><div class="step"><div class="num">2</div><div>Your dollars are <span class="green">bigger</span> \u2192 enough!</div></div><div class="step"><div class="num">3</div><div>Your dollars are <span class="warn">smaller</span> \u2192 not enough!</div></div><div class="step"><div class="num">4</div><div>Dollars are the <span class="hl">same</span> \u2192 compare cents</div></div></div>');

slide(6,'Day 6 \u2014 Count Up','<h2>Count UP to Find Change \u2B06\uFE0F</h2><div class="step-list"><div class="step"><div class="num">1</div><div>Start at the <span class="gold">price</span></div></div><div class="step"><div class="num">2</div><div><span class="hl">Count up</span> with coins & bills until you reach what you <span class="hl">paid</span></div></div><div class="step"><div class="num">3</div><div>What you counted = <span class="green">your change!</span></div></div></div><div class="practice" style="margin-top:10px"><p style="font-size:1.1rem">Costs <span class="ptag" style="font-size:1.1rem;padding:4px 12px">$3.75</span> \u2014 You pay <span class="paytag" style="font-size:1.1rem;padding:4px 12px">$5.00</span></p><div class="count-up" style="margin-top:8px"><div class="cu-step"><div class="v">$3.75</div><div class="l">Start</div></div><div class="arr">\u2192</div><div class="cu-step"><div class="v">$4.00</div><div class="l">+ 25\xA2</div></div><div class="arr">\u2192</div><div class="cu-step"><div class="v">$5.00</div><div class="l">+ $1</div></div></div><p style="font-size:1.25rem;margin-top:6px">Change = <span class="changetag" style="font-size:1.1rem;padding:4px 12px">$1.25</span></p></div>');
slide(6,'Day 6 \u2014 Review','<h2>\uD83C\uDFC6 Everything We Learned!</h2><div class="review-grid"><div class="rv"><h3>Day 1</h3><p>Hairy Money: hair = 5\xA2<br>Q=5, D=2, N=1, P=bald</p></div><div class="rv"><h3>Day 2</h3><p>Sort big\u2192small<br>Write with \xA2 and $</p></div><div class="rv"><h3>Day 3</h3><p>Bills: $1, $5, $10, $20<br>Count biggest first</p></div><div class="rv"><h3>Day 4</h3><p>Bills + Coins together<br>Bills first, then Hairy Money</p></div><div class="rv"><h3>Day 5</h3><p>Do I have enough?<br>Compare dollars first</p></div><div class="rv"><h3>Day 6</h3><p>Making change<br>Count UP from price</p></div></div>');
slide(6,'Day 6 \u2014 Full Strategy','<h2>The Full Strategy \uD83E\uDDE0</h2><div class="card" style="text-align:left"><div class="step-list"><div class="step"><div class="num">1</div><div><span class="hl">Sort</span> \u2014 bills big\u2192small, coins big\u2192small</div></div><div class="step"><div class="num">2</div><div><span class="hl">Count bills</span> \u2014 add dollar amounts</div></div><div class="step"><div class="num">3</div><div><span class="hl">Hairy Money</span> \u2014 hairs by 5s, pennies by 1s</div></div><div class="step"><div class="num">4</div><div><span class="hl">Combine</span> \u2014 $dollars.cents</div></div><div class="step"><div class="num">5</div><div><span class="hl">Compare</span> \u2014 enough? Count up for change!</div></div></div></div>');
slide(6,'Complete! \uD83C\uDF89','<h1>\uD83C\uDF89 Amazing Work!</h1><p class="big">You are now a <span class="hl">money counting pro!</span></p><p style="margin-top:18px;font-size:1.25rem;color:#5eead4">Keep practicing \u2014 every time you see coins and bills,<br>think about those hairs! \uD83E\uDDD1\u200D\uD83E\uDDB1\uD83D\uDCB0</p>');

var deck=document.getElementById('deck');
for(var i=0;i<S.length;i++){var d=document.createElement('div');d.className='slide'+(i===0?' active':'');d.innerHTML='<div class="day-banner">'+S[i].banner+'</div>'+S[i].html;deck.appendChild(d);}
var slides=document.querySelectorAll('.slide');var cur=0,total=slides.length;
function go(dir){slides[cur].classList.remove('active');cur=Math.max(0,Math.min(cur+dir,total-1));slides[cur].classList.add('active');upd();}
function upd(){document.getElementById('progFill').style.width=((cur+1)/total*100)+'%';document.getElementById('slideCtr').textContent=(cur+1)+' / '+total;document.getElementById('prevBtn').className='nav-btn'+(cur===0?' off':'');document.getElementById('nextBtn').className='nav-btn'+(cur===total-1?' off':'');}
function doReveal(id){document.getElementById(id).classList.add('shown');}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
upd();
</script>
