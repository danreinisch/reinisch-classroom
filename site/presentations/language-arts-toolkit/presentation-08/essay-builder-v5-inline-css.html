<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Builder</title>
</head>
<body>
    <div class="save-ind" id="saveInd">Saved</div>
    <div class="toast-el" id="toastEl"></div>

    <div class="container">
        <div class="header">
            <h1>Essay Builder</h1>
            <p>Build a well-structured essay with guided feedback on every sentence</p>
        </div>

        <div class="setup-panel" id="setupPanel">
            <h2>Configure Your Essay</h2>
            <div class="setup-row">
                <div class="setup-group">
                    <label for="essayType">Essay Type</label>
                    <select id="essayType">
                        <option value="argumentative">Argumentative / Persuasive</option>
                        <option value="informational">Informational / Expository</option>
                        <option value="narrative">Narrative</option>
                        <option value="compare">Compare &amp; Contrast</option>
                        <option value="literary">Literary Analysis</option>
                    </select>
                </div>
                <div class="setup-group">
                    <label for="paraCount">Essay Length</label>
                    <select id="paraCount">
                        <option value="3">Short Response (3 paragraphs)</option>
                        <option value="4">Standard (4 paragraphs)</option>
                        <option value="5" selected>Standard Essay (5 paragraphs)</option>
                        <option value="6">Extended Essay (6 paragraphs)</option>
                    </select>
                </div>
            </div>
            <div class="counter-toggle" id="counterToggle">
                <input type="checkbox" id="includeCounter">
                <label for="includeCounter">Include a counterargument paragraph</label>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-label">Essay Progress</span>
                <div class="progress-stats">
                    <span class="progress-stat" id="totalWords">0 words</span>
                    <span class="progress-stat" id="totalSentences">0 sentences</span>
                    <span class="progress-stat" id="sectionsDone">0 / 5 paragraphs</span>
                </div>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="prompt-section">
            <span class="prompt-optional-badge">OPTIONAL</span>
            <h2>Essay Prompt / Topic</h2>
            <textarea class="prompt-input" id="promptInput" placeholder="Paste your essay prompt or topic here (optional)..."></textarea>
        </div>

        <div id="essaySections"></div>

        <div class="actions">
            <button class="btn btn-secondary" id="btnClear">Clear All</button>
            <button class="btn btn-primary" id="btnPreview">Preview Essay</button>
            <button class="btn btn-success" id="btnCopy">Copy to Clipboard</button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <h2>Your Complete Essay</h2>
            <div class="preview-text" id="previewText"></div>
            <div class="preview-meta" id="previewMeta"></div>
            <div style="text-align:center;margin-top:24px;">
                <button class="btn btn-secondary" id="btnClosePreview">Close</button>
            </div>
        </div>
    </div>

        function build(){
            var T=TYPES[curType],c=$("essaySections");c.innerHTML="";sections=[];var bc=curParas-2;
            c.innerHTML+='<div class="paragraph-section" id="p-intro"><div class="section-header"><div class="section-status" id="si"></div><div class="section-title intro-title">Introduction</div><span class="type-badge '+curType+'">'+T.label+'</span><div class="word-count" id="wci">0 words</div></div><div class="subsection"><div class="subsection-label">Hook Sentence</div><textarea class="content-textarea short" id="hook" placeholder="'+esc(T.hookTip)+'"></textarea><div class="feedback" id="hookFB"></div></div><div class="subsection"><div class="subsection-label">Background / Context (2\u20133 sentences)</div><textarea class="content-textarea" id="bg" placeholder="Provide background information and context..."></textarea><div class="feedback" id="bgFB"></div></div><div class="subsection"><div class="subsection-label">Thesis Statement</div><textarea class="content-textarea short" id="thesis" placeholder="'+esc(T.thesisTip)+'"></textarea><div class="feedback" id="thesisFB"></div></div><div class="tips"><strong>Tip:</strong> Your introduction should funnel from general to specific, ending with a strong thesis.</div></div>';
            sections.push({k:"intro",f:["hook","bg","thesis"],wc:"wci",st:"si"});
            for(var i=1;i<=bc;i++){var tc=i===1?"body-title":i===2?"body2-title":i===3?"body3-title":"body4-title";var tk=i===1?"first":i===bc?"last":"middle";var pn=i+1;var lbl=T.bodyLabel(i);
                c.innerHTML+='<div class="paragraph-section" id="p-b'+i+'"><div class="section-header"><div class="section-status" id="sb'+i+'"></div><div class="section-title '+tc+'">Paragraph '+pn+": "+esc(lbl)+'</div><div class="word-count" id="wcb'+i+'">0 words</div></div><div class="subsection"><div class="transition-dropdown"><select id="tr'+i+'">'+transOpts(T.trans[tk])+'</select><div class="transition-selected" id="tr'+i+'L"></div></div><div class="subsection-label">Topic Sentence</div><textarea class="content-textarea short" id="b'+i+'t" placeholder="State your main point for this paragraph..."></textarea><div class="feedback" id="b'+i+'tFB"></div></div><div class="subsection"><div class="subsection-label">Evidence &amp; Explanation</div><textarea class="content-textarea" id="b'+i+'e" placeholder="Provide specific evidence and explain..."></textarea><div class="feedback" id="b'+i+'eFB"></div></div><div class="subsection"><div class="subsection-label">Concluding Sentence</div><textarea class="content-textarea short" id="b'+i+'c" placeholder="Wrap up this point..."></textarea><div class="feedback" id="b'+i+'cFB"></div></div><div class="tips"><strong>Tip:</strong> '+(i===bc?"This is often your strongest point.":"Follow: Topic \u2192 Evidence \u2192 Explanation \u2192 Concluding.")+"</div></div>";
                sections.push({k:"b"+i,f:["b"+i+"t","b"+i+"e","b"+i+"c"],wc:"wcb"+i,st:"sb"+i});}
            if(useCounter&&T.counterOk){
                c.innerHTML+='<div class="paragraph-section" id="p-ctr"><div class="section-header"><div class="section-status" id="sctr"></div><div class="section-title counter-title">Counterargument &amp; Rebuttal</div><div class="word-count" id="wcctr">0 words</div></div><div class="subsection"><div class="transition-dropdown"><select id="trCtr"><option value="">Choose transition...</option><option value="Some may argue that ">Some may argue that</option><option value="Critics might say ">Critics might say</option><option value="On the other hand, ">On the other hand,</option><option value="Opponents believe that ">Opponents believe that</option></select><div class="transition-selected" id="trCtrL"></div></div><div class="subsection-label">Opposing View</div><textarea class="content-textarea" id="ctrV" placeholder="State the opposing argument fairly..."></textarea><div class="feedback" id="ctrVFB"></div></div><div class="subsection"><div class="subsection-label">Rebuttal</div><textarea class="content-textarea" id="ctrR" placeholder="Explain why your argument is stronger..."></textarea><div class="feedback" id="ctrRFB"></div></div><div class="tips"><strong>Tip:</strong> Acknowledge the opposing side, then explain why your position is stronger.</div></div>';
                sections.push({k:"ctr",f:["ctrV","ctrR"],wc:"wcctr",st:"sctr"});}
            c.innerHTML+='<div class="paragraph-section" id="p-concl"><div class="section-header"><div class="section-status" id="scon"></div><div class="section-title concl-title">Conclusion</div><div class="word-count" id="wccon">0 words</div></div><div class="subsection"><div class="transition-dropdown"><select id="trCon">'+transOpts(T.trans.conclusion)+'</select><div class="transition-selected" id="trConL"></div></div><div class="subsection-label">Restated Thesis</div><textarea class="content-textarea short" id="rThesis" placeholder="Restate your thesis in different words..."></textarea><div class="feedback" id="rThesisFB"></div></div><div class="subsection"><div class="subsection-label">Summary of Main Points</div><textarea class="content-textarea" id="summ" placeholder="Briefly summarize your main points..."></textarea><div class="feedback" id="summFB"></div></div><div class="subsection"><div class="subsection-label">Closing Thought</div><textarea class="content-textarea short" id="closing" placeholder="'+esc(T.concTip)+'"></textarea><div class="feedback" id="closingFB"></div></div><div class="tips"><strong>Tip:</strong> '+esc(T.concTip)+"</div></div>";
            sections.push({k:"concl",f:["rThesis","summ","closing"],wc:"wccon",st:"scon"});
            wireAll();updGlobal();
        }

        /* ---- feedback ---- */
        function chkB(text){var msgs=[],tr=text.replace(/^\s+|\s+$/g,"");if(!tr)return msgs;var fl=tr.replace(/^["'\u201C\u201D\u2018\u2019\s]+/,"").charAt(0);if(fl&&/[a-z]/.test(fl))msgs.push(fbi("e","\u26D4","Start with a capital letter."));if(!/[.!?]["'\u201D\u2019]?$/.test(tr))msgs.push(fbi("e","\u26D4","End with proper punctuation."));var w=cw(tr);if(w<5)msgs.push(fbi("e","\u26D4","Too short."));else if(w>=8&&w<=35)msgs.push(fbi("s","\u2705","Good sentence length."));else if(w>35)msgs.push(fbi("w","\u26A0","Consider splitting into two sentences."));if(/\b\w+(n't|'re|'ve|'ll|'d)\b/i.test(text))msgs.push(fbi("w","\u26A0","Avoid contractions in formal writing."));if(/\b(thing|things|stuff|a lot|very|really)\b/i.test(text))msgs.push(fbi("w","\u26A0","Replace vague words."));var T=TYPES[curType];if(T.warnRe&&T.warnRe.test(text))msgs.push(fbi("e","\u26D4",T.warnMsg));return msgs;}

        function analyze(fid,text){var T=TYPES[curType],msgs=chkB(text),tr=text.replace(/^\s+|\s+$/g,"");if(!tr)return msgs;var w=cw(tr);
            if(fid==="hook"){if(T.hookRe&&T.hookRe.test(text))msgs.push(fbi("s","\u2705","Great engaging hook!"));else msgs.push(fbi("w","\u26A0",T.hookTip));if(/^(this essay|this paper|in this essay|i will|i am going to)/i.test(tr))msgs.push(fbi("e","\u26D4","Do not announce what you are doing."));}
            if(fid==="bg"){if(w<15)msgs.push(fbi("w","\u26A0","Add more context."));else if(w<=60)msgs.push(fbi("s","\u2705","Good amount of background."));else msgs.push(fbi("w","\u26A0","Background may be too long."));}
            if(fid==="thesis"){if(/^(i think|i believe|i feel|in my opinion)/i.test(tr)&&curType!=="narrative")msgs.push(fbi("e","\u26D4","State your thesis directly."));if(w<12)msgs.push(fbi("w","\u26A0","Your thesis seems brief."));if(T.thesisGood.test(text))msgs.push(fbi("s","\u2705","Strong thesis!"));else msgs.push(fbi("w","\u26A0",T.thesisWarn));if(tr.charAt(tr.length-1)==="?"&&curType!=="narrative")msgs.push(fbi("e","\u26D4","Thesis should be a statement."));}
            if(/^b\d+t$/.test(fid)){if(/^(i think|i believe|this paragraph)/i.test(tr))msgs.push(fbi("e","\u26D4","State your point directly."));if(T.topicGood.test(text))msgs.push(fbi("s","\u2705","Clear topic sentence!"));else msgs.push(fbi("w","\u26A0","Add stronger language."));}
            if(/^b\d+e$/.test(fid)){if(w<20)msgs.push(fbi("w","\u26A0","Add more detail."));else if(w<=80)msgs.push(fbi("s","\u2705","Good amount of evidence."));if(T.eviGood.test(text))msgs.push(fbi("s","\u2705","Good use of evidence!"));else msgs.push(fbi("w","\u26A0",T.eviWarn));if(/(this means|this shows|this demonstrates|this proves|therefore|as a result|because of this)/i.test(text))msgs.push(fbi("s","\u2705","Good explanation!"));else msgs.push(fbi("w","\u26A0","Explain how evidence supports your point."));}
            if(/^b\d+c$/.test(fid)){if(/(therefore|thus|clearly|as shown|this demonstrates|this proves|in short|overall|ultimately)/i.test(text))msgs.push(fbi("s","\u2705","Good concluding language!"));else msgs.push(fbi("w","\u26A0","Use concluding words."));if(/^(for example|for instance|according to)/i.test(tr))msgs.push(fbi("e","\u26D4","No new evidence in concluding sentence."));}
            if(fid==="ctrV"){if(/(some|others|opponents|critics|many people|it could be argued)/i.test(text))msgs.push(fbi("s","\u2705","Good acknowledgment!"));else msgs.push(fbi("w","\u26A0","Fairly present the opposing argument."));}
            if(fid==="ctrR"){if(/(however|despite this|while this may be true|nevertheless|on the contrary|but|yet|the flaw|this ignores)/i.test(text))msgs.push(fbi("s","\u2705","Strong rebuttal!"));else msgs.push(fbi("w","\u26A0","Use rebuttal language."));}
            if(fid==="rThesis"){var th=$("thesis");if(th){var tv=th.value.replace(/^\s+|\s+$/g,"");if(tv&&tr.toLowerCase()===tv.toLowerCase())msgs.push(fbi("e","\u26D4","Do not copy thesis exactly."));else if(tv&&w>=6)msgs.push(fbi("s","\u2705","Good restating!"));}if(/^(a new|another|also|additionally)/i.test(tr))msgs.push(fbi("e","\u26D4","No new information in conclusion."));}
            if(fid==="summ"){if(w<15)msgs.push(fbi("w","\u26A0","Summarize more."));else if(w<=50)msgs.push(fbi("s","\u2705","Good summary length."));if(/(first|second|third|these|all|together|each|points|arguments)/i.test(text))msgs.push(fbi("s","\u2705","Good reference to main points!"));else msgs.push(fbi("w","\u26A0","Reference your main points."));}
            if(fid==="closing"){if(T.concGood.test(text))msgs.push(fbi("s","\u2705","Strong closing!"));else msgs.push(fbi("w","\u26A0",T.concTip));if(/^(in conclusion|to summarize|that is why)/i.test(tr))msgs.push(fbi("w","\u26A0","Go beyond summarizing."));}
            return msgs;}

        /* ---- wire ---- */
        function wireAll(){
            var allF=[];for(var s=0;s<sections.length;s++){var sec=sections[s];for(var f=0;f<sec.f.length;f++)allF.push({id:sec.f[f],sec:sec});}
            for(var i=0;i<allF.length;i++){(function(field){var el=$(field.id),fbEl=$(field.id+"FB");if(!el||!fbEl)return;
                var dfb=debounce("fb_"+field.id,function(){fbEl.innerHTML=analyze(field.id,el.value).join("");},300);
                el.addEventListener("input",function(){updParaWC();updGlobal();dfb();dSave();});
            })(allF[i]);}
            var sels=document.querySelectorAll("select[id^='tr']");
            for(var t=0;t<sels.length;t++){(function(sel){var lbl=$(sel.id+"L");if(!lbl)return;
                sel.addEventListener("change",function(){lbl.textContent=sel.value?"Using: \""+sel.value.replace(/\s+$/,"").replace(/^\s+/,"")+"\"":"";dSave();});
            })(sels[t]);}
        }

        function updParaWC(){for(var s=0;s<sections.length;s++){var sec=sections[s],tot=0;for(var f=0;f<sec.f.length;f++){var el=$(sec.f[f]);if(el)tot+=cw(el.value);}var wce=$(sec.wc);if(wce)wce.textContent=tot+" words";var ste=$(sec.st);if(ste){if(tot>=10){ste.className="section-status complete";ste.textContent="\u2713";}else{ste.className="section-status";ste.textContent="";}}}}

        function updGlobal(){var tw=0,ts=0,dn=0,total=sections.length;for(var s=0;s<sections.length;s++){var sec=sections[s],sw=0;for(var f=0;f<sec.f.length;f++){var el=$(sec.f[f]);if(el){sw+=cw(el.value);ts+=csen(el.value);}}tw+=sw;if(sw>=10)dn++;}
            var we=$("totalWords");if(we)we.textContent=tw+" words";var se=$("totalSentences");if(se)se.textContent=ts+" sentences";var de=$("sectionsDone");if(de)de.textContent=dn+" / "+total+" paragraphs";var pe=$("progressFill");if(pe)pe.style.width=(total>0?((dn/total)*100):0)+"%";}

        /* ---- save/load ---- */
        function save(){var state={type:curType,paras:curParas,counter:useCounter,prompt:"",fields:{},trans:{}};var pi=$("promptInput");if(pi)state.prompt=pi.value;for(var s=0;s<sections.length;s++){var sec=sections[s];for(var f=0;f<sec.f.length;f++){var el=$(sec.f[f]);if(el)state.fields[sec.f[f]]=el.value;}}var sels=document.querySelectorAll("select[id^='tr']");for(var t=0;t<sels.length;t++)state.trans[sels[t].id]=sels[t].value;try{localStorage.setItem(SK,JSON.stringify(state));var ind=$("saveInd");if(ind){ind.className="save-ind vis";setTimeout(function(){ind.className="save-ind";},1500);}}catch(x){}}
        var dSave=debounce("save",save,800);

        function load(){try{var raw=localStorage.getItem(SK);if(!raw)return;var s=JSON.parse(raw);if(s.type){curType=s.type;$("essayType").value=s.type;}if(s.paras){curParas=parseInt(s.paras,10);$("paraCount").value=String(s.paras);}if(s.counter){useCounter=true;$("includeCounter").checked=true;}updCtrVis();build();var pi=$("promptInput");if(pi&&s.prompt)pi.value=s.prompt;if(s.fields){var keys=Object.keys(s.fields);for(var i=0;i<keys.length;i++){var el=$(keys[i]);if(el)el.value=s.fields[keys[i]];}}if(s.trans){var tkeys=Object.keys(s.trans);for(var j=0;j<tkeys.length;j++){var tel=$(tkeys[j]);if(tel){tel.value=s.trans[tkeys[j]];var lbl=$(tkeys[j]+"L");if(lbl&&tel.value)lbl.textContent="Using: \""+tel.value.replace(/\s+$/,"").replace(/^\s+/,"")+"\"";;}}}
            for(var x=0;x<sections.length;x++){var sec=sections[x];for(var f=0;f<sec.f.length;f++){var fel=$(sec.f[f]),fbEl=$(sec.f[f]+"FB");if(fel&&fbEl&&fel.value.replace(/^\s+|\s+$/g,""))fbEl.innerHTML=analyze(sec.f[f],fel.value).join("");}}updParaWC();updGlobal();}catch(x){}}

        /* ---- setup handlers ---- */
        function updCtrVis(){var el=$("counterToggle");if(curType==="argumentative"){el.className="counter-toggle visible";}else{el.className="counter-toggle";useCounter=false;$("includeCounter").checked=false;}}
        $("essayType").addEventListener("change",function(){curType=this.value;updCtrVis();build();dSave();});
        $("paraCount").addEventListener("change",function(){curParas=parseInt(this.value,10);build();dSave();});
        $("includeCounter").addEventListener("change",function(){useCounter=this.checked;build();dSave();});
        $("promptInput").addEventListener("input",dSave);

        /* ---- generate ---- */
        function gv(id){var el=$(id);return el?(el.value.replace(/^\s+|\s+$/g,"")):""}
        function gvs(id){var el=$(id);return el?el.value:"";}
        function genEssay(){var pr=gv("promptInput"),essay="";if(pr)essay+="Essay Topic: "+pr+"\n\n";var h=gv("hook"),b=gv("bg"),th=gv("thesis"),ip=[];if(h)ip.push(h);if(b)ip.push(b);if(th)ip.push(th);if(ip.length)essay+=ip.join(" ")+"\n\n";var bc=curParas-2;for(var n=1;n<=bc;n++){var t=gvs("tr"+n),parts=[gv("b"+n+"t"),gv("b"+n+"e"),gv("b"+n+"c")],pp=[];for(var j=0;j<parts.length;j++)if(parts[j])pp.push(parts[j]);if(pp.length)essay+=(t||"")+pp.join(" ")+"\n\n";}if(useCounter&&TYPES[curType].counterOk){var tc=gvs("trCtr"),cp=[gv("ctrV"),gv("ctrR")],cc=[];for(var k=0;k<cp.length;k++)if(cp[k])cc.push(cp[k]);if(cc.length)essay+=(tc||"")+cc.join(" ")+"\n\n";}var tcc=gvs("trCon"),fp=[gv("rThesis"),gv("summ"),gv("closing")],ff=[];for(var m=0;m<fp.length;m++)if(fp[m])ff.push(fp[m]);if(ff.length)essay+=(tcc||"")+ff.join(" ");return essay.replace(/^\s+|\s+$/g,"");}

        /* ---- actions ---- */
        $("btnClear").addEventListener("click",function(){if(!confirm("Clear all content?"))return;var pi=$("promptInput");if(pi)pi.value="";var tas=document.querySelectorAll(".content-textarea");for(var i=0;i<tas.length;i++)tas[i].value="";var sels=document.querySelectorAll("select[id^='tr']");for(var j=0;j<sels.length;j++){sels[j].value="";var l=$(sels[j].id+"L");if(l)l.textContent="";}var fbs=document.querySelectorAll(".feedback");for(var k=0;k<fbs.length;k++)fbs[k].innerHTML="";updParaWC();updGlobal();try{localStorage.removeItem(SK);}catch(x){}toast("All fields cleared");});

        $("btnPreview").addEventListener("click",function(){var essay=genEssay();if(!essay||(essay.indexOf("Essay Topic:")===0&&essay.length<30)){toast("Write some content first!",true);return;}var paras=essay.split("\n\n"),html="";for(var i=0;i<paras.length;i++){if(paras[i].indexOf("Essay Topic:")===0)html+='<p class="pl">'+esc(paras[i])+"</p>";else html+="<p>"+esc(paras[i])+"</p>";}$("previewText").innerHTML=html;var body=[];for(var j=0;j<paras.length;j++)if(paras[j].indexOf("Essay Topic:")!==0)body.push(paras[j]);var bt=body.join(" ");$("previewMeta").innerHTML="<span>"+cw(bt)+" words</span><span>"+csen(bt)+" sentences</span><span>"+body.length+" paragraphs</span>";$("previewModal").style.display="block";});

        $("btnClosePreview").addEventListener("click",function(){$("previewModal").style.display="none";});
        $("previewModal").addEventListener("click",function(e){if(e.target===this)this.style.display="none";});

        $("btnCopy").addEventListener("click",function(){var essay=genEssay();if(!essay||(essay.indexOf("Essay Topic:")===0&&essay.length<30)){toast("Write some content first!",true);return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(essay).then(function(){toast("Copied to clipboard!");},function(){fc(essay);});}else fc(essay);});

        function fc(text){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied to clipboard!");}catch(x){toast("Copy failed",true);}document.body.removeChild(ta);}

        document.addEventListener("keydown",function(e){if(e.ctrlKey&&e.key==="p"){e.preventDefault();$("btnPreview").click();}if(e.ctrlKey&&e.shiftKey&&(e.key==="C"||e.key==="c")){e.preventDefault();$("btnCopy").click();}if(e.key==="Escape"){$("previewModal").style.display="none";}});

        /* ---- init ---- */
        updCtrVis();build();load();
    })();
    </script>
</body>
</html>
