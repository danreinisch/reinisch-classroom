<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer – Reinisch Classroom</title>
  
  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <link rel="stylesheet" href="/assets/css/viewer.css">
  <link rel="stylesheet" href="/assets/css/viewer-display-compat.css?v=20260824-2">
  <link rel="stylesheet" href="/assets/css/class-clock.css">
  <link rel="stylesheet" href="/assets/css/class-mode.css" />
</head>
<body>
  <div class="tc-app">
    <div class="tc-shell" style="min-height: 100vh;">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/" data-href="/">
            <span class="tc-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span class="tc-label">Home</span>
          </a>
        </nav>
      </aside>

      <div style="flex: 1; display: flex; flex-direction: column; min-height: 100vh;">
        <div class="pv-bar" id="viewerControls">
          <div class="pv-traffic-lights">
            <button class="pv-dot pv-dot-red"    id="closeBtn"            title="Close"             aria-label="Close viewer"></button>
            <button class="pv-dot pv-dot-yellow" id="presentationModeBtn" title="Presentation Mode" aria-label="Toggle presentation mode"></button>
            <button class="pv-dot pv-dot-green"  id="fullscreenBtn"       title="Full Screen"       aria-label="Toggle fullscreen"></button>
          </div>
          <div class="pv-title" id="viewerTitle"></div>
          <div class="pv-clock" id="viewerClock"></div>
          <button class="viewer-btn-sidebar" id="sidebarToggleBtn" aria-label="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="viewer-frame" id="viewerFrame" style="flex: 1;">
          <iframe 
            id="contentIframe" 
            class="viewer-iframe"
            sandbox="allow-scripts allow-same-origin allow-forms"
            allow="fullscreen"
            allowfullscreen
            title="Content viewer"></iframe>
        </div>
      </div>
    </div>
  </div>
  
  <script defer src="/web/student-shell.js"></script>
  <script defer src="/assets/js/class-clock.js" type="module"></script>
  <script defer src="/web/class-mode.js"></script>
  <script src="/assets/js/viewer-display-compat.js?v=20260824-3"></script>
  <script src="/assets/js/viewer.js"></script>
</body>
</html>
