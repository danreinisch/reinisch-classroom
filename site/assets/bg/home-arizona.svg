  <title id="scene-title">Arizona red-rock trail</title>
  <desc id="scene-desc">An original layered desert illustration with sunlit sandstone mesas, finely lined rock faces, distant violet ridges, saguaros, sage, and a small fawn pug beside the trail. Native vector artwork; no enlarged photographs or blur.</desc>
