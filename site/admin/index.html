<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reinisch Classroom — Admin</title>
  <style>
    :root{
      --bg:#0b1220;--panel:rgba(255,255,255,.06);--panel-brd:rgba(255,255,255,.18);
      --text:#e8edf5;--muted:#b8c1d9;--accent:#60a5fa;--accent2:#2563eb
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
    #gate{min-height:100vh;display:grid;place-items:center}
    #app{display:none}
    .wrap{max-width:1100px;margin:32px auto;padding:20px;background:var(--panel);border:1px solid var(--panel-brd);border-radius:12px}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .row > *{flex:1 1 220px}
    label{display:block;margin-bottom:6px;font-weight:600;color:var(--muted)}
    input,select,button,textarea{
      width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);color:#fff
    }
    button.primary{
      border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent),var(--accent2));cursor:pointer
    }
    button.warn{
      border:1px solid #f59e0b;background:linear-gradient(180deg,#fbbf24,#f59e0b);cursor:pointer;color:#1b2437
    }
    .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .drop{
      border:2px dashed rgba(255,255,255,.25);padding:18px;border-radius:12px;text-align:center;color:var(--muted)
    }
    .drop.drag{border-color:var(--accent);color:#fff;background:rgba(96,165,250,.08)}
    .list{max-height:220px;overflow:auto;background:#0e1629;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px;font:12px ui-monospace,Menlo,Consolas,monospace}
    .log{margin-top:16px;background:#0e1629;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px;height:260px;overflow:auto;font:12px ui-monospace,Menlo,Consolas,monospace;color:#dbeafe;white-space:pre-wrap}
    .sp{flex:1}
    a.btn{color:#fff;border:1px solid #fff;padding:.4rem .7rem;border-radius:.5rem;text-decoration:none}
    .hint{font-size:12px;color:var(--muted);margin-top:4px}
    .taken-note{font-size:12px;color:#fde68a;margin-top:4px}
  </style>
  <script>
  // Gate: verify session on the server. If not logged in → redirect to /admin-login.
  (function(){
    function showApp(){
      const app = document.getElementById('app');
      const gate = document.getElementById('gate');
      if (app) app.style.display = 'block';
      if (gate) gate.style.display = 'none';
    }
    async function check(){
      try{
        const r = await fetch('/.netlify/functions/admin-session-check', { cache:'no-store', credentials:'same-origin' });
        if (!r.ok) { location.replace('/admin-login'); return; }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showApp, { once:true });
        else showApp();
      }catch{ location.replace('/admin-login'); }
    }
    check();
  })();
  </script>
</head>
<body>
  <div id="gate">Checking session…</div>

  <div id="app">
    <div class="wrap">
      <div class="bar">
        <h1 style="margin:0">Admin Uploader</h1>
        <div style="display:flex;gap:8px;align-items:center">
          <a class="btn" href="/.netlify/functions/admin-logout">Sign out</a>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="cat">Category</label>
          <select id="cat">
            <option value="toolkit">Language Arts Toolkit (8)</option>
            <option value="adit">A Door Into Time (16)</option>
            <option value="lik">Lost in Kragdon‑Ah (16)</option>
            <option value="rfk">Return from Kragdon‑Ah (16)</option>
            <option value="wok">Warrior of Kragdon‑Ah (16)</option>
            <option value="life">Life Skills (32)</option>
          </select>
        </div>

        <div>
          <label for="slotSel">Slot</label>
          <select id="slotSel"></select>
          <div class="hint">Open slots show “Open”; taken slots show the current title.</div>
          <div id="slotWarn" class="taken-note" style="display:none"></div>
        </div>

        <div class="sp">
          <label for="title">Title</label>
          <input id="title" placeholder="Presentation title" />
        </div>
      </div>

      <div class="row">
        <div style="flex:1 1 320px">
          <div class="drop" id="drop">Drop files here, or use the pickers below</div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Add files</label>
          <input id="files" type="file" multiple />
        </div>
        <div>
          <label>Add a folder (optional)</label>
          <input id="folder" type="file" webkitdirectory directory multiple />
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="primary" id="upload">Upload</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="warn" id="deleteBtn" disabled>Delete slot</button>
        </div>
      </div>

      <div class="row">
        <div class="sp">
          <label>Selected files</label>
          <div class="list" id="list"></div>
        </div>
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

<script>
(function(){
  const CAT_META = {
    toolkit: { slots: 8,  baseOut: 'presentations/language-arts-toolkit' },
    adit:    { slots: 16, baseOut: 'presentations/a-door-into-time' },
    lik:     { slots: 16, baseOut: 'presentations/lost-in-kragdon-ah' },
    rfk:     { slots: 16, baseOut: 'presentations/return-from-kragdon-ah' },
    wok:     { slots: 16, baseOut: 'presentations/warrior-of-kragdon-ah' },
    life:    { slots: 32, baseOut: 'life-skills/presentations' }
  };

  // Keep batches small to avoid provider limits but support arbitrarily large uploads
  const BATCH_TARGET = 1.8 * 1024 * 1024; // ~1.8 MB per request

  const catEl = document.getElementById('cat');
  const slotSel = document.getElementById('slotSel');
  const slotWarn = document.getElementById('slotWarn');
  const deleteBtn = document.getElementById('deleteBtn');

  const titleEl = document.getElementById('title');
  const filesEl = document.getElementById('files');
  const folderEl = document.getElementById('folder');
  const dropEl = document.getElementById('drop');
  const listEl = document.getElementById('list');
  const logEl = document.getElementById('log');
  const uploadBtn = document.getElementById('upload');

  let queue = [];
  let siteState = null;

  function log(){ logEl.textContent += Array.from(arguments).join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }
  function fmtBytes(n){ if(!n && n!==0) return ''; const u=['B','KB','MB','GB']; let i=0; while(n>1024&&i<u.length-1){n/=1024;i++} return n.toFixed(1)+' '+u[i]; }

  async function loadState(){
    try{
      const r = await fetch('/assets/data/site-state.json', { cache:'no-store' });
      if (r.ok) { siteState = await r.json(); return; }
    } catch {}
    siteState = { version:'v1', updated:'', categories:{} };
    for (const [id, meta] of Object.entries(CAT_META)) {
      siteState.categories[id] = { slots: meta.slots, titles: [], links: [] };
    }
  }

  function firstOpenSlot(titles=[], total=1){
    for (let i=0;i<total;i++){
      const t = (titles[i]||'').trim();
      if (!t) return i+1;
    }
    return 1;
  }

  function renderSlots(){
    const cat = catEl.value;
    const meta = CAT_META[cat];
    const titles = (siteState && siteState.categories && siteState.categories[cat] && siteState.categories[cat].titles) || [];
    const total = meta.slots;

    const prev = Number(slotSel.value) || 0;

    slotSel.innerHTML = '';
    for (let i=1; i<=total; i++){
      const title = (titles[i-1]||'').trim();
      const opt = document.createElement('option');
      const num = String(i).padStart(2,'0');
      opt.value = String(i);
      opt.textContent = title ? `${num} — ${title}` : `${num} — Open`;
      slotSel.appendChild(opt);
    }

    let defaultSlot = firstOpenSlot(titles, total);
    if (prev>=1 && prev<=total) defaultSlot = prev;
    slotSel.value = String(defaultSlot);

    updateSlotWarningAndTitle();
  }

  function updateSlotWarningAndTitle(){
    const cat = catEl.value;
    const titles = (siteState && siteState.categories && siteState.categories[cat] && siteState.categories[cat].titles) || [];
    const s = Number(slotSel.value)||1;
    const existing = (titles[s-1]||'').trim();

    if (existing) {
      slotWarn.style.display = '';
      slotWarn.textContent = `Note: Slot ${String(s).padStart(2,'0')} is already used (“${existing}”). Uploading will replace its files and title.`;
      deleteBtn.disabled = false;
      if (!(titleEl.value||'').trim()) titleEl.value = existing;
    } else {
      slotWarn.style.display = 'none';
      deleteBtn.disabled = true;
    }
  }

  catEl.addEventListener('change', renderSlots);
  slotSel.addEventListener('change', updateSlotWarningAndTitle);

  function addFiles(fileList){
    for (const f of fileList) {
      // Skip hidden files like .DS_Store
      if (String(f.name||'').startsWith('.')) continue;
      let path = f.webkitRelativePath || f.name;
      if (path.includes('/')) {
        const parts = path.split('/');
        path = parts.slice(1).join('/') || parts[parts.length-1];
      }
      queue.push({ file:f, path });
    }
    renderList();
  }

  function renderList(){
    if (!queue.length) { listEl.textContent = '(no files selected)'; return; }
    const items = queue.map(q => `• ${q.path} (${fmtBytes(q.file.size)})`).join('\n');
    listEl.textContent = items;
  }

  filesEl.addEventListener('change', (e)=> addFiles(e.target.files||[]));
  folderEl.addEventListener('change', (e)=> addFiles(e.target.files||[]));

  ;['dragenter','dragover'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropEl.classList.add('drag'); }));
  ;['dragleave','drop'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropEl.classList.remove('drag'); }));
  dropEl.addEventListener('drop', e => {
    const dt = e.dataTransfer;
    if (dt && dt.files) addFiles(dt.files);
  });

  // Robust base64 for large files: use readAsDataURL and strip the prefix
  async function toBase64(f){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => {
        try {
          const s = String(r.result||'');
          const i = s.indexOf('base64,');
          res(i >= 0 ? s.slice(i+7) : s);
        } catch(e){ rej(e); }
      };
      r.onerror = () => rej(r.error||new Error('read error'));
      r.readAsDataURL(f);
    });
  }

  function estimateB64Size(bytes){ return Math.ceil(bytes * 4 / 3); }

  uploadBtn.addEventListener('click', async () => {
    try{
      const category = catEl.value;
      const slot = Number(slotSel.value);
      const title = (titleEl.value||'').trim();
      const total = CAT_META[category].slots;
      if (!category || !slot || slot<1 || slot>total) { alert('Please choose a valid category and slot'); return; }
      if (!title) { alert('Please enter a title'); return; }
      if (!queue.length) { alert('Please add at least one file'); return; }

      log('Preparing files…');
      const encoded = [];
      let totalBytes = 0, doneBytes = 0;
      for (const q of queue) totalBytes += q.file.size;

      for (const q of queue) {
        const b64 = await toBase64(q.file);
        const encSize = estimateB64Size(q.file.size);
        doneBytes += q.file.size;
        encoded.push({ path: q.path, base64: b64, encSize });
        log(`Encoded ${q.path} (${fmtBytes(q.file.size)})  [${fmtBytes(doneBytes)}/${fmtBytes(totalBytes)}]`);
      }

      // Batch into multiple small requests
      const batches = [];
      let cur = [], curSize = 0;
      for (const e of encoded) {
        if (curSize + e.encSize > BATCH_TARGET && cur.length) {
          batches.push(cur); cur = []; curSize = 0;
        }
        cur.push({ path:e.path, base64:e.base64 });
        curSize += e.encSize;
      }
      if (cur.length) batches.push(cur);

      log(`Uploading in ${batches.length} batch(es)…`);
      let lastText = '';
      for (let i=0;i<batches.length;i++){
        const files = batches[i];
        const isFinal = (i === batches.length - 1);
        const body = JSON.stringify({ category, slot, title, files, final: isFinal });
        const res = await fetch('/.netlify/functions/incremental-deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body
        });
        const text = await res.text().catch(()=> '');
        lastText = text;
        log(`Batch ${i+1}/${batches.length} -> ${res.status} ${text}`);
        if (res.status === 401) { alert('Session expired. Please sign in again.'); location.replace('/admin-login'); return; }
        if (!res.ok) { alert(`Upload failed: ${res.status}\n${(text||'').slice(0,400)}`); return; }
      }

      // Update dropdown state immediately
      if (siteState?.categories?.[category]?.titles) {
        const titles = siteState.categories[category].titles;
        while (titles.length < total) titles.push('');
        titles[slot-1] = title;
      }
      renderSlots();
      alert('Upload complete');
    }catch(e){
      console.error(e);
      log('Error:', e && e.message ? e.message : String(e));
      alert('Error: ' + (e && e.message ? e.message : String(e)));
    }
  });

  deleteBtn.addEventListener('click', async () => {
    const category = catEl.value;
    const slot = Number(slotSel.value);
    if (!category || !slot) return;
    if (!confirm(`Delete all files and the title for slot ${String(slot).padStart(2,'0')}? This cannot be undone.`)) return;

    try{
      log('Deleting…');
      const res = await fetch('/.netlify/functions/incremental-deploy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ action:'delete', category, slot })
      });
      const text = await res.text().catch(()=> '');
      log(`Delete response ${res.status} -> ${text}`);
      if (res.status === 401) { alert('Session expired. Please sign in again.'); location.replace('/admin-login'); return; }
      if (!res.ok) { alert(`Delete failed: ${res.status}\n${(text||'').slice(0,400)}`); return; }

      if (siteState?.categories?.[category]) {
        const titles = siteState.categories[category].titles || [];
        const links  = siteState.categories[category].links  || [];
        titles[slot-1] = ''; links[slot-1] = '';
      }
      renderSlots();
      alert('Slot deleted');
    }catch(e){
      console.error(e);
      log('Error:', e && e.message ? e.message : String(e));
      alert('Error: ' + (e && e.message ? e.message : String(e)));
    }
  });

  (async()=>{
    await loadState();
    renderSlots();
    renderList();
    try{
      const r=await fetch('/.netlify/functions/incremental-deploy?action=diagnostics',{cache:'no-store', credentials:'same-origin'});
      const t=await r.text().catch(()=> ''); log('GET diagnostics ->', r.status, t);
    }catch(e){ log('Diagnostics failed', e?.message||String(e)); }
  })();
})();
</script>
</body>
</html>
