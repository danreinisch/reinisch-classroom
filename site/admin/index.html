<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reinisch Classroom — Admin Uploader</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:#e8edf5}
    .wrap{max-width:960px;margin:40px auto;padding:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px}
    label{display:block;margin:12px 0 6px}
    select,input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
    input[type=file]{display:block;width:100%;padding:10px;border-radius:8px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff}
    button{margin-top:16px;padding:10px 16px;border-radius:10px;border:1px solid #60a5fa;background:linear-gradient(180deg,#60a5fa,#2563eb);color:#fff;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .log{margin-top:16px;background:#0e1629;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px;height:160px;overflow:auto;font:12px ui-monospace,Menlo,Consolas,monospace;color:#dbeafe}
    small{color:#b8c1d9}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Uploader</h1>
    <p>Upload a new presentation/module without re-uploading the whole site.</p>

    <div class="row">
      <div>
        <label>Category</label>
        <select id="cat">
          <option value="toolkit">Language Arts Toolkit</option>
          <option value="adit">A Door Into Time</option>
          <option value="lik">Lost in Kragdon-ah</option>
          <option value="rfk">Return from Kragdon-ah</option>
          <option value="wok">Warrior of Kragdon-ah</option>
          <option value="life">Life Skills</option>
        </select>
      </div>
      <div>
        <label>Slot</label>
        <select id="slot"></select>
        <small id="slotHelp"></small>
      </div>
    </div>

    <label>Title</label>
    <input id="title" type="text" placeholder="Presentation title"/>

    <label>Presentation folder</label>
    <input id="folder" type="file" webkitdirectory directory multiple />
    <small>Choose the folder for this presentation. The index.html (if present) will be auto-linked.</small>

    <label>Optional background image(s) to add/replace</label>
    <input id="bgs" type="file" multiple accept="image/*"/>
    <small>Only include if you want to add/replace images under assets/images/</small>

    <div style="display:flex;gap:10px;align-items:center">
      <button id="go">Upload & Deploy (Incremental)</button>
      <small>Only changed files are uploaded.</small>
    </div>

    <div id="log" class="log" aria-live="polite"></div>
  </div>

<script>
const catMeta = {
  toolkit: { slots: 8,  baseOut: 'language-arts/toolkit/presentations', section: 'language-arts', back: '/language-arts/toolkit/index.html' },
  adit:    { slots: 16, baseOut: 'presentations/a-door-into-time',      section: 'language-arts', back: '/language-arts/a-door-into-time/index.html' },
  lik:     { slots: 16, baseOut: 'presentations/lost-in-kragdon-ah',     section: 'language-arts', back: '/language-arts/lost-in-kragdon-ah/index.html' },
  rfk:     { slots: 16, baseOut: 'presentations/return-from-kragdon-ah', section: 'language-arts', back: '/language-arts/return-from-kragdon-ah/index.html' },
  wok:     { slots: 16, baseOut: 'presentations/warrior-of-kragdon-ah',  section: 'language-arts', back: '/language-arts/warrior-of-kragdon-ah/index.html' },
  life:    { slots: 32, baseOut: 'life-skills/presentations',            section: 'life-skills',   back: '/life-skills/index.html' }
};

function log(){const el=document.getElementById('log');el.textContent+=Array.from(arguments).join(' ')+'\n';el.scrollTop=el.scrollHeight;}

async function loadState(){
  try{
    const res=await fetch('/assets/data/site-state.json',{cache:'no-store'});
    if(!res.ok) throw new Error('state not found');
    return await res.json();
  }catch{
    return { version:'v1', updated:'', categories:Object.fromEntries(Object.entries(catMeta).map(([id,m])=>[id,{slots:m.slots,titles:[],links:[]}])) };
  }
}

function fillSlots(catId,state){
  const sel=document.getElementById('slot'); sel.innerHTML='';
  const total=catMeta[catId].slots; const titles=state.categories[catId]?.titles||[];
  let firstEmpty=1;
  for(let i=1;i<=total;i++){
    const title=titles[i-1]||''; if(!title && firstEmpty===1) firstEmpty=i;
    const opt=document.createElement('option'); opt.value=String(i);
    opt.textContent='#'+String(i).padStart(2,'0')+(title?` — ${title}`:' (empty)'); sel.appendChild(opt);
  }
  sel.value=String(firstEmpty);
  document.getElementById('slotHelp').textContent='First empty suggested. You can override.';
}

function relPath(file){ if(file.webkitRelativePath){ const parts=file.webkitRelativePath.split('/'); return parts.slice(1).join('/'); } return file.name; }

async function toBase64(file){
  const buf=await file.arrayBuffer(); let binary=''; const bytes=new Uint8Array(buf); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(binary);
}

async function run(){
  const state=await loadState(); const catEl=document.getElementById('cat');
  fillSlots(catEl.value,state); catEl.addEventListener('change',()=>fillSlots(catEl.value,state));

  document.getElementById('go').addEventListener('click', async ()=>{
    const cat=document.getElementById('cat').value;
    const slot=Number(document.getElementById('slot').value);
    const title=document.getElementById('title').value.trim();
    const folder=document.getElementById('folder').files;
    const bgs=document.getElementById('bgs').files;

    if(!folder || folder.length===0) return log('Please choose a presentation folder.');
    if(!title) return log('Please enter a title.');

    log('Preparing files...');
    const files=[];
    for(const f of folder) files.push({ path: relPath(f), base64: await toBase64(f) });
    for(const f of bgs) files.push({ path: 'assets/images/' + f.name, base64: await toBase64(f) });

    const res=await fetch('/.netlify/functions/incremental-deploy', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ category:cat, slot, title, files })
    });

    const json = await res.json().catch(()=>({}));
    if(res.ok && json.deploy_url){ log('Success! Deployed:', json.deploy_url); }
    else{ log('Deploy error:', res.status, json.message || res.statusText); }
  });
}
run();
</script>
</body>
</html>
