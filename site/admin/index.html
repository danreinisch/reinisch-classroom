<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reinisch Classroom — Admin</title>

  <!-- Shared theme + auto “glass” nav -->
  <link rel="stylesheet" href="/assets/css/theme.css"/>
  <script src="/assets/js/admin-guard.js"></script>
  <script src="/assets/js/section-nav.js" defer></script>
  <script src="./gate.js" defer></script>

  <style>
    .wrap{
      max-width:1100px;margin:32px auto;padding:20px;
      background:var(--panel);border:1px solid var(--panel-brd);border-radius:12px
    }
    .bar{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:12px
    }
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .row > *{flex:1 1 220px}
    label{display:block;margin-bottom:6px;font-weight:600;color:var(--muted)}
    input,select,button,textarea{
      width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);color:#fff
    }
    button.primary{
      border:1px solid #5aa9ff;background:linear-gradient(180deg,#90c4ff,#5aa9ff);cursor:pointer
    }
    button.warn{
      border:1px solid #f59e0b;background:linear-gradient(180deg,#fbbf24,#f59e0b);cursor:pointer;color:#1b2437
    }
    .drop{
      border:2px dashed rgba(255,255,255,.25);padding:18px;border-radius:12px;text-align:center;color:var(--muted)
    }
    .drop.drag{border-color:#90c4ff;color:#fff;background:rgba(144,196,255,.10)}
    .list{
      max-height:220px;overflow:auto;background:#0e1629;border:1px solid rgba(255,255,255,.14);
      border-radius:10px;padding:8px;font:12px ui-monospace,Menlo,Consolas,monospace
    }
    .log{
      margin-top:16px;background:#0e1629;border:1px solid rgba(255,255,255,.14);
      border-radius:10px;padding:10px;height:260px;overflow:auto;font:12px ui-monospace,Menlo,Consolas,monospace;
      color:#dbeafe;white-space:pre-wrap
    }
    .sp{flex:1}
    .hint{font-size:12px;color:var(--muted);margin-top:4px}
    .taken-note{font-size:12px;color:#fde68a;margin-top:4px}
  </style>
</head>
<body>
  <!-- glass top-nav is injected by section-nav.js; we also keep explicit Home/Sign out in the header -->
  <div id="gate" style="min-height:100vh;display:grid;place-items:center">Checking session…</div>

  <div id="app" style="display:none">
    <div class="wrap">
      <div class="bar">
        <h1 style="margin:0">Admin Uploader</h1>
        <div style="display:flex;gap:.5rem;align-items:center">
          <a class="btn" href="/">Home</a>
          <a class="btn" href="/.netlify/functions/admin-logout">Sign out</a>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="cat">Category</label>
          <select id="cat"></select>
        </div>

        <div>
          <label for="slotSel">Slot</label>
          <select id="slotSel"></select>
          <div class="hint">Open slots show “Open”; taken slots show the current title.</div>
          <div id="slotWarn" class="taken-note" style="display:none"></div>
        </div>

        <div class="sp">
          <label for="title">Title</label>
          <input id="title" placeholder="Presentation title" />
        </div>
      </div>

      <div class="row">
        <div style="flex:1 1 320px">
          <div class="drop" id="drop">Drop files here, or use the pickers below</div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Add files</label>
          <input id="files" type="file" multiple />
        </div>
        <div>
          <label>Add a folder (optional)</label>
          <input id="folder" type="file" webkitdirectory directory multiple />
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="primary" id="upload">Upload</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="warn" id="deleteBtn" disabled>Delete slot</button>
        </div>
      </div>

      <div class="row">
        <div class="sp">
          <label>Selected files</label>
          <div class="list" id="list">(no files selected)</div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Diagnostic Tools</label>
          <button class="primary" id="auditBtn">Audit Life Skills</button>
          <div class="hint">Scan Life Skills directories and verify site-state.json entries</div>
        </div>
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

<script src="./app.js"></script>
</body>
</html>
