<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reinisch Classroom — Admin</title>
  <style>
    :root{--bg:#0b1220;--panel:rgba(255,255,255,.06);--panel-brd:rgba(255,255,255,.18);--text:#e8edf5}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
    #gate{min-height:100vh;display:grid;place-items:center}
    #app{display:none}
  </style>
  <script>
  // Gate: verify session on the server. If not logged in → redirect to /admin-login.
  (function(){
    function showApp(){
      const app = document.getElementById('app');
      const gate = document.getElementById('gate');
      if (app) app.style.display = 'block';
      if (gate) gate.style.display = 'none';
    }
    async function check(){
      try{
        const r = await fetch('/.netlify/functions/admin-session-check', { cache:'no-store' });
        if (!r.ok) { location.replace('/admin-login'); return; }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showApp, { once:true });
        } else {
          showApp();
        }
      }catch{
        location.replace('/admin-login');
      }
    }
    check();
  })();
  </script>
</head>
<body>
  <div id="gate">Checking session…</div>

  <div id="app">
    <div style="max-width:960px;margin:40px auto;padding:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h1 style="margin:0">Admin Uploader</h1>
        <div>
          <a href="/.netlify/functions/admin-logout" style="color:#fff;border:1px solid #fff;padding:.4rem .7rem;border-radius:.5rem;text-decoration:none">Sign out</a>
        </div>
      </div>
      <div id="uploader-root"></div>
      <div id="log" style="margin-top:16px;background:#0e1629;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px;height:260px;overflow:auto;font:12px ui-monospace,Menlo,Consolas,monospace;color:#dbeafe;white-space:pre-wrap"></div>
    </div>

    <script>
    // Minimal diagnostics
    function log(){ const el=document.getElementById('log'); el.textContent+=Array.from(arguments).join(' ')+'\\n'; el.scrollTop=el.scrollHeight; }
    (async()=>{
      try{
        const r=await fetch('/.netlify/functions/incremental-deploy?action=diagnostics',{cache:'no-store'});
        const t=await r.text().catch(()=> ''); log('GET diagnostics ->', r.status, t.slice(0,300));
      }catch(e){ log('Diagnostics failed', e?.message||String(e)); }
    })();
    </script>
  </div>
</body>
</html>
