<div id="connectivityDetails" style="margin-top:12px;padding:10px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid var(--line);display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <div style="font-weight:800">Connectivity Details</div>
    <button id="btnRetryConnectivity" class="btn small" style="padding:4px 8px;font-size:12px">Try again</button>
  </div>
  <div id="connectivityMessage" class="subtle"></div>
  <div id="connectivityTimestamp" class="subtle" style="margin-top:4px;font-size:12px"></div>
</div>

<script type="module">
  import * as supabaseSettings from '../web/supabase-settings.js';

  document.addEventListener('DOMContentLoaded', async () => {
    // Migrate legacy keys
    const migrationResult = supabaseSettings.migrateLegacyKeys();
    if (migrationResult?.migrated) console.log('[Settings] Legacy keys migrated:', migrationResult.message);

    // Auto-enable when URL + Anon exist and user hasn’t opted out
    const auto = supabaseSettings.autoEnableIfEligible();
    if (auto.changed) {
      if (typeof addNotif === 'function') addNotif('Supabase enabled — you can turn this off in Settings', { type: 'success' });
      window.dispatchEvent(new CustomEvent('rc:remote-config-changed', { detail: { config: auto.config, autoEnabled: true } }));
    }

    // Initial connectivity probe
    try {
      const probe = await supabaseSettings.testConnectivity(supabaseSettings.readConfig());
      window.dispatchEvent(new CustomEvent('rc:remote-connectivity-checked', { detail: probe }));
    } catch {}
  });

  // Enhance Save behavior to preserve anon and track opt-out
  function saveSettingsEnhanced() {
    const url = (document.querySelector('#supabaseUrl')?.value || '').trim();
    const key = (document.querySelector('#supabaseKey')?.value || '').trim();
    const enabled = !!document.querySelector('#useSupabase')?.checked;

    const current = supabaseSettings.readConfig();
    const turningOff = current.enabled && !enabled;
    const turningOnAfterOptOut = !current.enabled && enabled && current.optOut;

    supabaseSettings.writeConfig(
      {
        url,
        anon: key,
        enabled,
        optOut: turningOnAfterOptOut ? false : (turningOff ? true : undefined),
        autoEnabled: enabled ? undefined : false
      },
      { preserveAnonIfMasked: true }
    );

    if (typeof testSupabaseConnection === 'function') testSupabaseConnection();
  }

  const btnSave = document.querySelector('#btnSaveSettings, button#saveSettings, button[data-action="saveSettings"]');
  if (btnSave && !btnSave.__rcEnhanced) {
    btnSave.__rcEnhanced = true;
    btnSave.addEventListener('click', () => { try { saveSettingsEnhanced(); } catch {} }, { capture: true });
  }

  // Debounced retry button behavior
  let lastConnectivityTest = 0;
  const CONNECTIVITY_TEST_DEBOUNCE_MS = 2000;

  async function retryConnectivityTest() {
    const now = Date.now();
    if (now - lastConnectivityTest < CONNECTIVITY_TEST_DEBOUNCE_MS) return;
    lastConnectivityTest = now;

    const retryBtn = document.querySelector('#btnRetryConnectivity');
    if (!retryBtn) return;
    const originalText = retryBtn.textContent;
    retryBtn.disabled = true;
    retryBtn.textContent = '⏳ Testing...';

    try {
      if (typeof testSupabaseConnection === 'function') await testSupabaseConnection();
      window.dispatchEvent(new CustomEvent('rc:remote-connectivity-checked', { detail: { timestamp: new Date().toISOString() } }));
    } finally {
      retryBtn.disabled = false;
      retryBtn.textContent = originalText;
    }
  }

  document.querySelector('#btnRetryConnectivity')?.addEventListener('click', retryConnectivityTest);
</script>
