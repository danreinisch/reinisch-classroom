<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment Hub – Language Arts</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="section" content="Language Arts" />
  
  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <script src="/web/public-nav.js"></script>
  <script src="/web/sidebar-init.js"></script>
  
  <style>
    .card { 
      background: var(--rc-glass);
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius);
      padding: 1rem;
      margin: 0.75rem 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .meta { color: var(--rc-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    form { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
    input[type=text], textarea { 
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--rc-border);
      border-radius: var(--rc-radius-sm);
      background: var(--rc-glass);
      color: var(--rc-ink);
      font-family: var(--rc-font);
    }
    button { 
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--rc-brand);
      background: var(--rc-brand);
      color: var(--rc-ink);
      border-radius: var(--rc-radius-sm);
      cursor: pointer;
      font-family: var(--rc-font);
      font-weight: 500;
    }
    button:hover {
      opacity: 0.9;
    }
    .ok { color: var(--rc-success); font-weight: 600; }
    .err { color: var(--rc-danger); font-weight: 600; }
  </style>
</head>
<body>
  <div class="tc-app" data-page-title="Assignment Hub">

    <div class="tc-shell">

      <main class="tc-main">
        <h1 style="margin:0 0 .25rem; font-size:2.25rem; font-weight:850; letter-spacing:-0.02em;">Assignment Hub</h1>
        <div id="list">Loading assignments…</div>
      </main>
    </div>
  </div>

  <script defer src="/web/public-shell.js"></script>
  <script defer src="/web/assignment-hub-app.js"></script>
</body>
</html>
