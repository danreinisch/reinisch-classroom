<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment Hub – Language Arts</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="section" content="Language Arts" />
  
  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  
  <style>
    body {
      background:
        url("/assets/bg/bg5e_soft_grid.svg") center/cover no-repeat fixed,
        radial-gradient(1200px 800px at 20% -10%, rgba(34, 197, 94, 0.08), transparent 50%),
        radial-gradient(1200px 800px at 120% 20%, rgba(6, 182, 212, 0.06), transparent 50%),
        linear-gradient(180deg, var(--rc-base), #0c1322 60%, #0b0f14);
    }
    .card { 
      background: var(--rc-glass);
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius);
      padding: 1rem;
      margin: 0.75rem 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .meta { color: var(--rc-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    form { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
    input[type=text], textarea { 
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--rc-border);
      border-radius: var(--rc-radius-sm);
      background: var(--rc-glass);
      color: var(--rc-ink);
      font-family: var(--rc-font);
    }
    button { 
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--rc-brand);
      background: var(--rc-brand);
      color: var(--rc-ink);
      border-radius: var(--rc-radius-sm);
      cursor: pointer;
      font-family: var(--rc-font);
      font-weight: 500;
    }
    button:hover {
      opacity: 0.9;
    }
    .ok { color: var(--rc-success); font-weight: 600; }
    .err { color: var(--rc-danger); font-weight: 600; }
  </style>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
      <a class="tc-btn" href="/" aria-label="Home">🏠</a>
      <div class="tc-title">Assignment Hub</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/" data-href="/">
            <span class="tc-icon">🏠</span>
            <span class="tc-label">Home</span>
          </a>
          <a href="/language-arts/" data-href="/language-arts/">
            <span class="tc-icon">📖</span>
            <span class="tc-label">Language Arts</span>
          </a>
          <a href="/language-arts/toolkit/" data-href="/language-arts/toolkit/">
            <span class="tc-icon">📚</span>
            <span class="tc-label">Toolkit</span>
          </a>
          <a href="/language-arts/assignment-hub/" data-href="/language-arts/assignment-hub/">
            <span class="tc-icon">📋</span>
            <span class="tc-label">Assignment Hub</span>
          </a>
          <a href="/language-arts/a-door-into-time/" data-href="/language-arts/a-door-into-time/">
            <span class="tc-icon">📕</span>
            <span class="tc-label">A Door Into Time</span>
          </a>
          <a href="/language-arts/lost-in-kragdon-ah/" data-href="/language-arts/lost-in-kragdon-ah/">
            <span class="tc-icon">📗</span>
            <span class="tc-label">Lost in Kragdon-ah</span>
          </a>
          <a href="/language-arts/return-from-kragdon-ah/" data-href="/language-arts/return-from-kragdon-ah/">
            <span class="tc-icon">📘</span>
            <span class="tc-label">Return from Kragdon-ah</span>
          </a>
          <a href="/language-arts/warrior-of-kragdon-ah/" data-href="/language-arts/warrior-of-kragdon-ah/">
            <span class="tc-icon">📙</span>
            <span class="tc-label">Warrior of Kragdon-ah</span>
          </a>
        </nav>
      </aside>

      <main class="tc-main">
        <h1 style="margin:0 0 .25rem; font-size:2.25rem; font-weight:850; letter-spacing:-0.02em;">Assignment Hub</h1>
        <div id="list">Loading assignments…</div>
      </main>
    </div>
  </div>

  <script defer src="/web/public-shell.js"></script>
  <script>
    async function fetchJSON(url, init) {
      const res = await fetch(url, init);
      const text = await res.text();
      try { return { ok: res.ok, status: res.status, data: res.ok ? JSON.parse(text) : text }; }
      catch { return { ok: res.ok, status: res.status, data: text }; }
    }

    function card(assign) {
      const due = assign.due_date ? new Date(assign.due_date + 'T00:00:00').toLocaleDateString() : 'No due date';
      return `
        <div class="card" data-id="${assign.id}">
          <h3>${assign.title}</h3>
          <div class="meta">Due: ${due} · Section: ${assign.section || 'language-arts'}</div>
          <p>${assign.description || ''}</p>
          <form onsubmit="return submitWork(event, ${assign.id})">
            <input type="text" name="student_name" placeholder="Your name" required />
            <textarea name="content" placeholder="Write your response (optional)"></textarea>
            <input type="text" name="content_url" placeholder="Link to Google Doc / Drive (optional)" />
            <button type="submit">Submit</button>
            <span class="status" aria-live="polite"></span>
          </form>
        </div>
      `;
    }

    async function loadAssignments() {
      const { ok, data } = await fetchJSON('/.netlify/functions/assignments-list');
      const list = document.getElementById('list');
      if (!ok) { list.textContent = 'Failed to load assignments.'; return; }
      const A = (data.assignments || []);
      if (!A.length) { list.textContent = 'No active assignments yet.'; return; }
      list.innerHTML = A.map(card).join('');
    }

    async function submitWork(ev, assignment_id) {
      ev.preventDefault();
      const form = ev.target;
      const status = form.querySelector('.status');
      status.textContent = 'Submitting…';
      const payload = {
        assignment_id,
        student_name: form.student_name.value.trim(),
        content: form.content.value.trim() || null,
        content_url: form.content_url.value.trim() || null,
      };
      const { ok, data } = await fetchJSON('/.netlify/functions/submissions-create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (ok) {
        status.textContent = 'Submitted!';
        status.className = 'status ok';
        form.reset();
      } else {
        status.textContent = 'Submit failed: ' + (typeof data === 'string' ? data : 'error');
        status.className = 'status err';
      }
      return false;
    }

    loadAssignments();
  </script>
</body>
</html>
