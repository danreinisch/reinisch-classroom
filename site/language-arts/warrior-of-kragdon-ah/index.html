<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Warrior of Kragdon-ah – Reinisch Classroom</title>
  <meta name="description" content="Language Arts unit — Warrior of Kragdon-ah"/>
  <link rel="stylesheet" href="/assets/css/theme.css"/>
  <script src="/assets/js/open-in-viewer.js"></script>
  <script src="/assets/js/section-nav.js" defer></script>
  <style>
    .wrap{ max-width:1100px; margin:2.2rem auto; padding:0 1rem }
    header{ text-align:center; margin-bottom:1.2rem }
    h1{ margin:.2rem 0 .3rem 0; font-size:2rem }
    .sub{ color:var(--muted); margin:0 0 1.2rem 0 }
    .grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); align-items:stretch }
    .card{ display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--panel-brd); border-radius:14px; padding:18px; min-height:98px; transition:transform .12s ease, border-color .12s ease, background .12s ease }
    .card:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.08) }
    .card.disabled{ cursor:default }
    .card.disabled:hover{ transform:none; border-color:var(--panel-brd); background:var(--panel) }
    .t{ font-weight:800; line-height:1.3 }
    .s{ margin-top:.2rem; color:var(--muted); font-size:.92rem }
  </style>
  <script src="/assets/js/unit-grid.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Warrior of Kragdon-ah</h1>
      <p class="sub">Unit hub</p>
      <nav style="display:flex;justify-content:center;gap:10px;margin-bottom:1.2rem">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/language-arts/">Back to Language Arts</a>
      </nav>
    </header>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>
</body>
</html>
