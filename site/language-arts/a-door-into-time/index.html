    body {

        url("/assets/bg/bg5e_soft_grid.svg") center/cover no-repeat fixed,
        radial-gradient(1200px 800px at 20% -10%, rgba(34, 197, 94, 0.08), transparent 50%),
        radial-gradient(1200px 800px at 120% 20%, rgba(6, 182, 212, 0.06), transparent 50%),
        linear-gradient(180deg, var(--rc-base), #0c1322 60%, #0b0f14);

    /* Styles for unit-grid.js generated elements */
    .wrap{ max-width:1100px; margin:1rem auto; padding:0 1rem }
    header{ margin-bottom:1.2rem }
    h1{ margin:.2rem 0 .3rem 0; font-size:2.25rem; font-weight:850; letter-spacing:-0.02em }
    .sub{ color:var(--rc-muted); margin:0 0 1.2rem 0 }
    .grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); align-items:stretch }
    .card{ display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; text-decoration:none; color:inherit; background:var(--rc-glass); border:1px solid var(--rc-glass-border); border-radius:var(--rc-radius-lg); padding:18px; min-height:98px; transition:transform .12s ease, border-color .12s ease, background .12s ease; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--rc-shadow) }
    .card:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.28); background:var(--rc-glass-hover) }
    .card.disabled{ cursor:default; opacity:0.6 }
    .card.disabled:hover{ transform:none; border-color:var(--rc-glass-border); background:var(--rc-glass) }
    .t{ font-weight:800; line-height:1.3 }
    .s{ margin-top:.2rem; color:var(--rc-muted); font-size:.92rem }
  </style>
