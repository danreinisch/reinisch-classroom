<!doctype html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Language Arts – Reinisch Classroom</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- RC Theme Design System -->
    <link rel="stylesheet" href="/assets/css/rc-theme.css" />
    <link rel="stylesheet" href="/web/teacher-shell.css" />
    <script src="/web/public-nav.js"></script>
    <script>try{if(localStorage.getItem('rc_public_sidebar')!=='expanded')document.documentElement.classList.add('tc-collapsed');}catch(_){document.documentElement.classList.add('tc-collapsed');}</script>

    <style>
      /* Link styling for rc-card */
      a.rc-card {
        text-decoration: none;
        color: inherit;
        display: block;
      }

      /* Main content styling */
      .content-wrapper {
        padding-top: 1rem;
      }

      .content-wrapper h1 {
        font-size: 38px;
        font-weight: 850;
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
        color: var(--rc-ink);
      }

      .content-wrapper > p {
        font-size: 1.05rem;
        color: var(--rc-ink-dim);
        margin: 0 0 1.5rem 0;
        max-width: 72ch;
      }

      .book-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
        margin-top: 2rem;
      }

      .book-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        backdrop-filter: blur(12px) saturate(130%);
        -webkit-backdrop-filter: blur(12px) saturate(130%);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-left: 3px solid transparent;
        border-radius: 18px;
        text-decoration: none;
        color: inherit;
        transition: all 0.25s ease;
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        min-height: 90px;
      }

      .book-card:hover {
        transform: translateY(-4px);
        border-color: rgba(34, 197, 94, 0.35);
        box-shadow: 
          0 16px 48px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .book-card:nth-child(1) { border-left-color: rgba(239, 68, 68, 0.5); }
      .book-card:nth-child(1):hover { border-left-color: rgba(239, 68, 68, 0.8); }
      .book-card:nth-child(2) { border-left-color: rgba(34, 197, 94, 0.5); }
      .book-card:nth-child(2):hover { border-left-color: rgba(34, 197, 94, 0.8); }
      .book-card:nth-child(3) { border-left-color: rgba(59, 130, 246, 0.5); }
      .book-card:nth-child(3):hover { border-left-color: rgba(59, 130, 246, 0.8); }
      .book-card:nth-child(4) { border-left-color: rgba(168, 85, 247, 0.5); }
      .book-card:nth-child(4):hover { border-left-color: rgba(168, 85, 247, 0.8); }

      .book-icon {
        font-size: 2.5rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .book-title {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
      }

      .toolkit-card {
        display: inline-flex !important;
        align-items: center;
        gap: 10px;
        padding: 14px 24px !important;
        min-height: auto !important;
        border-color: rgba(34, 197, 94, 0.25) !important;
      }
      .toolkit-card:hover {
        border-color: rgba(34, 197, 94, 0.5) !important;
      }
    </style>
  </head>
  <body>
    <div class="tc-app" data-page-title="Language Arts">

      <div class="tc-shell">

        <main class="tc-main">
          <div class="content-wrapper">
            <h1>Language Arts</h1>
            <p>
              Choose a book or open the toolkit for skills reference &amp; mini-lessons.
            </p>

            <div style="margin-bottom: 1.5rem">
              <a class="rc-card toolkit-card" href="/language-arts/toolkit/index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
                <strong>Language Arts Toolkit</strong>
              </a>
            </div>

            <div class="book-grid">
              <a class="book-card" href="/language-arts/a-door-into-time/index.html">
                <div class="book-icon">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                  </svg>
                </div>
                <strong class="book-title">A Door Into Time</strong>
              </a>
              <a class="book-card" href="/language-arts/lost-in-kragdon-ah/index.html">
                <div class="book-icon">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                  </svg>
                </div>
                <strong class="book-title">Lost in Kragdon-ah</strong>
              </a>
              <a class="book-card" href="/language-arts/return-from-kragdon-ah/index.html">
                <div class="book-icon">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                  </svg>
                </div>
                <strong class="book-title">Return from Kragdon-ah</strong>
              </a>
              <a class="book-card" href="/language-arts/warrior-of-kragdon-ah/index.html">
                <div class="book-icon">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                  </svg>
                </div>
                <strong class="book-title">Warrior of Kragdon-ah</strong>
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script defer src="/web/public-shell.js"></script>
    <script defer src="/assets/js/open-in-viewer.js"></script>
  </body>
</html>
