<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reinisch Classroom — Student Hub</title>
<style>
  :root{ 
    --base:#0b1220; --panel:#0f172a; --panel-2:#111827; --edge:#0b1220;
    --ink:#e6edf3; --ink-dim:#cbd5e1; --muted:#94a3b8;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --brand:#22c55e; --brand-2:#06b6d4;
    --shadow-1:0 6px 28px rgba(0,0,0,.35); --shadow-2:0 14px 48px rgba(0,0,0,.45);
    --inset-top:inset 0 1px 0 rgba(255,255,255,.03);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0;
    background: url('/assets/bg/bg5e_soft_grid.png') center/cover no-repeat fixed,
                radial-gradient(1200px 800px at 20% -10%, rgba(34,197,94,.08), transparent 50%),
                radial-gradient(1200px 800px at 120% 20%, rgba(6,182,212,.06), transparent 50%),
                linear-gradient(180deg, #0b1220, #0c1322 60%, #0b0f14);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial;
  }
  
  .header{
    position:sticky; top:0; z-index:40; padding:16px 0;
    background:linear-gradient(180deg, rgba(34,197,94,.92), rgba(22,163,74,.92));
    border-bottom:1px solid rgba(255,255,255,.18);
  }
  .bar{max-width:1200px; margin:0 auto; padding:0 16px; display:flex; gap:12px; align-items:center;}
  .brand{font-weight:900; letter-spacing:.2px; margin-right:auto; color:#031f11; font-size:18px;}
  .chip{
    display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.25); color:#062513; font-weight:800;
  }
  .btn{
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
    color:var(--ink); padding:10px 16px; border-radius:10px;
    font-weight:800; cursor:pointer; transition:.15s;
  }
  .btn:hover{border-color:rgba(255,255,255,.24)}
  .btn.primary{
    background:linear-gradient(180deg,rgba(34,197,94,1),rgba(22,163,74,1));
    color:#032313; border:0;
    box-shadow:0 4px 16px rgba(34,197,94,.35);
  }
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.small{padding:6px 10px; font-size:14px}
  
  .container{
    max-width:1200px; margin:0 auto; padding:24px 16px;
  }
  
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow-1), var(--inset-top); padding:20px; margin-bottom:20px;
  }
  .card-header{
    font-size:20px; font-weight:900; margin-bottom:16px; color:var(--ink);
    display:flex; justify-content:space-between; align-items:center;
  }
  
  .login-box{
    max-width:420px; margin:80px auto; text-align:center;
  }
  .login-box h1{margin-bottom:8px; font-size:32px}
  .login-box .subtle{color:var(--muted); font-size:15px; margin-bottom:24px}
  
  label{display:block; margin:12px 0 6px 0; font-weight:700; text-align:left}
  input,select,textarea{
    width:100%; background:#1f2937; border:1px solid rgba(255,255,255,.14);
    border-radius:10px; color:var(--ink); padding:10px 12px; font-size:15px;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid rgba(34,197,94,.35); border-color:rgba(34,197,94,.45);
    box-shadow:0 0 0 3px rgba(34,197,94,.18);
  }
  
  .table{width:100%; border-collapse:collapse}
  .table th,.table td{padding:12px; border-bottom:1px solid var(--line); text-align:left}
  .table th{background:var(--edge); color:var(--ink); font-weight:800}
  .table td{color:var(--ink-dim)}
  .table tbody tr:hover{background:rgba(255,255,255,.03)}
  
  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
    border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,.10); font-size:13px; font-weight:700;
  }
  .badge.success{background:rgba(34,197,94,.2); border-color:rgba(34,197,94,.4); color:#4ade80}
  .badge.warning{background:rgba(245,158,11,.2); border-color:rgba(245,158,11,.4); color:#fbbf24}
  .badge.info{background:rgba(6,182,212,.2); border-color:rgba(6,182,212,.4); color:#22d3ee}
  
  .subtle{color:var(--muted); font-size:14px}
  
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  @media (max-width:768px){.grid-2{grid-template-columns:1fr}}
  
  .goal-item{
    display:flex; gap:12px; align-items:flex-start; padding:12px;
    border:1px solid var(--line); border-radius:10px;
    background:rgba(255,255,255,.03); margin-bottom:10px;
  }
  
  .sparkline{
    display:flex; align-items:flex-end; gap:3px; height:40px; margin-top:8px;
  }
  .sparkline .bar{
    flex:1; background:linear-gradient(180deg, rgba(34,197,94,.8), rgba(22,163,74,.8));
    border-radius:3px 3px 0 0; min-height:4px; transition:.2s;
  }
  
  .error-msg{
    padding:12px; background:rgba(239,68,68,.1); border-radius:8px;
    border:1px solid rgba(239,68,68,.5); color:#fecaca; margin-top:12px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="bar">
      <div class="brand">Reinisch Classroom — Student Hub</div>
      <span id="userChip" class="chip" style="display:none">Not logged in</span>
      <button class="btn small" id="btnLogout" style="display:none">Logout</button>
    </div>
  </div>

  <!-- Login View -->
  <div id="loginView" class="login-box card">
    <h1>Welcome!</h1>
    <div class="subtle">Sign in to access your assignments and progress</div>
    
    <label style="margin-top:24px">Student Code
      <input id="loginCode" type="text" placeholder="e.g., S001" autocomplete="username" />
    </label>
    
    <label>Password
      <input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" />
    </label>
    
    <div id="loginError" class="error-msg" style="display:none"></div>
    
    <button class="btn primary" id="btnLogin" style="width:100%; margin-top:20px">Sign In</button>
    
    <div class="subtle" style="margin-top:16px">
      First time? Your default password is your student code followed by an exclamation mark (e.g., S001!)
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboardView" class="container" style="display:none">
    <div class="grid-2">
      <!-- My Grades -->
      <div class="card">
        <div class="card-header">
          <div>📝 My Grades</div>
          <div class="badge" id="gradesCount">0 assignments</div>
        </div>
        
        <div id="gradesContent">
          <div class="subtle" style="text-align:center; padding:40px 20px">
            No assignments yet
          </div>
        </div>
      </div>

      <!-- My IEP Progress -->
      <div class="card">
        <div class="card-header">
          <div>🎯 My IEP Progress</div>
          <div class="badge" id="goalsCount">0 goals</div>
        </div>
        
        <div id="goalsContent">
          <div class="subtle" style="text-align:center; padding:40px 20px">
            No goals available
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, isRemote } from '../web/data-adapter.js';

    const qs = s => document.querySelector(s);
    let currentStudent = null;

    // Login handler
    qs('#btnLogin').addEventListener('click', async () => {
      const code = qs('#loginCode').value.trim();
      const password = qs('#loginPassword').value;
      
      if (!code) {
        showError('Please enter your student code');
        return;
      }
      
      if (!password) {
        showError('Please enter your password');
        return;
      }
      
      try {
        // Verify password
        const valid = await db.verifyStudentPassword(code, password);
        
        if (!valid) {
          showError('Invalid student code or password');
          return;
        }
        
        // Get student info
        const students = await db.listStudents();
        const student = students.find(s => s.code === code);
        
        if (!student) {
          showError('Student not found');
          return;
        }
        
        // Login successful
        currentStudent = student;
        sessionStorage.setItem('rc_student_code', code);
        showDashboard();
        
      } catch (err) {
        console.error('Login error:', err);
        showError('Login failed: ' + err.message);
      }
    });
    
    // Logout handler
    qs('#btnLogout').addEventListener('click', () => {
      currentStudent = null;
      sessionStorage.removeItem('rc_student_code');
      showLogin();
    });
    
    // Enter key on login
    qs('#loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        qs('#btnLogin').click();
      }
    });
    
    function showError(msg) {
      const errorDiv = qs('#loginError');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }
    
    function showLogin() {
      qs('#loginView').style.display = 'block';
      qs('#dashboardView').style.display = 'none';
      qs('#userChip').style.display = 'none';
      qs('#btnLogout').style.display = 'none';
      qs('#loginCode').value = '';
      qs('#loginPassword').value = '';
      qs('#loginError').style.display = 'none';
    }
    
    async function showDashboard() {
      qs('#loginView').style.display = 'none';
      qs('#dashboardView').style.display = 'block';
      qs('#userChip').style.display = 'inline-flex';
      qs('#userChip').textContent = currentStudent.name || currentStudent.code;
      qs('#btnLogout').style.display = 'inline-block';
      
      // Load dashboard data
      await loadGrades();
      await loadGoals();
    }
    
    async function loadGrades() {
      try {
        // Get all assignment instances for this student
        const instances = await db.listAssignmentInstances();
        const myInstances = instances.filter(i => i.student_code === currentStudent.code);
        
        qs('#gradesCount').textContent = `${myInstances.length} assignment${myInstances.length !== 1 ? 's' : ''}`;
        
        if (myInstances.length === 0) {
          qs('#gradesContent').innerHTML = '<div class="subtle" style="text-align:center; padding:40px 20px">No assignments yet</div>';
          return;
        }
        
        // Get assignment details
        const assignments = await db.listAssignments();
        const assignmentMap = new Map(assignments.map(a => [a.id, a]));
        
        // Build table
        let html = '<table class="table"><thead><tr><th>Assignment</th><th>Status</th><th>Due Date</th><th>Score</th></tr></thead><tbody>';
        
        for (const inst of myInstances) {
          const assignment = assignmentMap.get(inst.assignment_id);
          const title = assignment ? assignment.title : 'Unknown';
          const status = inst.status || 'Assigned';
          const dueDate = inst.due_at ? new Date(inst.due_at).toLocaleDateString() : '—';
          
          // Badge class based on status
          let badgeClass = 'info';
          if (status === 'Submitted' || status === 'Completed') badgeClass = 'success';
          else if (status === 'Late' || status === 'Overdue') badgeClass = 'warning';
          
          html += `<tr>
            <td>${title}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
            <td>${dueDate}</td>
            <td>—</td>
          </tr>`;
        }
        
        html += '</tbody></table>';
        qs('#gradesContent').innerHTML = html;
        
      } catch (err) {
        console.error('Failed to load grades:', err);
        qs('#gradesContent').innerHTML = '<div class="error-msg">Failed to load assignments</div>';
      }
    }
    
    async function loadGoals() {
      try {
        // Get goals for this student
        const goals = await db.listGoalsByStudentCode(currentStudent.code);
        
        qs('#goalsCount').textContent = `${goals.length} goal${goals.length !== 1 ? 's' : ''}`;
        
        if (goals.length === 0) {
          qs('#goalsContent').innerHTML = '<div class="subtle" style="text-align:center; padding:40px 20px">No goals available</div>';
          return;
        }
        
        // Build goals list
        let html = '';
        for (const goal of goals) {
          const statusBadge = goal.status === 'Open' ? 'info' : goal.status === 'Met' ? 'success' : 'warning';
          
          // Simple sparkline (placeholder - would need progress data)
          const sparklineHtml = '<div class="sparkline">' + 
            Array(8).fill(0).map((_, i) => {
              const height = Math.random() * 100; // Placeholder
              return `<div class="bar" style="height:${height}%"></div>`;
            }).join('') + '</div>';
          
          html += `
            <div class="goal-item">
              <div style="font-size:24px">🎯</div>
              <div style="flex:1">
                <div style="font-weight:800; margin-bottom:4px">${goal.desc || goal.code}</div>
                <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px">
                  <span class="badge ${statusBadge}">${goal.status || 'Open'}</span>
                  <span class="subtle">Code: ${goal.code}</span>
                  ${goal.target ? `<span class="subtle">Target: ${goal.target}%</span>` : ''}
                </div>
                ${sparklineHtml}
              </div>
            </div>
          `;
        }
        
        qs('#goalsContent').innerHTML = html;
        
      } catch (err) {
        console.error('Failed to load goals:', err);
        qs('#goalsContent').innerHTML = '<div class="error-msg">Failed to load goals</div>';
      }
    }
    
    // Check for existing session
    (async function init() {
      const savedCode = sessionStorage.getItem('rc_student_code');
      if (savedCode) {
        try {
          const students = await db.listStudents();
          const student = students.find(s => s.code === savedCode);
          if (student) {
            currentStudent = student;
            showDashboard();
            return;
          }
        } catch (err) {
          console.error('Session restore failed:', err);
        }
      }
      showLogin();
    })();
  </script>
</body>
</html>
