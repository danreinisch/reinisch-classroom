<!doctype html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reinisch Classroom — Empowering Every Learner Through Accessible Education" />
    <title>Reinisch Classroom – Home</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/rc-theme.css" />
    <link rel="stylesheet" href="/web/teacher-shell.css" />
    <script src="/web/public-nav.js"></script>
    <script src="/web/sidebar-init.js"></script>
    <style>
      /* Hero */
      .home-hero {
        padding-top: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .home-hero-title {
        font-size: 2.5rem;
        font-weight: 850;
        letter-spacing: -0.02em;
        color: var(--rc-ink);
        margin: 0 0 0.5rem 0;
      }

      .home-hero-tagline {
        font-size: 1.15rem;
        color: var(--rc-ink-dim);
        margin: 0;
        max-width: 52ch;
      }

      .home-accent-line {
        width: 80px;
        height: 3px;
        background: var(--rc-brand);
        border: none;
        margin-top: 1.25rem;
        border-radius: 2px;
      }

      /* Quick Access Pills */
      .home-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 1.5rem;
      }

      .home-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--rc-glass);
        border: 1px solid var(--rc-glass-border);
        color: var(--rc-ink);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .home-pill:hover {
        background: var(--rc-glass-hover);
        transform: translateY(-1px);
      }

      /* Section heading */
      .home-section-heading {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 2.5rem 0 1rem;
        color: var(--rc-ink);
      }

      /* What's New pulse animation */
      .whats-new-pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rc-brand);
        animation: pulse 2s ease-in-out infinite;
        margin-left: 8px;
        vertical-align: middle;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      /* What's New items */
      #whats-new-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .whats-new-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 16px;
        border-radius: var(--rc-radius);
        text-decoration: none;
        transition: background 0.2s;
      }

      .whats-new-item:hover {
        background: var(--rc-glass-hover);
      }

      .whats-new-category {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--rc-brand);
        font-weight: 600;
      }

      .whats-new-title {
        font-size: 0.95rem;
        color: var(--rc-ink);
        font-weight: 500;
      }

      /* Daily Inspiration */
      .home-quote {
        margin-top: 2.5rem;
        padding: 24px;
        border-radius: var(--rc-radius-lg);
        background: var(--rc-glass);
        border: 1px solid var(--rc-glass-border);
        border-left: 3px solid var(--rc-brand);
      }

      .home-quote-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--rc-brand);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .home-quote-text {
        font-size: 1.1rem;
        font-style: italic;
        color: var(--rc-ink);
        line-height: 1.6;
        margin: 0 0 8px;
      }

      .home-quote-author {
        font-size: 0.85rem;
        color: var(--rc-muted);
        font-weight: 500;
        margin: 0;
      }

      @media (max-width: 768px) {
        .home-hero-title {
          font-size: 1.9rem;
        }

        .home-pills {
          gap: 8px;
        }
      }
    </style>
  </head>

          <section class="home-hero">
            <h1 class="home-hero-title">Welcome to Reinisch Classroom</h1>

          <!-- Quick Access Pills -->
          <nav class="home-pills" aria-label="Quick access">
            <a class="home-pill" href="/language-arts/">📖 Language Arts</a>
            <a class="home-pill" href="/life-skills/">💡 Life Skills</a>

          <section class="home-whats-new">
