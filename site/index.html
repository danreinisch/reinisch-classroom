<html lang="en" data-theme="emerald">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reinisch Classroom — Empowering Every Learner Through Accessible Education" />
    <title>Reinisch Classroom – Home</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/web/teacher-shell.css" />
    <script src="/web/public-nav.js"></script>
    <script>try{if(localStorage.getItem('rc_public_sidebar')!=='expanded')document.documentElement.classList.add('tc-collapsed');}catch(_){document.documentElement.classList.add('tc-collapsed');}</script>
    <style>
      .home-header {
        margin-bottom: 2rem;
      }

      .home-title {
        font-size: 38px;
        font-weight: 850;
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
        color: var(--rc-ink);
      }

      .home-subtitle {
        font-size: 1.15rem;
        color: var(--rc-ink-dim);
        margin: 0;
        max-width: 72ch;
      }

      /* Quick Access Pills */
      .home-quick-access {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 1.5rem;
      }

      .home-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        backdrop-filter: blur(10px) saturate(130%);
        -webkit-backdrop-filter: blur(10px) saturate(130%);
        border: 1px solid rgba(34, 197, 94, 0.25);
        border-radius: 999px;
        text-decoration: none;
        color: var(--rc-ink);
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .home-pill:hover {
        border-color: rgba(34, 197, 94, 0.55);
        background: linear-gradient(135deg, rgba(34,197,94,0.10), rgba(34,197,94,0.04));
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .home-pill svg {
        color: rgba(34, 197, 94, 0.8);
        flex-shrink: 0;
      }

      /* What's New Ticker */
      .home-ticker-section {
        margin-top: 2.5rem;
      }

      .home-ticker-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(34, 197, 94, 0.7);
        margin: 0 0 8px 4px;
      }

      .home-ticker-wrap {
        position: relative;
        height: 44px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
      }

      .home-ticker-track {
        display: flex;
        align-items: center;
        height: 100%;
        white-space: nowrap;
        animation: ticker-scroll 40s linear infinite;
      }

      .home-ticker-wrap:hover .home-ticker-track {
        animation-play-state: paused;
      }

      @keyframes ticker-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }

      .home-ticker-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 20px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
      }

      .home-ticker-item:hover {
        color: rgba(34, 197, 94, 0.9);
      }

      .home-ticker-sep {
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.9rem;
        padding: 0 4px;
      }

      @media (max-width: 768px) {
        .home-quick-access {
          gap: 8px;
        }
        .home-pill {
          font-size: 0.85rem;
          padding: 8px 14px;
        }
      }
    </style>
  </head>
