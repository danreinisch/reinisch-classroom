<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Toolkits – Reinisch Classroom</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="description" content="Explore Language Arts and Math toolkits"/>

  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css"/>
  <link rel="stylesheet" href="/web/teacher-shell.css"/>
  <link rel="stylesheet" href="/assets/css/class-clock.css"/>
  <link rel="stylesheet" href="/assets/css/class-mode.css"/>
  <script src="/web/public-nav.js"></script>
  <script src="/web/sidebar-init.js"></script>
  <script defer src="/assets/js/class-clock.js" type="module"></script>
  <script defer src="/web/class-mode.js"></script>

  <style>
    .toolkits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .toolkit-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 1.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .toolkit-card:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
    .toolkit-card-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      transition: box-shadow 0.25s ease, background 0.25s ease;
    }
    .toolkit-card-icon svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.25s ease;
    }
    .toolkit-card-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .toolkit-card-desc {
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: center;
    }
    /* --- Hover glow on icon --- */
    .toolkit-card:nth-child(1):hover .toolkit-card-icon {
      box-shadow: 0 0 12px 4px rgba(99, 102, 241, 0.25);
      background: rgba(99, 102, 241, 0.12);
    }
    .toolkit-card:nth-child(1):hover .toolkit-card-icon svg {
      stroke: #a5b4fc;
    }
    .toolkit-card:nth-child(2):hover .toolkit-card-icon {
      box-shadow: 0 0 12px 4px rgba(52, 211, 153, 0.25);
      background: rgba(52, 211, 153, 0.12);
    }
    .toolkit-card:nth-child(2):hover .toolkit-card-icon svg {
      stroke: #6ee7b7;
    }

    /* --- Click glow burst on icon --- */
    @keyframes icon-glow {
      0%   { box-shadow: 0 0 8px 4px var(--icon-glow, rgba(99,102,241,0.6)), 0 0 24px 12px var(--icon-glow, rgba(99,102,241,0.3)); transform: scale(1.1); }
      50%  { box-shadow: 0 0 16px 8px var(--icon-glow, rgba(99,102,241,0.4)), 0 0 32px 16px var(--icon-glow, rgba(99,102,241,0.15)); transform: scale(1.15); }
      100% { box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; transform: scale(1); }
    }

    .toolkit-card.clicked .toolkit-card-icon {
      animation: icon-glow 0.45s ease-out forwards;
    }

    .toolkit-card:nth-child(1).clicked .toolkit-card-icon {
      --icon-glow: rgba(99, 102, 241, 0.6);
    }
    .toolkit-card:nth-child(1).clicked .toolkit-card-icon svg {
      stroke: #818cf8;
    }

    .toolkit-card:nth-child(2).clicked .toolkit-card-icon {
      --icon-glow: rgba(52, 211, 153, 0.6);
    }
    .toolkit-card:nth-child(2).clicked .toolkit-card-icon svg {
      stroke: #34d399;
    }
  </style>

<body>
  <div class="tc-app" data-page-title="Toolkits">

    <div class="tc-shell">

      <main class="tc-main">
        <div class="wrap" style="max-width:900px;margin:0 auto;padding:1rem 1.2rem;">
          <header>
            <h1>Toolkits</h1>
            <p style="opacity:0.7;margin-top:0.25rem;">Quick-access presentations and interactive tools</p>
          </header>

          <div class="toolkits-grid">
            <a href="/language-arts/toolkit/" class="toolkit-card" data-glow-color="rgba(99, 102, 241, 0.5)">
              <div class="toolkit-card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              </div>
              <div class="toolkit-card-title">Language Arts Toolkit</div>
              <div class="toolkit-card-desc">Vocabulary, grammar, writing tools, and more</div>
            </a>

            <a href="/math-toolkit/" class="toolkit-card" data-glow-color="rgba(52, 211, 153, 0.5)">
              <div class="toolkit-card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line><line x1="8" y1="18" x2="12" y2="18"></line></svg>
              </div>
              <div class="toolkit-card-title">Math Toolkit</div>
              <div class="toolkit-card-desc">Algebra, geometry, number sense, and more</div>
            </a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script defer src="/web/public-shell.js"></script>
  <script>
    document.querySelectorAll('.toolkit-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        card.classList.add('clicked');
        var href = card.getAttribute('href');
        setTimeout(function() {
          card.classList.remove('clicked');
          if (href) window.location.href = href;
        }, 450);
      });
    });
  </script>
</body>
</html>
