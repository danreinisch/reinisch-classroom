<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Toolkits – Reinisch Classroom</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="description" content="Explore Language Arts and Math toolkits"/> 

  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css"/>
  <link rel="stylesheet" href="/web/teacher-shell.css"/>
  <link rel="stylesheet" href="/assets/css/class-clock.css"/>
  <link rel="stylesheet" href="/assets/css/class-mode.css"/>
  <script src="/web/public-nav.js"></script>
  <script src="/web/sidebar-init.js"></script>
  <script defer src="/assets/js/class-clock.js" type="module"></script>
  <script defer src="/web/class-mode.js"></script>

  <style>
    .toolkits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .toolkit-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 1.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .toolkit-card:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
    .toolkit-card-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      transition: color 0.15s, filter 0.15s, background 0.15s;
    }
    .toolkit-card-icon svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Language Arts card — warm amber/gold glow on click */
    .toolkit-card--la:active .toolkit-card-icon {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.5));
    }

    /* Math card — cool blue glow on click */
    .toolkit-card--math:active .toolkit-card-icon {
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.15);
      filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.5));
    }

    .toolkit-card-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .toolkit-card-desc {
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: center;
    }
  </style>

<body>
  <div class="tc-app" data-page-title="Toolkits">

    <div class="tc-shell">

      <main class="tc-main">
        <div class="wrap" style="max-width:900px;margin:0 auto;padding:1rem 1.2rem;">
          <header>
            <h1>Toolkits</h1>
            <p style="opacity:0.7;margin-top:0.25rem;">Quick-access presentations and interactive tools</p>
          </header>

          <div class="toolkits-grid">
            <a href="/language-arts/toolkit/" class="toolkit-card toolkit-card--la">
              <div class="toolkit-card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              </div>
              <div class="toolkit-card-title">Language Arts Toolkit</div>
              <div class="toolkit-card-desc">Vocabulary, grammar, writing tools, and more</div>
            </a>

            <a href="/math-toolkit/" class="toolkit-card toolkit-card--math">
              <div class="toolkit-card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line><line x1="8" y1="18" x2="12" y2="18"></line></svg>
              </div>
              <div class="toolkit-card-title">Math Toolkit</div>
              <div class="toolkit-card-desc">Algebra, geometry, number sense, and more</div>
            </a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script defer src="/web/public-shell.js"></script>
</body>
</html>
