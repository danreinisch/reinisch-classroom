<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Substitute – Reinisch Classroom</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <script src="/web/public-nav.js"></script>
  <script src="/web/sidebar-init.js"></script>
  <style>
    /* Prevent tc-main from overflowing its flex bounds (ticker nowrap fix) */
    .tc-main { min-width: 0; }

    .hidden { display: none !important; }

    /* ── Login ─────────────────────────────────────────────────────────────── */
    .sp-login-wrap {
      max-width: 420px;
      margin: 40px auto;
    }

    .sp-login-card {
      padding: 32px;
      border-radius: var(--rc-radius-lg);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .sp-login-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--rc-muted);
    }

    .sp-login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .sp-login-subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--rc-muted);
      margin: 0 0 28px;
    }

    .sp-form-group {
      margin-bottom: 20px;
    }

    .sp-form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sp-form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.18);
      color: inherit;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .sp-form-group input:focus {
      border-color: rgba(34, 197, 94, 0.5);
    }

    .sp-btn-primary {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.18);
      color: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .sp-btn-primary:hover {
      background: rgba(34, 197, 94, 0.28);
    }

    .sp-btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sp-message {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .sp-message.error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* ── Dashboard ─────────────────────────────────────────────────────────── */
    .sp-dashboard {
      max-width: 900px;
    }

    .sp-header-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .sp-header-info {
      flex: 1;
      min-width: 0;
    }

    .sp-header-info h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
    }

    .sp-date {
      font-size: 15px;
      color: var(--rc-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sp-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
    }

    .sp-badge.published {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .sp-badge.draft {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fcd34d;
    }

    .sp-badge.none {
      background: rgba(148, 163, 184, 0.08);
      border-color: rgba(148, 163, 184, 0.2);
      color: var(--rc-muted);
    }

    .sp-logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .sp-logout-btn:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* ── Plan cards ────────────────────────────────────────────────────────── */
    .sp-card {
      padding: 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 16px;
      transition: background 0.2s ease;
    }

    .sp-card:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .sp-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .sp-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--rc-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .sp-value {
      color: var(--rc-ink);
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .sp-value:last-child { margin-bottom: 0; }

    .sp-pres-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
    }

    .sp-pres-list:last-child { margin-bottom: 0; }

    .sp-pres-list li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sp-pres-list li:last-child { margin-bottom: 0; }

    .sp-pres-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: var(--rc-ink-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
      max-width: 100%;
    }

    .sp-pres-link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(3px);
    }

    .sp-pres-link-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sp-pres-mode-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--rc-warning);
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
      text-decoration: none;
    }

    .sp-pres-mode-dot:hover {
      background: #fbbf24;
      transform: scale(1.15);
    }

    .sp-notes-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 14px;
      color: var(--rc-ink-dim);
    }

    /* ── Empty state ───────────────────────────────────────────────────────── */
    .sp-empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--rc-muted);
    }

    .sp-empty-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .sp-empty-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--rc-ink);
    }

    .sp-empty p {
      margin: 0 auto;
      font-size: 14px;
      max-width: 40ch;
    }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    /* Mobile (<768px) */
    @media (max-width: 767px) {
      .sp-login-wrap { margin: 20px auto; }
      .sp-header-row { flex-direction: column; gap: 12px; }
      .sp-header-info h1 { font-size: 22px; }
      .sp-card { padding: 18px; }
      .sp-card-title { font-size: 16px; }
    }

    /* Tablet (768px–1023px) */
    @media (min-width: 768px) and (max-width: 1023px) {
      .sp-dashboard { max-width: 100%; }
    }

    /* Large classroom displays (1920px+) */
    @media (min-width: 1920px) {
      html { font-size: 20px; }
      .sp-dashboard { max-width: 1100px; }
      .sp-header-info h1 { font-size: 2rem; }
      .sp-card { padding: 32px; }
      .sp-card-title { font-size: 1.3rem; }
      .sp-value { font-size: 1rem; }
    }

    /* 4K / Ultra-wide classroom displays (3000px+) */
    @media (min-width: 3000px) {
      html { font-size: 28px; }
      .sp-dashboard { max-width: 1400px; }
      .sp-card { padding: 40px; }
    }
  </style>
</head>
<body>
  <div class="tc-app" data-page-title="Substitute Plans">
    <div class="tc-shell">
      <main class="tc-main">

        <!-- Login View (shown when not authenticated) -->
        <div id="loginView">
          <div class="sp-login-wrap">
            <div class="sp-login-card">
              <div class="sp-login-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <h1 class="sp-login-title">Sign In Required</h1>
              <p class="sp-login-subtitle">Enter your PIN and password to access substitute plans.</p>

              <div id="loginError" class="sp-message error hidden"></div>

              <form id="loginForm">
                <div class="sp-form-group">
                  <label for="subPin">PIN</label>
                  <input type="text" id="subPin" name="pin" autocomplete="off" required />
                </div>
                <div class="sp-form-group">
                  <label for="subPassword">Password</label>
                  <input type="password" id="subPassword" name="password" autocomplete="current-password" required />
                </div>
                <button type="submit" id="loginBtn" class="sp-btn-primary">Sign In</button>
              </form>

              <div style="text-align:center;margin-top:20px;">
                <a href="/" style="font-size:13px;color:var(--rc-muted);text-decoration:none;">← Back to Home</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Dashboard View (shown when authenticated) -->
        <div id="dashboardView" class="hidden">
          <div class="sp-dashboard">
            <div class="sp-header-row">
              <div class="sp-header-info">
                <h1>Substitute Plans</h1>
                <div class="sp-date">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  <span id="dateText">Loading…</span>
                </div>
              </div>
              <div class="sp-header-actions">
                <span id="statusBadge" class="sp-badge none">No plan</span>
                <button id="logoutBtn" class="sp-logout-btn">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Sign Out
                </button>
              </div>
            </div>

            <div id="planContent">
              <!-- Plan cards loaded dynamically -->
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { getTodaysSubPlan } from '../web/sub-plans.js';

    // ── Helpers ──────────────────────────────────────────────────────────────

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function formatDateLong(date) {
      return date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      });
    }

    function formatDateYMD(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // ── Auth ─────────────────────────────────────────────────────────────────

    async function checkSession() {
      try {
        const res = await fetch('/.netlify/functions/substitute-session', {
          method: 'GET',
          credentials: 'include',
        });
        if (res.ok) {
          const data = await res.json();
          return data.ok && data.role === 'substitute';
        }
        return false;
      } catch (err) {
        console.error('[substitute] Session check failed:', err);
        return false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('subPin').value.trim();
      const password = document.getElementById('subPassword').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/.netlify/functions/substitute-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ pin, password }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.reload();
        } else {
          errorDiv.textContent = data.error || 'Invalid PIN or password.';
          errorDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        console.error('[substitute] Login failed:', err);
        errorDiv.textContent = 'Login failed. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleLogout() {
      try {
        await fetch('/.netlify/functions/substitute-logout', {
          method: 'POST',
          credentials: 'include',
        });
      } catch (err) {
        console.error('[substitute] Logout failed:', err);
      }
      window.location.reload();
    }

    // ── Plan rendering ───────────────────────────────────────────────────────

    function renderPresentationLinks(urls) {
      if (!urls || !urls.length) return '';
      const items = urls.map(url => {
        let label = url;
        try { label = new URL(url).pathname.split('/').filter(Boolean).pop() || url; } catch (_) {
          label = url.includes('/') ? url.split('/').pop() : url;
        }
        const returnPath = encodeURIComponent('/substitute/');
        const viewerHref = `/viewer/?src=${encodeURIComponent(url)}&return=${returnPath}`;
        const presHref = `/viewer/?src=${encodeURIComponent(url)}&return=${returnPath}&mode=presentation`;
        return `<li><a class="sp-pres-link" href="${escapeHtml(viewerHref)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span class="sp-pres-link-text">${escapeHtml(label)}</span>
        </a><a class="sp-pres-mode-dot" href="${escapeHtml(presHref)}" title="Presentation Mode" aria-label="Open in Presentation Mode"></a></li>`;
      }).join('');
      return `<ul class="sp-pres-list">${items}</ul>`;
    }

    function renderEmptyState() {
      return `<div class="sp-empty">
        <div class="sp-empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <div class="sp-empty-title">No plan for today</div>
        <p>No substitute plan has been published for today. Please check with the teacher or office.</p>
      </div>`;
    }

    function renderPlan(plan) {
      if (!plan) return renderEmptyState();

      // Language Arts
      const laContent = [];
      if (plan.la_lesson) {
        laContent.push(`<div class="sp-label">Lesson</div><div class="sp-value">${escapeHtml(plan.la_lesson)}</div>`);
      }
      if (plan.la_book) {
        laContent.push(`<div class="sp-label">Book</div><div class="sp-value">${escapeHtml(plan.la_book)}</div>`);
      }
      if (!plan.la_lesson && !plan.la_book) {
        laContent.push(`<div class="sp-value" style="color:var(--rc-muted)">No lesson details provided.</div>`);
      }
      if (plan.la_presentations && plan.la_presentations.length) {
        laContent.push(`<div class="sp-label">Presentations</div>${renderPresentationLinks(plan.la_presentations)}`);
      }

      // Life Skills
      const lsContent = [];
      if (plan.life_skills_topic) {
        lsContent.push(`<div class="sp-label">Topic</div><div class="sp-value">${escapeHtml(plan.life_skills_topic)}</div>`);
      } else {
        lsContent.push(`<div class="sp-value" style="color:var(--rc-muted)">No topic provided.</div>`);
      }
      if (plan.life_skills_presentations && plan.life_skills_presentations.length) {
        lsContent.push(`<div class="sp-label">Presentations</div>${renderPresentationLinks(plan.life_skills_presentations)}`);
      }

      // Notes card (only if notes exist)
      const notesCard = plan.notes ? `
        <div class="sp-card">
          <h2 class="sp-card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            Notes
          </h2>
          <div class="sp-notes-box">${escapeHtml(plan.notes)}</div>
        </div>` : '';

      return `
        <div class="sp-card">
          <h2 class="sp-card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            Language Arts
          </h2>
          ${laContent.join('')}
        </div>
        <div class="sp-card">
          <h2 class="sp-card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
            </svg>
            Life Skills
          </h2>
          ${lsContent.join('')}
        </div>
        ${notesCard}`;
    }

    // ── Dashboard loading ────────────────────────────────────────────────────

    async function loadDashboard() {
      const today = new Date();
      document.getElementById('dateText').textContent = formatDateLong(today);

      try {
        const plan = await getTodaysSubPlan(formatDateYMD(today));

        const badge = document.getElementById('statusBadge');
        if (!plan) {
          badge.className = 'sp-badge none';
          badge.textContent = 'No plan';
        } else if (plan.published) {
          badge.className = 'sp-badge published';
          badge.textContent = 'Published';
        } else {
          badge.className = 'sp-badge draft';
          badge.textContent = 'Draft';
        }

        document.getElementById('planContent').innerHTML = renderPlan(plan);
      } catch (err) {
        console.error('[substitute] Failed to load plan:', err);
        document.getElementById('planContent').innerHTML = `
          <div class="sp-empty">
            <div class="sp-empty-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
            </div>
            <div class="sp-empty-title">Unable to load plan</div>
            <p>${escapeHtml(err.message || 'Check your connection and try refreshing.')}</p>
          </div>`;
      }

      // Reload every 5 minutes to catch updates — setInterval started in init()
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    async function init() {
      const authenticated = await checkSession();
      if (authenticated) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        loadDashboard();
        setInterval(loadDashboard, 5 * 60 * 1000);
      } else {
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
      }
    }

    init();
  </script>

  <script defer src="/web/public-shell.js"></script>
</body>
</html>
