<template id="teacher-promise"><h4 data-title="">What you can expect from me</h4><div data-body=""><ul><li>Clear directions and a reason for what we are doing.</li><li>Help when you are stuck without embarrassing you for being stuck.</li><li>Respect for your privacy, your supports, and your dignity.</li><li>Honest feedback and a chance to improve when another attempt makes sense.</li><li>Direct correction when something needs to change — privately when possible.</li><li>If I make a mistake, I will own it and fix it.</li></ul><div class="best"><strong>Bottom line:</strong> I take the work seriously. I do not need to turn every mistake into a federal case.</div></div></template>
<template id="respect"><h4 data-title="">Respect</h4><div data-body=""><p>Respect is not forced friendship, fake politeness, or everybody agreeing all the time.</p><div class="best"><strong>It means:</strong> you do not interfere with somebody else's ability to learn, work, or keep their dignity.</div><p>Let people finish. Do not mock mistakes. Leave belongings alone. Keep private information private.</p></div></template>
<template id="ready"><h4 data-title="">Be ready</h4><div data-body=""><p>Ready does not mean perfect. It means prepared enough to begin and willing to solve small problems quickly.</p><div class="best"><strong>Looks like:</strong> materials out, charged Chromebook ready when needed, and your attention on the first direction.</div></div></template>
<template id="participate"><h4 data-title="">Participate</h4><div data-body=""><p>You do not have to perform enthusiasm. You do have to do something real with the task.</p><div class="best"><strong>Participation can be:</strong> speaking, writing, reading along, choosing an answer, practicing a step, using guided notes, or asking a useful question.</div><div class="watch"><strong>Not participation:</strong> being physically present while mentally living three browser tabs away.</div></div></template>
<template id="time"><h4 data-title="">Use time well</h4><div data-body=""><p>Independent work time, catch-up time, and support time are still class time.</p><div class="best"><strong>Best move:</strong> start with the most important unfinished task, ask what should come first if you are unsure, and use the time so Future You has less cleanup.</div></div></template>
<template id="help"><h4 data-title="">Ask for help</h4><div data-body=""><p>Needing help is normal. Hiding the problem until the last five minutes makes it harder for both of us.</p><div class="best"><strong>Useful:</strong> “I understand the first part, but I don't know what to do after this step.”</div></div></template>
<template id="respect-mistake"><h4 data-title="">Someone gives a wrong answer</h4><div data-body=""><p>A classmate answers and misses it. That is going to happen. It is called learning, not a public event.</p><div class="best"><strong>Best move:</strong> let the correction happen and move on. Everyone in this room will be wrong sometimes — including me.</div><div class="watch"><strong>Not okay:</strong> laughing, repeating the mistake for entertainment, or saving it for later embarrassment.</div></div></template>
<template id="respect-support"><h4 data-title="">Someone gets a different support</h4><div data-body=""><p>You notice another student has a word bank, extra time, a different response format, or another support.</p><div class="best"><strong>Best move:</strong> stay focused on your own work. Supports are based on what helps that person access the task.</div><p>You do not need somebody else's private information for the classroom to be fair.</p></div></template>
<template id="respect-space"><h4 data-title="">Someone wants some space</h4><div data-body=""><div class="best"><strong>Best move:</strong> give it to them. Do not grab their binder, lean over their screen, move their stuff, or keep poking at them because you think it is funny.</div><p>Personal space and classroom property are part of respect, not optional upgrades.</p></div></template>
<template id="respect-frustrated"><h4 data-title="">Someone is having a rough moment</h4><div data-body=""><p>Maybe they are upset, confused, frustrated, or just need a minute.</p><div class="best"><strong>Best move:</strong> give them room and let me handle what needs handling.</div><div class="watch"><strong>Do not:</strong> stare, narrate, record, tease, or make their moment bigger.</div></div></template>
<template id="fair-example"><h4 data-title="">“Why does that student get that?”</h4><div data-body=""><p>The short answer: because that support is appropriate for that student.</p><div class="best"><strong>Think of it this way:</strong> eyeglasses are not unfair to people who do not need glasses. The goal is access, not identical equipment.</div><p>The better question is: <strong>“What support would help me do this successfully?”</strong></p></div></template>
<template id="forgot-binder"><h4 data-title="">Forgot your binder</h4><div data-body=""><div class="best"><strong>Best move:</strong> tell me quickly, get the temporary material or solution we use, and join the lesson.</div><div class="watch"><strong>Remember:</strong> “I forgot it” is a problem to solve, not a 50-minute exemption.</div></div></template>
<template id="dead-chromebook"><h4 data-title="">Your Chromebook is dead</h4><div data-body=""><p>WHS expects your assigned Chromebook to be charged at home and brought to every class. Batteries still occasionally choose violence.</p><div class="best"><strong>Best move:</strong> tell me immediately so we can use the appropriate workaround and keep learning.</div><p>Then fix the routine for next time. We solve the access problem; we do not hold a lengthy memorial service for the battery.</p></div></template>
<template id="late-start"><h4 data-title="">You arrive late</h4><div data-body=""><div class="best"><strong>Best move:</strong> enter quietly, get your materials, look at the screen or ReinischClassroom, figure out the current step, then ask a short question if you still need one.</div><p>You do not need the entire room to restart the day with you.</p></div></template>
<template id="participate-speak"><h4 data-title="">Participation: speak</h4><div data-body=""><p>Answer a question, explain your thinking, ask for clarification, or contribute to a discussion.</p><div class="best"><strong>You do not have to be certain.</strong> “I think it might be ___ because ___” is a useful start.</div></div></template>
<template id="participate-write"><h4 data-title="">Participation: write</h4><div data-body=""><p>Some days your strongest participation is on paper or on screen: notes, a short response, matching, sorting, a sentence frame, or a written example.</p><p>Quiet does not automatically mean disengaged. The work should show that your brain is still in the room.</p></div></template>
<template id="participate-follow"><h4 data-title="">Participation: follow the model</h4><div data-body=""><p>Tracking the text, filling guided notes, and following the steps of an example are active participation when you are actually engaged with them.</p></div></template>
<template id="participate-practice"><h4 data-title="">Participation: practice</h4><div data-body=""><div class="best"><strong>Best move:</strong> attempt the step even if you are not sure you can finish it. Practice gives us something real to work with.</div><div class="watch"><strong>“I might be wrong”</strong> is not a reason to leave the page blank.</div></div></template>
