<template id="participate-ask"><h4 data-title="">Participation: ask</h4><div data-body=""><p>A useful question shows where the learning process broke.</p><div class="best"><strong>Example:</strong> “I know I need evidence, but I don't know which sentence from the text actually proves my answer.”</div></div></template>
<template id="participate-rejoin"><h4 data-title="">Participation: rejoin</h4><div data-body=""><p>Sometimes you need a short reset. That is fine.</p><div class="best"><strong>The important part:</strong> come back to the next manageable step instead of deciding the entire period is over.</div></div></template>
<template id="missed-direction"><h4 data-title="">“I missed part of that.”</h4><div data-body=""><div class="best"><strong>Try:</strong> “I heard that we are opening the assignment. What did you say to do after question 1?”</div><p>That lets me answer the missing piece instead of replaying three minutes of directions.</p></div></template>
<template id="dont-know-start"><h4 data-title="">“I don't know where to start.”</h4><div data-body=""><div class="best"><strong>Try:</strong> “Can you show me the first step?” or “Which part should I do first?”</div><p>You do not need the entire assignment solved. You need enough traction to start moving.</p></div></template>
<template id="help-shutdown"><h4 data-title="">Frustration is turning into shutdown</h4><div data-body=""><p>You can ask for a reset without escaping the task entirely.</p><div class="best"><strong>Try:</strong> “I’m getting frustrated. Can I take a minute and then have you help me start the next part?”</div><p>That tells me both the problem <em>and</em> your plan to come back.</p></div></template>
<template id="loop-lesson"><h4 data-title="">Mini lesson</h4><div data-body=""><p>This is where I introduce the skill, explain why it matters, and model what it looks like.</p><div class="best"><strong>Your job:</strong> attention first. You do not need to know it yet — that is the point of the lesson.</div></div></template>
<template id="loop-notes"><h4 data-title="">Guided notes</h4><div data-body=""><p>The notes capture the important pieces so you can focus on thinking instead of copying every word at full panic speed.</p></div></template>
<template id="loop-practice"><h4 data-title="">Guided practice</h4><div data-body=""><p>We work examples while help is close. This is the ideal time to make a mistake, figure out why, and try the step again.</p></div></template>
<template id="loop-rc"><h4 data-title="">ReinischClassroom</h4><div data-body=""><p>This is where directions, assignments, practice, and evidence of your learning live.</p><div class="best"><strong>Check here first</strong> when you are absent, unsure what is due, or need to find the task again.</div></div></template>
<template id="loop-feedback"><h4 data-title="">Feedback &amp; revision</h4><div data-body=""><p>Some work is finished when you submit it. Some work gets feedback and another attempt because the skill matters more than protecting the first score.</p></div></template>
<template id="notes-fill"><h4 data-title="">Fill the important gaps</h4><div data-body=""><p>Guided notes give you most of the structure. Your job is to add the key word, example, step, or idea we are focusing on.</p></div></template>
<template id="notes-add"><h4 data-title="">Add what helps you</h4><div data-body=""><p>If an example, arrow, sketch, reminder, or simpler wording helps you remember the idea, add it. The notes are a tool, not a museum exhibit.</p></div></template>
<template id="notes-organize"><h4 data-title="">Keep the notes findable</h4><div data-body=""><p>Put the notes back in the correct binder or section. We will reuse skills. “I know I have it somewhere” is not a search strategy.</p></div></template>
<template id="notes-absent"><h4 data-title="">Absent and missing notes</h4><div data-body=""><div class="best"><strong>Best move:</strong> check ReinischClassroom for the lesson and support, then get the missing notes or ask which parts matter most.</div></div></template>
<template id="tech-video"><h4 data-title="">Bring the Chromebook charged</h4><div data-body=""><p>WHS assigns each student an individual laptop and expects it to be charged at home and brought to every class.</p><div class="best"><strong>Best move:</strong> make charging it part of the night-before routine. If something goes wrong anyway, tell me right away so we can keep the lesson moving.</div></div></template>
<template id="tech-game"><h4 data-title="">Keep the Chromebook on task</h4><div data-body=""><p>The school-issued laptop is here for educational use: instruction, assignments, projects, research, assessments, and the tools we are actually using.</p><div class="best"><strong>Best move:</strong> keep ReinischClassroom and the current task in front of you. Close the game, unrelated video, or wandering tab.</div><p>“But I was almost done with the level” remains a compelling tragedy and still not the assignment.</p></div></template>
<template id="tech-music"><h4 data-title="">Headphones have rules</h4><div data-body=""><p>Wireless earbuds — AirPods and similar devices — are not allowed during the school day.</p><div class="best"><strong>What is allowed:</strong> wired headphones may be used with the Chromebook when I approve them for that activity.</div><div class="watch"><strong>Translation:</strong> “Can I listen to music?” is not a workaround for the wireless-earbud rule.</div></div></template>
<template id="tech-help"><h4 data-title="">Recording needs permission</h4><div data-body=""><p>School rules protect everybody's privacy. Do not photograph, record, or make video/audio of students or staff without the required prior approval.</p><div class="best"><strong>Best move:</strong> if an assignment actually involves recording, wait for the directions and use the approved process.</div><p>Your camera roll does not need unsolicited classroom DLC.</p></div></template>
