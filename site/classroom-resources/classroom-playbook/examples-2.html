<template id="participate-ask"><h4 data-title="">Participation: ask</h4><div data-body=""><p>A useful question tells me where things stopped making sense.</p><div class="best"><strong>Example:</strong> “I know I need evidence, but I don't know which sentence from the text actually proves my answer.”</div></div></template>
<template id="participate-rejoin"><h4 data-title="">Participation: rejoin</h4><div data-body=""><p>Sometimes you need a short reset. That is fine.</p><div class="best"><strong>The important part:</strong> come back to the next manageable step instead of deciding the entire period is over.</div></div></template>
<template id="missed-direction"><h4 data-title="">“I missed part of that.”</h4><div data-body=""><div class="best"><strong>Try:</strong> “I heard that we are opening the assignment. What did you say to do after question 1?”</div><p>Now I can answer the part you missed instead of replaying three minutes of directions.</p></div></template>
<template id="dont-know-start"><h4 data-title="">“I don't know where to start.”</h4><div data-body=""><div class="best"><strong>Try:</strong> “Can you show me the first step?” or “Which part should I do first?”</div><p>You do not need the entire assignment solved for you. You need enough help to get started.</p></div></template>
<template id="help-shutdown"><h4 data-title="">Frustration is turning into shutdown</h4><div data-body=""><p>You can ask for a reset without escaping the task entirely.</p><div class="best"><strong>Try:</strong> “I’m getting frustrated. Can I take a minute and then have you help me start the next part?”</div><p>That tells me what is wrong and lets me know you plan to come back.</p></div></template>
<template id="loop-lesson"><h4 data-title="">Mini lesson</h4><div data-body=""><p>This is where I teach the skill, explain why it matters, and show you what it looks like.</p><div class="best"><strong>Your job:</strong> give me your attention first. You are not supposed to already know it — that is why I am teaching it.</div></div></template>
<template id="loop-notes"><h4 data-title="">Guided notes</h4><div data-body=""><p>The notes capture the important pieces so you can think about the lesson instead of copying every word at full panic speed.</p></div></template>
<template id="loop-practice"><h4 data-title="">Guided practice</h4><div data-body=""><p>We try examples while help is close. This is a good time to make a mistake, figure out what happened, and try again.</p></div></template>
<template id="loop-rc"><h4 data-title="">ReinischClassroom</h4><div data-body=""><p>This is where your directions, assignments, lessons, and class materials live.</p><div class="best"><strong>Check here first</strong> when you are absent, unsure what is due, or need to find the work again.</div></div></template>
<template id="loop-feedback"><h4 data-title="">Feedback &amp; revision</h4><div data-body=""><p>Some work is finished when you submit it. Some work gets feedback and another try because learning the skill matters more than protecting the first answer.</p></div></template>
<template id="notes-fill"><h4 data-title="">Fill the important gaps</h4><div data-body=""><p>Guided notes give you most of the structure. Your job is to add the key word, example, step, or idea we are focusing on.</p></div></template>
<template id="notes-add"><h4 data-title="">Add what helps you</h4><div data-body=""><p>If an example, arrow, sketch, reminder, or simpler wording helps you remember the idea, add it. The notes are a tool, not a museum exhibit.</p></div></template>
<template id="notes-organize"><h4 data-title="">Keep the notes findable</h4><div data-body=""><p>Put the notes back in the correct binder or section. We will reuse skills. “I know I have it somewhere” is not a search strategy.</p></div></template>
<template id="notes-absent"><h4 data-title="">Absent and missing notes</h4><div data-body=""><div class="best"><strong>Best move:</strong> check ReinischClassroom for what you missed, get the missing notes, and ask me which parts matter most if you are not sure.</div></div></template>
<template id="tech-video"><h4 data-title="">Bring the Chromebook charged</h4><div data-body=""><p>Your Chromebook is part of your regular class supplies. Bring it charged and ready to use.</p><div class="best"><strong>If something goes wrong anyway:</strong> tell me right away. We will solve the problem and keep moving.</div><p>A dead battery is a problem to fix — not a free pass for the day.</p></div></template>
<template id="tech-game"><h4 data-title="">Stay on the class task</h4><div data-body=""><p>If we are using ReinischClassroom, a document, a reading, or another class tool, stay there.</p><div class="best"><strong>Best move:</strong> close the game, unrelated video, random tab, or anything else that has nothing to do with what we are doing.</div><p>“But I was almost done with the level” remains a compelling tragedy and still not the assignment.</p></div></template>
<template id="tech-music"><h4 data-title="">Headphones</h4><div data-body=""><p>Wireless earbuds — AirPods and similar devices — are not allowed during the school day.</p><div class="best"><strong>Wired headphones:</strong> you may use them with the Chromebook only when I approve them for that activity.</div><div class="watch"><strong>So yes:</strong> you still need to ask before putting on headphones. And no, asking does not turn AirPods into wired headphones.</div></div></template>
<template id="tech-help"><h4 data-title="">Photos &amp; recording</h4><div data-body=""><p>Do not take pictures, record audio, or make videos of people at school unless the people involved and the supervising teacher or administrator have approved it.</p><div class="best"><strong>If an assignment actually involves recording:</strong> I will tell you what we are doing and what permission is needed before anybody starts recording.</div><p>Your camera roll does not need unsolicited classroom DLC.</p></div></template>
