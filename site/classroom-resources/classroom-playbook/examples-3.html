<template id="tech-phone"><h4 data-title="">Personal devices stay away</h4><div data-body=""><p>The current WHS handbook restricts personal electronic devices during the school day. In this room, phones, smartwatches, and other personal electronics are not classroom tools.</p><div class="best"><strong>Best move:</strong> keep them put away and stay with the school-issued Chromebook and the task in front of you.</div><div class="watch"><strong>If the school has specifically authorized an exception:</strong> follow that approved plan. We do not invent our own exceptions in the middle of class.</div></div></template>
<template id="tech-done"><h4 data-title="">AI is teacher-directed</h4><div data-body=""><p>WHS treats AI as a tool that may be used at the individual teacher's discretion.</p><div class="best"><strong>Best move:</strong> use AI only when I specifically ask or authorize you to use it for that assignment — and follow the directions I give you.</div><div class="watch"><strong>Important:</strong> using AI on your own when it was not requested can be treated as academic dishonesty under the WHS handbook.</div></div></template>
<template id="absent-one"><h4 data-title="">Missed one day</h4><div data-body=""><p>The handbook makes students responsible for getting and completing make-up work. I am not going to make that a scavenger hunt.</p><ol><li>Open ReinischClassroom.</li><li>Find the lesson or assignment you missed.</li><li>Check the directions and support.</li><li>Ask what matters most if there is more than one thing.</li></ol><div class="best"><strong>Goal:</strong> take responsibility for the gap while using the help and supports available to you.</div></div></template>
<template id="absent-several"><h4 data-title="">Missed several days</h4><div data-body=""><p>You are responsible for making up missed work, but that does not mean you should try to swallow the whole backlog at once.</p><div class="best"><strong>Best move:</strong> ask me to help prioritize: “What are the two things I need to do first?”</div><p>We build a recovery plan instead of a panic pile.</p></div></template>
<template id="unfinished"><h4 data-title="">Work is unfinished</h4><div data-body=""><p>Unfinished work is a solvable problem. Hidden unfinished work has a habit of getting bigger.</p><div class="best"><strong>Best move:</strong> say where you are, what is left, and what help you need. Then use the available completion/support time.</div></div></template>
<template id="feedback-wrong"><h4 data-title="">Your answer needs correction</h4><div data-body=""><div class="best"><strong>Productive response:</strong> “Okay — what part should I look at again?”</div><p>You can disagree or ask why. The goal is to use the feedback, not defend the first draft like it is a family heirloom.</p></div></template>
<template id="feedback-redo"><h4 data-title="">Try this part again</h4><div data-body=""><p>Redo can simply mean the skill matters enough to practice until it is stronger.</p><div class="best"><strong>Best move:</strong> use the feedback to change something specific. Do not resubmit the same answer with additional confidence.</div></div></template>
<template id="reset-correction"><h4 data-title="">You get redirected</h4><div data-body=""><div class="best"><strong>Fastest route back:</strong> stop, acknowledge it, fix the behavior, and rejoin the task.</div><p>A ten-second correction does not need to become a ten-minute argument.</p></div></template>
<template id="reset-pattern"><h4 data-title="">The same issue keeps happening</h4><div data-body=""><p>A reminder should solve most small problems. If the same problem keeps repeating, we need a different plan.</p><div class="best"><strong>That may mean:</strong> a private conversation, changing the setup, a clearer support, a different seat, or another appropriate school response depending on the issue.</div><p>The goal is to solve the pattern — not conduct a public trial.</p></div></template>
<template id="scenario-absent"><h4 data-title="">Scenario A — You missed yesterday</h4><div data-body=""><p>You walk in and everybody else already seems to know what is happening.</p><div class="best"><strong>Best move:</strong> open ReinischClassroom, check the posted lesson or assignment, then ask: “What do I need to do first?”</div><p><strong>Why:</strong> you gather the easy information yourself and use teacher help for the part only the teacher can answer.</p></div></template>
<template id="scenario-confused"><h4 data-title="">Scenario B — One step makes no sense</h4><div data-body=""><div class="best"><strong>Best move:</strong> point to the exact step and ask a specific question.</div><p>“I know how to find the quote. I don't know how to explain what it proves.”</p><p><strong>Why:</strong> now we can solve the real problem instead of restarting the entire assignment.</p></div></template>
<template id="scenario-corrected"><h4 data-title="">Scenario C — Your answer gets corrected</h4><div data-body=""><div class="best"><strong>Best move:</strong> ask what evidence or step shows the difference, then revise.</div><p><strong>Why:</strong> being corrected is part of learning. Your job is not to protect every first answer from harm.</p></div></template>
<template id="scenario-frustrated"><h4 data-title="">Scenario D — You are about to shut down</h4><div data-body=""><div class="best"><strong>Best move:</strong> communicate before you disappear: “I need a minute. Can you help me start the next step when I come back?”</div><p><strong>Why:</strong> it protects the reset <em>and</em> the expectation that you rejoin.</p></div></template>
<template id="scenario-peer"><h4 data-title="">Scenario E — A classmate gets different support</h4><div data-body=""><div class="best"><strong>Best move:</strong> keep working. If you need something, ask about your own support.</div><p><strong>Why:</strong> fairness is about access to learning, and other students' needs are private.</p></div></template>
<template id="scenario-distracted"><h4 data-title="">Scenario F — Your Chromebook wins the distraction battle</h4><div data-body=""><div class="best"><strong>Best move:</strong> close the distraction and reopen the actual task. If you cannot keep it there, ask for a workaround before the problem gets bigger.</div><p><strong>Why:</strong> the school-issued Chromebook is there for educational use. Technology is useful only when it is serving the task.</p></div></template>
<template id="course-ela"><h4 data-title="">Language Arts</h4><div data-body=""><p>The books give us a shared context, but the real target is the transferable Language Arts skill.</p><ul><li>Read and understand increasingly complex text.</li><li>Use evidence instead of guessing.</li><li>Build vocabulary and language skills.</li><li>Write responses, revise, and explain your thinking.</li><li>Use guided notes and supported practice before more independent work.</li></ul><div class="best"><strong>Translation:</strong> yes, we will read actual books. No, “remember the plot” is not the entire course.</div></div></template>
<template id="course-ts"><h4 data-title="">Transitional Skills</h4><div data-body=""><p>This class is built around practical adult-life skills, with employment readiness as the main strand.</p><ul><li>Job fit, job postings, applications, interviews, and workplace behavior.</li><li>Schedules, time, communication, and problem-solving.</li><li>Money skills connected to real decisions and employment.</li><li>Guided practice, role-play, printable tasks, and real-world products.</li></ul><div class="best"><strong>Translation:</strong> we practice the stuff adults actually have to do — with support before independence.</div></div></template>
