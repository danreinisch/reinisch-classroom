<template id="tech-phone"><h4 data-title="">Personal electronics</h4><div data-body=""><p>This is not a Reinisch preference. WHS says personal electronic devices are not for use during the school day.</p><div class="best"><strong>In this room:</strong> personal devices are not out and they are not in use. If you have a school-approved exception, we follow that plan.</div><div class="watch"><strong>Simple version:</strong> do not make me referee a device rule that is already written down for the whole school.</div></div></template>
<template id="tech-done"><h4 data-title="">AI</h4><div data-body=""><p>AI can be useful, and there may be times when I want you to use it.</p><div class="best"><strong>The rule is simple:</strong> use AI for an assignment only when I tell you it is part of the assignment, and use it the way I tell you to use it.</div><div class="watch"><strong>If I did not authorize it:</strong> do not use it for the work. The WHS handbook treats unauthorized AI use as academic dishonesty.</div></div></template>
<template id="absent-one"><h4 data-title="">Missed one day</h4><div data-body=""><p>If you miss class, catching up is your responsibility. I am not going to make that a scavenger hunt.</p><ol><li>Open ReinischClassroom.</li><li>Find the lesson or assignment you missed.</li><li>Read the directions and look at the notes, examples, or materials that are there.</li><li>Ask me what still is not clear or what you should do first.</li></ol><div class="best"><strong>Bottom line:</strong> take the first step yourself, then use the help that is here for you.</div></div></template>
<template id="absent-several"><h4 data-title="">Missed several days</h4><div data-body=""><p>You still need to make up the work, but I do not expect you to stare at a pile of assignments and magically know what matters most.</p><div class="best"><strong>Best move:</strong> ask me to help prioritize: “What are the two things I need to do first?”</div><p>We make a plan instead of building a panic pile.</p></div></template>
<template id="unfinished"><h4 data-title="">Work is unfinished</h4><div data-body=""><p>Unfinished work is a solvable problem. Hidden unfinished work has a habit of getting bigger.</p><div class="best"><strong>Best move:</strong> tell me where you are, what is left, and what help you need. Then use the class time we have for finishing, correcting, or catching up.</div></div></template>
<template id="feedback-wrong"><h4 data-title="">Your answer needs correction</h4><div data-body=""><div class="best"><strong>Productive response:</strong> “Okay — what part should I look at again?”</div><p>You can disagree or ask why. The goal is to use the feedback, not defend the first draft like it is a family heirloom.</p></div></template>
<template id="feedback-redo"><h4 data-title="">Try this part again</h4><div data-body=""><p>Redo can simply mean the skill matters enough to practice until it is stronger.</p><div class="best"><strong>Best move:</strong> use the feedback to change something specific. Do not resubmit the same answer with additional confidence.</div></div></template>
<template id="reset-correction"><h4 data-title="">You get redirected</h4><div data-body=""><div class="best"><strong>Fastest route back:</strong> stop, acknowledge it, fix the behavior, and rejoin the task.</div><p>A ten-second correction does not need to become a ten-minute argument.</p></div></template>
<template id="reset-pattern"><h4 data-title="">The same issue keeps happening</h4><div data-body=""><p>A reminder should solve most small problems. If the same problem keeps coming back, a reminder clearly is not enough.</p><div class="best"><strong>Then we change something:</strong> a private conversation, a different seat or setup, clearer support, parent contact, or a consequence if that is where the problem has gone.</div><p>The goal is to stop repeating the same problem — not conduct a public trial.</p></div></template>
<template id="scenario-absent"><h4 data-title="">Scenario A — You missed yesterday</h4><div data-body=""><p>You walk in and everybody else already seems to know what is happening.</p><div class="best"><strong>Best move:</strong> open ReinischClassroom, check the posted lesson or assignment, then ask: “What do I need to do first?”</div><p><strong>Why:</strong> start with the information that is already there, then use me for what you still need.</p></div></template>
<template id="scenario-confused"><h4 data-title="">Scenario B — One step makes no sense</h4><div data-body=""><div class="best"><strong>Best move:</strong> point to the exact step and ask a specific question.</div><p>“I know how to find the quote. I don't know how to explain what it proves.”</p><p><strong>Why:</strong> now we can fix the actual problem instead of restarting the entire assignment.</p></div></template>
<template id="scenario-corrected"><h4 data-title="">Scenario C — Your answer gets corrected</h4><div data-body=""><div class="best"><strong>Best move:</strong> ask what evidence or step shows the difference, then revise.</div><p><strong>Why:</strong> being corrected is part of learning. Your job is not to protect every first answer from harm.</p></div></template>
<template id="scenario-frustrated"><h4 data-title="">Scenario D — You are about to shut down</h4><div data-body=""><div class="best"><strong>Best move:</strong> communicate before you disappear: “I need a minute. Can you help me start the next step when I come back?”</div><p><strong>Why:</strong> you get the reset, and you are also making it clear that you plan to come back to the work.</p></div></template>
<template id="scenario-peer"><h4 data-title="">Scenario E — A classmate gets different support</h4><div data-body=""><div class="best"><strong>Best move:</strong> keep working. If you need something, ask about your own support.</div><p><strong>Why:</strong> fairness means people get the help they need, and somebody else's needs are private.</p></div></template>
<template id="scenario-distracted"><h4 data-title="">Scenario F — Your Chromebook wins the distraction battle</h4><div data-body=""><div class="best"><strong>Best move:</strong> close the distraction and get back to the actual task. If you keep getting pulled away, tell me before it becomes a bigger problem.</div><p><strong>Why:</strong> the Chromebook is here to help you do the work. If it is pulling you away from the work, something needs to change.</p></div></template>
<template id="course-ela"><h4 data-title="">Language Arts</h4><div data-body=""><p>The books matter, but the bigger goal is what you can do with reading and writing.</p><ul><li>Understand what you read.</li><li>Use evidence instead of guessing.</li><li>Build vocabulary and language skills.</li><li>Write responses, revise, and explain your thinking.</li><li>Use guided notes and supported practice before doing more on your own.</li></ul><div class="best"><strong>Translation:</strong> yes, we will read actual books. No, “remember the plot” is not the entire course.</div></div></template>
<template id="course-ts"><h4 data-title="">Transitional Skills</h4><div data-body=""><p>This class is mainly about getting ready for work and adult life.</p><ul><li>Job fit, job postings, applications, interviews, and workplace behavior.</li><li>Schedules, time, communication, and problem-solving.</li><li>Money skills connected to real decisions and employment.</li><li>Guided practice, role-play, printable tasks, and real-world products.</li></ul><div class="best"><strong>Translation:</strong> we practice the stuff adults actually have to do — with support before independence.</div></div></template>
