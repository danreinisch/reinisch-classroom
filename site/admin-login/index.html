<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login — Reinisch Classroom</title>
  <link rel="stylesheet" href="/assets/css/theme.css"/>
  <script src="/assets/js/section-nav.js" defer></script>
  <style>
    .wrap{max-width:520px;margin:80px auto;padding:24px;background:var(--panel);border:1px solid var(--panel-brd);border-radius:14px}
    h1{margin:0 0 12px 0}
    label{display:block;margin:10px 0 6px 0;font-weight:600;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
    .actions{margin-top:16px;display:flex;gap:.6rem;align-items:center}
    .muted{font-size:12px;color:var(--muted)}
    .error{padding:12px;margin:12px 0;background:rgba(255,100,100,.15);border:1px solid rgba(255,100,100,.3);border-radius:8px;color:#ffaaaa;font-size:14px;display:none}
    .error.show{display:block}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Admin Login</h1>
    <div id="error" class="error"></div>
    <form method="post" action="/.netlify/functions/admin-session">
      <label>Username</label>
      <input name="username" autocomplete="username" required/>
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required/>
      <div class="actions">
        <button class="btn" type="submit" style="border:1px solid #5aa9ff;background:linear-gradient(180deg,#90c4ff,#5aa9ff)">Sign in</button>
        <a class="btn" href="/">Home</a>
      </div>
    </form>
    <p class="muted" style="margin-top:8px">Use your admin credentials to access the uploader.</p>
  </main>
  <script>
    // Display error messages based on URL query parameter
    (function() {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('e');
      const errorEl = document.getElementById('error');
      
      if (error && errorEl) {
        let message = '';
        switch (error) {
          case 'config':
            message = 'Server configuration error. Please contact the administrator to configure ADMIN_SESSION_SECRET, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY environment variables.';
            break;
          case 'invalid':
            message = 'Invalid username or password. Please try again.';
            break;
          case 'unauthorized':
            message = 'Your account does not have permission to access the admin panel. Only teacher and admin accounts are allowed.';
            break;
          case 'server':
            message = 'Server error occurred. Please try again later or contact the administrator if the problem persists.';
            break;
          case 'throttled':
            message = 'Too many login attempts. Please wait a moment before trying again.';
            break;
          case '1':
          default:
            message = 'Login failed. Please check your credentials and try again.';
            break;
        }
        
        errorEl.textContent = message;
        errorEl.classList.add('show');
        
        // Clear error from URL after displaying (for better UX)
        if (window.history.replaceState) {
          const cleanUrl = window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      }
    })();
  </script>
</body>
</html>
