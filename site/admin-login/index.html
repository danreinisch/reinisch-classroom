<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login — Reinisch Classroom</title>
  
  <!-- Emerald Dashboard Theme -->
  <link rel="stylesheet" href="/assets/css/rc-emerald-dashboard-theme.css"/>
  <link rel="stylesheet" href="/assets/css/app-shell.css"/>
  <link rel="stylesheet" href="/assets/css/app-shell-layout.css"/>
  
  <script src="/assets/js/admin-guard.js"></script>
  <script src="/assets/js/section-nav.js" defer></script>
  <script src="/web/admin-login.js" defer></script>
  <style>
    .wrap{
      max-width:520px;margin:80px auto;padding:24px;
      background:var(--surface0, #0f1512);border:1px solid var(--border, rgba(255, 255, 255, 0.08));border-radius:14px;
      box-shadow: var(--shadow-0, 0 12px 30px rgba(0, 0, 0, 0.45));
    }
    h1{margin:0 0 12px 0;color:var(--text0, #e8f1ec)}
    label{display:block;margin:10px 0 6px 0;font-weight:700;color:var(--text1, #a9bbb1)}
    input{
      width:100%;padding:12px;border-radius:var(--r-md, 14px);border:1px solid var(--border, rgba(255,255,255,0.08));
      background:rgba(10, 14, 12, 0.55);color:var(--text0, #e8f1ec)
    }
    input:focus{
      outline: none;
      border-color: color-mix(in oklab, var(--accent, #35e08a) 55%, transparent);
      box-shadow:
        0 0 0 4px color-mix(in oklab, var(--accent, #35e08a) 18%, transparent),
        var(--shadow-1, 0 18px 50px rgba(0, 0, 0, 0.6));
    }
    .actions{margin-top:16px;display:flex;gap:.6rem;align-items:center}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;
      padding:0.5rem 0.85rem;border-radius:var(--r-md, 14px);
      background:var(--glass, rgba(17, 26, 21, 0.58));border:1px solid var(--border, rgba(255, 255, 255, 0.08));
      color:var(--text0, #e8f1ec);text-decoration:none;font-weight:700;cursor:pointer;
      transition: all 0.12s ease;
    }
    .btn:hover{
      border-color:var(--border-strong, rgba(255, 255, 255, 0.14));
      transform:translateY(-1px);
    }
    button.btn{
      background:linear-gradient(180deg, color-mix(in oklab, var(--accent, #35e08a) 80%, transparent), color-mix(in oklab, var(--accent2, #14b86a) 80%, transparent));
      border:0;color:#032313;font-weight:800;
      box-shadow: 0 4px 16px var(--glow, rgba(53, 224, 138, 0.2));
    }
    button.btn:hover{
      box-shadow: 0 6px 22px var(--glow, rgba(53, 224, 138, 0.3));
    }
    .muted{font-size:12px;color:var(--text1, #a9bbb1)}
    .error-message{
      margin:12px 0;
      padding:12px;
      background:rgba(255,100,100,0.15);
      border:1px solid rgba(255,100,100,0.3);
      border-radius:var(--r-md, 14px);
      color:#ffaaaa;
      font-size:14px;
    }
    .error-message.error-config{
      background:rgba(255,193,7,0.15);
      border-color:rgba(255,193,7,0.4);
      color:#ffc107;
    }
    .error-message .support-text{
      margin-top:6px;
      font-size:12px;
      color:var(--text1, #a9bbb1);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Admin Login</h1>
    <!-- Error message container (populated by JavaScript if error code present) -->
    <div id="errorContainer"></div>
    <form method="post" action="/.netlify/functions/admin-session">
      <label>Username</label>
      <input name="username" autocomplete="username" required/>
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required/>
      <div class="actions">
        <button class="btn" type="submit" style="border:1px solid #5aa9ff;background:linear-gradient(180deg,#90c4ff,#5aa9ff)">Sign in</button>
        <a class="btn" href="/">Home</a>
      </div>
    </form>
    <p class="muted" style="margin-top:8px">Use your admin credentials to access the uploader.</p>
  </main>
</body>
</html>
