<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volume | Math Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d1117;--surface:#161d2e;--surface2:#1e2840;--surface3:#243050;
      --border:#2a3a58;--border2:#34466e;--accent:#14b8a6;--accent-dim:#0d9488;
      --accent2:#38bdf8;--accent3:#fb923c;--text:#e2e8f0;--text-muted:#8a9bbf;
      --text-dim:#5a6a8a;--success:#22c55e;--error:#f87171;--formula-bg:#0a1628;
      --mono:'JetBrains Mono', monospace;
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 56px; }
    .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; } .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--text-dim); } .breadcrumb .current { color: var(--text); font-weight: 500; }
    .page-body { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .module-title { font-size: 1.65rem; font-weight: 700; margin-bottom: 0.25rem; } .module-title span { color: var(--accent); }
    .module-subtitle { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 2rem; }
    .section-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }
    .shape-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
    .shape-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 0.75rem; cursor: pointer; transition: all 0.18s ease; text-align: center; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .shape-btn:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); transform: translateY(-1px); }
    .shape-btn.active { border-color: var(--accent); background: rgba(20,184,166,0.08); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .shape-btn .shape-icon { font-size: 1.7rem; line-height: 1; } .shape-btn .shape-name { font-size: 0.82rem; font-weight: 500; line-height: 1.2; }
    .shape-btn .shape-formula { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); line-height: 1.2; margin-top: 0.1rem; }
    .shape-btn.active .shape-formula { color: var(--accent-dim); }
    .sub-row { display: none; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; } .sub-row.visible { display: flex; }
    .sub-btn { flex: 1; min-width: 140px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1rem; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 0.83rem; color: var(--text-muted); transition: all 0.15s; text-align: center; }
    .sub-btn:hover { border-color: var(--accent); color: var(--text); }
    .sub-btn.active { border-color: var(--accent); background: rgba(20,184,166,0.1); color: var(--accent); }
    .mode-toggle { display: none; gap: 0.5rem; margin-bottom: 1.5rem; } .mode-toggle.visible { display: flex; flex-wrap: wrap; }
    .mode-btn { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 1rem; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--text-muted); transition: all 0.15s; text-align: center; }
    .mode-btn:hover { border-color: var(--accent); color: var(--text); }
    .mode-btn.active { border-color: var(--accent); background: rgba(20,184,166,0.1); color: var(--accent); }
    #workspace { display: none; } #workspace.visible { display: block; }
    .concept-panel { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent3); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; animation: slideDown 0.3s ease; display: flex; align-items: flex-start; gap: 1rem; }
    .concept-icon { font-size: 1.5rem; flex-shrink: 0; } .concept-text { font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; } .concept-text strong { color: var(--accent3); }
    .formula-card { background: var(--formula-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 1.5rem; animation: slideDown 0.3s ease; }
    .formula-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.25rem; }
    .formula-text { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; color: var(--text); letter-spacing: 0.04em; line-height: 1.6; } .formula-text .var { color: var(--accent2); }
    .formula-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.35rem; line-height: 1.5; }
    .formula-key { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); line-height: 1.9; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; } .formula-key .kv { color: var(--accent2); }
    .realworld-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.25); border-radius: 20px; padding: 0.3rem 0.85rem; font-size: 0.75rem; color: #fdba74; margin-top: 0.5rem; }
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; animation: slideDown 0.25s ease; transition: border-color 0.2s; }
    .step-card.locked { opacity: 0.4; pointer-events: none; } .step-card.complete { border-color: var(--success); } .step-card.error { border-color: var(--error); }
    .step-header { padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .step-badge { width: 26px; height: 26px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
    .step-card.complete .step-badge { background: var(--success); border-color: var(--success); color: #fff; }
    .step-title { font-weight: 600; font-size: 0.9rem; } .step-instruction { font-size: 0.82rem; color: var(--text-muted); margin-left: auto; text-align: right; max-width: 280px; }
    .step-body { padding: 1.25rem; }
    .known-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.85rem; margin-bottom: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .field-label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); } .field-label .var-name { font-family: var(--mono); color: var(--accent2); font-size: 0.82rem; }
    .field-hint { font-size: 0.71rem; color: var(--text-dim); }
    .known-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 0.55rem 0.85rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 100%; transition: border-color 0.15s; outline: none; }
    .known-input:focus { border-color: var(--accent); } .known-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .unit-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; padding: 0.65rem 0.85rem; background: var(--formula-bg); border: 1px solid var(--border); border-radius: 7px; }
    .unit-label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
    .unit-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; font-family: 'Outfit', sans-serif; font-size: 0.88rem; color: var(--text); outline: none; cursor: pointer; min-width: 80px; }
    .unit-select:focus { border-color: var(--accent); } .unit-select option { background: var(--surface); color: var(--text); }
    .unit-hint { font-size: 0.72rem; color: var(--text-dim); font-style: italic; }
    .begin-btn { background: var(--accent); color: #0a1628; border: none; border-radius: 7px; padding: 0.6rem 1.5rem; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 0.5rem; }
    .begin-btn:hover { background: #0d9488; transform: translateY(-1px); } .begin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .expr-display { font-family: var(--mono); font-size: 1rem; color: var(--text); background: var(--formula-bg); border: 1px solid var(--border); border-radius: 7px; padding: 0.75rem 1rem; letter-spacing: 0.03em; line-height: 1.7; } .expr-display .val { color: var(--accent2); }
    .compute-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; } .compute-row:last-child { margin-bottom: 0; }
    .compute-expr { font-family: var(--mono); font-size: 0.97rem; color: var(--text); flex: 1; min-width: 0; line-height: 1.5; } .compute-expr .val { color: var(--accent2); }
    .compute-label { font-size: 0.75rem; color: var(--text-dim); margin-right: 0.3rem; font-style: italic; }
    .answer-box { background: var(--surface2); border: 2px solid var(--border2); border-radius: 7px; padding: 0.45rem 0.75rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 120px; outline: none; transition: border-color 0.15s; text-align: center; }
    .answer-box:focus { border-color: var(--accent); } .answer-box.correct { border-color: var(--success); background: rgba(34,197,94,0.08); color: var(--success); }
    .answer-box.incorrect { border-color: var(--error); background: rgba(248,113,113,0.08); }
    .check-btn { background: var(--surface3); border: 1px solid var(--border2); border-radius: 6px; padding: 0.45rem 0.85rem; font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .check-btn:hover { border-color: var(--accent); color: var(--accent); } .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .feedback-box { border-radius: 7px; padding: 0.65rem 1rem; font-size: 0.83rem; line-height: 1.5; margin-top: 0.75rem; display: none; }
    .feedback-box.visible { display: block; }
    .feedback-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .feedback-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
    .feedback-box.hint { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: #fde68a; }
    .final-answer-card { background: linear-gradient(135deg, rgba(20,184,166,0.12), rgba(251,146,60,0.08)); border: 1px solid var(--accent); border-radius: 10px; padding: 1.5rem; text-align: center; display: none; animation: celebrate 0.4s ease; }
    .final-answer-card.visible { display: block; }
    .final-answer-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.5rem; }
    .final-answer-value { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: var(--text); }
    .final-answer-caption { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; }
    .final-actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
    .try-again-btn, .copy-btn { background: transparent; border: 1px solid var(--border2); border-radius: 7px; padding: 0.5rem 1.25rem; font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .try-again-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn { border-color: var(--accent-dim); color: var(--accent); } .copy-btn:hover { background: rgba(20,184,166,0.1); border-color: var(--accent); }
    .copy-btn.copied { background: rgba(34,197,94,0.12); border-color: var(--success); color: var(--success); pointer-events: none; }
    .divider { height: 1px; background: var(--border); margin: 1.75rem 0; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes celebrate { 0% { transform: scale(0.95); opacity: 0; } 60% { transform: scale(1.02); } 100% { transform: scale(1); opacity: 1; } }
    @media (max-width: 620px) { .formula-card { flex-direction: column; gap: 0.75rem; } .formula-key { margin-left: 0; } .shape-grid { grid-template-columns: repeat(2, 1fr); } .compute-row { flex-direction: column; align-items: flex-start; } .answer-box { width: 100%; } .step-instruction { display: none; } .mode-toggle, .sub-row { flex-direction: column; } }
  </style>
</head>
<body>
<header class="page-header"><nav class="breadcrumb"><a href="/">Home</a><span class="sep">›</span><a href="/math-toolkit">Math Toolkit</a><span class="sep">›</span><span class="current">Volume</span></nav></header>
<main class="page-body">
  <h1 class="module-title">Volume of <span>3D Shapes</span></h1>
  <p class="module-subtitle">Select a 3D shape, enter your known measurements, then work through each step to find the volume.</p>
  <div class="section-label">Choose a Shape</div>
  <div class="shape-grid" id="shapeGrid"></div>
  <div class="sub-row" id="pyramidSub">
    <button class="sub-btn active" data-pyr="square">Square Base Pyramid</button>
    <button class="sub-btn" data-pyr="rectangular">Rectangular Base Pyramid</button>
    <button class="sub-btn" data-pyr="triangular">Triangular Base Pyramid</button>
  </div>
  <div class="sub-row" id="prismSub">
    <button class="sub-btn active" data-prism="rectangular">Rectangular Prism</button>
    <button class="sub-btn" data-prism="triangular">Triangular Prism</button>
    <button class="sub-btn" data-prism="trapezoidal">Trapezoidal Prism</button>
  </div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" data-mode="forward" onclick="setMode('forward')">→ Find the Volume</button>
    <button class="mode-btn" data-mode="reverse" onclick="setMode('reverse')">← Find a Missing Dimension</button>
  </div>
  <div id="workspace">
    <div class="divider"></div>
    <div class="concept-panel" id="conceptPanel"><div class="concept-icon">📐</div><div class="concept-text" id="conceptText"></div></div>
    <div class="formula-card" id="formulaCard">
      <div style="flex:1"><div class="formula-label">Formula</div><div class="formula-text" id="formulaText"></div><div class="formula-desc" id="formulaDesc"></div><div class="realworld-chip" id="realworldChip"></div></div>
      <div class="formula-key" id="formulaKey"></div>
    </div>
    <div class="step-card" id="stepKnown">
      <div class="step-header"><div class="step-badge" id="badgeKnown">1</div><div class="step-title">Identify Your Known Values</div><div class="step-instruction">Enter the measurements from your problem.</div></div>
      <div class="step-body">
        <div class="unit-row"><span class="unit-label">Units:</span>
          <select class="unit-select" id="unitSelect"><option value="">no unit</option><option value="in">inches (in)</option><option value="ft">feet (ft)</option><option value="yd">yards (yd)</option><option value="cm" selected>centimeters (cm)</option><option value="mm">millimeters (mm)</option><option value="m">meters (m)</option><option value="km">kilometers (km)</option></select>
          <span class="unit-hint" id="unitHint">Volume will be in cm³</span>
        </div>
        <div class="known-grid" id="knownGrid"></div>
        <button class="begin-btn" id="beginBtn" onclick="beginSteps()" disabled>Begin Solving →</button>
      </div>
    </div>
    <div id="stepsContainer"></div>
    <div class="final-answer-card" id="finalCard">
      <div class="final-answer-label" id="finalLabel">✓ Volume</div>
      <div class="final-answer-value" id="finalValue"></div>
      <div class="final-answer-caption" id="finalCaption"></div>
      <div class="final-actions">
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">📋 Copy Problem to Clipboard</button>
        <button class="try-again-btn" onclick="resetWorkspace()">↺ Try Another Problem</button>
      </div>
    </div>
  </div>
</main>
<script>
function round2(n) { return Math.round(n * 100) / 100; }
function isClose(a, b) { return Math.abs(a - b) <= Math.max(0.06, Math.abs(b) * 0.015); }
function getUnit() { return document.getElementById('unitSelect').value; }
function getUnitLabel(cubic) { const u = getUnit(); if (!u) return ''; return cubic ? ` ${u}³` : ` ${u}`; }

/* ================================================================
   SHAPE DEFINITIONS — forward + optional reverse
================================================================ */
const SHAPES = {

  cube: { name: 'Cube', concept: 'Volume measures how much <strong>space</strong> is inside a 3D shape — in <strong>cubic units</strong> (units³). A cube has equal length, width, and height.', realworld: '🎲 Think: dice, ice cubes, sugar cubes',
    forward: { formulaText: 'V = <span class="var">s</span>³', formulaDesc: 'Cube the side length — multiply it by itself three times.', formulaKey: '<span class="kv">s</span> = side length',
      knownFields: [{ id: 's', label: 'Side length (s)', varName: 's', hint: 'All edges are equal.' }],
      steps: [
        { title: 'Substitute Your Value', type: 'expression', displayFn: (k) => `V = <span class="val">${k.s}</span>³` },
        { title: 'Multiply s × s (s²)', instruction: 'Square the side.', type: 'compute', rows: [{ exprFn: (k) => `<span class="val">${k.s}</span> × <span class="val">${k.s}</span> =`, answerId: 's2', answerFn: (k) => round2(k.s*k.s), hintFn: (k) => `Multiply ${k.s} × ${k.s}.` }]},
        { title: 'Multiply s² × s (s³)', instruction: 'Multiply by s one more time.', type: 'compute', isFinal: true, finalLabel: 'Volume', rows: [{ exprFn: (k, c) => `<span class="val">${c.s2}</span> × <span class="val">${k.s}</span> =`, answerId: 'V', answerFn: (k, c) => round2(c.s2*k.s), hintFn: (k, c) => `Multiply ${c.s2} × ${k.s}.` }]}
      ]
    },
    reverse: { formulaText: '<span class="var">s</span> = ∛V', formulaDesc: 'Take the cube root of the volume. Use a calculator.', formulaKey: '<span class="kv">V</span> = volume',
      knownFields: [{ id: 'V', label: 'Volume', varName: 'V', hint: 'Total volume of the cube.' }],
      steps: [
        { title: 'Substitute Your Value', type: 'expression', displayFn: (k) => `s = ∛<span class="val">${k.V}</span>` },
        { title: 'Find the Cube Root', instruction: 'What number × itself × itself = V? Use a calculator.', type: 'compute', isFinal: true, finalLabel: 'Side Length', rows: [{ exprFn: (k) => `∛<span class="val">${k.V}</span> =`, answerId: 's', answerFn: (k) => round2(Math.cbrt(k.V)), hintFn: (k) => `Find ∛${k.V}. What number cubed = ${k.V}?` }]}
      ]
    }
  },

  'prism-rectangular': { name: 'Rectangular Prism', concept: 'Volume of a prism = <strong>Base Area × Height</strong>. For a rectangular prism, the base is a rectangle (l × w), then multiplied by the height.', realworld: '📦 Think: cereal boxes, bricks, shoeboxes',
    forward: { formulaText: 'V = <span class="var">l</span> × <span class="var">w</span> × <span class="var">h</span>', formulaDesc: 'Multiply length × width × height.', formulaKey: '<span class="kv">l</span> = length<br><span class="kv">w</span> = width<br><span class="kv">h</span> = height',
      knownFields: [{ id: 'l', label: 'Length (l)', varName: 'l', hint: '' }, { id: 'w', label: 'Width (w)', varName: 'w', hint: '' }, { id: 'h', label: 'Height (h)', varName: 'h', hint: '' }],
      steps: [
        { title: 'Substitute Your Values', type: 'expression', displayFn: (k) => `V = <span class="val">${k.l}</span> × <span class="val">${k.w}</span> × <span class="val">${k.h}</span>` },
        { title: 'Find the Base Area (l × w)', instruction: 'Multiply length × width.', type: 'compute', rows: [{ exprFn: (k) => `<span class="val">${k.l}</span> × <span class="val">${k.w}</span> =`, answerId: 'lw', answerFn: (k) => round2(k.l*k.w), hintFn: (k) => `Multiply ${k.l} × ${k.w}.` }]},
        { title: 'Multiply Base Area × Height', instruction: 'Multiply by height.', type: 'compute', isFinal: true, finalLabel: 'Volume', rows: [{ exprFn: (k, c) => `<span class="val">${c.lw}</span> × <span class="val">${k.h}</span> =`, answerId: 'V', answerFn: (k, c) => round2(c.lw*k.h), hintFn: (k, c) => `Multiply ${c.lw} × ${k.h}.` }]}
      ]
    },
    reverse: { formulaText: 'missing = V ÷ (known₁ × known₂)', formulaDesc: 'Divide the volume by the two dimensions you know.', formulaKey: '<span class="kv">V</span> = volume<br><span class="kv">known₁, known₂</span> = two sides',
      knownFields: [{ id: 'V', label: 'Volume', varName: 'V', hint: 'Total volume.' }, { id: 'k1', label: 'Known side 1', varName: 'known₁', hint: 'First dimension you know.' }, { id: 'k2', label: 'Known side 2', varName: 'known₂', hint: 'Second dimension you know.' }],
      steps: [
        { title: 'Multiply the Two Known Sides', instruction: 'Multiply the two sides you know.', type: 'compute', rows: [{ exprFn: (k) => `<span class="val">${k.k1}</span> × <span class="val">${k.k2}</span> =`, answerId: 'prod', answerFn: (k) => round2(k.k1*k.k2), hintFn: (k) => `Multiply ${k.k1} × ${k.k2}.` }]},
        { title: 'Divide Volume by Product', instruction: 'Find the missing side.', type: 'compute', isFinal: true, finalLabel: 'Missing Dimension', rows: [{ exprFn: (k, c) => `<span class="val">${k.V}</span> ÷ <span class="val">${c.prod}</span> =`, answerId: 'missing', answerFn: (k, c) => round2(k.V/c.prod), hintFn: (k, c) => `Divide ${k.V} ÷ ${c.prod}.` }]}
      ]
    }

/* ================================================================

================================================================ */
let currentShapeId = null, pyrMode = 'square', prismMode = 'rectangular', problemMode = 'forward';
let knownValues = {}, computedValues = {}, stepAttempts = {};

function getShapeDef() {
  if (!currentShapeId) return null;
  if (currentShapeId === 'pyramid') return SHAPES[`pyramid-${pyrMode}`];
  if (currentShapeId === 'prism') return SHAPES[`prism-${prismMode}`];
  return SHAPES[currentShapeId];
}
function getShape() { const d = getShapeDef(); if (!d) return null; return (problemMode==='reverse' && d.reverse) ? d.reverse : d.forward; }
function hasReverse() { return !!getShapeDef()?.reverse; }

function buildShapeGrid() {
  const grid = document.getElementById('shapeGrid');
  shapeList.forEach(s => { const btn = document.createElement('button'); btn.className = 'shape-btn'; btn.dataset.shape = s.id;
    btn.innerHTML = `<span class="shape-icon">${s.icon}</span><span class="shape-name">${s.name}</span><span class="shape-formula">${s.formula}</span>`;
    btn.addEventListener('click', () => selectShape(s.id)); grid.appendChild(btn);
  });
}

function selectShape(id) {
  currentShapeId = id;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.shape-btn[data-shape="${id}"]`).classList.add('active');
  document.getElementById('pyramidSub').classList.toggle('visible', id === 'pyramid');
  document.getElementById('prismSub').classList.toggle('visible', id === 'prism');
  updateModeToggle(); resetWorkspace(); renderWorkspace();
}

function updateModeToggle() {
  const t = document.getElementById('modeToggle');
  if (hasReverse()) { t.classList.add('visible'); } else { t.classList.remove('visible'); problemMode = 'forward';
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.mode-btn[data-mode="forward"]').classList.add('active'); }
}

document.querySelectorAll('#pyramidSub .sub-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('#pyramidSub .sub-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); pyrMode = btn.dataset.pyr; updateModeToggle(); resetWorkspace(); renderWorkspace(); }); });
document.querySelectorAll('#prismSub .sub-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('#prismSub .sub-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); prismMode = btn.dataset.prism; updateModeToggle(); resetWorkspace(); renderWorkspace(); }); });

function setMode(mode) {
  problemMode = mode; document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active');
  const u = getUnit(), h = document.getElementById('unitHint');
  h.textContent = mode==='forward' ? (u?`Volume will be in ${u}³`:'Volume is in cubic units') : (u?`Dimensions in ${u}`:'Label your answer!');
  resetWorkspace(); renderWorkspace();
}

document.getElementById('unitSelect').addEventListener('change', () => {
  const u = getUnit(), h = document.getElementById('unitHint');
  h.textContent = problemMode==='forward' ? (u?`Volume will be in ${u}³`:'Volume is in cubic units') : (u?`Dimensions in ${u}`:'Label your answer!');
});

/* ================================================================
   RENDER WORKSPACE
================================================================ */
function renderWorkspace() {
  const def = getShapeDef(), shape = getShape(); if (!shape || !def) return;
  document.getElementById('workspace').classList.add('visible');
  document.getElementById('conceptText').innerHTML = def.concept;
  document.getElementById('conceptPanel').style.display = problemMode==='forward' ? '' : 'none';
  document.getElementById('formulaText').innerHTML = shape.formulaText;
  document.getElementById('formulaDesc').textContent = shape.formulaDesc;
  document.getElementById('formulaKey').innerHTML = shape.formulaKey;
  document.getElementById('realworldChip').textContent = def.realworld;
  document.getElementById('realworldChip').style.display = problemMode==='forward' ? '' : 'none';

  const grid = document.getElementById('knownGrid'); grid.innerHTML = '';
  shape.knownFields.forEach(f => { const div = document.createElement('div'); div.className = 'field-group';
    div.innerHTML = `<label class="field-label">${f.label} &nbsp;<span class="var-name">(${f.varName})</span></label>${f.hint?`<div class="field-hint">${f.hint}</div>`:''}<input class="known-input" id="known_${f.id}" type="number" step="any" min="0" placeholder="Enter value..." oninput="checkBeginReady()" />`;
    grid.appendChild(div);
  });
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('badgeKnown').textContent = '1';
  document.getElementById('stepKnown').classList.remove('complete');
  document.getElementById('beginBtn').disabled = true;
  document.getElementById('beginBtn').style.display = '';
}

function checkBeginReady() { const s = getShape(); if (!s) return; document.getElementById('beginBtn').disabled = !s.knownFields.every(f => { const v = document.getElementById(`known_${f.id}`)?.value.trim(); return v !== '' && !isNaN(parseFloat(v)); }); }

function beginSteps() {
  const shape = getShape(); knownValues = {}; computedValues = {}; stepAttempts = {};
  shape.knownFields.forEach(f => { knownValues[f.id] = parseFloat(document.getElementById(`known_${f.id}`).value); });
  document.getElementById('stepKnown').classList.add('complete'); document.getElementById('badgeKnown').textContent = '✓';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = true);
  document.getElementById('unitSelect').disabled = true;
  document.getElementById('beginBtn').style.display = 'none'; renderSteps(shape);
}

/* ================================================================
   RENDER / UNLOCK / CHECK — standard engine
================================================================ */
function renderSteps(shape) {
  const c = document.getElementById('stepsContainer'); c.innerHTML = '';
  shape.steps.forEach((step, idx) => {
    const sn = idx+2, card = document.createElement('div'); card.className = 'step-card'+(idx>0?' locked':''); card.id = `dynStep_${idx}`;
    let bHTML = '';
    if (step.type === 'expression') bHTML = `<div class="expr-display">${step.displayFn(knownValues)}</div>`;
    else if (step.type === 'compute') { bHTML = step.rows.map((row, rIdx) => { const rid = `row_${idx}_${rIdx}`;
      return `<div class="compute-row" id="${rid}_wrap"><div class="compute-expr">${row.exprFn(knownValues, computedValues)}</div><input class="answer-box" id="${rid}_input" type="number" step="any" placeholder="?" onkeydown="if(event.key==='Enter') checkRow('${rid}',${idx},${rIdx})" /><button class="check-btn" id="${rid}_btn" onclick="checkRow('${rid}',${idx},${rIdx})">Check</button></div>`;
    }).join(''); bHTML += `<div class="feedback-box" id="fb_${idx}"></div>`; }
    card.innerHTML = `<div class="step-header"><div class="step-badge" id="badge_${idx}">${sn}</div><div class="step-title">Step ${sn}: ${step.title}</div><div class="step-instruction">${step.instruction||''}</div></div><div class="step-body">${bHTML}</div>`;
    c.appendChild(card);
  });
  document.getElementById('dynStep_0').classList.remove('locked');
  if (shape.steps[0].type === 'expression') setTimeout(() => unlockStep(1), 350);
}

function unlockStep(idx) { const card = document.getElementById(`dynStep_${idx}`); if (!card) return; card.classList.remove('locked'); const s = getShape(); if (s?.steps[idx]?.type==='expression') { const el = card.querySelector('.expr-display'); if (el) el.innerHTML = s.steps[idx].displayFn(knownValues); setTimeout(() => unlockStep(idx+1), 400); } }

function checkRow(rowId, stepIdx, rowIdx) {
  const shape = getShape(), step = shape.steps[stepIdx], row = step.rows[rowIdx];
  const input = document.getElementById(`${rowId}_input`), btn = document.getElementById(`${rowId}_btn`);
  const fb = document.getElementById(`fb_${stepIdx}`), badge = document.getElementById(`badge_${stepIdx}`), card = document.getElementById(`dynStep_${stepIdx}`);
  if (!input || input.value.trim()==='') { showFeedback(fb,'hint','Please enter a number before checking.'); return; }
  const ua = parseFloat(input.value), correct = row.answerFn(knownValues, computedValues);
  stepAttempts[rowId] = (stepAttempts[rowId]||0)+1;
  if (isClose(ua, correct)) {
    input.classList.add('correct'); input.disabled = true; btn.disabled = true; computedValues[row.answerId] = round2(ua);
    const allDone = step.rows.every((r,ri) => { const inp = document.getElementById(`row_${stepIdx}_${ri}_input`); return inp && inp.disabled; });
    if (allDone) { card.classList.add('complete'); badge.textContent = '✓';
      if (step.isFinal) { showFeedback(fb,'success','✓ Correct! You found the answer!'); showFinalAnswer(step.finalLabel, computedValues[row.answerId]); }
      else { showFeedback(fb,'success','✓ Correct! Move on to the next step.'); const ni = stepIdx+1, ns = shape.steps[ni];
        if (ns?.type==='compute') ns.rows.forEach((nr,nri) => { const el = document.querySelector(`#row_${ni}_${nri}_wrap .compute-expr`); if (el) el.innerHTML = nr.exprFn(knownValues, computedValues); });
        setTimeout(() => unlockStep(ni), 400); }
    } else showFeedback(fb,'success','✓ Correct! Complete remaining calculations.');
  } else { input.classList.add('incorrect'); card.classList.add('error');
    setTimeout(() => { input.classList.remove('incorrect'); card.classList.remove('error'); }, 600);
    const att = stepAttempts[rowId]; let msg = '';
    if (att===1) msg = 'Not quite — double-check your math.';
    else if (att===2) msg = `Still not right. Hint: ${row.hintFn(knownValues, computedValues)}`;
    else msg = `The correct answer is <strong>${correct}</strong>. ${row.hintFn(knownValues, computedValues)}`;
    showFeedback(fb,'error',msg);
  }
}
function showFeedback(el,type,msg) { el.className = `feedback-box visible ${type}`; el.innerHTML = msg; }

function showFinalAnswer(label, value) {
  const card = document.getElementById('finalCard'), isVol = problemMode==='forward';
  document.getElementById('finalLabel').textContent = `✓ ${label}`;
  document.getElementById('finalValue').textContent = value + getUnitLabel(isVol);
  document.getElementById('finalCaption').textContent = 'You worked through every step of the formula — excellent problem solving!';
  card.classList.add('visible'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ================================================================
   COPY TO CLIPBOARD
================================================================ */
function buildProblemText() {
  const shape = getShape(), def = getShapeDef(); if (!shape) return '';
  const isVol = problemMode==='forward', ul = getUnitLabel(isVol), ulIn = getUnitLabel(false);
  const lines = [], d = '─'.repeat(40);
  lines.push('VOLUME'); lines.push(`Shape: ${def.name}`);
  lines.push(`Mode: ${problemMode==='forward'?'Find Volume':'Find Missing Dimension'}`);
  if (getUnit()) lines.push(`Units: ${getUnit()}`); lines.push(d);
  lines.push(`Formula: ${shape.formulaText.replace(/<[^>]+>/g, '')}`); lines.push('');
  lines.push('Step 1: Known Values');
  shape.knownFields.forEach(f => { const iu = (f.id==='V'&&problemMode==='reverse') ? getUnitLabel(true) : ulIn; lines.push(`  ${f.label} (${f.varName}) = ${knownValues[f.id]}${iu}`); });
  lines.push('');
  shape.steps.forEach((step, idx) => { lines.push(`Step ${idx+2}: ${step.title}`);
    if (step.type==='expression') lines.push(`  ${step.displayFn(knownValues).replace(/<[^>]+>/g,'')}`);
    else if (step.type==='compute') step.rows.forEach((row,rIdx) => {
      const expr = row.exprFn(knownValues, computedValues).replace(/<[^>]+>/g,''), ans = computedValues[row.answerId], att = stepAttempts[`row_${idx}_${rIdx}`]||1;
      lines.push(`  ${expr} ${ans}${att===1?' ✓ (1st try)':` (${att} attempts)`}`);
    }); lines.push('');
  });
  lines.push(d); const fs = shape.steps.find(s=>s.isFinal), fk = fs?.rows?.slice(-1)[0]?.answerId;
  lines.push(`${fs?.finalLabel||'Answer'} = ${computedValues[fk]}${ul}`); lines.push(d);
  return lines.join('\n');
}

function copyToClipboard() {
  const text = buildProblemText(), btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(text).then(() => { btn.textContent = '✓ Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋 Copy Problem to Clipboard'; btn.classList.remove('copied'); }, 2500);
  }).catch(() => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); btn.textContent = '✓ Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋 Copy Problem to Clipboard'; btn.classList.remove('copied'); }, 2500); });
}

function resetWorkspace() {
  knownValues = {}; computedValues = {}; stepAttempts = {};
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('workspace').classList.remove('visible');
  document.getElementById('unitSelect').disabled = false;
  const cb = document.getElementById('copyBtn'); cb.textContent = '📋 Copy Problem to Clipboard'; cb.classList.remove('copied');
}

buildShapeGrid();
</script>
