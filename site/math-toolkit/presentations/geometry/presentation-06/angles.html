<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angles | Math Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0d1117;
      --surface:    #161d2e;
      --surface2:   #1e2840;
      --surface3:   #243050;
      --border:     #2a3a58;
      --border2:    #34466e;
      --accent:     #14b8a6;
      --accent-dim: #0d9488;
      --accent2:    #38bdf8;
      --accent3:    #fb923c;
      --accent4:    #a78bfa;
      --text:       #e2e8f0;
      --text-muted: #8a9bbf;
      --text-dim:   #5a6a8a;
      --success:    #22c55e;
      --error:      #f87171;
      --formula-bg: #0a1628;
      --mono:       'JetBrains Mono', monospace;
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 56px; }
    .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--text-dim); }
    .breadcrumb .current { color: var(--text); font-weight: 500; }

    .page-body { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .module-title { font-size: 1.65rem; font-weight: 700; color: var(--text); margin-bottom: 0.25rem; }
    .module-title span { color: var(--accent); }
    .module-subtitle { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 2rem; }
    .section-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }

    /* ── PROBLEM TYPE GRID ── */
    .problem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; margin-bottom: 2rem; }
    .prob-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.2rem 1rem; cursor: pointer; transition: all 0.18s ease;
      text-align: left; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.45rem;
    }
    .prob-btn:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-1px); }
    .prob-btn.active { border-color: var(--accent); background: rgba(20,184,166,0.08); box-shadow: 0 0 0 1px var(--accent); }
    .prob-btn .prob-icon { font-size: 1.6rem; }
    .prob-btn .prob-name { font-size: 0.92rem; font-weight: 600; color: var(--text); line-height: 1.2; }
    .prob-btn .prob-desc { font-size: 0.77rem; color: var(--text-muted); line-height: 1.4; }
    .prob-btn .prob-rule { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); margin-top: 0.1rem; }
    .prob-btn.active .prob-name { color: var(--accent); }

    /* ── WORKSPACE ── */
    #workspace { display: none; }
    #workspace.visible { display: block; }
    .divider { height: 1px; background: var(--border); margin: 1.75rem 0; }

    /* ── VISUAL DIAGRAM CARD ── */
    .diagram-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent4);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      animation: slideDown 0.3s ease;
    }
    .diagram-svg-wrap { flex-shrink: 0; }
    .diagram-info { flex: 1; min-width: 0; }
    .diagram-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent4); margin-bottom: 0.5rem; }
    .diagram-rule { font-size: 0.88rem; color: var(--text); line-height: 1.65; margin-bottom: 0.6rem; }
    .diagram-rule strong { color: var(--accent2); }
    .diagram-rule .hi-orange { color: var(--accent3); }
    .diagram-rule .hi-purple { color: var(--accent4); }
    .diagram-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; margin-top: 0.4rem; }
    .leg-item { font-size: 0.78rem; display: flex; align-items: center; gap: 0.4rem; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── FORMULA CARD ── */
    .formula-card {
      background: var(--formula-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
      display: flex; align-items: flex-start; gap: 1.5rem; animation: slideDown 0.3s ease;
    }
    .formula-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.25rem; }
    .formula-text { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; color: var(--text); letter-spacing: 0.04em; line-height: 1.7; }
    .formula-text .var { color: var(--accent2); }
    .formula-text .tot { color: var(--accent3); }
    .formula-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.35rem; line-height: 1.6; }
    .formula-key { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); line-height: 1.9; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; }
    .formula-key .kv { color: var(--accent2); }
    .formula-key .kt { color: var(--accent3); }

    /* ── STEP CARDS ── */
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; animation: slideDown 0.25s ease; transition: border-color 0.2s; }
    .step-card.locked { opacity: 0.4; pointer-events: none; }
    .step-card.complete { border-color: var(--success); }
    .step-card.error    { border-color: var(--error); }
    .step-header { padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }
    .step-badge { width: 26px; height: 26px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
    .step-card.complete .step-badge { background: var(--success); border-color: var(--success); color: #fff; }
    .step-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .step-instruction { font-size: 0.82rem; color: var(--text-muted); margin-left: auto; text-align: right; max-width: 300px; }
    .step-body { padding: 1.25rem; }

    .known-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.85rem; margin-bottom: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .field-label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); }
    .field-label .var-name { font-family: var(--mono); color: var(--accent2); font-size: 0.82rem; }
    .field-hint { font-size: 0.71rem; color: var(--text-dim); }
    .known-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 0.55rem 0.85rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 100%; transition: border-color 0.15s; outline: none; }
    .known-input:focus { border-color: var(--accent); }
    .known-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .begin-btn { background: var(--accent); color: #0a1628; border: none; border-radius: 7px; padding: 0.6rem 1.5rem; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 0.5rem; }
    .begin-btn:hover { background: #0d9488; transform: translateY(-1px); }
    .begin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .expr-display { font-family: var(--mono); font-size: 1.05rem; color: var(--text); background: var(--formula-bg); border: 1px solid var(--border); border-radius: 7px; padding: 0.75rem 1rem; letter-spacing: 0.03em; line-height: 1.8; }
    .expr-display .val { color: var(--accent2); }
    .expr-display .tot { color: var(--accent3); }

    .compute-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .compute-row:last-child { margin-bottom: 0; }
    .compute-expr { font-family: var(--mono); font-size: 0.97rem; color: var(--text); flex: 1; min-width: 0; line-height: 1.5; }
    .compute-expr .val { color: var(--accent2); }
    .compute-expr .tot { color: var(--accent3); }
    .compute-label { font-size: 0.75rem; color: var(--text-dim); margin-right: 0.3rem; font-style: italic; }
    .answer-box { background: var(--surface2); border: 2px solid var(--border2); border-radius: 7px; padding: 0.45rem 0.75rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 110px; outline: none; transition: border-color 0.15s; text-align: center; }
    .answer-box:focus { border-color: var(--accent); }
    .answer-box.correct { border-color: var(--success); background: rgba(34,197,94,0.08); color: var(--success); }
    .answer-box.incorrect { border-color: var(--error); background: rgba(248,113,113,0.08); }
    .check-btn { background: var(--surface3); border: 1px solid var(--border2); border-radius: 6px; padding: 0.45rem 0.85rem; font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .check-btn:hover { border-color: var(--accent); color: var(--accent); }
    .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .feedback-box { border-radius: 7px; padding: 0.65rem 1rem; font-size: 0.83rem; line-height: 1.5; margin-top: 0.75rem; display: none; }
    .feedback-box.visible { display: block; }
    .feedback-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .feedback-box.error   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
    .feedback-box.hint    { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: #fde68a; }

    /* angle-pair info tags */
    .angle-tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 0.3rem;
    }
    .tag-equal   { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
    .tag-supp    { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
    .tag-total   { background: rgba(20,184,166,0.12); color: #14b8a6; border: 1px solid rgba(20,184,166,0.3); }

    /* transversal pair legend table */
    .pair-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.82rem; }
    .pair-table th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
    .pair-table td { padding: 0.5rem; border-bottom: 1px solid var(--border2); color: var(--text-muted); vertical-align: top; }
    .pair-table td:first-child { font-family: var(--mono); color: var(--accent2); font-size: 0.85rem; white-space: nowrap; }
    .pair-table .equal-row td { color: #38bdf8; }
    .pair-table .supp-row td  { color: #fb923c; }

    .final-answer-card { background: linear-gradient(135deg, rgba(20,184,166,0.12), rgba(167,139,250,0.08)); border: 1px solid var(--accent); border-radius: 10px; padding: 1.5rem; text-align: center; display: none; animation: celebrate 0.4s ease; }
    .final-answer-card.visible { display: block; }
    .final-answer-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.5rem; }
    .final-answer-value { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: var(--text); }
    .final-answer-caption { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; }
    .final-actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
    .try-again-btn, .copy-btn { background: transparent; border: 1px solid var(--border2); border-radius: 7px; padding: 0.5rem 1.25rem; font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .try-again-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn { border-color: var(--accent-dim); color: var(--accent); } .copy-btn:hover { background: rgba(20,184,166,0.1); border-color: var(--accent); }
    .copy-btn.copied { background: rgba(34,197,94,0.12); border-color: var(--success); color: var(--success); pointer-events: none; }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes celebrate { 0% { transform: scale(0.95); opacity: 0; } 60% { transform: scale(1.02); } 100% { transform: scale(1); opacity: 1; } }

    @media (max-width: 640px) {
      .diagram-card { flex-direction: column; gap: 1rem; }
      .formula-card { flex-direction: column; gap: 0.75rem; }
      .formula-key { margin-left: 0; }
      .problem-grid { grid-template-columns: 1fr 1fr; }
      .compute-row { flex-direction: column; align-items: flex-start; }
      .answer-box { width: 100%; }
      .step-instruction { display: none; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <nav class="breadcrumb">
    <a href="/">Home</a>
    <span class="sep">›</span>
    <a href="/math-toolkit">Math Toolkit</a>
    <span class="sep">›</span>
    <span class="current">Angles</span>
  </nav>
</header>

<main class="page-body">
  <h1 class="module-title">Working with <span>Angles</span></h1>
  <p class="module-subtitle">Select an angle relationship or problem type, then work step-by-step to find the missing angle.</p>

  <div class="section-label">Choose a Problem Type</div>
  <div class="problem-grid" id="problemGrid"></div>

  <div id="workspace">
    <div class="divider"></div>

    <!-- Visual Diagram -->
    <div class="diagram-card">
      <div class="diagram-svg-wrap">
        <svg id="diagramSVG" width="180" height="160" viewBox="0 0 180 160"></svg>
      </div>
      <div class="diagram-info">
        <div class="diagram-tag" id="diagramTag">📐 Angle Relationship</div>
        <div class="diagram-rule" id="diagramRule"></div>
        <div class="diagram-legend" id="diagramLegend"></div>
      </div>
    </div>

    <!-- Formula Card -->
    <div class="formula-card">
      <div style="flex:1">
        <div class="formula-label">Formula / Rule</div>
        <div class="formula-text" id="formulaText"></div>
        <div class="formula-desc" id="formulaDesc"></div>
      </div>
      <div class="formula-key" id="formulaKey"></div>
    </div>

    <!-- Known Values -->
    <div class="step-card" id="stepKnown">
      <div class="step-header">
        <div class="step-badge" id="badgeKnown">1</div>
        <div class="step-title">Identify Your Known Values</div>
        <div class="step-instruction">Enter the angle measurements from your problem.</div>
      </div>
      <div class="step-body">
        <div class="known-grid" id="knownGrid"></div>
        <button class="begin-btn" id="beginBtn" onclick="beginSteps()" disabled>Begin Solving →</button>
      </div>
    </div>

    <div id="stepsContainer"></div>

    <div class="final-answer-card" id="finalCard">
      <div class="final-answer-label" id="finalLabel">✓ Missing Angle</div>
      <div class="final-answer-value" id="finalValue"></div>
      <div class="final-answer-caption" id="finalCaption"></div>
      <div class="final-actions">
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">📋 Copy Problem to Clipboard</button>
        <button class="try-again-btn" onclick="resetWorkspace()">↺ Try Another Problem</button>
      </div>
    </div>
  </div>
</main>

<script>
function round2(n) { return Math.round(n * 100) / 100; }
function isClose(a, b) { return Math.abs(a - b) <= Math.max(0.11, Math.abs(b) * 0.015); }

/* ================================================================

/* ================================================================
   STATE
================================================================ */
let currentProbId = null;
let knownValues = {}, computedValues = {}, stepAttempts = {};

/* ================================================================
   PROBLEM GRID
================================================================ */
const probList = [
  { id: 'complementary',            name: 'Complementary',       icon: '🔲', desc: 'Two angles adding to 90°',        rule: 'a + b = 90°' },
  { id: 'supplementary',            name: 'Supplementary',       icon: '📏', desc: 'Two angles adding to 180°',       rule: 'a + b = 180°' },

];

function buildProblemGrid() {
  const grid = document.getElementById('problemGrid');
  probList.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'prob-btn';
    btn.dataset.prob = p.id;
    btn.innerHTML = `
      <span class="prob-icon">${p.icon}</span>
      <span class="prob-name">${p.name}</span>
      <span class="prob-desc">${p.desc}</span>
      <span class="prob-rule">${p.rule}</span>
    `;
    btn.addEventListener('click', () => selectProblem(p.id));
    grid.appendChild(btn);
  });
}

function selectProblem(id) {
  currentProbId = id;
  document.querySelectorAll('.prob-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.prob-btn[data-prob="${id}"]`).classList.add('active');
  resetWorkspace();
  renderWorkspace();
}

/* ================================================================
   RENDER WORKSPACE
================================================================ */
function renderWorkspace() {
  const prob = PROBLEMS[currentProbId];
  if (!prob) return;
  document.getElementById('workspace').classList.add('visible');

  // Diagram
  document.getElementById('diagramTag').textContent  = prob.diagramTag;
  document.getElementById('diagramRule').innerHTML   = prob.diagramRule;
  document.getElementById('diagramSVG').innerHTML    = DIAGRAMS[prob.diagramKey] || '';
  const legendEl = document.getElementById('diagramLegend');
  legendEl.innerHTML = (prob.diagramLegend || []).map(l =>
    `<div class="leg-item"><div class="leg-dot" style="background:${l.color}"></div><span>${l.label}</span></div>`
  ).join('');

  // Formula
  document.getElementById('formulaText').innerHTML  = prob.formulaText;
  document.getElementById('formulaDesc').textContent = prob.formulaDesc;
  document.getElementById('formulaKey').innerHTML   = prob.formulaKey;

  // Known fields
  const grid = document.getElementById('knownGrid');
  grid.innerHTML = '';
  prob.knownFields.forEach(field => {
    const div = document.createElement('div');
    div.className = 'field-group';
    if (field.isSelect) {
      div.innerHTML = `
        <label class="field-label">${field.label}</label>
        ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
        <select class="known-input" id="known_${field.id}" onchange="checkBeginReady()" style="cursor:pointer">
          ${field.options.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
        </select>`;
    } else {
      div.innerHTML = `
        <label class="field-label">${field.label} &nbsp;<span class="var-name">(${field.varName})</span></label>
        ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
        <input class="known-input" id="known_${field.id}" type="number" step="any" min="0" placeholder="Enter value..." oninput="checkBeginReady()" />`;
    }
    grid.appendChild(div);
  });

  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('badgeKnown').textContent = '1';
  document.getElementById('stepKnown').classList.remove('complete');
  document.getElementById('beginBtn').disabled = true;
  document.getElementById('beginBtn').style.display = '';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = false);
  checkBeginReady();
}

function checkBeginReady() {
  const prob = PROBLEMS[currentProbId];
  if (!prob) return;
  const allFilled = prob.knownFields.every(f => {
    if (f.isSelect) return true;
    const v = document.getElementById(`known_${f.id}`)?.value.trim();
    return v !== '' && !isNaN(parseFloat(v));
  });
  document.getElementById('beginBtn').disabled = !allFilled;
}

/* ================================================================
   BEGIN SOLVING — with special handling for isosceles & transversal
================================================================ */
function beginSteps() {
  const prob = PROBLEMS[currentProbId];
  knownValues = {}; computedValues = {}; stepAttempts = {};

  prob.knownFields.forEach(f => {
    const el = document.getElementById(`known_${f.id}`);
    if (f.isSelect) knownValues[f.id] = el.value;
    else knownValues[f.id] = parseFloat(el.value);
  });

  document.getElementById('stepKnown').classList.add('complete');
  document.getElementById('badgeKnown').textContent = '✓';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = true);
  document.getElementById('beginBtn').style.display = 'none';

  // Isosceles: build steps dynamically based on selected mode
  if (currentProbId === 'isosceles') {
    buildIsoscelesSteps();
    return;
  }

  renderSteps(prob);
}

function buildIsoscelesSteps() {
  const mode = knownValues.mode;
  const val  = knownValues.known;
  const dynamicProb = {
    steps: mode === 'vertex'
      ? [
          { title: 'Substitute Your Value', type: 'expression',
            displayFn: () => `<span class="val">${val}</span>° + 2B = <span class="tot">180°</span>` },
          { title: 'Subtract Vertex Angle from 180°', instruction: 'Subtract the vertex angle from 180°.',
            type: 'compute', rows: [{
              exprFn: () => `<span class="tot">180</span>° − <span class="val">${val}</span>° =`,
              answerId: 'rem', answerFn: () => round2(180 - val),
              hintFn: () => `Subtract 180 − ${val}.`
            }]},
          { title: 'Divide by 2 (Two Equal Base Angles)', instruction: 'Divide by 2 since there are two equal base angles.',
            type: 'compute', isFinal: true,
            rows: [{
              exprFn: (k, c) => `<span class="val">${c.rem}</span>° ÷ 2 =`,
              answerId: 'B', answerFn: (k, c) => round2(c.rem / 2),
              hintFn: (k, c) => `Divide ${c.rem} ÷ 2.`
            }],
            multiAnswerFn: (k, c) => `Vertex (A): ${val}°, Base angles (B): ${c.B}° each`,
            multiCaption: (k, c) => `${val}° + ${c.B}° + ${c.B}° = 180° ✓`
          }
        ]
      : [
          { title: 'Substitute Your Value', type: 'expression',
            displayFn: () => `A + 2(<span class="val">${val}</span>°) = <span class="tot">180°</span>` },
          { title: 'Multiply the Base Angle by 2', instruction: 'There are two equal base angles.',
            type: 'compute', rows: [{
              exprFn: () => `2 × <span class="val">${val}</span>° =`,
              answerId: 'twoB', answerFn: () => round2(2 * val),
              hintFn: () => `Multiply 2 × ${val}.`
            }]},
          { title: 'Subtract from 180° to Find Vertex Angle', instruction: 'Subtract the combined base angles from 180°.',
            type: 'compute', isFinal: true,
            rows: [{
              exprFn: (k, c) => `<span class="tot">180</span>° − <span class="val">${c.twoB}</span>° =`,
              answerId: 'A', answerFn: (k, c) => round2(180 - c.twoB),
              hintFn: (k, c) => `Subtract 180 − ${c.twoB}.`
            }],
            multiAnswerFn: (k, c) => `Vertex (A): ${c.A}°, Base angles (B): ${val}° each`,
            multiCaption: (k, c) => `${c.A}° + ${val}° + ${val}° = 180° ✓`
          }
        ]
  };
  renderSteps(dynamicProb);
}

/* ================================================================
   RENDER STEPS
================================================================ */
function renderSteps(prob) {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';
  prob.steps.forEach((step, idx) => {
    const stepNum = idx + 2;
    const card = document.createElement('div');
    card.className = 'step-card' + (idx > 0 ? ' locked' : '');
    card.id = `dynStep_${idx}`;
    let bodyHTML = '';

    if (step.type === 'expression') {
      bodyHTML = `<div class="expr-display">${step.displayFn(knownValues)}</div>`;
    } else if (step.type === 'compute') {
      bodyHTML = step.rows.map((row, rIdx) => {
        const rowId = `row_${idx}_${rIdx}`;
        return `
          <div class="compute-row" id="${rowId}_wrap">
            <div class="compute-expr">${row.exprFn(knownValues, computedValues)}</div>
            <input class="answer-box" id="${rowId}_input" type="number" step="any" placeholder="?"
              onkeydown="if(event.key==='Enter') checkRow('${rowId}',${idx},${rIdx})" />
            <button class="check-btn" id="${rowId}_btn" onclick="checkRow('${rowId}',${idx},${rIdx})">Check</button>
          </div>`;
      }).join('');
      bodyHTML += `<div class="feedback-box" id="fb_${idx}"></div>`;
    } else if (step.type === 'transversal_summary') {
      bodyHTML = `
        <div id="transversalSummary">
          <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:0.75rem;">
            Enter your known angle and the supplementary angle above, then click the button to see all 8 angles.
          </p>
          <button class="begin-btn" style="background:var(--surface3);border:1px solid var(--border2);color:var(--text-muted);" onclick="showTransversalSummary(${idx})">
            Show All 8 Angles →
          </button>
        </div>
        <div class="feedback-box" id="fb_${idx}"></div>`;
    }

    card.innerHTML = `
      <div class="step-header">
        <div class="step-badge" id="badge_${idx}">${stepNum}</div>
        <div class="step-title">Step ${stepNum}: ${step.title}</div>
        <div class="step-instruction">${step.instruction || ''}</div>
      </div>
      <div class="step-body">${bodyHTML}</div>`;
    container.appendChild(card);
  });
  document.getElementById('dynStep_0').classList.remove('locked');
  if (prob.steps[0] && prob.steps[0].type === 'expression') setTimeout(() => unlockStep(1), 350);
}

/* ================================================================
   TRANSVERSAL SUMMARY
================================================================ */
function showTransversalSummary(stepIdx) {
  const ang1 = knownValues.ang1;
  const supp  = round2(180 - ang1);
  const card  = document.getElementById(`dynStep_${stepIdx}`);
  const badge = document.getElementById(`badge_${stepIdx}`);
  const fb    = document.getElementById(`fb_${stepIdx}`);

  card.classList.add('complete');
  badge.textContent = '✓';

  const summaryHTML = `
    <table class="pair-table">
      <thead><tr><th>Angles</th><th>Value</th><th>Relationship</th></tr></thead>
      <tbody>
        <tr class="equal-row"><td>∠1, ∠3, ∠5, ∠7</td><td>${ang1}°</td><td>Corresponding / Alternate — all equal</td></tr>
        <tr class="supp-row"><td>∠2, ∠4, ∠6, ∠8</td><td>${supp}°</td><td>Supplementary partners — add to 180°</td></tr>
        <tr><td colspan="3" style="color:var(--text-dim);font-size:0.75rem;padding-top:0.5rem">∠1+∠2 = ${ang1}+${supp} = 180° ✓ &nbsp;|&nbsp; ∠1+∠5 = ${ang1} (corresponding) ✓</td></tr>
      </tbody>
    </table>`;

  document.getElementById('transversalSummary').innerHTML = summaryHTML;
  showFeedback(fb, 'success', `✓ All 8 angles identified using corresponding and supplementary angle rules.`);

  const finalCard = document.getElementById('finalCard');
  document.getElementById('finalLabel').textContent = '✓ All 8 Angles';
  document.getElementById('finalValue').textContent = `${ang1}° and ${supp}°`;
  document.getElementById('finalCaption').textContent = `Four angles measure ${ang1}° and four angles measure ${supp}°. Each pair adds to 180°.`;
  finalCard.classList.add('visible');
  setTimeout(() => finalCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

/* ================================================================
   UNLOCK STEP
================================================================ */
function unlockStep(idx) {
  const card = document.getElementById(`dynStep_${idx}`);
  if (!card) return;
  card.classList.remove('locked');
  const prob = currentProbId === 'isosceles' ? null : PROBLEMS[currentProbId];
  const steps = prob ? prob.steps : null;
  if (steps && steps[idx] && steps[idx].type === 'expression') {
    const exprEl = card.querySelector('.expr-display');
    if (exprEl) exprEl.innerHTML = steps[idx].displayFn(knownValues);
    setTimeout(() => unlockStep(idx + 1), 400);
  }
}

/* ================================================================
   CHECK ROW
================================================================ */
function checkRow(rowId, stepIdx, rowIdx) {
  const prob  = currentProbId === 'isosceles' ? null : PROBLEMS[currentProbId];
  // get current steps array
  const stepsContainer = document.getElementById('stepsContainer');
  const stepCards = stepsContainer.querySelectorAll('.step-card');
  // determine step from rendered cards
  const step = getStepAt(stepIdx);
  if (!step) return;

  const row  = step.rows[rowIdx];
  const input = document.getElementById(`${rowId}_input`);
  const btn   = document.getElementById(`${rowId}_btn`);
  const fb    = document.getElementById(`fb_${stepIdx}`);
  const badge = document.getElementById(`badge_${stepIdx}`);
  const card  = document.getElementById(`dynStep_${stepIdx}`);

  if (!input || input.value.trim() === '') { showFeedback(fb, 'hint', 'Please enter a number before checking.'); return; }

  const userAnswer = parseFloat(input.value);
  const correct    = row.answerFn(knownValues, computedValues);
  stepAttempts[rowId] = (stepAttempts[rowId] || 0) + 1;

  if (isClose(userAnswer, correct)) {
    input.classList.add('correct'); input.disabled = true; btn.disabled = true;
    computedValues[row.answerId] = round2(userAnswer);

    const allDone = step.rows.every((r, ri) => {
      const inp = document.getElementById(`row_${stepIdx}_${ri}_input`);
      return inp && inp.disabled;
    });

    if (allDone) {
      card.classList.add('complete'); badge.textContent = '✓';
      if (step.isFinal) {
        showFeedback(fb, 'success', `✓ Correct! Great work.`);
        // multi-answer final (vertical, isosceles)
        if (step.multiAnswerFn) {
          showMultiFinalAnswer(step.multiAnswerFn(knownValues, computedValues), step.multiCaption ? step.multiCaption(knownValues, computedValues) : '');
        } else {
          showFinalAnswer(prob || PROBLEMS[currentProbId], computedValues[row.answerId]);
        }
      } else {
        showFeedback(fb, 'success', `✓ Correct! Move on to the next step.`);
        const nextIdx = stepIdx + 1;
        const nextStep = getStepAt(nextIdx);
        if (nextStep && nextStep.type === 'compute') {
          nextStep.rows.forEach((nr, nri) => {
            const exprEl = document.querySelector(`#row_${nextIdx}_${nri}_wrap .compute-expr`);
            if (exprEl) exprEl.innerHTML = nr.exprFn(knownValues, computedValues);
          });
        }
        setTimeout(() => unlockStep(nextIdx), 400);
      }
    } else {
      showFeedback(fb, 'success', `✓ Correct! Complete the remaining calculations.`);
    }
  } else {
    input.classList.add('incorrect'); card.classList.add('error');
    setTimeout(() => { input.classList.remove('incorrect'); card.classList.remove('error'); }, 600);
    const attempts = stepAttempts[rowId];
    let msg = '';
    if (attempts === 1)      msg = `Not quite — double-check your math and try again.`;
    else if (attempts === 2) msg = `Still not right. Hint: ${row.hintFn(knownValues, computedValues)}`;
    else                     msg = `The correct answer is <strong>${correct}</strong>. ${row.hintFn(knownValues, computedValues)}`;
    showFeedback(fb, 'error', msg);
  }
}

// Resolve current step data — handles dynamic isosceles steps stored in closure
let _isoscelesSteps = null;
function getStepAt(idx) {
  if (currentProbId === 'isosceles') {
    // Re-derive isosceles steps from current knownValues
    const mode = knownValues.mode;
    const val  = knownValues.known;
    const allSteps = mode === 'vertex'
      ? [
          { title: '', type: 'expression', displayFn: () => '' },
          { title: '', type: 'compute', rows: [{ exprFn: () => '', answerId: 'rem', answerFn: () => round2(180 - val), hintFn: () => `Subtract 180 − ${val}.` }] },
          { title: '', type: 'compute', isFinal: true,
            rows: [{ exprFn: (k, c) => '', answerId: 'B', answerFn: (k, c) => round2(c.rem / 2), hintFn: (k, c) => `Divide ${c.rem} ÷ 2.` }],
            multiAnswerFn: (k, c) => `Vertex (A): ${val}°, Base angles (B): ${c.B}° each`,
            multiCaption: (k, c) => `${val}° + ${c.B}° + ${c.B}° = 180° ✓`
          }
        ]
      : [
          { title: '', type: 'expression', displayFn: () => '' },
          { title: '', type: 'compute', rows: [{ exprFn: () => '', answerId: 'twoB', answerFn: () => round2(2 * val), hintFn: () => `Multiply 2 × ${val}.` }] },
          { title: '', type: 'compute', isFinal: true,
            rows: [{ exprFn: (k, c) => '', answerId: 'A', answerFn: (k, c) => round2(180 - c.twoB), hintFn: (k, c) => `Subtract 180 − ${c.twoB}.` }],
            multiAnswerFn: (k, c) => `Vertex (A): ${c.A}°, Base angles (B): ${val}° each`,
            multiCaption: (k, c) => `${c.A}° + ${val}° + ${val}° = 180° ✓`
          }
        ];
    return allSteps[idx];
  }
  return PROBLEMS[currentProbId]?.steps[idx];
}

function showFeedback(el, type, msg) { el.className = `feedback-box visible ${type}`; el.innerHTML = msg; }

function showFinalAnswer(prob, value) {
  const finalCard = document.getElementById('finalCard');
  document.getElementById('finalLabel').textContent = prob.finalLabel;
  document.getElementById('finalValue').textContent = value + '°';
  document.getElementById('finalValue').style.color  = '';
  document.getElementById('finalValue').style.fontSize = '';
  document.getElementById('finalCaption').textContent = prob.finalCaption ? prob.finalCaption(value, knownValues) : '';
  finalCard.classList.add('visible');
  setTimeout(() => finalCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function showMultiFinalAnswer(valueStr, caption) {
  const finalCard = document.getElementById('finalCard');
  const prob = PROBLEMS[currentProbId];
  document.getElementById('finalLabel').textContent  = prob.finalLabel;
  document.getElementById('finalValue').textContent  = valueStr;
  document.getElementById('finalValue').style.fontSize = '1.2rem';
  document.getElementById('finalCaption').textContent = caption;
  finalCard.classList.add('visible');
  setTimeout(() => finalCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

/* ================================================================
   COPY TO CLIPBOARD
================================================================ */
function buildProblemText() {
  const prob = PROBLEMS[currentProbId]; if (!prob) return '';
  const lines = [], d = '─'.repeat(40);
  lines.push('ANGLES');
  lines.push(`Problem Type: ${prob.name}`);
  lines.push(d);
  lines.push(`Formula: ${prob.formulaText.replace(/<[^>]+>/g, '').replace(/<br>/g, ' | ')}`);
  lines.push('');
  lines.push('Step 1: Known Values');
  prob.knownFields.forEach(f => {
    if (f.isSelect) {
      lines.push(`  ${f.label}: ${knownValues[f.id]}`);
    } else {
      lines.push(`  ${f.label} (${f.varName}) = ${knownValues[f.id]}°`);
    }
  });
  lines.push('');

  // For isosceles, get the dynamic steps
  const steps = currentProbId === 'isosceles' ? getIsoscelesStepsForClipboard() : prob.steps;

  steps.forEach((step, idx) => {
    const stepNum = idx + 2;
    lines.push(`Step ${stepNum}: ${step.title}`);
    if (step.type === 'expression' && step.displayFn) {
      lines.push(`  ${step.displayFn(knownValues).replace(/<[^>]+>/g, '')}`);
    } else if (step.type === 'compute') {
      step.rows.forEach((row, rIdx) => {
        const expr = row.exprFn(knownValues, computedValues).replace(/<[^>]+>/g, '');
        const ans = computedValues[row.answerId];
        const att = stepAttempts[`row_${idx}_${rIdx}`] || 1;
        const note = att === 1 ? ' ✓ (1st try)' : ` (${att} attempts)`;
        lines.push(`  ${expr} ${ans}°${note}`);
      });
    } else if (step.type === 'transversal_summary') {
      const ang1 = knownValues.ang1;
      const supp = round2(180 - ang1);
      lines.push(`  ∠1, ∠3, ∠5, ∠7 = ${ang1}°`);
      lines.push(`  ∠2, ∠4, ∠6, ∠8 = ${supp}°`);
    }
    lines.push('');
  });

  lines.push(d);
  // Final answer from the displayed final value
  const fv = document.getElementById('finalValue')?.textContent || '';
  const fc = document.getElementById('finalCaption')?.textContent || '';
  lines.push(fv);
  if (fc) lines.push(fc);
  lines.push(d);
  return lines.join('\n');
}

function getIsoscelesStepsForClipboard() {
  const mode = knownValues.mode;
  const val = knownValues.known;
  if (mode === 'vertex') {
    return [
      { title: 'Substitute Your Value', type: 'expression', displayFn: () => `${val}° + 2B = 180°` },
      { title: 'Subtract Vertex Angle from 180°', type: 'compute', rows: [{ exprFn: () => `180° − ${val}° =`, answerId: 'rem', answerFn: () => round2(180-val), hintFn: () => '' }]},
      { title: 'Divide by 2', type: 'compute', rows: [{ exprFn: (k,c) => `${c.rem}° ÷ 2 =`, answerId: 'B', answerFn: (k,c) => round2(c.rem/2), hintFn: () => '' }], isFinal: true }
    ];
  } else {
    return [
      { title: 'Substitute Your Value', type: 'expression', displayFn: () => `A + 2(${val}°) = 180°` },
      { title: 'Multiply Base Angle by 2', type: 'compute', rows: [{ exprFn: () => `2 × ${val}° =`, answerId: 'twoB', answerFn: () => round2(2*val), hintFn: () => '' }]},
      { title: 'Subtract from 180°', type: 'compute', rows: [{ exprFn: (k,c) => `180° − ${c.twoB}° =`, answerId: 'A', answerFn: (k,c) => round2(180-c.twoB), hintFn: () => '' }], isFinal: true }
    ];
  }
}

function copyToClipboard() {
  const text = buildProblemText(), btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Problem to Clipboard'; btn.classList.remove('copied'); }, 2500);
  }).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Problem to Clipboard'; btn.classList.remove('copied'); }, 2500);
  });
}

function resetWorkspace() {
  knownValues = {}; computedValues = {}; stepAttempts = {};
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('workspace').classList.remove('visible');
  const cb = document.getElementById('copyBtn');
  cb.textContent = '📋 Copy Problem to Clipboard'; cb.classList.remove('copied');
}

buildProblemGrid();
</script>
