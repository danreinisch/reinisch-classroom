<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinate Geometry | Math Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0d1117;
      --surface:    #161d2e;
      --surface2:   #1e2840;
      --surface3:   #243050;
      --border:     #2a3a58;
      --border2:    #34466e;
      --accent:     #14b8a6;
      --accent-dim: #0d9488;
      --accent2:    #38bdf8;
      --accent3:    #fb923c;
      --accent4:    #a78bfa;
      --accent5:    #34d399;
      --text:       #e2e8f0;
      --text-muted: #8a9bbf;
      --text-dim:   #5a6a8a;
      --success:    #22c55e;
      --error:      #f87171;
      --formula-bg: #0a1628;
      --mono:       'JetBrains Mono', monospace;
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 56px; }
    .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--text-dim); }
    .breadcrumb .current { color: var(--text); font-weight: 500; }

    .page-body { max-width: 920px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .module-title { font-size: 1.65rem; font-weight: 700; color: var(--text); margin-bottom: 0.25rem; }
    .module-title span { color: var(--accent); }
    .module-subtitle { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 2rem; }
    .section-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }

    /* ── PROBLEM GRID ── */
    .problem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 0.85rem; margin-bottom: 2rem; }
    .prob-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.2rem 1rem; cursor: pointer; transition: all 0.18s ease;
      text-align: left; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.45rem;
    }
    .prob-btn:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-1px); }
    .prob-btn.active { border-color: var(--accent); background: rgba(20,184,166,0.08); box-shadow: 0 0 0 1px var(--accent); }
    .prob-btn .prob-icon { font-size: 1.6rem; }
    .prob-btn .prob-name { font-size: 0.92rem; font-weight: 600; color: var(--text); line-height: 1.2; }
    .prob-btn.active .prob-name { color: var(--accent); }
    .prob-btn .prob-desc { font-size: 0.77rem; color: var(--text-muted); line-height: 1.4; }
    .prob-btn .prob-rule { font-family: var(--mono); font-size: 0.7rem; color: var(--accent); margin-top: 0.1rem; }

    /* ── WORKSPACE ── */
    #workspace { display: none; }
    #workspace.visible { display: block; }
    .divider { height: 1px; background: var(--border); margin: 1.75rem 0; }

    /* ── COORDINATE GRID CARD ── */
    .coord-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent4);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 2rem;
      animation: slideDown 0.3s ease;
    }
    .coord-svg-wrap { flex-shrink: 0; }
    .coord-info { flex: 1; min-width: 0; }
    .coord-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent4); margin-bottom: 0.5rem; }
    .coord-rule { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 0.6rem; }
    .coord-rule strong { color: var(--accent2); }
    .coord-rule .hi-o { color: var(--accent3); font-weight: 600; }
    .coord-rule .hi-g { color: var(--accent5); font-weight: 600; }
    .coord-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; }
    .leg-item { font-size: 0.78rem; display: flex; align-items: center; gap: 0.4rem; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── FORMULA CARD ── */
    .formula-card {
      background: var(--formula-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
      display: flex; align-items: flex-start; gap: 1.5rem; animation: slideDown 0.3s ease;
    }
    .formula-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.25rem; }
    .formula-text { font-family: var(--mono); font-size: 1.2rem; font-weight: 500; color: var(--text); letter-spacing: 0.04em; line-height: 1.75; }
    .formula-text .var  { color: var(--accent2); }
    .formula-text .res  { color: var(--accent5); }
    .formula-text .neg  { color: var(--error); }
    .formula-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.35rem; line-height: 1.6; }
    .formula-key { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); line-height: 1.9; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; }
    .formula-key .kv { color: var(--accent2); }
    .formula-key .kr { color: var(--accent5); }

    /* ── STEP CARDS ── */
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; animation: slideDown 0.25s ease; transition: border-color 0.2s; }
    .step-card.locked { opacity: 0.4; pointer-events: none; }
    .step-card.complete { border-color: var(--success); }
    .step-card.error { border-color: var(--error); }
    .step-header { padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }
    .step-badge { width: 26px; height: 26px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
    .step-card.complete .step-badge { background: var(--success); border-color: var(--success); color: #fff; }
    .step-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .step-instruction { font-size: 0.82rem; color: var(--text-muted); margin-left: auto; text-align: right; max-width: 300px; }
    .step-body { padding: 1.25rem; }

    .known-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 0.85rem; margin-bottom: 1rem; }
    .point-group { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem; }
    .point-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.6rem; }
    .point-label.p1 { color: #f87171; }
    .point-label.p2 { color: var(--accent3); }
    .point-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .field-label { font-size: 0.76rem; font-weight: 500; color: var(--text-muted); }
    .field-label .var-name { font-family: var(--mono); color: var(--accent2); font-size: 0.8rem; }
    .field-hint { font-size: 0.7rem; color: var(--text-dim); }
    .known-input { background: var(--surface3); border: 1px solid var(--border); border-radius: 7px; padding: 0.5rem 0.75rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 100%; transition: border-color 0.15s; outline: none; }
    .known-input:focus { border-color: var(--accent); }
    .known-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .single-field { max-width: 300px; }

    .begin-btn { background: var(--accent); color: #0a1628; border: none; border-radius: 7px; padding: 0.6rem 1.5rem; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 0.5rem; }
    .begin-btn:hover { background: #0d9488; transform: translateY(-1px); }
    .begin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .expr-display { font-family: var(--mono); font-size: 1.02rem; color: var(--text); background: var(--formula-bg); border: 1px solid var(--border); border-radius: 7px; padding: 0.75rem 1rem; letter-spacing: 0.03em; line-height: 1.85; }
    .expr-display .val  { color: var(--accent2); }
    .expr-display .p1v  { color: #f87171; }
    .expr-display .p2v  { color: var(--accent3); }
    .expr-display .res  { color: var(--accent5); }
    .expr-display .neg  { color: var(--error); }

    .compute-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .compute-row:last-child { margin-bottom: 0; }
    .compute-expr { font-family: var(--mono); font-size: 0.95rem; color: var(--text); flex: 1; min-width: 0; line-height: 1.5; }
    .compute-expr .val  { color: var(--accent2); }
    .compute-expr .p1v  { color: #f87171; }
    .compute-expr .p2v  { color: var(--accent3); }
    .compute-expr .res  { color: var(--accent5); }
    .compute-expr .neg  { color: var(--error); }
    .compute-label { font-size: 0.74rem; color: var(--text-dim); margin-right: 0.3rem; font-style: italic; }

    .answer-box { background: var(--surface2); border: 2px solid var(--border2); border-radius: 7px; padding: 0.45rem 0.75rem; font-family: var(--mono); font-size: 1rem; color: var(--text); width: 120px; outline: none; transition: border-color 0.15s; text-align: center; }
    .answer-box:focus { border-color: var(--accent); }
    .answer-box.correct { border-color: var(--success); background: rgba(34,197,94,0.08); color: var(--success); }
    .answer-box.incorrect { border-color: var(--error); background: rgba(248,113,113,0.08); }
    .check-btn { background: var(--surface3); border: 1px solid var(--border2); border-radius: 6px; padding: 0.45rem 0.85rem; font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .check-btn:hover { border-color: var(--accent); color: var(--accent); }
    .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .feedback-box { border-radius: 7px; padding: 0.65rem 1rem; font-size: 0.83rem; line-height: 1.5; margin-top: 0.75rem; display: none; }
    .feedback-box.visible { display: block; }
    .feedback-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .feedback-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
    .feedback-box.hint { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: #fde68a; }

    /* ── SLOPE INTERPRETATION CHIP ── */
    .slope-chip {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3);
      border-radius: 8px; padding: 0.5rem 1rem;
      font-size: 0.82rem; color: #d8b4fe; margin-top: 0.75rem;
    }

    /* ── COORDINATE CANVAS ── */
    .canvas-wrap {
      background: var(--formula-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
      display: flex; justify-content: center;
    }

    /* ── NEGATIVE NUMBER REMINDER ── */
    .neg-note {
      background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25);
      border-radius: 7px; padding: 0.55rem 1rem; font-size: 0.8rem;
      color: #fca5a5; margin-bottom: 1rem;
    }

    /* ── SQRT REMINDER ── */
    .sqrt-note {
      background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.25);
      border-radius: 7px; padding: 0.55rem 1rem; font-size: 0.8rem;
      color: #d8b4fe; margin-top: 0.75rem;
    }

    /* ── FINAL ANSWER ── */
    .final-answer-card { background: linear-gradient(135deg, rgba(20,184,166,0.12), rgba(56,189,248,0.07)); border: 1px solid var(--accent); border-radius: 10px; padding: 1.5rem; text-align: center; display: none; animation: celebrate 0.4s ease; }
    .final-answer-card.visible { display: block; }
    .final-answer-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.5rem; }
    .final-answer-value { font-family: var(--mono); font-size: 1.9rem; font-weight: 700; color: var(--text); }
    .final-answer-caption { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; line-height: 1.6; }
    .try-again-btn { margin-top: 1.25rem; background: transparent; border: 1px solid var(--border2); border-radius: 7px; padding: 0.5rem 1.25rem; font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .try-again-btn:hover { border-color: var(--accent); color: var(--accent); }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes celebrate { 0% { transform: scale(0.95); opacity: 0; } 60% { transform: scale(1.02); } 100% { transform: scale(1); opacity: 1; } }

    @media (max-width: 640px) {
      .coord-card { flex-direction: column; gap: 1rem; }
      .formula-card { flex-direction: column; gap: 0.75rem; }
      .formula-key { margin-left: 0; }
      .problem-grid { grid-template-columns: 1fr 1fr; }
      .compute-row { flex-direction: column; align-items: flex-start; }
      .answer-box { width: 100%; }
      .step-instruction { display: none; }
      .point-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>

<header class="page-header">
  <nav class="breadcrumb">
    <a href="/">Home</a>
    <span class="sep">›</span>
    <a href="/math-toolkit">Math Toolkit</a>
    <span class="sep">›</span>
    <span class="current">Coordinate Geometry</span>
  </nav>
</header>

<main class="page-body">
  <h1 class="module-title">Coordinate <span>Geometry</span></h1>
  <p class="module-subtitle">Select a problem type, enter your coordinate points, then work step-by-step to find the answer.</p>

  <div class="section-label">Choose a Problem Type</div>
  <div class="problem-grid" id="problemGrid"></div>

  <div id="workspace">
    <div class="divider"></div>

    <!-- Coordinate Diagram Card -->
    <div class="coord-card">
      <div class="coord-svg-wrap">
        <canvas id="coordCanvas" width="200" height="200" style="border-radius:6px;"></canvas>
      </div>
      <div class="coord-info">
        <div class="coord-tag" id="coordTag">📍 Coordinate Plane</div>
        <div class="coord-rule" id="coordRule"></div>
        <div class="coord-legend" id="coordLegend"></div>
      </div>
    </div>

    <!-- Formula Card -->
    <div class="formula-card">
      <div style="flex:1">
        <div class="formula-label">Formula</div>
        <div class="formula-text" id="formulaText"></div>
        <div class="formula-desc" id="formulaDesc"></div>
      </div>
      <div class="formula-key" id="formulaKey"></div>
    </div>

    <!-- Known Values -->
    <div class="step-card" id="stepKnown">
      <div class="step-header">
        <div class="step-badge" id="badgeKnown">1</div>
        <div class="step-title">Identify Your Known Values</div>
        <div class="step-instruction">Enter the coordinates from your problem.</div>
      </div>
      <div class="step-body">
        <div id="knownGrid"></div>
        <button class="begin-btn" id="beginBtn" onclick="beginSteps()" disabled>Begin Solving →</button>
      </div>
    </div>

    <div id="stepsContainer"></div>

    <div class="final-answer-card" id="finalCard">
      <div class="final-answer-label" id="finalLabel">✓ Answer</div>
      <div class="final-answer-value" id="finalValue"></div>
      <div class="final-answer-caption" id="finalCaption"></div>
      <br>
      <button class="try-again-btn" onclick="resetWorkspace()">↺ Try Another Problem</button>
    </div>
  </div>
</main>

<script>
/* ================================================================
   HELPERS
================================================================ */
function round2(n) { return Math.round(n * 100) / 100; }
function round4(n) { return Math.round(n * 10000) / 10000; }
function isClose(a, b) { return Math.abs(a - b) <= Math.max(0.06, Math.abs(b) * 0.015); }
function fmtNum(n) { return n < 0 ? `(${n})` : `${n}`; }

/* ================================================================
   COORDINATE CANVAS DRAWING
================================================================ */
function drawGrid(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a1628';
  ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const step = 20;
  ctx.strokeStyle = '#1e2840';
  ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y <= h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = '#2a3a58';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.fillStyle = '#5a6a8a';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('x', w - 8, cy - 5);
  ctx.fillText('y', cx + 8, 10);
}

function coordToCanvas(x, y, w, h, scale) {
  return { cx: w/2 + x * scale, cy: h/2 - y * scale };
}

function drawPoint(ctx, x, y, color, label, w, h, scale=20) {
  const {cx, cy} = coordToCanvas(x, y, w, h, scale);
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#0a1628';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 10px Outfit, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${label}(${x},${y})`, cx + 7, cy - 4);
}

function drawLine(ctx, x1, y1, x2, y2, color, w, h, scale=20) {
  const p1 = coordToCanvas(x1, y1, w, h, scale);
  const p2 = coordToCanvas(x2, y2, w, h, scale);
  ctx.beginPath();
  ctx.moveTo(p1.cx, p1.cy);
  ctx.lineTo(p2.cx, p2.cy);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawMidpoint(ctx, mx, my, color, w, h, scale=20) {
  const {cx, cy} = coordToCanvas(mx, my, w, h, scale);
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#0a1628';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`M(${mx},${my})`, cx + 6, cy + 3);
}

function refreshCanvas() {
  const canvas = document.getElementById('coordCanvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  drawGrid(ctx, W, H);
}

function drawProblemCanvas(probId) {
  const canvas = document.getElementById('coordCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  drawGrid(ctx, W, H);

  const x1 = knownValues.x1, y1 = knownValues.y1;
  const x2 = knownValues.x2, y2 = knownValues.y2;
  if (isNaN(x1) || isNaN(y1)) return;

  const scale = 18;

  if (probId === 'slope_from_equation' || probId === 'y_intercept') {
    // Draw y = mx + b line
    const m = knownValues.m, b = knownValues.b_int;
    if (!isNaN(m) && !isNaN(b_int)) {
      drawLine(ctx, -5, m * -5 + b, 5, m * 5 + b, '#38bdf8', W, H, scale);
    }
    return;
  }

  if (!isNaN(x2) && !isNaN(y2)) {
    drawLine(ctx, x1, y1, x2, y2, '#2a3a58', W, H, scale);
    if (probId === 'midpoint') {
      const mx = round2((x1 + x2) / 2), my = round2((y1 + y2) / 2);
      drawMidpoint(ctx, mx, my, '#14b8a6', W, H, scale);
    }
    drawPoint(ctx, x1, y1, '#f87171', 'P₁', W, H, scale);
    drawPoint(ctx, x2, y2, '#fb923c', 'P₂', W, H, scale);
  } else {
    drawPoint(ctx, x1, y1, '#f87171', 'P', W, H, scale);
  }
}

/* ================================================================
   PROBLEM DEFINITIONS
================================================================ */
const PROBLEMS = {

  midpoint: {
    name: 'Midpoint',
    icon: '📍',
    desc: 'Find the exact middle point between two coordinate points.',
    rule: 'M = ((x₁+x₂)/2, (y₁+y₂)/2)',
    coordTag: '📍 Midpoint Formula',
    coordRule: 'The <strong>midpoint</strong> is the exact center between two points. Average the x-coordinates and average the y-coordinates to find it.',
    coordLegend: [

function buildProblemGrid() {
  const grid = document.getElementById('problemGrid');
  probList.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'prob-btn';
    btn.dataset.prob = p.id;
    btn.innerHTML = `
      <span class="prob-icon">${p.icon}</span>
      <span class="prob-name">${p.name}</span>
      <span class="prob-desc">${p.desc}</span>
      <span class="prob-rule">${p.rule}</span>
    `;
    btn.addEventListener('click', () => selectProblem(p.id));
    grid.appendChild(btn);
  });
}

function selectProblem(id) {
  currentProbId = id;
  document.querySelectorAll('.prob-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.prob-btn[data-prob="${id}"]`).classList.add('active');
  resetWorkspace();
  renderWorkspace();
}

            </div>
          </div>
        </div>
      </div>`;
  } else if (prob.usesSlope) {
    grid.innerHTML = `
      <div class="known-grid" style="margin-bottom:1rem;">
        <div class="field-group">
          <label class="field-label">Slope (m) <span class="var-name"></span></label>
          <div class="field-hint">e.g. 2, −3, 0.5, or 0</div>
          <input class="known-input" id="known_m" type="number" step="any" placeholder="Enter slope…" oninput="checkBeginReady()" />
        </div>
        <div class="field-group">
          <label class="field-label">Point x</label>
          <div class="field-hint">x-coordinate of a point on the line</div>
          <input class="known-input" id="known_x" type="number" step="any" placeholder="x" oninput="checkBeginReady()" />
        </div>
        <div class="field-group">
          <label class="field-label">Point y</label>
          <div class="field-hint">y-coordinate of the same point</div>
          <input class="known-input" id="known_y" type="number" step="any" placeholder="y" oninput="checkBeginReady()" />
        </div>
      </div>`;
  } else if (prob.usesSingleSlope) {
    grid.innerHTML = `
      <div class="known-grid" style="margin-bottom:1rem;">
        <div class="field-group">
          <label class="field-label">Original Slope (m)</label>
          <div class="field-hint">e.g. 2, −3, 0.5. Cannot be 0 for perpendicular.</div>
          <input class="known-input" id="known_m_orig" type="number" step="any" placeholder="Enter slope…" oninput="checkBeginReady()" />
        </div>
      </div>`;
  } else if (prob.usesMissingCoord) {
    grid.innerHTML = `
      <div style="margin-bottom:1rem;">
        <div class="field-group" style="margin-bottom:0.75rem;">
          <label class="field-label">What is missing?</label>
          <select class="known-input" id="known_missing" onchange="checkBeginReady()" style="cursor:pointer;max-width:300px;">
            <option value="y2">I am missing y₂ (I know x₂)</option>
            <option value="x2">I am missing x₂ (I know y₂)</option>
          </select>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.75rem;">
          <div class="field-group">
            <label class="field-label">Slope (m)</label>
            <input class="known-input" id="known_m_mc" type="number" step="any" placeholder="Slope" oninput="checkBeginReady()" />
          </div>
          <div class="field-group">
            <label class="field-label">x₁</label>
            <input class="known-input" id="known_x1_mc" type="number" step="any" placeholder="x₁" oninput="checkBeginReady()" />
          </div>
          <div class="field-group">
            <label class="field-label">y₁</label>
            <input class="known-input" id="known_y1_mc" type="number" step="any" placeholder="y₁" oninput="checkBeginReady()" />
          </div>
          <div class="field-group" id="mc_known_x2_wrap">
            <label class="field-label" id="mc_known_label">Known x₂</label>
            <input class="known-input" id="known_partial_mc" type="number" step="any" placeholder="Known coord" oninput="checkBeginReady()" />
          </div>
        </div>
      </div>`;
    // Update label on select change
    setTimeout(() => {
      const sel = document.getElementById('known_missing');
      if (sel) sel.addEventListener('change', () => {
        const lbl = document.getElementById('mc_known_label');
        if (lbl) lbl.textContent = sel.value === 'y2' ? 'Known x₂' : 'Known y₂';
      });
    }, 50);
  }

  refreshCanvas();

  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('badgeKnown').textContent = '1';
  document.getElementById('stepKnown').classList.remove('complete');
  document.getElementById('beginBtn').disabled = true;
  document.getElementById('beginBtn').style.display = '';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = false);
  checkBeginReady();
}

/* ================================================================
   CHECK BEGIN READY
================================================================ */
function checkBeginReady() {
  const prob = PROBLEMS[currentProbId];
  if (!prob) return;
  let allFilled = false;
  if (prob.usesPoints || prob.isClassify) {
    allFilled = ['x1','y1','x2','y2'].every(id => {
      const v = document.getElementById(`known_${id}`)?.value.trim();
      return v !== '' && !isNaN(parseFloat(v));
    });
  } else if (prob.usesSlope) {
    allFilled = ['m','x','y'].every(id => {
      const v = document.getElementById(`known_${id}`)?.value.trim();
      return v !== '' && !isNaN(parseFloat(v));
    });
  } else if (prob.usesSingleSlope) {
    const v = document.getElementById('known_m_orig')?.value.trim();
    allFilled = v !== '' && !isNaN(parseFloat(v));
  } else if (prob.usesMissingCoord) {
    allFilled = ['m_mc','x1_mc','y1_mc','partial_mc'].every(id => {
      const v = document.getElementById(`known_${id}`)?.value.trim();
      return v !== '' && !isNaN(parseFloat(v));
    });
  }
  document.getElementById('beginBtn').disabled = !allFilled;
}

/* ================================================================
   BEGIN SOLVING
================================================================ */
function beginSteps() {
  const prob = PROBLEMS[currentProbId];
  knownValues = {}; computedValues = {}; stepAttempts = {};

  if (prob.usesPoints || prob.isClassify) {
    ['x1','y1','x2','y2'].forEach(id => {
      knownValues[id] = parseFloat(document.getElementById(`known_${id}`).value);
    });
  } else if (prob.usesSlope) {
    knownValues.m = parseFloat(document.getElementById('known_m').value);
    knownValues.x = parseFloat(document.getElementById('known_x').value);
    knownValues.y = parseFloat(document.getElementById('known_y').value);
  } else if (prob.usesSingleSlope) {
    knownValues.m_orig = parseFloat(document.getElementById('known_m_orig').value);
  } else if (prob.usesMissingCoord) {
    knownValues.missing   = document.getElementById('known_missing').value;
    knownValues.m_mc      = parseFloat(document.getElementById('known_m_mc').value);
    knownValues.x1_mc     = parseFloat(document.getElementById('known_x1_mc').value);
    knownValues.y1_mc     = parseFloat(document.getElementById('known_y1_mc').value);
    knownValues.partial   = parseFloat(document.getElementById('known_partial_mc').value);
  }

  document.getElementById('stepKnown').classList.add('complete');
  document.getElementById('badgeKnown').textContent = '✓';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = true);
  document.getElementById('beginBtn').style.display = 'none';

  // Draw canvas with real values
  drawProblemCanvas(currentProbId);

  // Build dynamic missing coordinate steps
  if (currentProbId === 'find_missing_coord') {
    buildMissingCoordSteps();
    return;
  }

  renderSteps(prob);
}

/* ================================================================
   DYNAMIC MISSING COORDINATE STEPS
================================================================ */
function buildMissingCoordSteps() {
  const k = knownValues;
  const findingY = k.missing === 'y2';

  const dynSteps = findingY
    ? [
        { title: 'Substitute Into Slope Formula', type: 'expression',
          displayFn: () => `<span class="val">${k.m_mc}</span> = (y₂ − <span class="p1v">${k.y1_mc}</span>) ÷ (<span class="p2v">${k.partial}</span> − <span class="p1v">${k.x1_mc}</span>)`
        },
        { title: 'Calculate the Run (x₂ − x₁)', instruction: 'Subtract x₁ from the known x₂.',
          type: 'compute',
          rows: [{ exprFn: () => `<span class="p2v">${k.partial}</span> − <span class="p1v">${k.x1_mc}</span> =`,
            answerId: 'run', answerFn: () => round2(k.partial - k.x1_mc),
            hintFn: () => `Subtract ${k.partial} − ${k.x1_mc}.`
          }]
        },
        { title: 'Multiply Both Sides by the Run', instruction: 'Multiply slope × run to find the rise.',
          type: 'compute',
          rows: [{ exprFn: (k2, c) => `<span class="val">${k.m_mc}</span> × <span class="val">${c.run}</span> =`,
            answerId: 'rise', answerFn: (k2, c) => round2(k.m_mc * c.run),
            hintFn: (k2, c) => `Multiply ${k.m_mc} × ${c.run}.`
          }]
        },
        { title: 'Solve for y₂ (Add y₁ to the Rise)', instruction: 'Add the rise to y₁ to find y₂.',
          type: 'compute', isFinal: true,
          rows: [{ exprFn: (k2, c) => `<span class="val">${c.rise}</span> + <span class="p1v">${k.y1_mc}</span> =`,
            answerId: 'result', answerFn: (k2, c) => round2(c.rise + k.y1_mc),
            hintFn: (k2, c) => `Add ${c.rise} + ${k.y1_mc}.`
          }],
          missingLabel: `✓ Missing y₂`,
          missingCaption: (c) => `y₂ = ${c.result}. The second point is (${k.partial}, ${c.result}).`
        }
      ]
    : [
        { title: 'Substitute Into Slope Formula', type: 'expression',
          displayFn: () => `<span class="val">${k.m_mc}</span> = (<span class="p2v">${k.partial}</span> − <span class="p1v">${k.y1_mc}</span>) ÷ (x₂ − <span class="p1v">${k.x1_mc}</span>)`
        },
        { title: 'Calculate the Rise (y₂ − y₁)', instruction: 'Subtract y₁ from the known y₂.',
          type: 'compute',
          rows: [{ exprFn: () => `<span class="p2v">${k.partial}</span> − <span class="p1v">${k.y1_mc}</span> =`,
            answerId: 'rise', answerFn: () => round2(k.partial - k.y1_mc),
            hintFn: () => `Subtract ${k.partial} − ${k.y1_mc}.`
          }]
        },
        { title: 'Divide Rise by Slope to Get the Run', instruction: 'Divide the rise by m to find (x₂ − x₁).',
          type: 'compute',
          rows: [{ exprFn: (k2, c) => `<span class="val">${c.rise}</span> ÷ <span class="val">${k.m_mc}</span> =`,
            answerId: 'run', answerFn: (k2, c) => round2(c.rise / k.m_mc),
            hintFn: (k2, c) => `Divide ${c.rise} ÷ ${k.m_mc}.`
          }]
        },
        { title: 'Solve for x₂ (Add x₁ to the Run)', instruction: 'Add the run to x₁ to find x₂.',
          type: 'compute', isFinal: true,
          rows: [{ exprFn: (k2, c) => `<span class="val">${c.run}</span> + <span class="p1v">${k.x1_mc}</span> =`,
            answerId: 'result', answerFn: (k2, c) => round2(c.run + k.x1_mc),
            hintFn: (k2, c) => `Add ${c.run} + ${k.x1_mc}.`
          }],
          missingLabel: `✓ Missing x₂`,
          missingCaption: (c) => `x₂ = ${c.result}. The second point is (${c.result}, ${k.partial}).`
        }
      ];

  window._dynSteps = dynSteps;
  renderDynSteps(dynSteps);
}

/* ================================================================
   RENDER STEPS
================================================================ */
function renderSteps(prob) {
  window._dynSteps = null;
  renderDynSteps(prob.steps);
}

function renderDynSteps(steps) {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';
  steps.forEach((step, idx) => {
    const stepNum = idx + 2;
    const card = document.createElement('div');
    card.className = 'step-card' + (idx > 0 ? ' locked' : '');
    card.id = `dynStep_${idx}`;
    let bodyHTML = '';

    if (step.type === 'expression') {
      bodyHTML = `<div class="expr-display">${step.displayFn(knownValues)}</div>`;
    } else if (step.type === 'compute') {
      if (step.negNote) bodyHTML += `<div class="neg-note">⚠️ Watch out for negative numbers! Subtracting a negative is the same as adding. e.g. 3 − (−5) = 3 + 5 = 8</div>`;
      bodyHTML += step.rows.map((row, rIdx) => {
        const rowId = `row_${idx}_${rIdx}`;
        return `
          <div class="compute-row" id="${rowId}_wrap">
            <div class="compute-expr">${row.exprFn(knownValues, computedValues)}</div>
            <input class="answer-box" id="${rowId}_input" type="number" step="any" placeholder="?"
              onkeydown="if(event.key==='Enter') checkRow('${rowId}',${idx},${rIdx})" />
            <button class="check-btn" id="${rowId}_btn" onclick="checkRow('${rowId}',${idx},${rIdx})">Check</button>
          </div>`;
      }).join('');
      if (step.sqrtNote) bodyHTML += `<div class="sqrt-note">💡 <strong>Square root reminder:</strong> √ undoes squaring. Use a calculator and round to 2 decimal places.</div>`;
      bodyHTML += `<div class="feedback-box" id="fb_${idx}"></div>`;
    }

    card.innerHTML = `
      <div class="step-header">
        <div class="step-badge" id="badge_${idx}">${stepNum}</div>
        <div class="step-title">Step ${stepNum}: ${step.title}</div>
        <div class="step-instruction">${step.instruction || ''}</div>
      </div>
      <div class="step-body">${bodyHTML}</div>`;
    container.appendChild(card);
  });
  document.getElementById('dynStep_0').classList.remove('locked');
  if (steps[0] && steps[0].type === 'expression') setTimeout(() => unlockStep(1, steps), 350);
}

/* ================================================================
   UNLOCK STEP
================================================================ */
function unlockStep(idx, stepsRef) {
  const steps = stepsRef || window._dynSteps || PROBLEMS[currentProbId]?.steps;
  const card = document.getElementById(`dynStep_${idx}`);
  if (!card) return;
  card.classList.remove('locked');
  if (steps && steps[idx] && steps[idx].type === 'expression') {
    const exprEl = card.querySelector('.expr-display');
    if (exprEl) exprEl.innerHTML = steps[idx].displayFn(knownValues);
    setTimeout(() => unlockStep(idx + 1, steps), 400);
  }
}

/* ================================================================
   CHECK ROW
================================================================ */
function checkRow(rowId, stepIdx, rowIdx) {
  const steps = window._dynSteps || PROBLEMS[currentProbId]?.steps;
  if (!steps) return;
  const step = steps[stepIdx];
  const row  = step.rows[rowIdx];

  const input = document.getElementById(`${rowId}_input`);
  const btn   = document.getElementById(`${rowId}_btn`);
  const fb    = document.getElementById(`fb_${stepIdx}`);
  const badge = document.getElementById(`badge_${stepIdx}`);
  const card  = document.getElementById(`dynStep_${stepIdx}`);

  if (!input || input.value.trim() === '') { showFeedback(fb, 'hint', 'Please enter a number before checking.'); return; }

  const userAnswer = parseFloat(input.value);
  const correct    = row.answerFn(knownValues, computedValues);
  stepAttempts[rowId] = (stepAttempts[rowId] || 0) + 1;

  // Handle undefined slope
  const isUndef = !isFinite(correct) && !isFinite(userAnswer);

  if (isUndef || isClose(userAnswer, correct)) {
    input.classList.add('correct'); input.disabled = true; btn.disabled = true;
    computedValues[row.answerId] = isFinite(correct) ? round2(userAnswer) : Infinity;

    const allDone = step.rows.every((r, ri) => {
      const inp = document.getElementById(`row_${stepIdx}_${ri}_input`);
      return inp && inp.disabled;
    });

    if (allDone) {
      card.classList.add('complete'); badge.textContent = '✓';
      if (step.isFinal) {
        showFeedback(fb, 'success', `✓ Correct! Well done.`);
        showFinalAnswer(step);
      } else {
        showFeedback(fb, 'success', `✓ Correct! Move on to the next step.`);
        const nextIdx = stepIdx + 1;
        const nextStep = steps[nextIdx];
        if (nextStep && nextStep.type === 'compute') {
          nextStep.rows.forEach((nr, nri) => {
            const exprEl = document.querySelector(`#row_${nextIdx}_${nri}_wrap .compute-expr`);
            if (exprEl) exprEl.innerHTML = nr.exprFn(knownValues, computedValues);
          });
        }
        setTimeout(() => unlockStep(nextIdx, steps), 400);
      }
    } else {
      showFeedback(fb, 'success', `✓ Correct! Complete the remaining calculations.`);
    }
  } else {
    input.classList.add('incorrect'); card.classList.add('error');
    setTimeout(() => { input.classList.remove('incorrect'); card.classList.remove('error'); }, 600);
    const attempts = stepAttempts[rowId];
    let msg = '';
    if (attempts === 1)      msg = `Not quite — double-check your math and try again.`;
    else if (attempts === 2) msg = `Still not right. Hint: ${row.hintFn(knownValues, computedValues)}`;
    else                     msg = `The correct answer is <strong>${isFinite(correct) ? correct : 'undefined'}</strong>. ${row.hintFn(knownValues, computedValues)}`;
    showFeedback(fb, 'error', msg);
  }
}

/* ================================================================
   SHOW FINAL ANSWER — handles all special cases
================================================================ */
function showFinalAnswer(step) {
  const prob   = PROBLEMS[currentProbId];
  const finalCard = document.getElementById('finalCard');
  const label  = document.getElementById('finalLabel');
  const value  = document.getElementById('finalValue');
  const caption = document.getElementById('finalCaption');

  value.style.fontSize = '';
  value.style.color = '';

  // Midpoint → coordinate pair
  if (prob.isCoordPair) {
    label.textContent   = prob.finalLabel;
    value.textContent   = `(${computedValues.mx}, ${computedValues.my})`;
    caption.textContent = prob.finalCaption(computedValues);
  }
  // Slope-intercept → write full equation
  else if (prob.isEquation) {
    const m = knownValues.m;
    const b = computedValues.b;
    const bStr = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;
    label.textContent   = '✓ Equation of the Line';
    value.textContent   = `y = ${m}x ${bStr}`;
    value.style.fontSize = '1.5rem';
    caption.textContent = `Slope m = ${m}, y-intercept b = ${b}. The line crosses the y-axis at (0, ${b}).`;
  }
  // Parallel/Perpendicular → two values
  else if (prob.isParPerp) {
    label.textContent   = '✓ Slopes Found';
    value.textContent   = `∥ = ${computedValues.m_par}  ⊥ = ${computedValues.m_perp}`;
    value.style.fontSize = '1.4rem';
    caption.textContent = `Lines parallel to m=${knownValues.m_orig} also have slope ${computedValues.m_par}. Lines perpendicular have slope ${computedValues.m_perp}.`;
  }
  // Classify slope → verdict
  else if (step.isClassify) {
    const m = computedValues.m;
    let cls, clr;
    if (!isFinite(m)) { cls = 'Undefined Slope ↕'; clr = '#a78bfa'; }
    else if (m > 0)   { cls = 'Positive Slope ↗';  clr = '#34d399'; }
    else if (m < 0)   { cls = 'Negative Slope ↘';  clr = '#f87171'; }
    else               { cls = 'Zero Slope →';       clr = '#38bdf8'; }
    label.textContent   = '✓ Slope Classification';
    value.textContent   = `m = ${isFinite(m) ? m : 'undefined'} → ${cls}`;
    value.style.color   = clr;
    value.style.fontSize = '1.3rem';
    caption.textContent = prob.finalCaption(computedValues);
  }
  // Missing coordinate (dynamic)
  else if (step.missingLabel) {
    label.textContent   = step.missingLabel;
    value.textContent   = `${computedValues.result}`;
    caption.textContent = step.missingCaption(computedValues);
  }
  // Distance → units
  else if (prob === PROBLEMS.distance) {
    label.textContent   = prob.finalLabel;
    value.textContent   = `${computedValues.d} units`;
    caption.textContent = prob.finalCaption(computedValues);
  }
  // Slope → with interpretation chip
  else if (currentProbId === 'slope') {
    const m = computedValues.m;
    label.textContent   = prob.finalLabel;
    value.textContent   = isFinite(m) ? `m = ${m}` : 'm = undefined';
    caption.textContent = prob.finalCaption(computedValues);
  }
  // Generic
  else {
    label.textContent   = prob.finalLabel;
    const lastKey = Object.keys(computedValues).pop();
    value.textContent   = `${computedValues[lastKey]}°`;
    caption.textContent = '';
  }

  finalCard.classList.add('visible');
  setTimeout(() => finalCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function showFeedback(el, type, msg) { el.className = `feedback-box visible ${type}`; el.innerHTML = msg; }

function resetWorkspace() {
  knownValues = {}; computedValues = {}; stepAttempts = {};
  window._dynSteps = null;
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('workspace').classList.remove('visible');
  refreshCanvas();
}

buildProblemGrid();
refreshCanvas();
</script>
</body>
