<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perimeter & Circumference | Math Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d1117;
      --surface:    #161d2e;
      --surface2:   #1e2840;
      --surface3:   #243050;
      --border:     #2a3a58;
      --border2:    #34466e;
      --accent:     #14b8a6;
      --accent-dim: #0d9488;
      --accent2:    #38bdf8;
      --text:       #e2e8f0;
      --text-muted: #8a9bbf;
      --text-dim:   #5a6a8a;
      --success:    #22c55e;
      --success-bg: #14532d;
      --error:      #f87171;
      --error-bg:   #7f1d1d;
      --warning:    #fbbf24;
      --warning-bg: #78350f;
      --formula-bg: #0a1628;
      --mono:       'JetBrains Mono', monospace;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* ── HEADER ─────────────────────────── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 56px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--text-dim); }
    .breadcrumb .current { color: var(--text); font-weight: 500; }

    /* ── MAIN LAYOUT ─────────────────────── */
    .page-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .module-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .module-title span { color: var(--accent); }
    .module-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 2rem;
    }

    /* ── SHAPE SELECTOR ──────────────────── */
    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .shape-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .shape-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 0.75rem;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .shape-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface2);
      transform: translateY(-1px);
    }
    .shape-btn.active {
      border-color: var(--accent);
      background: rgba(20, 184, 166, 0.08);
      color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .shape-btn .shape-icon {
      font-size: 1.6rem;
      line-height: 1;
    }
    .shape-btn .shape-name {
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.2;
    }
    .shape-btn .shape-formula {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1;
    }
    .shape-btn.active .shape-formula { color: var(--accent-dim); }

    /* ── CIRCLE SUB-SELECTOR ─────────────── */
    .circle-sub {
      display: none;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .circle-sub.visible { display: flex; }
    .sub-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: all 0.15s;
      text-align: center;
    }
    .sub-btn:hover { border-color: var(--accent); color: var(--text); }
    .sub-btn.active {
      border-color: var(--accent);
      background: rgba(20, 184, 166, 0.1);
      color: var(--accent);
    }

    /* ── PROBLEM WORKSPACE ───────────────── */
    #workspace { display: none; }
    #workspace.visible { display: block; }

    /* Formula Card */
    .formula-card {
      background: var(--formula-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      animation: slideDown 0.3s ease;
    }
    .formula-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    .formula-text {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .formula-text .var { color: var(--accent2); }
    .formula-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      line-height: 1.5;
    }
    .formula-key {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.8;
      font-family: var(--mono);
    }
    .formula-key .kv { color: var(--accent2); }

    /* Steps */
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1rem;
      overflow: hidden;
      animation: slideDown 0.25s ease;
      transition: border-color 0.2s;
    }
    .step-card.locked {
      opacity: 0.4;
      pointer-events: none;
    }
    .step-card.complete { border-color: var(--success); }
    .step-card.error    { border-color: var(--error); }

    .step-header {
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .step-badge {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--surface3);
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .step-card.complete .step-badge {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .step-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }
    .step-instruction {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .step-body { padding: 1.25rem; }

    /* Known value inputs */
    .known-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .field-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .field-label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .field-label .var-name {
      font-family: var(--mono);
      color: var(--accent2);
      font-size: 0.82rem;
    }
    .field-hint {
      font-size: 0.71rem;
      color: var(--text-dim);
    }
    .known-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0.55rem 0.85rem;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text);
      width: 100%;
      transition: border-color 0.15s;
      outline: none;
    }
    .known-input:focus { border-color: var(--accent); }
    .known-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .begin-btn {
      background: var(--accent);
      color: #0a1628;
      border: none;
      border-radius: 7px;
      padding: 0.6rem 1.5rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 0.5rem;
    }
    .begin-btn:hover { background: #0d9488; transform: translateY(-1px); }
    .begin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Expression display row */
    .expr-display {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--text);
      background: var(--formula-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0.75rem 1rem;
      letter-spacing: 0.04em;
    }
    .expr-display .val { color: var(--accent2); }
    .expr-display .op  { color: var(--text-muted); }

    /* Compute rows */
    .compute-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .compute-row:last-child { margin-bottom: 0; }
    .compute-expr {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text);
      min-width: 0;
      flex: 1;
    }
    .compute-expr .val { color: var(--accent2); }
    .answer-box {
      background: var(--surface2);
      border: 2px solid var(--border2);
      border-radius: 7px;
      padding: 0.45rem 0.75rem;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text);
      width: 110px;
      outline: none;
      transition: border-color 0.15s;
      text-align: center;
    }
    .answer-box:focus { border-color: var(--accent); }
    .answer-box.correct { border-color: var(--success); background: rgba(34,197,94,0.08); color: var(--success); }
    .answer-box.incorrect { border-color: var(--error); background: rgba(248,113,113,0.08); }
    .check-btn {
      background: var(--surface3);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .check-btn:hover { border-color: var(--accent); color: var(--accent); }
    .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Feedback */
    .feedback-box {
      border-radius: 7px;
      padding: 0.65rem 1rem;
      font-size: 0.83rem;
      line-height: 1.5;
      margin-top: 0.75rem;
      display: none;
    }
    .feedback-box.visible { display: block; }
    .feedback-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .feedback-box.error   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
    .feedback-box.hint    { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: #fde68a; }

    /* Final Answer */
    .final-answer-card {
      background: linear-gradient(135deg, rgba(20,184,166,0.12), rgba(56,189,248,0.08));
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      display: none;
      animation: celebrate 0.4s ease;
    }
    .final-answer-card.visible { display: block; }
    .final-answer-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.5rem; }
    .final-answer-value { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: var(--text); }
    .final-answer-caption { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; }
    .try-again-btn {
      margin-top: 1.25rem;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 7px;
      padding: 0.5rem 1.25rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .try-again-btn:hover { border-color: var(--accent); color: var(--accent); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes celebrate {
      0%   { transform: scale(0.95); opacity: 0; }
      60%  { transform: scale(1.02); }
      100% { transform: scale(1);    opacity: 1; }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.75rem 0;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .formula-card { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .formula-key { margin-left: 0; }
      .shape-grid { grid-template-columns: repeat(2, 1fr); }
      .compute-row { flex-direction: column; align-items: flex-start; }
      .answer-box { width: 100%; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="page-header">
  <nav class="breadcrumb">
    <a href="/">Home</a>
    <span class="sep">›</span>
    <a href="/math-toolkit">Math Toolkit</a>
    <span class="sep">›</span>
    <span class="current">Perimeter &amp; Circumference</span>
  </nav>
</header>

<!-- BODY -->
<main class="page-body">

  <h1 class="module-title">Perimeter <span>&amp;</span> Circumference</h1>
  <p class="module-subtitle">Select a shape, enter your known values, then work through each step to find the answer.</p>

  <!-- SHAPE SELECTOR -->
  <div class="section-label">Choose a Shape</div>
  <div class="shape-grid" id="shapeGrid">
    <!-- filled by JS -->
  </div>

  <!-- CIRCLE SUB-SELECTOR -->
  <div class="circle-sub" id="circleSub">
    <button class="sub-btn active" data-circle="radius">I know the <strong>Radius</strong> &nbsp;(C = 2πr)</button>
    <button class="sub-btn" data-circle="diameter">I know the <strong>Diameter</strong> &nbsp;(C = πd)</button>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace">
    <div class="divider"></div>

    <!-- Formula Card -->
    <div class="formula-card" id="formulaCard">
      <div>
        <div class="formula-label">Formula</div>
        <div class="formula-text" id="formulaText"></div>
        <div class="formula-desc" id="formulaDesc"></div>
      </div>
      <div class="formula-key" id="formulaKey"></div>
    </div>

    <!-- Step 1: Known Values -->
    <div class="step-card" id="stepKnown">
      <div class="step-header">
        <div class="step-badge" id="badgeKnown">1</div>
        <div class="step-title">Identify Your Known Values</div>
        <div class="step-instruction">Enter the measurements from your problem.</div>
      </div>
      <div class="step-body">
        <div class="known-grid" id="knownGrid"></div>
        <button class="begin-btn" id="beginBtn" onclick="beginSteps()">Begin Solving →</button>
      </div>
    </div>

    <!-- Dynamic Steps Container -->
    <div id="stepsContainer"></div>

    <!-- Final Answer -->
    <div class="final-answer-card" id="finalCard">
      <div class="final-answer-label">✓ Perimeter / Circumference</div>
      <div class="final-answer-value" id="finalValue"></div>
      <div class="final-answer-caption" id="finalCaption"></div>
      <br>
      <button class="try-again-btn" onclick="resetWorkspace()">↺ Try Another Problem</button>
    </div>
  </div>

</main>

<script>
/* ================================================================
   DATA: Shape Definitions
   Each shape has:
     name, icon, formulaText (HTML), formulaDesc, formulaKey (HTML),
     knownFields: [{id, label, hint, varName}],
     steps: [{title, instruction, type, ...}]
   Step types:
     'expression' — auto display only
     'compute'    — user must enter and check answers
================================================================ */

const SHAPES = {

  square: {
    name: 'Square',
    icon: '⬜',
    formulaText: 'P = 4<span class="var">s</span>',
    formulaDesc: 'All four sides of a square are equal.',
    formulaKey: '<span class="kv">s</span> = side length',
    knownFields: [
      { id: 's', label: 'Side length', varName: 's', hint: 'All sides are equal.' }
    ],
    steps: [
      {
        title: 'Substitute Your Value',
        instruction: 'Replace the variable with your known value.',
        type: 'expression',
        displayFn: (k) => `P = 4 × <span class="val">${k.s}</span>`
      },
      {
        title: 'Multiply',
        instruction: 'Calculate 4 times the side length.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `4 × <span class="val">${k.s}</span> =`,
            answerId: 'P',
            answerFn: (k) => round2(4 * k.s),
            hintFn:   (k) => `Multiply 4 × ${k.s}. Think: 4 groups of ${k.s}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  rectangle: {
    name: 'Rectangle',
    icon: '▭',
    formulaText: 'P = 2<span class="var">l</span> + 2<span class="var">w</span>',
    formulaDesc: 'Add twice the length and twice the width.',
    formulaKey: '<span class="kv">l</span> = length<br><span class="kv">w</span> = width',
    knownFields: [
      { id: 'l', label: 'Length', varName: 'l', hint: 'The longer side.' },
      { id: 'w', label: 'Width',  varName: 'w', hint: 'The shorter side.' }
    ],
    steps: [
      {
        title: 'Substitute Your Values',
        instruction: 'Replace the variables with your known values.',
        type: 'expression',
        displayFn: (k) => `P = 2(<span class="val">${k.l}</span>) + 2(<span class="val">${k.w}</span>)`
      },
      {
        title: 'Multiply Each Term',
        instruction: 'Calculate 2 × length and 2 × width separately.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `2 × <span class="val">${k.l}</span> =`,
            answerId: '2l',
            answerFn: (k) => round2(2 * k.l),
            hintFn:   (k) => `Multiply 2 × ${k.l}.`
          },
          {
            exprFn:   (k) => `2 × <span class="val">${k.w}</span> =`,
            answerId: '2w',
            answerFn: (k) => round2(2 * k.w),
            hintFn:   (k) => `Multiply 2 × ${k.w}.`
          }
        ]
      },
      {
        title: 'Add the Products',
        instruction: 'Add your two results together to find P.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k, c) => `<span class="val">${c['2l']}</span> + <span class="val">${c['2w']}</span> =`,
            answerId: 'P',
            answerFn: (k, c) => round2(c['2l'] + c['2w']),
            hintFn:   (k, c) => `Add ${c['2l']} + ${c['2w']}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  triangle: {
    name: 'Triangle',
    icon: '△',
    formulaText: 'P = <span class="var">a</span> + <span class="var">b</span> + <span class="var">c</span>',
    formulaDesc: 'Add all three side lengths together.',
    formulaKey: '<span class="kv">a</span> = side a<br><span class="kv">b</span> = side b<br><span class="kv">c</span> = side c',
    knownFields: [
      { id: 'a', label: 'Side a', varName: 'a', hint: '' },
      { id: 'b', label: 'Side b', varName: 'b', hint: '' },
      { id: 'c', label: 'Side c', varName: 'c', hint: '' }
    ],
    steps: [
      {
        title: 'Substitute Your Values',
        instruction: 'Replace the variables with your known values.',
        type: 'expression',
        displayFn: (k) => `P = <span class="val">${k.a}</span> + <span class="val">${k.b}</span> + <span class="val">${k.c}</span>`
      },
      {
        title: 'Add All Three Sides',
        instruction: 'Add all three side lengths to find P.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `<span class="val">${k.a}</span> + <span class="val">${k.b}</span> + <span class="val">${k.c}</span> =`,
            answerId: 'P',
            answerFn: (k) => round2(k.a + k.b + k.c),
            hintFn:   (k) => `Add ${k.a} + ${k.b} + ${k.c}. You can add two numbers first, then add the third.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  equilateral: {
    name: 'Equilateral Triangle',
    icon: '▲',
    formulaText: 'P = 3<span class="var">s</span>',
    formulaDesc: 'All three sides of an equilateral triangle are equal.',
    formulaKey: '<span class="kv">s</span> = side length',
    knownFields: [
      { id: 's', label: 'Side length', varName: 's', hint: 'All 3 sides are equal.' }
    ],
    steps: [
      {
        title: 'Substitute Your Value',
        instruction: 'Replace the variable with your known value.',
        type: 'expression',
        displayFn: (k) => `P = 3 × <span class="val">${k.s}</span>`
      },
      {
        title: 'Multiply',
        instruction: 'Calculate 3 times the side length.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `3 × <span class="val">${k.s}</span> =`,
            answerId: 'P',
            answerFn: (k) => round2(3 * k.s),
            hintFn:   (k) => `Multiply 3 × ${k.s}. Think: 3 groups of ${k.s}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  parallelogram: {
    name: 'Parallelogram',
    icon: '▱',
    formulaText: 'P = 2<span class="var">a</span> + 2<span class="var">b</span>',
    formulaDesc: 'Opposite sides of a parallelogram are equal.',
    formulaKey: '<span class="kv">a</span> = base length<br><span class="kv">b</span> = side length',
    knownFields: [
      { id: 'a', label: 'Base length', varName: 'a', hint: 'Top and bottom sides.' },
      { id: 'b', label: 'Side length', varName: 'b', hint: 'Left and right sides.' }
    ],
    steps: [
      {
        title: 'Substitute Your Values',
        instruction: 'Replace the variables with your known values.',
        type: 'expression',
        displayFn: (k) => `P = 2(<span class="val">${k.a}</span>) + 2(<span class="val">${k.b}</span>)`
      },
      {
        title: 'Multiply Each Term',
        instruction: 'Calculate 2 × a and 2 × b separately.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `2 × <span class="val">${k.a}</span> =`,
            answerId: '2a',
            answerFn: (k) => round2(2 * k.a),
            hintFn:   (k) => `Multiply 2 × ${k.a}.`
          },
          {
            exprFn:   (k) => `2 × <span class="val">${k.b}</span> =`,
            answerId: '2b',
            answerFn: (k) => round2(2 * k.b),
            hintFn:   (k) => `Multiply 2 × ${k.b}.`
          }
        ]
      },
      {
        title: 'Add the Products',
        instruction: 'Add your two results together to find P.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k, c) => `<span class="val">${c['2a']}</span> + <span class="val">${c['2b']}</span> =`,
            answerId: 'P',
            answerFn: (k, c) => round2(c['2a'] + c['2b']),
            hintFn:   (k, c) => `Add ${c['2a']} + ${c['2b']}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  trapezoid: {
    name: 'Trapezoid',
    icon: '⏢',
    formulaText: 'P = <span class="var">a</span> + <span class="var">b</span> + <span class="var">c</span> + <span class="var">d</span>',
    formulaDesc: 'Add all four side lengths together.',
    formulaKey: '<span class="kv">a</span> = top base<br><span class="kv">b</span> = bottom base<br><span class="kv">c</span> = left leg<br><span class="kv">d</span> = right leg',
    knownFields: [
      { id: 'a', label: 'Top base (a)',    varName: 'a', hint: 'Shorter parallel side.' },
      { id: 'b', label: 'Bottom base (b)', varName: 'b', hint: 'Longer parallel side.' },
      { id: 'c', label: 'Left leg (c)',    varName: 'c', hint: 'Non-parallel side.' },
      { id: 'd', label: 'Right leg (d)',   varName: 'd', hint: 'Non-parallel side.' }
    ],
    steps: [
      {
        title: 'Substitute Your Values',
        instruction: 'Replace the variables with your known values.',
        type: 'expression',
        displayFn: (k) => `P = <span class="val">${k.a}</span> + <span class="val">${k.b}</span> + <span class="val">${k.c}</span> + <span class="val">${k.d}</span>`
      },
      {
        title: 'Add All Four Sides',
        instruction: 'Add all four side lengths to find P.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `<span class="val">${k.a}</span> + <span class="val">${k.b}</span> + <span class="val">${k.c}</span> + <span class="val">${k.d}</span> =`,
            answerId: 'P',
            answerFn: (k) => round2(k.a + k.b + k.c + k.d),
            hintFn:   (k) => `Add ${k.a} + ${k.b} first, then + ${k.c}, then + ${k.d}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Perimeter'
      }
    ]
  },

  'circle-radius': {
    name: 'Circle (Radius)',
    icon: '⭕',
    formulaText: 'C = 2π<span class="var">r</span>',
    formulaDesc: 'The circumference is 2 times pi times the radius. Use π = 3.14.',
    formulaKey: '<span class="kv">r</span> = radius<br>π ≈ 3.14',
    knownFields: [
      { id: 'r', label: 'Radius', varName: 'r', hint: 'Distance from center to edge.' }
    ],
    steps: [
      {
        title: 'Substitute Your Value',
        instruction: 'Replace the variable with your known value.',
        type: 'expression',
        displayFn: (k) => `C = 2 × 3.14 × <span class="val">${k.r}</span>`
      },
      {
        title: 'Multiply 2 × π First',
        instruction: 'Start by multiplying 2 times pi (3.14).',
        type: 'compute',
        rows: [
          {
            exprFn:   () => `2 × 3.14 =`,
            answerId: '2pi',
            answerFn: () => 6.28,
            hintFn:   () => `Multiply 2 × 3.14. This will always equal 6.28.`
          }
        ]
      },
      {
        title: 'Multiply by the Radius',
        instruction: 'Now multiply 6.28 by your radius.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k, c) => `<span class="val">${c['2pi']}</span> × <span class="val">${k.r}</span> =`,
            answerId: 'C',
            answerFn: (k) => round2(6.28 * k.r),
            hintFn:   (k) => `Multiply 6.28 × ${k.r}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Circumference'
      }
    ]
  },

  'circle-diameter': {
    name: 'Circle (Diameter)',
    icon: '⭕',
    formulaText: 'C = π<span class="var">d</span>',
    formulaDesc: 'The circumference is pi times the diameter. Use π = 3.14.',
    formulaKey: '<span class="kv">d</span> = diameter<br>π ≈ 3.14',
    knownFields: [
      { id: 'd', label: 'Diameter', varName: 'd', hint: 'Distance all the way across the center.' }
    ],
    steps: [
      {
        title: 'Substitute Your Value',
        instruction: 'Replace the variable with your known value.',
        type: 'expression',
        displayFn: (k) => `C = 3.14 × <span class="val">${k.d}</span>`
      },
      {
        title: 'Multiply',
        instruction: 'Multiply pi (3.14) by the diameter.',
        type: 'compute',
        rows: [
          {
            exprFn:   (k) => `3.14 × <span class="val">${k.d}</span> =`,
            answerId: 'C',
            answerFn: (k) => round2(3.14 * k.d),
            hintFn:   (k) => `Multiply 3.14 × ${k.d}.`
          }
        ],
        isFinal: true,
        finalLabel: 'Circumference'
      }
    ]
  }
};

/* ================================================================
   STATE
================================================================ */
let currentShapeId  = null;
let circleMode      = 'radius';
let knownValues     = {};      // { s: 5, l: 8, w: 3, ... }
let computedValues  = {};      // { '2l': 16, '2w': 6, ... }
let stepAttempts    = {};      // { 'rowId': count }
let activeStepIndex = 0;
let stepsRendered   = false;

/* ================================================================
   HELPERS
================================================================ */
function round2(n) { return Math.round(n * 100) / 100; }

function isClose(a, b) {
  const tol = Math.max(0.05, Math.abs(b) * 0.01);
  return Math.abs(a - b) <= tol;
}

function getShape() {
  if (!currentShapeId) return null;
  if (currentShapeId === 'circle') return SHAPES[`circle-${circleMode}`];
  return SHAPES[currentShapeId];
}

/* ================================================================
   BUILD SHAPE GRID
================================================================ */
function buildShapeGrid() {
  const grid = document.getElementById('shapeGrid');
  const shapeList = [
    'square', 'rectangle', 'triangle', 'equilateral', 'parallelogram', 'trapezoid', 'circle'
  ];

  const labels = {
    square: 'Square', rectangle: 'Rectangle', triangle: 'Triangle',
    equilateral: 'Equilateral Triangle', parallelogram: 'Parallelogram',
    trapezoid: 'Trapezoid', circle: 'Circle'
  };
  const formulas = {
    square: 'P = 4s', rectangle: 'P = 2l + 2w', triangle: 'P = a + b + c',
    equilateral: 'P = 3s', parallelogram: 'P = 2a + 2b',
    trapezoid: 'P = a+b+c+d', circle: 'C = 2πr or πd'
  };
  const icons = {
    square: '⬜', rectangle: '▭', triangle: '△',
    equilateral: '▲', parallelogram: '▱', trapezoid: '⏢', circle: '⭕'
  };

  shapeList.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'shape-btn';
    btn.dataset.shape = id;
    btn.innerHTML = `
      <span class="shape-icon">${icons[id]}</span>
      <span class="shape-name">${labels[id]}</span>
      <span class="shape-formula">${formulas[id]}</span>
    `;
    btn.addEventListener('click', () => selectShape(id));
    grid.appendChild(btn);
  });
}

/* ================================================================
   SELECT SHAPE
================================================================ */
function selectShape(id) {
  currentShapeId = id;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.shape-btn[data-shape="${id}"]`).classList.add('active');

  document.getElementById('circleSub').classList.toggle('visible', id === 'circle');
  resetWorkspace();
  renderWorkspace();
}

document.querySelectorAll('#circleSub .sub-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#circleSub .sub-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    circleMode = btn.dataset.circle;
    resetWorkspace();
    renderWorkspace();
  });
});

/* ================================================================
   RENDER WORKSPACE
================================================================ */
function renderWorkspace() {
  const shape = getShape();
  if (!shape) return;

  document.getElementById('workspace').classList.add('visible');

  // Formula card
  document.getElementById('formulaText').innerHTML = shape.formulaText;
  document.getElementById('formulaDesc').textContent = shape.formulaDesc;
  document.getElementById('formulaKey').innerHTML = shape.formulaKey;

  // Known fields
  const grid = document.getElementById('knownGrid');
  grid.innerHTML = '';
  shape.knownFields.forEach(field => {
    const div = document.createElement('div');
    div.className = 'field-group';
    div.innerHTML = `
      <label class="field-label">
        ${field.label} &nbsp;<span class="var-name">(${field.varName})</span>
      </label>
      ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
      <input
        class="known-input"
        id="known_${field.id}"
        type="number"
        step="any"
        min="0"
        placeholder="Enter value..."
        oninput="checkBeginReady()"
      />
    `;
    grid.appendChild(div);
  });

  // Reset step state
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('stepKnown').querySelector('.step-badge').textContent = '1';
  document.getElementById('stepKnown').classList.remove('complete');
  document.getElementById('beginBtn').disabled = false;

  stepsRendered = false;
}

function checkBeginReady() {
  const shape = getShape();
  if (!shape) return;
  const allFilled = shape.knownFields.every(f => {
    const val = document.getElementById(`known_${f.id}`)?.value.trim();
    return val !== '' && !isNaN(parseFloat(val));
  });
  document.getElementById('beginBtn').disabled = !allFilled;
}

/* ================================================================
   BEGIN SOLVING
================================================================ */
function beginSteps() {
  const shape = getShape();
  if (!shape) return;

  // Gather known values
  knownValues = {};
  shape.knownFields.forEach(f => {
    knownValues[f.id] = parseFloat(document.getElementById(`known_${f.id}`).value);
  });
  computedValues = {};
  stepAttempts = {};

  // Lock known step
  document.getElementById('stepKnown').classList.add('complete');
  document.getElementById('badgeKnown').textContent = '✓';
  document.querySelectorAll('.known-input').forEach(el => el.disabled = true);
  document.getElementById('beginBtn').style.display = 'none';

  // Render steps
  renderSteps(shape);
}

/* ================================================================
   RENDER STEPS
================================================================ */
function renderSteps(shape) {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '';

  shape.steps.forEach((step, idx) => {
    const stepNum = idx + 2; // Step 1 is always known values
    const card = document.createElement('div');
    card.className = 'step-card' + (idx > 0 ? ' locked' : '');
    card.id = `dynStep_${idx}`;

    let bodyHTML = '';

    if (step.type === 'expression') {
      bodyHTML = `<div class="expr-display">${step.displayFn(knownValues)}</div>`;
    } else if (step.type === 'compute') {
      bodyHTML = step.rows.map((row, rIdx) => {
        const rowId = `row_${idx}_${rIdx}`;
        return `
          <div class="compute-row" id="${rowId}_wrap">
            <div class="compute-expr">${row.exprFn(knownValues, computedValues)}</div>
            <input
              class="answer-box"
              id="${rowId}_input"
              type="number"
              step="any"
              placeholder="?"
              onkeydown="if(event.key==='Enter') checkRow('${rowId}', ${idx}, ${rIdx})"
            />
            <button class="check-btn" id="${rowId}_btn" onclick="checkRow('${rowId}', ${idx}, ${rIdx})">Check</button>
          </div>
        `;
      }).join('');
      bodyHTML += `<div class="feedback-box" id="fb_${idx}"></div>`;
    }

    card.innerHTML = `
      <div class="step-header">
        <div class="step-badge" id="badge_${idx}">${stepNum}</div>
        <div class="step-title">Step ${stepNum}: ${step.title}</div>
        <div class="step-instruction">${step.instruction}</div>
      </div>
      <div class="step-body">${bodyHTML}</div>
    `;
    container.appendChild(card);

    // Auto-advance expression steps
    if (step.type === 'expression' && idx === 0) {
      // already unlocked, auto-unlock next
      setTimeout(() => unlockStep(1), 300);
    }
  });

  // Unlock first step
  document.getElementById('dynStep_0').classList.remove('locked');
}

/* ================================================================
   UNLOCK STEP
================================================================ */
function unlockStep(idx) {
  const card = document.getElementById(`dynStep_${idx}`);
  if (!card) return;
  card.classList.remove('locked');

  // If expression, auto-unlock the next
  const shape = getShape();
  if (shape && shape.steps[idx] && shape.steps[idx].type === 'expression') {
    const exprEl = card.querySelector('.expr-display');
    if (exprEl) exprEl.innerHTML = shape.steps[idx].displayFn(knownValues);
    setTimeout(() => unlockStep(idx + 1), 400);
  }
}

/* ================================================================
   CHECK ROW ANSWER
================================================================ */
function checkRow(rowId, stepIdx, rowIdx) {
  const shape = getShape();
  const step = shape.steps[stepIdx];
  const row  = step.rows[rowIdx];

  const input = document.getElementById(`${rowId}_input`);
  const btn   = document.getElementById(`${rowId}_btn`);
  const fb    = document.getElementById(`fb_${stepIdx}`);
  const badge = document.getElementById(`badge_${stepIdx}`);
  const card  = document.getElementById(`dynStep_${stepIdx}`);

  if (!input || input.value.trim() === '') {
    showFeedback(fb, 'hint', 'Please enter a number before checking.');
    return;
  }

  const userAnswer = parseFloat(input.value);
  const correct    = row.answerFn(knownValues, computedValues);

  const attemptKey = rowId;
  stepAttempts[attemptKey] = (stepAttempts[attemptKey] || 0) + 1;

  if (isClose(userAnswer, correct)) {
    // Correct!
    input.classList.add('correct');
    input.disabled = true;
    btn.disabled = true;
    computedValues[row.answerId] = round2(userAnswer);

    // Check if all rows in this step are complete
    const allDone = step.rows.every((r, ri) => {
      const inp = document.getElementById(`row_${stepIdx}_${ri}_input`);
      return inp && inp.disabled;
    });

    if (allDone) {
      card.classList.add('complete');
      badge.textContent = '✓';

      if (step.isFinal) {
        showFeedback(fb, 'success', `✓ That's correct! Great work working through the problem step by step.`);
        showFinalAnswer(step.finalLabel, computedValues[row.answerId]);
      } else {
        showFeedback(fb, 'success', `✓ Correct! Move on to the next step.`);
        // Refresh next compute step expressions (they may depend on computed values)
        const nextIdx = stepIdx + 1;
        const nextStep = shape.steps[nextIdx];
        if (nextStep && nextStep.type === 'compute') {
          nextStep.rows.forEach((nr, nri) => {
            const exprEl = document.querySelector(`#row_${nextIdx}_${nri}_wrap .compute-expr`);
            if (exprEl) exprEl.innerHTML = nr.exprFn(knownValues, computedValues);
          });
        }
        setTimeout(() => unlockStep(nextIdx), 400);
      }
    } else {
      showFeedback(fb, 'success', `✓ Correct! Now complete the next calculation.`);
    }
  } else {
    // Wrong
    input.classList.add('incorrect');
    card.classList.add('error');
    setTimeout(() => { input.classList.remove('incorrect'); card.classList.remove('error'); }, 600);

    const attempts = stepAttempts[attemptKey];
    let msg = '';
    if (attempts === 1) {
      msg = `Not quite. Try again — double-check your math.`;
    } else if (attempts === 2) {
      msg = `Still not right. ${row.hintFn(knownValues, computedValues)}`;
    } else {
      msg = `Hint: The correct answer is <strong>${correct}</strong>. ${row.hintFn(knownValues, computedValues)}`;
    }
    showFeedback(fb, 'error', msg);
  }
}

function showFeedback(el, type, msg) {
  el.className = `feedback-box visible ${type}`;
  el.innerHTML = msg;
}

/* ================================================================
   FINAL ANSWER
================================================================ */
function showFinalAnswer(label, value) {
  const card = document.getElementById('finalCard');
  document.getElementById('finalCard').querySelector('.final-answer-label').textContent = `✓ ${label}`;
  document.getElementById('finalValue').textContent = value + ' units';
  document.getElementById('finalCaption').textContent = `You successfully solved the problem step by step!`;
  card.classList.add('visible');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ================================================================
   RESET
================================================================ */
function resetWorkspace() {
  knownValues = {};
  computedValues = {};
  stepAttempts = {};
  document.getElementById('stepsContainer').innerHTML = '';
  document.getElementById('finalCard').classList.remove('visible');
  document.getElementById('workspace').classList.remove('visible');
}

/* ================================================================
   INIT
================================================================ */
buildShapeGrid();
</script>
