<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Module Viewer</title>
  <style>
    :root{ --ink:#0b1021; --muted:#5b6477; --accent:#0b5fff; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:#0b1021;}
    header{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.75rem 1rem; background:rgba(255,255,255,.85); border-bottom:1px solid #e5e7eb; backdrop-filter:saturate(1.2) blur(6px)}
    header .title{margin:0; font-size:16px}
    header a{color:var(--accent); text-decoration:none}
    main{position:relative; height:calc(100% - 52px)}
    .stage{position:absolute; inset:0; display:flex}
    iframe{width:100%; height:100%; border:0; background:#fff; box-shadow: 0 10px 30px rgba(0,0,0,.25);}
    .bg, .bg-next{position:absolute; inset:0; background-size:cover; background-position:center; opacity:.15; transition: opacity 1.25s ease-in-out;}
    .bg-next{opacity:0}
    .vignette{position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, rgba(255,255,255,0) 40%, rgba(0,0,0,.35) 100%)}
    .overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.1)); pointer-events:none}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;">
      <a href="javascript:history.back()">← Back</a>
      <h1 class="title" id="title">Module</h1>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center;">
      <a id="openRaw" class="btn" href="#" target="_blank" rel="noopener" style="padding:.4rem .7rem; border:1px solid #e5e7eb; border-radius:8px; background:#fff;">Open raw</a>
    </div>
  </header>
  <main>
    <div class="stage">
      <div class="bg" id="bg"></div>
      <div class="bg-next" id="bgNext"></div>
      <div class="vignette"></div>
      <div class="overlay"></div>
      <iframe id="frame" src="about:blank" title="Module"></iframe>
    </div>
  </main>
  <script>
    (function(){
      function q(name){ const u=new URL(location.href); return u.searchParams.get(name) || ''; }
      const moduleUrl = q('p');
      const titleEl = document.getElementById('title');
      const frame = document.getElementById('frame');
      const openRaw = document.getElementById('openRaw');
      const bg = document.getElementById('bg');
      const bgNext = document.getElementById('bgNext');

      if (!moduleUrl) {
        titleEl.textContent = 'No module specified';
        document.body.style.background = '#fff';
        return;
      }

      // Set iframe and link
      frame.src = moduleUrl;
      openRaw.href = moduleUrl;

      // Derive base for assets
      let base;
      try { base = new URL(moduleUrl, location.origin).toString(); } catch { base = moduleUrl; }
      function join(p){ try { return new URL(p, base).toString(); } catch { return p; }
      }
      function dirname(url){ try { const u=new URL(url); u.pathname = u.pathname.replace(/[^/]+$/, ''); return u.toString(); } catch { return url.replace(/[^/]+$/, ''); }
      }
      const modBase = dirname(base);

      // Fetch card.json for metadata and images
      async function fetchCard(){
        try {
          const res = await fetch(join('card.json'), { cache: 'no-store' });
          if (!res.ok) return null;
          return await res.json();
        } catch { return null; }
      }

      function rotateBackground(urls){
        if (!urls || !urls.length) return;
        const imgs = urls.slice(0,12).map(u => join(u));
        let i = 0;
        function setBG(el, src){ el.style.backgroundImage = `url('${src}')`; }
        setBG(bg, imgs[0]);
        if (imgs.length === 1) return; // no rotation needed
        i = 1;
        setInterval(() => {
          setBG(bgNext, imgs[i]);
          // fade
          bgNext.style.opacity = '0.15';
          bg.style.opacity = '0';
          setTimeout(() => {
            // swap roles
            const tmp = bg.style.backgroundImage;
            bg.style.backgroundImage = bgNext.style.backgroundImage;
            bg.style.opacity = '0.15';
            bgNext.style.backgroundImage = tmp;
            bgNext.style.opacity = '0';
          }, 1300);
          i = (i + 1) % imgs.length;
        }, 6000);
      }

      (async function init(){
        const card = await fetchCard();
        if (card) {
          const t = card.title || 'Module';
          titleEl.textContent = t;
          document.title = t + ' • Module Viewer';
          if (Array.isArray(card.images) && card.images.length) {
            rotateBackground(card.images);
          }
        }
      })();
    })();
  </script>
</body>
</html>
