<!doctype html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Toolkit | Reinisch Classroom</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <link rel="stylesheet" href="/assets/css/class-clock.css" />
  <link rel="stylesheet" href="/assets/css/class-mode.css" />
  <script src="/web/public-nav.js"></script>
  <script src="/web/sidebar-init.js"></script>
  <script defer src="/assets/js/class-clock.js" type="module"></script>
  <script defer src="/web/class-mode.js"></script>

  <style>
    .content-wrapper { padding-top: 1rem; }

    .content-wrapper h1 {
      font-size: 38px;
      font-weight: 850;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
      color: var(--rc-ink);
    }

    .content-wrapper > p {
      font-size: 1.05rem;
      color: var(--rc-ink-dim);
      margin: 0 0 1.5rem 0;
      max-width: 72ch;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .book-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(12px) saturate(130%);
      -webkit-backdrop-filter: blur(12px) saturate(130%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-left: 3px solid transparent;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      min-height: 90px;
    }

    .book-card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .book-card:nth-child(1) { border-left-color: rgba(59, 130, 246, 0.5); }
    .book-card:nth-child(1):hover { border-left-color: rgba(59, 130, 246, 0.8); }
    .book-card:nth-child(2) { border-left-color: rgba(168, 85, 247, 0.5); }
    .book-card:nth-child(2):hover { border-left-color: rgba(168, 85, 247, 0.8); }
    .book-card:nth-child(3) { border-left-color: rgba(34, 197, 94, 0.5); }
    .book-card:nth-child(3):hover { border-left-color: rgba(34, 197, 94, 0.8); }
    .book-card:nth-child(4) { border-left-color: rgba(239, 68, 68, 0.5); }
    .book-card:nth-child(4):hover { border-left-color: rgba(239, 68, 68, 0.8); }
    .book-card:nth-child(5) { border-left-color: rgba(234, 179, 8, 0.5); }
    .book-card:nth-child(5):hover { border-left-color: rgba(234, 179, 8, 0.8); }
    .book-card:nth-child(6) { border-left-color: rgba(20, 184, 166, 0.5); }
    .book-card:nth-child(6):hover { border-left-color: rgba(20, 184, 166, 0.8); }

    .book-icon {
      font-size: 2.5rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
    }

    .empty-state {
      border: 1px dashed var(--rc-border-strong);
      border-radius: var(--rc-radius);
      padding: 1.5rem;
      background: rgba(0,0,0,.18);
      color: var(--rc-ink-dim);
    }
  </style>

  <script src="/assets/js/open-in-viewer.js"></script>
</head>
<body>
  <div class="tc-app" data-page-title="Math Toolkit">

    <div class="tc-shell">

      <main class="tc-main">
        <div class="content-wrapper">
          <h1>Math Toolkit</h1>
          <p>Choose a math category to explore presentations and activities.</p>

          <div class="book-grid" id="mathGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <p>No math modules yet. Teachers can upload modules via Teacher Tools.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var CATEGORIES = [
        { id: 'math_geo',   title: 'Geometry',           path: '/math-toolkit/geometry/' },
        { id: 'math_alg',   title: 'Algebra',            path: '/math-toolkit/algebra/' },
        { id: 'math_num',   title: 'Number Sense',       path: '/math-toolkit/number-sense/' },
        { id: 'math_data',  title: 'Data &amp; Statistics', path: '/math-toolkit/data-statistics/' },
        { id: 'math_money', title: 'Money Math',         path: '/math-toolkit/money-math/' },
        { id: 'math_gen',   title: 'General Math',       path: '/math-toolkit/general/' }
      ];

      var MATH_ICON = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';

      function hasContent(cat) {
        return cat && Array.isArray(cat.links) && cat.links.some(function (l) { return l && l.trim() !== ''; });
      }

      fetch('/assets/data/site-state.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : { categories: {} }; })
        .catch(function () { return { categories: {} }; })
        .then(function (state) {
          var cats = state.categories || {};
          var grid = document.getElementById('mathGrid');
          var empty = document.getElementById('emptyState');
          var shown = 0;

          CATEGORIES.forEach(function (c) {
            if (!hasContent(cats[c.id])) return;
            shown++;
            var a = document.createElement('a');
            a.className = 'book-card';
            a.href = c.path;
            a.innerHTML = '<div class="book-icon">' + MATH_ICON + '</div><strong class="book-title">' + c.title + '</strong>';
            grid.appendChild(a);
          });

          if (shown === 0) {
            empty.hidden = false;
          }
        });
    }());
  </script>

  <script defer src="/web/public-shell.js"></script>
</body>
</html>
