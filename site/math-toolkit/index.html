<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Toolkit | Reinisch Classroom</title>

  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />

  <style>
    /* Main heading */
    h1 { margin:0 0 .25rem; font-size:2.25rem; font-weight:850; letter-spacing:-0.02em; }

    /* Grid of modules (dynamically populated by math-toolkit-loader.js) */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; padding-top: 1rem; }
    .card-link { display: block; color: inherit; text-decoration: none; }
    .card { border: 1px solid rgba(255, 255, 255, 0.10); border-radius: var(--rc-radius-lg); overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); backdrop-filter: blur(12px) saturate(130%); -webkit-backdrop-filter: blur(12px) saturate(130%); box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08); transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); border-color: rgba(34, 197, 94, 0.35); box-shadow: 0 16px 48px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12); }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .desc { padding: .85rem 1rem; color: var(--rc-ink); min-height: 3rem; }

    /* Empty state */
    .empty { border: 1px dashed var(--rc-border-strong); border-radius: var(--rc-radius); padding: 1rem; background: rgba(0,0,0,.18); color: var(--rc-ink-dim); }

    /* Search */
    .controls { position: sticky; top: .75rem; display: flex; justify-content: flex-end; z-index: 1; margin-bottom: 1rem; }
    .search { padding: 0.6rem 0.75rem; border: 1px solid var(--rc-border); border-radius: var(--rc-radius); width: 260px; max-width: 100%; background: rgba(0,0,0,.22); color: var(--rc-ink); font-family: var(--rc-font); font-size: 16px; outline: none; transition: border-color 0.2s ease; }
    .search::placeholder { color: var(--rc-muted); }
    .search:focus { border-color: var(--rc-brand); }
  </style>

  <script src="/assets/js/open-in-viewer.js"></script>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="tc-btn" href="/" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <div class="tc-title">Math Toolkit</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/" data-href="/">
            <span class="tc-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span class="tc-label">Home</span>
          </a>
          <a href="/math-toolkit/" data-href="/math-toolkit/">
            <span class="tc-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                <line x1="8" y1="6" x2="16" y2="6"></line>
                <line x1="16" y1="14" x2="16" y2="18"></line>
                <path d="M16 10h.01"></path>
                <path d="M12 10h.01"></path>
                <path d="M8 10h.01"></path>
                <path d="M12 14h.01"></path>
                <path d="M8 14h.01"></path>
                <path d="M12 18h.01"></path>
                <path d="M8 18h.01"></path>
              </svg>
            </span>
            <span class="tc-label">Math Toolkit</span>
          </a>
        </nav>
      </aside>

      <main class="tc-main">
        <h1>Math Toolkit</h1>
        <p style="margin:.25rem 0 1rem; color: var(--rc-ink-dim); max-width: 72ch;">Explore math modules. Click a card to open the module. Use Teacher Tools to add or update modules.</p>
        <div class="controls">
          <input class="search" id="search" type="search" placeholder="Search modules..." aria-label="Search modules" />
        </div>

        <div id="modules" class="grid" role="list"></div>
        <div id="empty" class="empty" hidden>
          <p>No modules yet. Teachers can upload modules via Teacher Tools.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/math-toolkit-loader.js"></script>
  <script defer src="/web/public-shell.js"></script>
</body>
</html>
