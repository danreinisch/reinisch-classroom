    <style>
      a.rc-card { text-decoration: none; color: inherit; display: block; }

      .content-wrapper { padding-top: 1rem; }

      .content-wrapper h1 {
        font-size: 38px;
        font-weight: 850;
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
        color: var(--rc-ink);
      }

      .content-wrapper > p {
        font-size: 1.05rem;
        color: var(--rc-ink-dim);
        margin: 0 0 1.5rem 0;
        max-width: 72ch;
      }

      .book-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
        margin-top: 2rem;
      }

      .book-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        backdrop-filter: blur(12px) saturate(130%);
        -webkit-backdrop-filter: blur(12px) saturate(130%);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-left: 3px solid transparent;
        border-radius: 18px;
        text-decoration: none;
        color: inherit;
        transition: all 0.25s ease;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        min-height: 90px;
      }

      .book-card:hover {
        transform: translateY(-4px);
        border-color: rgba(34, 197, 94, 0.35);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .book-card:nth-child(1) { border-left-color: rgba(59, 130, 246, 0.5); }
      .book-card:nth-child(1):hover { border-left-color: rgba(59, 130, 246, 0.8); }
      .book-card:nth-child(2) { border-left-color: rgba(168, 85, 247, 0.5); }
      .book-card:nth-child(2):hover { border-left-color: rgba(168, 85, 247, 0.8); }
      .book-card:nth-child(3) { border-left-color: rgba(34, 197, 94, 0.5); }
      .book-card:nth-child(3):hover { border-left-color: rgba(34, 197, 94, 0.8); }
      .book-card:nth-child(4) { border-left-color: rgba(239, 68, 68, 0.5); }
      .book-card:nth-child(4):hover { border-left-color: rgba(239, 68, 68, 0.8); }
      .book-card:nth-child(5) { border-left-color: rgba(234, 179, 8, 0.5); }
      .book-card:nth-child(5):hover { border-left-color: rgba(234, 179, 8, 0.8); }
      .book-card:nth-child(6) { border-left-color: rgba(20, 184, 166, 0.5); }
      .book-card:nth-child(6):hover { border-left-color: rgba(20, 184, 166, 0.8); }

      .book-icon {
        font-size: 2.5rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .book-title {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
      }
    </style>
