<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Toolkit | Reinisch Classroom</title>

  <!-- RC Theme Design System -->
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />

  <style>
    /* Grid of modules (dynamically populated by math-toolkit-loader.js) */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; padding-top: 1rem; }
    .card-link { display: block; color: inherit; text-decoration: none; }
    .card { border: 1px solid var(--rc-border-strong); border-radius: var(--rc-radius-lg); overflow: hidden; background: var(--rc-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--rc-shadow-sm); transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease; }
    .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.28); background: var(--rc-glass-hover); }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .desc { padding: .85rem 1rem; color: var(--rc-ink); min-height: 3rem; }

    /* Empty state */
    .empty { border: 1px dashed var(--rc-border-strong); border-radius: var(--rc-radius); padding: 1rem; background: rgba(0,0,0,.18); color: var(--rc-ink-dim); }

    /* Search */
    .controls { position: sticky; top: .75rem; display: flex; justify-content: flex-end; z-index: 1; margin-bottom: 1rem; }
    .search { padding: 0.6rem 0.75rem; border: 1px solid var(--rc-border); border-radius: var(--rc-radius); width: 260px; max-width: 100%; background: rgba(0,0,0,.22); color: var(--rc-ink); font-family: var(--rc-font); font-size: 16px; outline: none; transition: border-color 0.2s ease; }
    .search::placeholder { color: var(--rc-muted); }
    .search:focus { border-color: var(--rc-brand); }
  </style>

  <script src="/assets/js/open-in-viewer.js"></script>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
      <a class="tc-btn" href="/" aria-label="Home">🏠</a>
      <div class="tc-title">Math Toolkit</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/" data-href="/">
            <span class="tc-icon">🏠</span>
            <span class="tc-label">Home</span>
          </a>
          <a href="/math-toolkit/" data-href="/math-toolkit/">
            <span class="tc-icon">🔢</span>
            <span class="tc-label">Math Toolkit</span>
          </a>
        </nav>
      </aside>

      <main class="tc-main">
        <h1 style="margin:0 0 .25rem; font-size: clamp(1.75rem, 3.5vw, 2.25rem);">Math Toolkit</h1>
        <p style="margin:.25rem 0 1rem; color: var(--rc-ink-dim); max-width: 72ch;">Explore math modules. Click a card to open the module. Use Teacher Tools to add or update modules.</p>
        <div class="controls">
          <input class="search" id="search" type="search" placeholder="Search modules..." aria-label="Search modules" />
        </div>

        <div id="modules" class="grid" role="list"></div>
        <div id="empty" class="empty" hidden>
          <p>No modules yet. Teachers can upload modules via Teacher Tools.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/math-toolkit-loader.js"></script>
  <script defer src="/web/student-shell.js"></script>
</body>
</html>
