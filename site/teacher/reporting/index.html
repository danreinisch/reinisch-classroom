<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Center — Reporting</title>
  <link rel="stylesheet" href="/web/teacher-shell.css" />
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
      <a class="tc-btn" href="/" target="_blank" rel="noopener" aria-label="Home">🏠</a>
      <div class="tc-title">Teacher Center — Reporting</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Teacher navigation">
        <nav class="tc-nav">
          <a data-href="/teacher/" href="/teacher/"><span class="tc-icon">🏁</span><span class="tc-label">Overview</span></a>
          <a data-href="/teacher/work/" href="/teacher/work/"><span class="tc-icon">🗂️</span><span class="tc-label">Work</span></a>
          <a data-href="/teacher/library/" href="/teacher/library/"><span class="tc-icon">📚</span><span class="tc-label">Library</span></a>
          <a data-href="/teacher/review/" href="/teacher/review/"><span class="tc-icon">✍️</span><span class="tc-label">Review</span></a>
          <a data-href="/teacher/gradebook/" href="/teacher/gradebook/"><span class="tc-icon">📊</span><span class="tc-label">Gradebook</span></a>
          <a data-href="/teacher/students/" href="/teacher/students/"><span class="tc-icon">🧑‍🎓</span><span class="tc-label">Students</span></a>
          <a data-href="/teacher/classes/" href="/teacher/classes/"><span class="tc-icon">🏫</span><span class="tc-label">Classes</span></a>
          <a data-href="/teacher/data/" href="/teacher/data/"><span class="tc-icon">🧾</span><span class="tc-label">Data</span></a>
          <a data-href="/admin/" href="/admin/"><span class="tc-icon">🛡️</span><span class="tc-label">Admin</span></a>
          <a data-href="/teacher/reporting/" href="/teacher/reporting/"><span class="tc-icon">📑</span><span class="tc-label">Reporting</span></a>
          <a data-href="/teacher/settings/" href="/teacher/settings/"><span class="tc-icon">⚙️</span><span class="tc-label">Settings</span></a>
        </nav>
      </aside>

      <main class="tc-main">
        <h1>Work</h1>
        <p><div style="max-width: 980px;">
        <p style="margin-top:0;">
          Reporting MVP: pick a report type + date range, then generate. (Controls are placeholders for now.)
        </p>

        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin:16px 0;">
          <label style="display:flex; flex-direction:column; gap:6px; min-width:240px;">
            <span>Report type</span>
            <select>
              <option>Student Report (placeholder)</option>
              <option>Class Report (placeholder)</option>
              <option>IEP Goal Report (placeholder)</option>
            </select>
          </label>

          <label style="display:flex; flex-direction:column; gap:6px;">
            <span>Start date</span>
            <input type="date" />
          </label>

          <label style="display:flex; flex-direction:column; gap:6px;">
            <span>End date</span>
            <input type="date" />
          </label>

          <button type="button">Generate</button>
        </div>

        <div style="border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px; min-height:140px;">
          <div style="opacity:0.85; margin-bottom:8px;">Output</div>
          <pre style="margin:0; white-space:pre-wrap;">(Report output will appear here.)</pre>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <button type="button" disabled>Export CSV</button>
          <button type="button" disabled>Print</button>
        </div>
      </div></p>
      </main>
    </div>
  </div>

  <script defer src="/web/teacher-shell.js"></script>
</body>
</html>
