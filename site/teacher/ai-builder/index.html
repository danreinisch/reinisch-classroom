          <div class="aib-card" id="aibAssignOptions" style="display:none;">
            <h2 style="margin:0 0 4px 0;font-size:15px;">Assignment Options <span class="aib-subtle" style="font-weight:normal;font-size:12px;">(optional)</span></h2>
            <div class="aib-grid">
              <div class="aib-field">
                <label for="aibAssignDays">Number of Days</label>
                <input type="number" id="aibAssignDays" min="1" max="10" placeholder="e.g. 4" />
              </div>
              <div class="aib-field">
                <label for="aibAssignDifficulty">Difficulty Level</label>
                <select id="aibAssignDifficulty">
                  <option value="">—</option>
                  <option value="Below Grade Level">Below Grade Level</option>
                  <option value="On Grade Level">On Grade Level</option>
                  <option value="Above Grade Level">Above Grade Level</option>
                </select>
              </div>
              <div class="aib-field">
                <label for="aibAssignFormat">Assignment Format</label>
                <select id="aibAssignFormat">
                  <option value="">—</option>
                  <option value="Worksheet">Worksheet</option>
                  <option value="Reading Passage + Questions">Reading Passage + Questions</option>
                  <option value="Fill-in-the-Blank">Fill-in-the-Blank</option>
                  <option value="Mixed">Mixed</option>
                </select>
              </div>
              <div class="aib-field">
                <label for="aibAssignInstructions">Special Instructions</label>
                <textarea id="aibAssignInstructions" placeholder="e.g. Include a word bank, add visual supports…" style="min-height:72px;"></textarea>
              </div>
            </div>
          </div>

          <div class="aib-card" id="aibPresOptions" style="display:none;">
            <h2 style="margin:0 0 4px 0;font-size:15px;">Presentation Options <span class="aib-subtle" style="font-weight:normal;font-size:12px;">(optional)</span></h2>
            <div class="aib-grid">
              <div class="aib-field">
                <label for="aibPresSlides">Number of Slides</label>
                <input type="number" id="aibPresSlides" min="3" max="30" placeholder="e.g. 12" />
              </div>
              <div class="aib-field">
                <label for="aibPresStyle">Slide Style</label>
                <select id="aibPresStyle">
                  <option value="">—</option>
                  <option value="Visual-Heavy">Visual-Heavy</option>
                  <option value="Text-Heavy">Text-Heavy</option>
                  <option value="Balanced">Balanced</option>
                </select>
              </div>
              <div class="aib-field">
                <label for="aibPresAudience">Audience Level</label>
                <select id="aibPresAudience">
                  <option value="">—</option>
                  <option value="Elementary">Elementary</option>
                  <option value="Middle School">Middle School</option>
                  <option value="High School">High School</option>
                  <option value="Adult">Adult</option>
                </select>
              </div>
              <div class="aib-field">
                <label for="aibPresInstructions">Special Instructions</label>
                <textarea id="aibPresInstructions" placeholder="e.g. Include discussion questions, use large fonts…" style="min-height:72px;"></textarea>
              </div>
            </div>
          </div>
