<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Center — Calendar</title>  <link rel="stylesheet" href="/assets/css/rc-theme.css" />

  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <style>
    /* Prevent tc-main from overflowing its flex bounds */
    .tc-main { min-width: 0; }

    .tc-card {
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--rc-glass-border);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tc-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--rc-radius-pill);
      font-size: 12px;
      border: 1px solid var(--rc-border-strong);
      background: var(--rc-glass-hover);
    }
    #calSyncStatus { display: none; }
    .tc-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid var(--rc-border-strong);
      background: var(--rc-glass-hover);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .tc-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
    }

    /* Page header row */
    .cal-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cal-page-header h1 { margin: 0; }

    /* Calendar specific styles */
    .cal-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cal-view-toggle {
      display: flex;
      gap: 4px;
    }
    .cal-view-toggle button {
      padding: 6px 12px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid var(--rc-border-strong);
      background: var(--rc-glass-hover);
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .cal-view-toggle button.active {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
    }
    .cal-view-toggle button:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .cal-header-title {
      font-size: 20px;
      font-weight: 700;
      min-width: 180px;
      text-align: center;
    }

    /* Calendar grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--rc-glass-border);
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius-sm);
      overflow: hidden;
    }
    .cal-day-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--rc-ink-dim);
    }
    .cal-day-cell {
      background: rgba(0, 0, 0, 0.18);
      min-height: 100px;
      padding: 6px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cal-day-cell:hover {
      background: var(--rc-glass-hover);
    }
    .cal-day-cell.other-month {
      opacity: 0.4;
    }
    .cal-day-cell.today {
      background: rgba(59, 130, 246, 0.15);
      border: 2px solid rgba(59, 130, 246, 0.5);
    }
    .cal-day-num {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .cal-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      z-index: 1;
    }
    .cal-event {
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .cal-event.assignment {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
    }
    .cal-event.iep {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.4);
    }
    .cal-event.eval {
      background: rgba(249, 115, 22, 0.2);
      border-color: rgba(249, 115, 22, 0.4);
    }
    .cal-event-overflow {
      font-size: 10px;
      opacity: 0.7;
      color: var(--rc-muted);
      padding: 2px 4px;
    }

    /* Quarter background bands */
    .cal-quarter-band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .cal-quarter-band.q1 {
      background: rgba(59, 130, 246, 0.05);
    }
    .cal-quarter-band.q2 {
      background: rgba(34, 197, 94, 0.05);
    }
    .cal-quarter-band.q3 {
      background: rgba(249, 115, 22, 0.05);
    }
    .cal-quarter-band.q4 {
      background: rgba(168, 85, 247, 0.05);
    }

    /* Week view */
    .cal-week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-week-day {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius-sm);
      padding: 12px;
      min-height: 300px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .cal-week-day.today {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.5);
    }
    .cal-week-day-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rc-glass-border);
    }
    .cal-week-events {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cal-week-events:empty::after {
      content: "No events";
      font-size: 12px;
      color: var(--rc-muted);
      font-style: italic;
    }
    .cal-week-empty {
      margin: 0;
      font-size: 12px;
      color: var(--rc-muted);
      font-style: italic;
    }
    .cal-week-event {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Quick-add modal */
    .cal-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .cal-modal.active {
      display: flex;
    }
    .cal-modal-content {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid var(--rc-border-strong);
      border-radius: var(--rc-radius);
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .cal-modal-header {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .cal-form-group {
      margin-bottom: 16px;
    }
    .cal-form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--rc-ink-dim);
    }
    .cal-form-input,
    .cal-form-select,
    .cal-form-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid var(--rc-border-strong);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 14px;
    }
    .cal-form-textarea {
      min-height: 80px;
      resize: vertical;
    }
    .cal-form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* Mobile (< 768px) */
    @media (max-width: 767px) {
      .cal-grid { font-size: 12px; }
      .cal-day-cell { min-height: 80px; padding: 4px; }
      .cal-event { font-size: 10px; }
      .cal-week-grid { grid-template-columns: 1fr; }
      .cal-header-title { min-width: 120px; font-size: 16px; }
    }

    /* Tablet / Chromebook portrait (768px–1023px) */
    @media (min-width: 768px) and (max-width: 1023px) {
      .cal-day-cell { min-height: 80px; }
      .cal-week-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* Large classroom displays (1920px+) — Smart TV */
    @media (min-width: 1920px) {
      html { font-size: 20px; }
      .cal-day-cell { min-height: 130px; }
      .cal-day-num { font-size: 16px; }
      .cal-event { font-size: 13px; }
      .cal-week-event { font-size: 14px; }
      .cal-header-title { font-size: 26px; }
    }

    /* 4K / Ultra-wide classroom displays (3000px+) */
    @media (min-width: 3000px) {
      html { font-size: 28px; }
      .cal-day-cell { min-height: 180px; }
      .cal-day-num { font-size: 20px; }
      .cal-event { font-size: 16px; }
      .cal-week-event { font-size: 18px; }
      .cal-header-title { font-size: 36px; }
    }
  </style>
</head>

            <button class="tc-btn" id="calNextBtn">
              Next

  <!-- Quick-add Assignment Modal -->
  <div class="cal-modal" id="quickAddModal">
    <div class="cal-modal-content">
      <div class="cal-modal-header">Quick Add Assignment</div>
      <form id="quickAddForm">
        <div class="cal-form-group">
          <label class="cal-form-label" for="qaTitle">Title *</label>
          <input type="text" class="cal-form-input" id="qaTitle" required />
        </div>
        <div class="cal-form-group">
          <label class="cal-form-label" for="qaClass">Class *</label>
          <select class="cal-form-select" id="qaClass" required>
            <option value="">Select a class...</option>
          </select>
        </div>
        <div class="cal-form-group">
          <label class="cal-form-label" for="qaDueDate">Due Date *</label>
          <input type="date" class="cal-form-input" id="qaDueDate" required />
