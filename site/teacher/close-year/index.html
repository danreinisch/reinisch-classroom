<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Center — Close School Year</title>
  <link rel="stylesheet" href="/assets/css/rc-theme.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <style>
    .cy-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 16px;
    }

    .cy-title {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .cy-subtitle {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .cy-step-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .cy-step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s;
    }

    .cy-step-dot.active {
      border-color: rgba(34, 197, 94, 0.8);
      background: rgba(34, 197, 94, 0.18);
      color: rgba(34, 197, 94, 1);
    }

    .cy-step-dot.complete {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.12);
      color: rgba(34, 197, 94, 0.8);
    }

    .cy-step-connector {
      width: 24px;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      align-self: center;
      border-radius: 1px;
    }

    .cy-step-connector.complete {
      background: rgba(34, 197, 94, 0.4);
    }

    .cy-section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .cy-desc {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .cy-stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .cy-stat {
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      text-align: center;
    }

    .cy-stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .cy-stat-label {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .cy-checklist {
      list-style: none;
      padding: 0;
      margin: 0 0 20px;
    }

    .cy-checklist li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cy-checklist li:last-child {
      border-bottom: none;
    }

    .cy-check-ok   { color: #34d399; }
    .cy-check-warn { color: #fbbf24; }
    .cy-check-err  { color: #f87171; }

    .cy-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0;
    }

    .cy-progress-fill {
      height: 100%;
      background: rgba(34, 197, 94, 0.7);
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .cy-status-text {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .cy-confirm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .cy-confirm-row label {
      font-size: 13px;
      cursor: pointer;
      line-height: 1.4;
    }

    .cy-confirm-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #34d399;
    }

    .cy-student-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 16px;
    }

    .cy-student-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    .cy-student-item:last-child {
      border-bottom: none;
    }

    .cy-student-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #34d399;
    }

    .cy-student-code {
      font-family: var(--mono, ui-monospace, Menlo, Consolas, monospace);
      font-size: 12px;
      opacity: 0.6;
      margin-left: auto;
    }

    .cy-btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .cy-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cy-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .cy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cy-btn.primary {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.35);
      color: #34d399;
    }

    .cy-btn.primary:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.26);
      border-color: rgba(34, 197, 94, 0.5);
    }

    .cy-btn.danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .cy-btn.danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .cy-alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }

    .cy-alert.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #34d399;
    }

    .cy-alert.warn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fbbf24;
    }

    .cy-alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    .cy-summary-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cy-summary-item:last-child {
      border-bottom: none;
    }

    .cy-year-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #34d399;
      gap: 6px;
    }

    .cy-select-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cy-select-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .cy-select-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .cy-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      opacity: 0.75;
      padding: 20px 0;
    }

    .cy-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: rgba(34, 197, 94, 0.8);
      border-radius: 50%;
      animation: cy-spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes cy-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
