<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Center — Review</title>  <link rel="stylesheet" href="/assets/css/rc-theme.css" />

  <link rel="stylesheet" href="/assets/css/class-clock.css" />
  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <style>
    /* Prevent tc-main from overflowing its flex bounds */
    .tc-main { min-width: 0; }

    /* Review Tab Styles */
    .rv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .rv-sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--rc-radius-sm);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--rc-glass-border);
    }
    
    .rv-sync-status.synced {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
    }
    
    .rv-sync-status.local {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
    }
    
    .rv-sync-status.error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
    }
    
    .rv-filters {
      margin-bottom: 20px;
    }
    
    .rv-filter-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .rv-filter-label {
      font-weight: 500;
      font-size: 13px;
      opacity: 0.85;
    }
    
    .rv-filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .rv-filter-btn {
      padding: 8px 14px;
      border-radius: var(--rc-radius);
      border: 1px solid var(--rc-border-strong);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s ease;
    }
    
    .rv-filter-btn:hover {
      background: var(--rc-glass-hover);
    }
    
    .rv-filter-btn.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.35);
      font-weight: 500;
    }
    
    .rv-status-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .rv-status-tab {
      padding: 10px 16px;
      border-radius: var(--rc-radius);
      border: 1px solid var(--rc-border-strong);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    
    .rv-status-tab:hover {
      background: var(--rc-glass-hover);
    }
    
    .rv-status-tab.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.35);
      font-weight: 500;
    }
    
    .rv-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 12px;
      font-weight: 600;
      margin-left: 6px;
    }
    
    .rv-search-input {
      padding: 10px 14px;
      border-radius: var(--rc-radius);
      border: 1px solid var(--rc-border-strong);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 14px;
      min-width: 250px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    
    .rv-search-input:focus {
      border-color: var(--rc-brand);
    }
    
    .rv-search-input::placeholder {
      opacity: 0.5;
    }
    
    .rv-select {
      padding: 10px 14px;
      border-radius: var(--rc-radius);
      border: 1px solid var(--rc-border-strong);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 14px;
      min-width: 200px;
      outline: none;
    }
    
    /* Submission Queue */
    .rv-queue {
      margin-top: 16px;
    }
    
    .rv-submission-item {
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius);
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease;
    }
    
    .rv-submission-item.expanded {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .rv-submission-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      border-radius: var(--rc-radius);
      transition: background 0.2s ease;
    }
    
    .rv-submission-header:hover {
      background: var(--rc-glass-hover);
    }
    
    .rv-submission-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .rv-student {
      font-weight: 600;
      font-size: 15px;
    }
    
    .rv-assignment {
      opacity: 0.85;
      font-size: 14px;
    }
    
    .rv-date {
      opacity: 0.7;
      font-size: 13px;
    }
    
    .rv-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--rc-radius-sm);
      font-size: 12px;
      font-weight: 500;
    }
    
    .rv-status-badge.pending {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }
    
    .rv-status-badge.in-progress {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #3b82f6;
    }
    
    .rv-status-badge.reviewed {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--rc-success);
    }
    
    .rv-expand-icon {
      display: flex;
      align-items: center;
      opacity: 0.7;
      flex-shrink: 0;
    }
    
    .rv-submission-body {
      padding: 0 18px 18px 18px;
      border-top: 1px solid var(--rc-glass-border);
    }
    
    /* Sections */
    .rv-section {
      margin-top: 20px;
    }
    
    .rv-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
    }
    
    .rv-section-status {
      font-size: 13px;
      opacity: 0.85;
    }
    
    .rv-details {
      margin-top: 8px;
    }
    
    .rv-details summary {
      cursor: pointer;
      padding: 8px 0;
      font-weight: 500;
      list-style: none;
      user-select: none;
    }
    
    .rv-details summary::-webkit-details-marker {
      display: none;
    }
    
    .rv-details[open] summary {
      margin-bottom: 12px;
    }
    
    /* Auto-graded table */
    .rv-auto-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }
    
    .rv-auto-table th {
      text-align: left;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid var(--rc-border-strong);
      font-weight: 600;
    }
    
    .rv-auto-table td {
      padding: 10px;
      border-bottom: 1px solid var(--rc-glass-border);
    }
    
    .rv-type-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(147, 51, 234, 0.3);
      color: #a855f7;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }
    
    /* Response cards */
    .rv-responses {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }
    
    .rv-response-card {
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius);
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    
    .rv-response-header {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--rc-ink);
    }
    
    .rv-student-response {
      margin-bottom: 12px;
    }
    
    .rv-student-response strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      opacity: 0.85;
    }
    
    .rv-response-text {
      padding: 12px;
      border-radius: var(--rc-radius-sm);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--rc-glass-border);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .rv-rubric-details {
      margin: 12px 0;
    }
    
    .rv-rubric-details summary {
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 0;
      opacity: 0.85;
    }
    
    .rv-rubric {
      margin-top: 8px;
      padding: 12px;
      border-radius: var(--rc-radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--rc-glass-border);
    }
    
    .rv-rubric-tier {
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .rv-rubric-tier:last-child {
      border-bottom: none;
    }
    
    .rv-rubric-tier strong {
      color: rgba(34, 197, 94, 0.9);
    }

    /* Raw submission data section */
    .rv-raw-data {
      margin-top: 8px;
      font-size: 13px;
    }

    .rv-raw-data h4 {
      margin: 12px 0 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }

    .rv-raw-data pre {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--rc-glass-border);
      border-radius: var(--rc-radius-sm);
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }

    .rv-meta-table {
      border-collapse: collapse;
      font-size: 12px;
      width: 100%;
    }

    .rv-meta-table td {
      padding: 4px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .rv-meta-table td:first-child {
      opacity: 0.7;
      width: 120px;
      font-weight: 500;
    }
    
    /* Scoring controls */
    .rv-scoring-controls {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--rc-glass-border);
    }
    
    .rv-score-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .rv-score-input-group label {
      font-weight: 500;
      font-size: 13px;
    }
    
    .rv-score-input {
      padding: 8px 12px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid var(--rc-border-strong);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 14px;
      width: 80px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    
    .rv-score-input:focus {
      border-color: var(--rc-brand);
    }
    
    .rv-note-input-group {
      margin-bottom: 12px;
    }
    
    .rv-note-input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
    }
    
    .rv-note-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--rc-radius-sm);
      border: 1px solid var(--rc-border-strong);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }
    
    .rv-note-input:focus {
      border-color: var(--rc-brand);
    }
    
    .rv-note-input::placeholder {
      opacity: 0.5;
    }
    
    .rv-btn {
      padding: 10px 16px;
      border-radius: var(--rc-radius);
      border: 1px solid var(--rc-border-strong);
      background: var(--rc-glass-hover);
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s ease;
      font-weight: 500;
    }
    
    .rv-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
    }
    
    .rv-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .rv-btn-save {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.35);
    }
    
    .rv-btn-save:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.25);
    }
    
    .rv-save-status {
      margin-left: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    
    .rv-save-status.success {
      color: var(--rc-success);
    }
    
    .rv-save-status.error {
      color: var(--rc-danger);
    }
    
    /* Summary */
    .rv-summary {
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--rc-radius);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--rc-border-strong);
    }
    
    .rv-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }
    
    .rv-summary-row span:first-child {
      opacity: 0.85;
    }
    
    .rv-summary-total {
      border-top: 1px solid var(--rc-border-strong);
      margin-top: 8px;
      padding-top: 12px;
      font-weight: 600;
      font-size: 15px;
    }
    
    .rv-score-green {
      color: var(--rc-success);
    }
    
    .rv-score-amber {
      color: var(--rc-warning);
    }
    
    .rv-score-red {
      color: var(--rc-danger);
    }
    
    /* Actions */
    .rv-actions {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--rc-border-strong);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .rv-btn-primary {
      background: rgba(148, 163, 184, 0.15);
      border-color: rgba(148, 163, 184, 0.3);
    }
    
    .rv-btn-primary:hover:not(:disabled) {
      background: rgba(148, 163, 184, 0.22);
    }
    
    .rv-btn-finalize {
      font-weight: 600;
    }
    
    .rv-batch-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }
    .rv-btn-batch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .rv-btn-batch:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .rv-btn-batch:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .rv-btn-batch svg {
      flex-shrink: 0;
    }
    
    .rv-hint {
      font-size: 12px;
      opacity: 0.7;
      font-style: italic;
    }
    
    /* Empty state */
    .rv-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--rc-muted);
    }
    
    /* Mobile (< 768px) */
    @media (max-width: 767px) {
      .rv-submission-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .rv-filter-row {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .rv-search-input,
      .rv-select {
        min-width: unset;
        width: 100%;
      }
    }

    /* Large classroom displays (1920px+) */
    @media (min-width: 1920px) {
      html { font-size: 20px; }
      .rv-submission-header { padding: 20px 22px; }
    }

    /* 4K / Ultra-wide (3000px+) */
    @media (min-width: 3000px) {
      html { font-size: 28px; }
    }

    /* Auto-Grade All button — purple/AI gradient to signal AI-powered batch action */
    .rv-btn-autograde {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(99, 102, 241, 0.12));
      border-color: rgba(168, 85, 247, 0.35);
      color: #c4b5fd;
    }
    .rv-btn-autograde:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(99, 102, 241, 0.2));
      border-color: rgba(168, 85, 247, 0.55);
      color: #ddd6fe;
    }

    /* Finalize All Reviewed button — green tint to match the finalize/success theme */
    .rv-btn-finalize-reviewed {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .rv-btn-finalize-reviewed:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.5);
      color: #bbf7d0;
    }

    /* Revert All Reviewed button — amber/warning tint to signal destructive batch action */
    .rv-btn-revert-reviewed {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }
    .rv-btn-revert-reviewed:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fde68a;
    }

    /* Progress indicator for Auto-Grade batch operation */
    .rv-autograde-progress {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e40af;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
    }

    /* AI Suggest Button */
    .rv-btn-suggest {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #c4b5fd;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: var(--rc-radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .rv-btn-suggest:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(139, 92, 246, 0.2));
      border-color: rgba(168, 85, 247, 0.5);
      color: #ddd6fe;
    }

    .rv-btn-suggest:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* AI suggestion flash */
    @keyframes rv-ai-flash {
      0% { box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.5); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
    }

    .rv-ai-suggested {
      animation: rv-ai-flash 2s ease-out;
    }

    /* AI rationale / error messages */
    .rv-ai-rationale {
      font-size: 11px;
      color: rgba(196, 181, 253, 0.7);
      margin-top: 4px;
      font-style: italic;
      transition: opacity 1s ease;
    }

    .rv-ai-rationale-fading {
      opacity: 0;
    }

    .rv-ai-error {
      font-size: 11px;
      color: #f87171;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="tc-btn" href="/" target="_blank" rel="noopener" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <div class="tc-title">Teacher Center — Review</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Teacher navigation">
        <nav class="tc-nav">
          <a data-href="/teacher/" href="/teacher/"><span class="tc-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </span><span class="tc-label">Overview</span></a>

      <main class="tc-main">
        <div class="rv-header">
          <h1>Review</h1>
          <div id="rvSyncStatus" class="rv-sync-status local" role="status" aria-live="polite">
            <span id="rvSyncIcon"></span>
            <span id="rvSyncText">Local</span>
          </div>
        </div>

        <div class="rv-filters">
          <!-- Class filter -->
          <div class="rv-filter-row">
            <span class="rv-filter-label">Class:</span>
            <div id="rvClassFilters" class="rv-filter-bar">
              <!-- Class filter buttons are populated dynamically by tc-review.js -->
            </div>
          </div>

          <!-- Assignment and search filter -->
          <div class="rv-filter-row">
            <span class="rv-filter-label">Assignment:</span>
            <select id="rvAssignmentFilter" class="rv-select">
              <option value="All Assignments">All Assignments</option>
            </select>
            
            <input 
              type="search" 
              id="rvSearch" 
              class="rv-search-input" 
              placeholder="Search by student name or code..."
              aria-label="Search submissions by student or assignment"
            />
          </div>
        </div>

        <!-- Status tabs -->
        <div class="rv-status-tabs">
          <button id="rvStatusNeedsReview" class="rv-status-tab active" aria-label="Filter: Needs Review">
            Needs Review <span class="rv-badge">0</span>
          </button>
          <button id="rvStatusReviewed" class="rv-status-tab" aria-label="Filter: Reviewed">
            Reviewed <span class="rv-badge">0</span>
          </button>
          <button id="rvStatusAll" class="rv-status-tab" aria-label="Filter: All">
            All <span class="rv-badge">0</span>
          </button>
          <button id="rvStatusFinalized" class="rv-status-tab" aria-label="Filter: Finalized">
            Finalized <span class="rv-badge">0</span>
          </button>
        </div>

        <!-- Batch actions bar -->
        <div class="rv-batch-bar" id="rvBatchBar" style="display:none;">
          <button class="rv-btn rv-btn-batch" id="rvBtnFinalizeAll" disabled aria-label="Finalize all scored submissions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Finalize All Scored (0)
          </button>
          <button class="rv-btn rv-btn-batch" id="rvBtnMarkAllReviewed" disabled aria-label="Mark all as reviewed">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            Mark All Reviewed (0)
          </button>
          <button class="rv-btn rv-btn-batch rv-btn-autograde" id="rvBtnAutoGrade" disabled aria-label="Auto-grade all unreviewed submissions with AI">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
            🤖 Auto-Grade All (0)
          </button>
          <button class="rv-btn rv-btn-batch rv-btn-finalize-reviewed" id="rvBtnFinalizeAllReviewed" disabled style="display:none;" aria-label="Finalize all reviewed submissions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
            ✅ Finalize All Reviewed (0)
          </button>
          <button class="rv-btn rv-btn-batch rv-btn-revert-reviewed" id="rvBtnRevertAllReviewed" disabled style="display:none;" aria-label="Revert all reviewed submissions back to Needs Review">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.59"></path></svg>
            ↩ Revert All Reviewed (0)
          </button>
        </div>

        <!-- Submission queue -->
        <div id="rvQueue" class="rv-queue">
          <!-- Submissions will be rendered here -->
        </div>
      </main>
    </div>
