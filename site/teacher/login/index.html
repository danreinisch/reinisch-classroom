<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Sign In — Reinisch Classroom</title>

  <link rel="stylesheet" href="/assets/css/app-shell.css" />
  <link rel="stylesheet" href="/assets/css/app-shell-layout.css" />

  <style>
    .wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
    .card { width: min(560px, 100%); }
    .row { display:flex; gap:12px; }
    .row > * { flex:1; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
    .msg.ok { border: 1px solid rgba(80, 200, 120, .35); background: rgba(80, 200, 120, .12); }
    .msg.err { border: 1px solid rgba(255, 80, 80, .35); background: rgba(255, 80, 80, .10); }
    .muted { opacity: .85; font-size: 13px; margin-top: 6px; }
    .links { margin-top: 14px; display:flex; gap: 10px; flex-wrap: wrap; }
    .links a { text-decoration: none; }
    input { width: 100%; }
  </style>
</head>

<body class="rc-app-shell">
  <div class="wrap">
    <div class="rc-glass-card card">
      <div class="rc-glass-card-header">
        <div class="brand">Reinisch Classroom</div>
        <div class="title">Teacher Sign In</div>
        <div id="subtitle" class="muted"></div>
      </div>

      <div class="rc-glass-card-body">
        <form id="form">
          <div class="row">
            <div>
              <label class="rc-label" for="username">Username</label>
              <input class="rc-input" id="username" name="username" autocomplete="username" required />
            </div>
            <div>
              <label class="rc-label" for="password">Password</label>
              <input class="rc-input" id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
          </div>

          <div style="margin-top:14px;">
            <button class="glass-button primary" id="btn" type="submit">Sign In</button>
          </div>

          <div id="msg" style="display:none;"></div>

          <div class="links">
            <a class="glass-button" href="/teacher/">Teacher Center</a>
            <a class="glass-button" href="/admin/">Admin</a>
          </div>
        </form>
      </div>
    </div>
  </div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const entry = (qs.get('entry') || 'teacher').toLowerCase();
  const reason = qs.get('reason') || '';
  const rawNext = qs.get('next') || '';

  const $ = (id) => document.getElementById(id);
  const msgEl = $('msg');
  const btn = $('btn');

  const fallbackNext = entry === 'admin' ? '/admin/' : '/teacher/';

  function safeNext(v) {
    if (!v || typeof v !== 'string') return fallbackNext;
    if (!v.startsWith('/')) return fallbackNext;
    if (v.startsWith('//')) return fallbackNext;
    if (v.includes('://')) return fallbackNext;
    return v;
  }

  const next = safeNext(rawNext);

  function setMsg(text, kind) {
    msgEl.style.display = 'block';
    msgEl.className = 'msg ' + (kind || '');
    msgEl.textContent = text;
  }

  const subtitleBits = [];
  if (entry === 'admin') subtitleBits.push('Admin access requested.');
  if (reason) subtitleBits.push('Reason: ' + reason);
  if (rawNext) subtitleBits.push('Next: ' + next);
  $('subtitle').textContent = subtitleBits.join('  •  ');

  async function getSession() {
    const r = await fetch('/.netlify/functions/teacher-session', {
      cache: 'no-store',
      credentials: 'include'
    });
    const j = await r.json().catch(() => null);
    return { ok: r.ok, status: r.status, json: j };
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = $('username').value.trim();
    const password = $('password').value;

    if (!username || !password) {
      setMsg('Enter username and password.', 'err');
      return;
    }

    btn.disabled = true;
    setMsg('Signing in…', '');

    try {
      const r = await fetch('/.netlify/functions/teacher-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });

      const j = await r.json().catch(() => null);

      if (!r.ok) {
        setMsg((j && (j.error || j.message)) ? (j.error || j.message) : `Sign in failed (${r.status}).`, 'err');
        btn.disabled = false;
        return;
      }

      const s = await getSession();
      if (!s.ok) {
        setMsg(`Login succeeded but session check failed (${s.status}).`, 'err');
        btn.disabled = false;
        return;
      }

      if (entry === 'admin' && s.json && s.json.user && s.json.user.role !== 'admin') {
        setMsg('Signed in, but this account is not an admin. Use an admin account for /admin/.', 'err');
        btn.disabled = false;
        return;
      }

      setMsg('Signed in. Redirecting…', 'ok');
      location.replace(next);

    } catch (err) {
      setMsg('Login error: ' + (err && err.message ? err.message : String(err)), 'err');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
