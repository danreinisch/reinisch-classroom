<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reinisch Classroom — Teacher Center Sign In</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/teacher/login/login.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="card" aria-labelledby="title">
        <h1 id="title">Teacher Center Sign In</h1>
        <p class="sub" id="reason"></p>

        <form id="loginForm" autocomplete="off" novalidate>
          <label>
            Username
            <input id="username" name="username" autocomplete="username" required />
          </label>

          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>

          <div class="actions">
            <button class="btn primary" id="submitBtn" type="submit">Sign In</button>
            <a class="btn" id="backLink" href="/teacher/">Back to Teacher Center</a>
          </div>

          <div class="msg" id="msg" aria-live="polite"></div>
        </form>

        <p class="tiny">
          If you got here from an expired session, logging in will return you to <code id="nextLabel">/teacher/</code>.
        </p>
      </section>
    </main>

    <script src="/teacher/login/login.js" defer></script>
  </body>
</html>
