<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Center — Login</title>  <link rel="stylesheet" href="/assets/css/rc-theme.css" />

  <link rel="stylesheet" href="/web/teacher-shell.css" />
  <style>
    .tc-main {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 18px;
      background: var(--tc-glass);
      border: 1px solid var(--tc-border);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .login-title {
      margin: 0 0 24px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--tc-text);
      text-align: center;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--tc-muted);
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--tc-text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus {
      border-color: rgba(56,255,166,.4);
    }

    .login-button {
      margin-top: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: rgba(56,255,166,.16);
      color: rgba(56,255,166,.98);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-button:hover:not(:disabled) {
      background: rgba(56,255,166,.22);
    }

    .login-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,80,80,.12);
      border: 1px solid rgba(255,80,80,.2);
      color: rgba(255,180,180,.98);
      font-size: 14px;
    }

    .login-error.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="tc-app">
    <header class="tc-topbar">
      <button class="tc-btn" id="tcSidebarToggle" aria-label="Toggle sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="tc-btn" href="/" target="_blank" rel="noopener" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <div class="tc-title">Teacher Center — Login</div>
    </header>

    <div class="tc-shell">
      <aside class="tc-sidebar" aria-label="Navigation">
        <nav class="tc-nav">
          <a href="/"><span class="tc-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span><span class="tc-label">Home</span></a>
          <a href="/student/"><span class="tc-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M5.5 21v-2a7.5 7.5 0 0 1 13 0v2"></path>
            </svg>
          </span><span class="tc-label">Student Portal</span></a>
          <a href="/teacher/"><span class="tc-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </span><span class="tc-label">Teacher Center</span></a>
        </nav>
      </aside>

      <main class="tc-main">
        <div class="login-container">
          <div class="login-card">
      <h1 class="login-title">Teacher Center</h1>
      
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="username" class="login-label">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="login-input" 
            autocomplete="username"
            required 
            autofocus
          />
        </div>

        <div class="login-field">
          <label for="password" class="login-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="login-input" 
            autocomplete="current-password"
            required
          />
        </div>

        <div id="errorMessage" class="login-error"></div>

        <button type="submit" id="submitButton" class="login-button">
          Sign In
        </button>
      </form>
    </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const submitButton = document.getElementById('submitButton');
      const errorMessage = document.getElementById('errorMessage');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('visible');
      }

      function hideError() {
        errorMessage.classList.remove('visible');
      }

      function getNextPath() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        
        // Validate that next path starts with /teacher/ to prevent open redirect
        // Use URL constructor to normalize path and prevent traversal attacks
        if (next) {
          try {
            // Create a URL object to normalize the path
            const url = new URL(next, window.location.origin);
            
            // Ensure the URL points to the same origin (prevent external redirects)
            if (url.origin !== window.location.origin) {
              return '/teacher/';
            }
            
            const normalizedPath = url.pathname;
            
            // Only allow paths that start with /teacher/ after normalization
            // Using trailing slash to prevent matches like /teacher-admin
            if (normalizedPath === '/teacher/' || normalizedPath.startsWith('/teacher/')) {
              // Return the full normalized URL (pathname + search + hash)
              return normalizedPath + url.search + url.hash;
            }
          } catch (e) {
            // Invalid URL, fall through to default
          }
        }
        
        return '/teacher/';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError('Please enter both username and password');
          return;
        }

        // Disable button to prevent double-submit
        submitButton.disabled = true;
        submitButton.textContent = 'Signing In...';

        try {
          const response = await fetch('/.netlify/functions/teacher-login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password }),
          });

          const result = await response.json();

          if (response.ok && result.ok === true) {
            // Success - redirect to next path
            const nextPath = getNextPath();
            window.location.replace(nextPath);
          } else {
            // Show error message from server
            const errorMsg = result.error || 'Login failed. Please try again.';
            showError(errorMsg);
            submitButton.disabled = false;
            submitButton.textContent = 'Sign In';
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (err) {
          console.error('[teacher-login] Network error:', err);
          showError('Network error. Please check your connection and try again.');
          submitButton.disabled = false;
          submitButton.textContent = 'Sign In';
        }
      });
    })();

    // Sidebar toggle functionality (inline to avoid loading teacher-shell.js)
    (function() {
      const toggle = document.getElementById('tcSidebarToggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          document.documentElement.classList.toggle('tc-collapsed');
        });
      }
    })();
  </script>
</body>
</html>
