<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5: Types of Employment &amp; Career Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #22c55e;
    --error: #ef4444;
    --warning: #f59e0b;
    --radius: 12px;
  }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header {
    text-align: center;
    padding: 32px 16px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  header .unit-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  header h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  header .student-name {
    font-size: 14px;
    color: var(--text-muted);
  }
  /* Day navigation */
  .day-nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    justify-content: center;
  }
  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .day-btn:hover { border-color: var(--accent); color: var(--text); }
  .day-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day-btn.completed { border-color: var(--success); color: var(--success); }
  /* Quiz card */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
  }
  .quiz-card .day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .day-number {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .day-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }
  /* Questions */
  .question-block {
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .question-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .question-text {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .question-text .q-num {
    color: var(--accent2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    margin-right: 6px;
  }
  /* Multiple choice */
  .mc-options { display: flex; flex-direction: column; gap: 8px; }
  .mc-option {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
  }
  .mc-option:hover { border-color: var(--accent); }
  .mc-option input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
  .mc-option label { cursor: pointer; flex: 1; color: var(--text); line-height: 1.4; }
  .mc-option.selected { border-color: var(--accent); background: rgba(108,99,255,0.12); }
  .mc-option.correct { border-color: var(--success); background: rgba(34,197,94,0.12); }
  .mc-option.incorrect { border-color: var(--error); background: rgba(239,68,68,0.12); }
  /* Fill in the blank */
  .fill-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--text);
    transition: border-color 0.15s;
    outline: none;
  }
  .fill-input:focus { border-color: var(--accent); }
  .fill-input.correct { border-color: var(--success); }
  .fill-input.incorrect { border-color: var(--error); }
  /* Matching */
  .matching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .match-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .match-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .match-select:focus { border-color: var(--accent); }
  .match-select.correct { border-color: var(--success); }
  .match-select.incorrect { border-color: var(--error); }
  /* Feedback */
  .feedback {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { color: var(--success); }
  .feedback.incorrect { color: var(--error); }
  /* Submit / Score */
  .quiz-actions {
    display: flex;
    justify-content: center;
    margin-top: 12px;
  }
  .btn-submit {
    background: var(--accent);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 36px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-submit:hover { opacity: 0.88; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .score-panel {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    margin-top: 16px;
    display: none;

  .score-big {
    font-size: 3rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent2);
  }
  .score-label { font-size: 15px; color: var(--text-muted); margin-top: 4px; }
  .submit-status { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
  /* Progress bar */
  .progress-bar-wrap { background: var(--surface2); border-radius: 99px; height: 6px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.4s; }
  /* Retry mode */
  .retry-banner {
    background: rgba(59,130,246,0.10);
    border: 1px solid rgba(59,130,246,0.28);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 14px;
    color: #93c5fd;
  }

  .retry-correct-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: #86efac;
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 10px;
    padding: 1px 7px;
    vertical-align: middle;
  }
</style>

  let currentDayIndex = 0;
  let answers = {};
  let submitted = {};
  let studentName = 'Student';
  // Retry state: tracks which days are in retry mode and which question IDs are locked
  let retryMode = {};     // { [day]: true/false }
  let retryLocked = {};   // { [day]: Set of question IDs that are locked (correct) }

  // Read ?student= param (sanitize: trim, max 100 chars, strip control characters)
  (function () {
    try {
      const params = new URLSearchParams(window.location.search);
      const s = params.get('student');
      if (s) {
        // Remove control characters and limit length
        const clean = s.replace(/[\x00-\x1f\x7f]/g, '').trim().slice(0, 100);
        if (clean) studentName = clean;
      }
    } catch (e) { /* ignore */ }
  })();

  // ── Supabase submit ─────────────────────────────────────────────
  async function submitToSupabase(dayData, correct, total, answerDetails) {
    if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) {
      return { ok: false, message: '⚠ Supabase not configured — grade not submitted.' };
    }
    const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
    const payload = {
      student_name: studentName,
      unit: 5,
      day: dayData.day,
      day_title: dayData.title,
      score: correct,
      total: total,
      percentage: pct,
      answers: answerDetails,
      submitted_at: new Date().toISOString()
    };
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        }
      );
      if (!res.ok) {
        const errText = await res.text();
        return { ok: false, message: `⚠ Submission error (${res.status}): ${errText}` };
      }
      return { ok: true, message: `✓ Score submitted for ${studentName}` };
    } catch (err) {
      return { ok: false, message: `⚠ Network error: ${err.message}` };
    }
  }

  // ── Rendering ───────────────────────────────────────────────────
  function renderDay(dayIndex) {
    const day = DAYS[dayIndex];
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    // Progress bar
    const totalDays = DAYS.length;
    const completedCount = Object.keys(submitted).length;
    const pct = Math.round((completedCount / totalDays) * 100);
    const progressWrap = document.createElement('div');
    progressWrap.className = 'progress-bar-wrap';
    progressWrap.innerHTML = `<div class="progress-bar-fill" style="width:${pct}%"></div>`;
    container.appendChild(progressWrap);

    const card = document.createElement('div');
    card.className = 'quiz-card';

    // Day header
    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `<span class="day-number">Day ${day.day}</span><span class="day-title">${escHtml(day.title)}</span>`;
    card.appendChild(header);

    // Retry mode banner
    const isInRetryMode = !!retryMode[day.day];
    if (isInRetryMode) {
      const banner = document.createElement('div');
      banner.className = 'retry-banner';
      banner.textContent = '🔄 Retry Mode — Correct answers are locked. Only your incorrect answers can be changed.';
      card.appendChild(banner);
    }

    // Questions
    const isSubmitted = !!submitted[day.day] && !isInRetryMode;
    const lockedIds = retryLocked[day.day] || new Set();
    day.questions.forEach((q, qi) => {
      const block = document.createElement('div');
      block.className = 'question-block';
      const isLocked = isInRetryMode && lockedIds.has(q.id);
      if (isLocked) block.classList.add('retry-locked');

      const qText = document.createElement('div');
      qText.className = 'question-text';
      qText.innerHTML = `<span class="q-num">${qi + 1}.</span>${escHtml(q.text)}${isLocked ? ' <span class="retry-correct-badge">✓ Correct</span>' : ''}`;
      block.appendChild(qText);

      if (q.type === 'mc') {
        const opts = document.createElement('div');
        opts.className = 'mc-options';
        q.options.forEach((opt, oi) => {
          const label = document.createElement('label');
          label.className = 'mc-option';
          const rid = `${q.id}_o${oi}`;
          const isDisabled = isSubmitted || isLocked;
          label.innerHTML = `<input type="radio" name="${escHtml(q.id)}" id="${escHtml(rid)}" value="${oi}" ${isDisabled ? 'disabled' : ''}>
            <label for="${escHtml(rid)}">${escHtml(opt)}</label>`;
          // Restore previous answer
          if (answers[q.id] !== undefined && answers[q.id] === oi) {
            label.querySelector('input').checked = true;
            label.classList.add('selected');
          }
          if (isSubmitted) {
            if (oi === q.answer) label.classList.add('correct');
            else if (answers[q.id] === oi && oi !== q.answer) label.classList.add('incorrect');
          }
          if (isLocked) {
            if (oi === q.answer) label.classList.add('correct');
            else label.style.opacity = '0.4';
          }
          if (!isDisabled) {
            label.querySelector('input').addEventListener('change', () => {
              document.querySelectorAll(`[name="${q.id}"]`).forEach(r => r.closest('.mc-option').classList.remove('selected'));
              label.classList.add('selected');
              answers[q.id] = oi;
            });
          }
          opts.appendChild(label);
        });
        block.appendChild(opts);
      } else if (q.type === 'fill') {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'fill-input';
        inp.placeholder = 'Type your answer…';
        inp.id = q.id;
        inp.disabled = isSubmitted || isLocked;
        if (answers[q.id] !== undefined) inp.value = answers[q.id];
        if (isSubmitted) {
          const userAns = (answers[q.id] || '').trim().toLowerCase();
          const correct = q.answer.toLowerCase();
          inp.classList.add(userAns === correct ? 'correct' : 'incorrect');
        } else if (isLocked) {
          inp.classList.add('correct');
        } else {
          inp.addEventListener('input', () => { answers[q.id] = inp.value; });
        }
        block.appendChild(inp);
        if (isSubmitted) {
          const hint = document.createElement('div');
          hint.className = 'feedback show';
          const userAns = (answers[q.id] || '').trim().toLowerCase();
          if (userAns === q.answer.toLowerCase()) {
            hint.className += ' correct';
            hint.textContent = '✓ Correct!';
          } else {
            hint.className += ' incorrect';
            hint.textContent = `✗ Answer: ${q.answer}`;
          }
          block.appendChild(hint);
        }
      }
      card.appendChild(block);
    });

    // Score panel (if fully submitted and not in retry)
    if (isSubmitted) {
      const sp = document.createElement('div');
      sp.className = 'score-panel show';
      const { correct, total, statusMsg } = submitted[day.day];
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      sp.innerHTML = `<div class="score-big">${pct}%</div>
        <div class="score-label">${correct} / ${total} correct</div>
        <div class="submit-status">${escHtml(statusMsg)}</div>`;
      card.appendChild(sp);
    } else {
      // Submit button
      const actions = document.createElement('div');
      actions.className = 'quiz-actions';
      const btn = document.createElement('button');
      btn.className = 'btn-submit';
      btn.textContent = isInRetryMode ? 'Re-submit Assignment' : 'Submit Assignment';
      btn.addEventListener('click', () => handleSubmit(day, btn, card));
      actions.appendChild(btn);
      card.appendChild(actions);
    }

    container.appendChild(card);
  }

  async function handleSubmit(day, btn, card) {
    const isInRetryMode = !!retryMode[day.day];
    const lockedIds = retryLocked[day.day] || new Set();

    // Validate: only check unanswered questions that are NOT locked in retry mode
    let allAnswered = true;
    day.questions.forEach(q => {
      if (isInRetryMode && lockedIds.has(q.id)) return; // skip locked questions
      if (answers[q.id] === undefined || answers[q.id] === '') allAnswered = false;
    });
    if (!allAnswered) {
      if (!await rcConfirm('Submit Assignment', 'You have unanswered questions. Submit anyway?', 'Submit', { danger: true })) return;
    }

    // Pre-submit confirmation (skip for retry mode re-submissions)
    if (!isInRetryMode) {
      if (!await rcConfirm('Submit Assignment', "Are you sure you want to submit? You won't be able to change your answers.", 'Submit', { danger: true })) return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting…';

    // Score
    let correct = 0;
    const answerDetails = [];
    day.questions.forEach(q => {
      let isCorrect = false;
      if (q.type === 'mc') {
        isCorrect = answers[q.id] === q.answer;
      } else if (q.type === 'fill') {
        isCorrect = (answers[q.id] || '').trim().toLowerCase() === q.answer.toLowerCase();
      }
      if (isCorrect) correct++;
      answerDetails.push({ id: q.id, type: q.type, answer: answers[q.id], correct: isCorrect });
    });

    const total = day.questions.length;
    const percentCorrect = total > 0 ? Math.round((correct / total) * 100) : 0;

    const result = await submitToSupabase(day, correct, total, answerDetails);

    // Offer retry if score ≤ 60%
    if (percentCorrect <= 60) {
      const wantRetry = await rcConfirm(
        'Try Again?',
        `You scored ${percentCorrect}% (${correct}/${total} correct).\n\nWould you like to try again? Your correct answers will be locked — only your incorrect answers can be changed.`,
        'Retry'
      );
      if (wantRetry) {
        // Enter retry mode: lock questions the student got correct
        retryMode[day.day] = true;
        retryLocked[day.day] = new Set(
          answerDetails.filter(d => d.correct).map(d => d.id)
        );
        // Clear incorrect answers so student must re-answer them
        answerDetails.forEach(d => {
          if (!d.correct) delete answers[d.id];
        });
        renderDayNav();
        renderDay(currentDayIndex);
        return;
      }
    }

    // No retry — finalize
    delete retryMode[day.day];
    delete retryLocked[day.day];
    submitted[day.day] = { correct, total, statusMsg: result.message };

    // Update day nav
    renderDayNav();
    // Re-render to show results
    renderDay(currentDayIndex);
  }

  function renderDayNav() {
    const nav = document.getElementById('day-nav');
    nav.innerHTML = '';
    DAYS.forEach((d, i) => {
      const btn = document.createElement('button');
      btn.className = 'day-btn' + (i === currentDayIndex ? ' active' : '') + (submitted[d.day] ? ' completed' : '');
      btn.textContent = `Day ${d.day}`;
      btn.title = d.title;
      btn.addEventListener('click', () => {
        currentDayIndex = i;
        renderDayNav();
        renderDay(i);
      });
      nav.appendChild(btn);
    });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('student-name-display').textContent = studentName;
    renderDayNav();
    renderDay(0);
  });
</script>
<header>
  <div class="unit-badge">Unit 5</div>
  <h1>Types of Employment &amp; Career Planning</h1>
  <div class="student-name">Student: <span id="student-name-display"></span></div>
</header>
<div class="container">
  <div id="day-nav" class="day-nav"></div>
  <div id="quiz-container"></div>
</div>
</body>
</html>
